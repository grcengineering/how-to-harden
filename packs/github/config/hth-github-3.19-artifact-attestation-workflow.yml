# HTH GitHub Control 3.19: Artifact Attestation Workflow
# Profile: L2 | SLSA: Build L2/L3
# https://howtoharden.com/guides/github/#35-generate-and-verify-artifact-attestations
#
# This workflow generates build provenance attestations using GitHub's
# artifact attestation feature, achieving SLSA v1.0 Build Level 2.
# For Build Level 3, call this as a reusable workflow.
#
# Docs: https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations

# HTH Guide Excerpt: begin workflow-artifact-attestation
name: Build and Attest
on:
  push:
    branches: [main]
  release:
    types: [published]

# Nothing at the workflow level; each job asks for exactly what it needs
permissions: {}

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build artifact
        run: |
          # Replace with your build steps
          make build
          echo "ARTIFACT_PATH=dist/my-app" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: ${{ env.ARTIFACT_PATH }}
# HTH Guide Excerpt: end workflow-artifact-attestation

# HTH Guide Excerpt: begin workflow-container-attestation
  build-and-attest-container:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Generate container attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
# HTH Guide Excerpt: end workflow-container-attestation
