# HTH GitHub Control 5.5: Restrict `secrets: inherit` in Reusable Workflows
# Profile: L2 | NIST: AC-6, SC-28
# https://howtoharden.com/guides/github/#55-restrict-secrets-inherit-in-reusable-workflows
#
# Reference patterns for calling reusable workflows. `secrets: inherit`
# hands EVERY secret in the caller's scope to the called workflow —
# pass only what the workflow actually needs.

# HTH Guide Excerpt: begin config-secrets-inherit-antipattern
# BAD: passes every secret to the reusable workflow
jobs:
  deploy-bad:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
# HTH Guide Excerpt: end config-secrets-inherit-antipattern

# HTH Guide Excerpt: begin config-secrets-explicit
# GOOD: only passes the secrets the workflow actually needs
jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
# HTH Guide Excerpt: end config-secrets-explicit

# HTH Guide Excerpt: begin config-secrets-serialization-antipattern
# BAD: serializes all secrets into a single string (never do this)
jobs:
  leak-bad:
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(secrets) }}' | jq .
# HTH Guide Excerpt: end config-secrets-serialization-antipattern
