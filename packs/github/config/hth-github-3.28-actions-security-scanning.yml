# HTH GitHub Control 3.22: Actions Security Scanning Workflow
# Profile: L1 | NIST: SA-11, CM-6
# https://howtoharden.com/guides/github/#37-recommended-open-source-security-tools
#
# This workflow runs zizmor and actionlint on pull requests to catch
# workflow security issues before they reach the default branch.
# zizmor uploads SARIF to Code Scanning itself (advanced-security: true).
#
# Docs:
#   - https://github.com/zizmorcore/zizmor-action
#   - https://github.com/rhysd/actionlint (no action.yml: install the pinned release binary)

# HTH Guide Excerpt: begin workflow-actions-security-scan
name: Actions Security Scan
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          min-severity: medium

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint 1.7.12 (download script pinned to the release commit)
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ./actionlint -color
# HTH Guide Excerpt: end workflow-actions-security-scan
