# HTH GitHub Control 6.04: npm Provenance Publishing Workflow
# Profile: L2 | NIST: SA-12, SA-15
# Deploy: Copy to .github/workflows/publish.yml in your repository

# HTH Guide Excerpt: begin cli-npm-provenance-workflow
name: Publish with Provenance

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false  # never restore a cache into a release build
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# HTH Guide Excerpt: end cli-npm-provenance-workflow
