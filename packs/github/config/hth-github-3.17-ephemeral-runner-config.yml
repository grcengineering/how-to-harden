# HTH GitHub Control 3.17: Ephemeral Runner Configuration
# Profile: L2 | NIST: CM-6
# https://howtoharden.com/guides/github/#34-configure-self-hosted-runner-security

# HTH Guide Excerpt: begin cli-ephemeral-runner-config
# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, production, ephemeral]
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: ./deploy.sh
# HTH Guide Excerpt: end cli-ephemeral-runner-config
