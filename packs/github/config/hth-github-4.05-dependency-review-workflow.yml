# HTH GitHub Control 4.05: Dependency Review Workflow
# Profile: L1 | NIST: SA-12
# Deploy: Copy to .github/workflows/dependency-review.yml in your repository

# HTH Guide Excerpt: begin cli-dependency-review
name: Dependency Review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
# HTH Guide Excerpt: end cli-dependency-review
