# HTH Pack Contract: v1
#   control: grok-bot-6.2
#   guide:   https://howtoharden.com/guides/grok-bot/#62-monitor-grok-bot-control-plane-audit-events
#   profile: L2
#   mode:    read-only
#   requires: Cursor Enterprise audit logs in the Admin API pull shape (GET /teams/audit-logs events[]), or a stream remapped per FIELD MAPPING below
# =============================================================================
# HTH Grok Bot Control 6.2: Monitor Grok Bot Control-Plane Audit Events
# Profile Level: L2 (Walk)
# Frameworks: CIS Controls v8 8.2, 8.9, 8.11 | NIST 800-53 AU-2, AU-6, SI-4 | SOC 2 CC7.2 | ISO 27001:2022 A.8.15, A.8.16
# Sources (every event type, field and value below is transcribed from these; fetched 2026-10-09):
#   https://cursor.com/docs/enterprise/compliance-and-monitoring#log-format
#   https://cursor.com/docs/enterprise/compliance-and-monitoring#event-types  (Telemetry export and LLM Gateway table)
#   https://cursor.com/docs/enterprise/opentelemetry-export  (families; "Turn individual families off in Team Settings")
# Feed: packs/grok-bot/api/hth-grok-bot-6.02-export-grok-bot-audit.sh with HTH_AUDIT_OUT
#   set (JSONL, one Admin API event object per line); it pulls both event types.
#
# LOGSOURCE (custom). Sigma has no upstream taxonomy for Cursor audit logs, so
# this rule declares product: cursor / service: audit. Field names are the
# Admin API pull shape, one flat object per event:
#   event_type       one value from the Event types tables (the selector)
#   event_data.<f>   the event-specific fields, documented as keys in event_data
#   user_email       the actor: an email, 'Api Key: <name>', or 'System'
#   event_id, timestamp, ip_address, application_type
# FIELD MAPPING for streamed delivery (Splunk HEC, Sumo Logic, HTTPS webhook or
# S3; set up by contacting hi@cursor.com), which uses the raw message shape:
#   event_data.<f>  ->  <event_type>.<f>     e.g. customer_telemetry_destination.action
#   event_id        ->  metadata.id
#   timestamp       ->  metadata.timestamp
#
# TRAPS
#  1. The OpenTelemetry destination is the only path Action Recording events
#     take out of Cursor (control 6.1), and no API reads it. These audit rows are
#     the only API-side record of someone deleting or disabling it.
#  2. enabled_families and disabled_families are documented as fields, but their
#     values are not enumerated, so the rule does not string-match a family name
#     such as grok_bot_agent_actions. Every other destination update (for
#     example a family turned off) is printed by the 6.02 pack for review.
#  3. The JSON type of `enabled` is documented by name only, so each selection
#     lists the boolean and the string.
#  4. The documented streamed example carries no top-level event_type key, only
#     the payload key named after the event type. On a stream, replace each
#     event_type match with "the <event_type> key exists" unless your pipeline
#     adds event_type itself.
title: Grok Bot Telemetry Export Removed, Disabled or Content Export Turned On
id: 3ed70e0e-5530-4698-bc82-227caf5d70e2
status: experimental
description: |
    Fires when an OpenTelemetry export destination is deleted
    (customer_telemetry_destination with action 'delete'), when a destination
    is saved with enabled=false, or when the team turns conversation-content
    export on (customer_telemetry_content_opt_in with enabled=true). The first
    two blind Action Recording (control 6.1): with no enabled destination,
    nothing Bots do leaves Cursor. The third starts streaming prompt and
    response text, and optionally tool I/O, for Cloud Agents and Grok Bot
    together, which is the L3 data-exposure decision. Map every hit to an
    approved change.
    Audit logs exist only on Cursor Enterprise.
    This corresponds to HTH Grok Bot control 6.2 (Monitor Grok Bot Control-Plane Audit Events, L2).
references:
    - https://howtoharden.com/guides/grok-bot/#62-monitor-grok-bot-control-plane-audit-events
    - https://cursor.com/docs/enterprise/compliance-and-monitoring
    - https://cursor.com/docs/enterprise/opentelemetry-export
author: How to Harden
date: 2026/10/09
tags:
    - attack.defense_evasion
    - attack.t1562.008
logsource:
    product: cursor
    service: audit
    definition: 'Cursor Enterprise audit log events in the Admin API pull shape (GET /teams/audit-logs events[]); streamed events need the FIELD MAPPING in the rule header'
# HTH Guide Excerpt: begin detection
# Admin API pull shape (event_type + event_data.<field>). Family values are not
# enumerated, so other destination updates are reviewed in the 6.02 pack.
detection:
    selection_deleted:
        event_type: 'customer_telemetry_destination'
        event_data.action: 'delete'
    selection_disabled:
        event_type: 'customer_telemetry_destination'
        event_data.enabled:
            - false
            - 'false'
    selection_content_on:
        event_type: 'customer_telemetry_content_opt_in'
        event_data.enabled:
            - true
            - 'true'
    condition: 1 of selection_*
fields:
    - timestamp
    - user_email
    - ip_address
    - event_type
    - event_data.action
    - event_data.destination_id
    - event_data.endpoint_url
    - event_data.enabled
    - event_data.enabled_families
    - event_data.disabled_families
# HTH Guide Excerpt: end detection
falsepositives:
    - A planned move to a new collector, where a new destination is created and enabled before the old one is deleted
    - An approved L3 decision to export conversation content, recorded with its data-minimization review
level: high
