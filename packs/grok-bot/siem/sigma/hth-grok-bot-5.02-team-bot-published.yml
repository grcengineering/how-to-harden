# HTH Pack Contract: v1
#   control: grok-bot-5.2
#   guide:   https://howtoharden.com/guides/grok-bot/#52-govern-team-bots-their-shared-credentials-and-their-slack-apps
#   profile: L2
#   mode:    read-only
#   requires: Cursor Enterprise audit logs in the Admin API pull shape (GET /teams/audit-logs events[]), or a stream remapped per FIELD MAPPING below
# =============================================================================
# HTH Grok Bot Control 5.2: Govern Team Bots, Their Shared Credentials, and Their Slack Apps
# Profile Level: L2 (Walk)
# Frameworks: CIS Controls v8 3.3, 6.8 | NIST 800-53 AC-6, AC-21, IA-5 | SOC 2 CC6.1, CC6.3 | ISO 27001:2022 A.5.15, A.5.17 | OWASP Agentic 2026 ASI01, ASI06, ASI07
# Sources (every event type, field and value below is transcribed from these; fetched 2026-10-08):
#   https://cursor.com/docs/enterprise/compliance-and-monitoring#log-format
#   https://cursor.com/docs/enterprise/compliance-and-monitoring#event-types  (Grok Bot table)
#   https://cursor.com/docs/account/teams/admin-api#get-audit-logs
# Feed: packs/cursor/api/hth-cursor-10.01-export-audit-logs.sh with HTH_AUDIT_OUT set
#   (JSONL, one Admin API event object per line). The Grok-Bot-scoped pull is
#   packs/grok-bot/api/hth-grok-bot-6.02-export-grok-bot-audit.sh.
#
# LOGSOURCE (custom). Sigma has no upstream taxonomy for Cursor audit logs, so
# this rule declares product: cursor / service: audit. Field names are the
# Admin API pull shape, one flat object per event:
#   event_type       one value from the Event types tables (the selector)
#   event_data.<f>   the event-specific fields, documented as keys in event_data
#   user_email       the actor: an email, 'Bot: <owner email>', 'Api Key: <name>', or 'System'
#   event_id, timestamp, ip_address, application_type
# FIELD MAPPING for streamed delivery (Splunk HEC, Sumo Logic, HTTPS webhook or
# S3; set up by contacting hi@cursor.com), which uses the raw message shape:
#   event_data.<f>  ->  <event_type>.<f>     e.g. grok_bot_lifecycle.action
#   event_id        ->  metadata.id
#   timestamp       ->  metadata.timestamp
#
# TRAPS
#  1. No documented audit event covers Manage Team Bots default assignment,
#     adding or removing a Team Bot's managers, its secrets, plugins or files,
#     or the creation and removal of its Slack app. The audit log does record
#     other Team Bot moments: Bot creation (grok_bot_created, for every Bot,
#     before it is ever published), unpublish and delete (grok_bot_lifecycle
#     'unpublished' and 'delete'), skill add/update/remove on a Team Bot
#     (grok_bot_skill), and Slack account links (slack_account_link). This rule
#     alerts only on 'published', the moment a Bot becomes team-wide; the 5.02
#     API pack inventories the rest.
#  2. The doc lists 'visibility_changed' (new_visibility OWNER or TEAM) as a
#     separate grok_bot_lifecycle action, and does not say whether publishing
#     also emits it. This rule selects only 'published'; the 5.02 API pack
#     inventories the other lifecycle actions.
#  3. Admins have no Team Bot API, and no documented admin control disables
#     Team Bot creation (as of 2026-10-09), so this is detection after the fact. The response is the dashboard's Manage Team
#     Bots (delete) plus Slack's own app approval.
#  4. The documented streamed example carries no top-level event_type key, only
#     the payload key named after the event type. On a stream, replace the
#     event_type match with "the grok_bot_lifecycle key exists" unless your
#     pipeline adds event_type itself.
title: Grok Bot Published to the Team as a Team Bot
id: 72588ae5-8a20-4be3-afa0-0a0082899a79
status: experimental
description: |
    Fires when a Bot is published to the team (grok_bot_lifecycle with action
    'published'). A Team Bot shares its plugins, secrets, skills, files and team
    memory with every teammate, can use every secret in any teammate's
    conversation, and in Slack channels, group DMs and threads runs on one
    shared computer. A plugin configured with a key is the Bot's own credential,
    the same for everyone. Each publication turns one member's credentials and
    memory into a team-wide, Slack-reachable agent, so map every hit to an
    approved request and confirm the owner used scoped, read-only
    service-account keys rather than personal credentials.
    Team Bots are available on Teams and Enterprise, but audit logs, and
    therefore this rule, exist only on Cursor Enterprise.
    This corresponds to HTH Grok Bot control 5.2 (Govern Team Bots, Their Shared Credentials, and Their Slack Apps, L2).
references:
    - https://howtoharden.com/guides/grok-bot/#52-govern-team-bots-their-shared-credentials-and-their-slack-apps
    - https://cursor.com/docs/enterprise/compliance-and-monitoring
    - https://docs.x.ai/grok-bot/team-bots
author: How to Harden
date: 2026/10/08
logsource:
    product: cursor
    service: audit
    definition: 'Cursor Enterprise audit log events in the Admin API pull shape (GET /teams/audit-logs events[]); streamed events need the FIELD MAPPING in the rule header'
# HTH Guide Excerpt: begin detection
# Admin API pull shape (event_type + event_data.<field>). No documented audit
# event covers a Team Bot's managers, secrets, plugins, files or Slack app.
detection:
    selection:
        event_type: 'grok_bot_lifecycle'
        event_data.action: 'published'
    condition: selection
fields:
    - timestamp
    - user_email
    - ip_address
    - event_data.agent_id
    - event_data.action
    - event_data.changed_fields
    - event_data.old_visibility
    - event_data.new_visibility
# HTH Guide Excerpt: end detection
falsepositives:
    - Approved Team Bots published after the owner's plugins, secrets and Slack app passed review
level: medium
