# HTH Pack Contract: v1
#   control: grok-bot-5.1
#   guide:   https://howtoharden.com/guides/grok-bot/#51-keep-public-template-sharing-off
#   profile: L1
#   mode:    read-only
#   requires: Cursor Enterprise audit logs in the Admin API pull shape (GET /teams/audit-logs events[]), or a stream remapped per FIELD MAPPING below
# =============================================================================
# HTH Grok Bot Control 5.1: Keep Public Template Sharing Off
# Profile Level: L1 (Crawl)
# Frameworks: CIS Controls v8 3.3 | NIST 800-53 AC-21, AC-3 | SOC 2 CC6.1, C1.1 | ISO 27001:2022 A.5.14
# Sources (every event type, field and value below is transcribed from these; fetched 2026-10-08):
#   https://cursor.com/docs/enterprise/compliance-and-monitoring#log-format
#   https://cursor.com/docs/enterprise/compliance-and-monitoring#event-types  (Grok Bot table)
#   https://cursor.com/docs/account/teams/admin-api#get-audit-logs
# Feed: packs/cursor/api/hth-cursor-10.01-export-audit-logs.sh with HTH_AUDIT_OUT set
#   (JSONL, one Admin API event object per line). The Grok-Bot-scoped pull is
#   packs/grok-bot/api/hth-grok-bot-6.02-export-grok-bot-audit.sh.
#
# LOGSOURCE (custom). Sigma has no upstream taxonomy for Cursor audit logs, so
# this rule declares product: cursor / service: audit. Field names are the
# Admin API pull shape, one flat object per event:
#   event_type       one value from the Event types tables (the selector)
#   event_data.<f>   the event-specific fields, documented as keys in event_data
#   user_email       the actor: an email, 'Bot: <owner email>', 'Api Key: <name>', or 'System'
#   event_id, timestamp, ip_address, application_type
# FIELD MAPPING for streamed delivery (Splunk HEC, Sumo Logic, HTTPS webhook or
# S3; set up by contacting hi@cursor.com), which uses the raw message shape:
#   event_data.<f>  ->  <event_type>.<f>     e.g. grok_bot_resource.visibility
#   event_id        ->  metadata.id
#   timestamp       ->  metadata.timestamp
#
# TRAPS
#  1. visibility values are documented in upper case (TEAM, PUBLIC). Sigma
#     string matches are case-insensitive by default; if your backend
#     translation is case-sensitive, keep the upper case.
#  2. The doc lists visibility and previous_visibility as fields of
#     grok_bot_resource without saying on which actions they are set. If a
#     create or publish row omits visibility, this rule misses it; the
#     visibility_changed row is the case it certainly covers.
#  3. No setting_name is documented for the team's template-sharing POLICY, so
#     a flip of templateSharing from team_only to all is not visible here. The
#     5.01 API pack's verify region is the check for the policy itself.
#  4. Payloads never include template bodies, so a SIEM cannot see secrets
#     inside a template; treat any public template as exposed.
#  5. The documented streamed example carries no top-level event_type key, only
#     the payload key named after the event type. On a stream, replace the
#     event_type match with "the grok_bot_resource key exists" unless your
#     pipeline adds event_type itself.
title: Grok Bot Template Made Public
id: 6da89a13-1ab5-49ac-80ba-da4cb81c3cc8
status: experimental
description: |
    Fires when a Grok Bot template event carries visibility PUBLIC. A Bot
    template carries the Bot's identity, description, skills and routines, and
    a public link can be opened by anyone who has it. Skills and routines encode
    internal processes and system names and can embed credentials. With
    template sharing set to team-only, Cursor enforces the policy on its
    servers, so a PUBLIC event means the policy is not set, was changed, or is
    not behaving as documented. Enterprise teams start with public sharing off;
    other teams start with it allowed.
    Audit logs exist only on Cursor Enterprise.
    This corresponds to HTH Grok Bot control 5.1 (Keep Public Template Sharing Off, L1).
references:
    - https://howtoharden.com/guides/grok-bot/#51-keep-public-template-sharing-off
    - https://cursor.com/docs/enterprise/compliance-and-monitoring
    - https://docs.x.ai/grok-bot/teams-and-enterprises
    - https://docs.x.ai/grok-bot/bots
author: How to Harden
date: 2026/10/08
tags:
    - attack.exfiltration
logsource:
    product: cursor
    service: audit
    definition: 'Cursor Enterprise audit log events in the Admin API pull shape (GET /teams/audit-logs events[]); streamed events need the FIELD MAPPING in the rule header'
# HTH Guide Excerpt: begin detection
# Admin API pull shape (event_type + event_data.<field>). visibility values are
# documented in upper case: TEAM, PUBLIC.
detection:
    selection:
        event_type: 'grok_bot_resource'
        event_data.resource_type: 'template'
        event_data.visibility: 'PUBLIC'
    condition: selection
fields:
    - timestamp
    - user_email
    - ip_address
    - event_data.action
    - event_data.resource_id
    - event_data.visibility
    - event_data.previous_visibility
# HTH Guide Excerpt: end detection
falsepositives:
    - A template deliberately published outside the team where the team policy allows it, recorded as an approved publication
level: high
