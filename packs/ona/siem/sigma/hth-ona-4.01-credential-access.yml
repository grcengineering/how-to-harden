# HTH Pack Contract: v1
#   control: ona-4.1
#   guide:   https://howtoharden.com/guides/ona/#41-scope-secrets-and-restrict-organization-secrets
#   profile: L2
#   mode:    read-only
#   requires: audit-log ingestion from EventService/ListAuditLogs (Enterprise plan)
# Frameworks: CIS Controls 3.3, 16.4 | NIST 800-53 AC-3, SC-28 | SOC 2 CC6.1
# Feed: packs/ona/cli/hth-ona-6.01-export-audit-logs.sh  (kind has no CLI filter flag —
#       select AUDIT_LOG_ENTRY_KIND_CREDENTIAL_ACCESS client-side or in the SIEM)
title: Ona Credential Access Event
id: 4928d4e5-5fa7-4b1d-8747-38e572a5a6e5
status: experimental
description: |
    Fires on Ona's credential-access event family — the kind the vendor defines
    as "relevant credential issuance, retrieval, replacement, or propagation".
    This is the audit trail for secrets actually being HANDLED, as distinct from
    a secret resource being created or deleted (which is a RESOURCE_CHANGE).
    It is the detection half of control 4.1: scoping secrets decides who may
    reach them, and this tells you who did. Correlate the actorPrincipal — a
    PRINCIPAL_ENVIRONMENT or PRINCIPAL_SERVICE_ACCOUNT retrieving a credential is
    ordinary automation; a PRINCIPAL_USER retrieving one out of hours, or an
    environment reaching for a credential outside its project's normal set, is
    the shape worth chasing.
    The rule keys on the closed `kind` enum (AuditLogEntryKind). `action` is FREE
    TEXT in the Ona audit log, so it is carried in `fields` as context and never
    used as a condition. `subjectType` is intentionally unconstrained: credential
    access spans SECRET, USER_SECRET, ORGANIZATION_SECRET,
    SERVICE_ACCOUNT_SECRET, SERVICE_ACCOUNT_TOKEN, PERSONAL_ACCESS_TOKEN and
    HOST_AUTHENTICATION_TOKEN, and pinning the list would silently drop future
    members.
    WatchEvents cannot back this rule — that stream carries no actor, no action
    text and no timestamp, so only ListAuditLogs/GetAuditLog can feed it.
    This corresponds to HTH Ona control hth-ona-4.01-scope-secrets-and-restrict-organization-secrets (section 4.1, L2).
references:
    - https://howtoharden.com/guides/ona/#41-scope-secrets-and-restrict-organization-secrets
    - https://ona.com/docs/ona/audit-logs/overview
author: How to Harden
date: 2026/08/19
tags:
    - attack.credential_access
    - attack.t1552
    - attack.t1528
logsource:
    product: ona
    service: audit
# HTH Guide Excerpt: begin detection
detection:
    selection:
        kind: 'AUDIT_LOG_ENTRY_KIND_CREDENTIAL_ACCESS'
    condition: selection
fields:
    - createdAt
    - actorId
    - actorPrincipal
    - subjectId
    - subjectType
    - action
# HTH Guide Excerpt: end detection
falsepositives:
    - Every environment start that injects a scoped secret produces credential-access entries; baseline per project before alerting on volume
    - Service accounts collecting logs or driving automations legitimately retrieve credentials on a schedule
    - Runner and host authentication token propagation is infrastructure activity, not user activity — segment by actorPrincipal rather than muting the class
level: medium
