# =============================================================================
# HTH GitLab Control 2.3: Harden .gitlab-ci.yml Configuration
# Profile: L2 | Section: 2.3
# =============================================================================

# HTH Guide Excerpt: begin hardened-ci-config
# .gitlab-ci.yml - Security hardened example

# The scanner jobs below come from GitLab's maintained templates; this file
# only overrides them. Without these includes, sast/dependency_scanning/
# container_scanning have no script and the pipeline fails validation.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

default:
  # Pin images by digest, not a mutable tag (and never :latest).
  # Resolve the digest for your tag with: docker buildx imagetools inspect ruby:3.2.0-alpine
  image: ruby:3.2.0-alpine@sha256:c690d3b45ef65e0098104c272f1736b0595b824908d5639c3a3d17636581a905

  # Limit job timeout
  timeout: 30 minutes

  # Run in isolated environment
  tags:
    - docker
    - isolated

# Prevent secret leakage in logs
variables:
  GIT_STRATEGY: clone
  SECURE_LOG_LEVEL: "warn"

# Security scanning stages
stages:
  - test
  - security
  - build
  - deploy

sast:
  stage: security
  allow_failure: false  # Block on security issues

dependency_scanning:
  stage: security
  allow_failure: false

container_scanning:
  stage: security
  allow_failure: false

# Restrict production deployment
deploy_production:
  stage: deploy
  script:
    - ./deploy.sh
  environment:
    name: production
    url: https://prod.company.com
  rules:
    # Only from main branch
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Require manual approval
  # Prevent concurrent deployments
  resource_group: production
# HTH Guide Excerpt: end hardened-ci-config
