# HTH 2.1: runtime-secrets
# Profile: L1 (Crawl); NIST 800-53 IA-5, AC-6
# Guide: https://howtoharden.com/guides/n8n/#21
# Source: https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/security.md
# Native Docker Compose environment mapping; merge under the existing n8n service.
# Test workflows using environment expressions before changing.
# HTH Guide Excerpt: begin runtime-secrets
environment:
  N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
  N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
# HTH Guide Excerpt: end runtime-secrets
