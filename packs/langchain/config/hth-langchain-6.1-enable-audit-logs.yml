#   control: langchain-6.1
#   guide:   https://howtoharden.com/guides/langchain/#61-enable-audit-logs
#   profile: L1
#   mode:    mutating
#   requires: helm upgrade access to the self-hosted LangSmith release (Helm chart 0.12.33+); Enterprise Cloud needs no values change
# =============================================================================
# HTH LangChain Control 6.1: Enable Audit Logs (Self-Hosted)
# Profile Level: L1 (Crawl)
# Frameworks: CIS Controls 8.2, 8.5 | NIST 800-53 AU-2, AU-3, AU-12
#
# Source: https://docs.langchain.com/langsmith/audit-logs ("Enable audit logs for
# self-hosted deployments") and the chart values (commonEnv is a list of {name, value}).
#
# What this file is NOT: the chart has no config.auditLogs.* keys (Helm would ignore
# them silently), and the audit-log documentation describes no stdout or log-file
# emission for a log shipper to tail. Audit events are read in the UI
# (Organization Settings > Audit logs) or pulled from GET /api/v1/audit-logs; the
# export pack for control 6.2 is the documented way to ship them to a SIEM.
# LangSmith retains audit logs for 400 days; forward them for longer retention.
#
# Alternative for a single organization (instead of the env flag), run against the
# LangSmith Postgres database, as documented:
#   UPDATE organizations SET config = config || '{"can_use_audit_logs": true}'
#   WHERE id = '<organization_id>' AND NOT is_personal;

# HTH Guide Excerpt: begin config-audit-logs-enable
# MANDATORY on self-hosted: installing chart 0.12.33+ alone does NOT turn audit logs on.
# Setting this org feature flag in commonEnv enables them for every organization.
commonEnv:
  - name: DEFAULT_ORG_FEATURE_CAN_USE_AUDIT_LOGS
    value: "true"
# HTH Guide Excerpt: end config-audit-logs-enable
