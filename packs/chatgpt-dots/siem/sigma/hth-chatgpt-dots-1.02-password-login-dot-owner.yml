# HTH Pack Contract: v1
#   control: chatgpt-dots-1.2
#   guide:   https://howtoharden.com/guides/chatgpt-dots/#12-require-sso-or-personal-mfa-on-every-account-that-owns-a-dot
#   profile: L1
#   mode:    read-only
#   requires: Compliance Logs Platform AUTH_LOG ingestion (ChatGPT Enterprise/Edu only); ChatGPT Admin key with scope chatgpt.enterprise.compliance_logs_platform.auth_log.read
# =============================================================================
# HTH ChatGPT Dots Control 1.2: Require SSO or personal MFA on every account that owns a dot
# Profile Level: L1 (Crawl)
# Frameworks: CIS Controls v8 6.3 | NIST 800-53 IA-2(2) | SOC 2 CC6.1 | no benchmark equivalent yet
# Feed: GET https://api.chatgpt.com/v1/compliance/workspaces/{workspace_id}/logs?event_type=AUTH_LOG&after=<ISO8601>
#       (List Files; event_type and after are required; page with last_end_time), then
#       GET .../logs/{log_file_id} (Download File; 307 to a short-lived signed JSONL URL).
#       Vendor script: https://developers.openai.com/downloads/compliance-api/download_compliance_files.sh
#
# Sources (field names and values transcribed from these; all fetched 2026-10-08):
#   - https://chatgpt.com/public/admin/api-reference
#       Admin API spec "OpenAI Programmatic Admin Platform" v2.5.37: Compliance Logs Platform
#       envelope (event_id, type, timestamp, principal, actor) and the Auth tag (type AUTH_LOG,
#       action_data.action values, action_data.auth_provider_name, request_metadata.client_ip).
#       The page returns 403 to curl; the spec (openapi.json) was read in a real browser.
#   - https://help.openai.com/en/articles/7967234-managing-multi-factor-authentication-mfa
#   - https://help.openai.com/en/articles/10468051
#   - https://help.openai.com/en/articles/11489188
#   - https://help.openai.com/en/articles/20001529-dots-privacy-security-and-safety-faqs
#   - https://learn.chatgpt.com/docs/pricing
#   - https://learn.chatgpt.com/docs/auth  (Secure your Codex cloud account; fetched 2026-10-09)
#
# TRAPS
#   1. AUTH_LOG carries NO MFA-state field. The Auth schema documents only action,
#      auth_provider_name, client_id, application_name and granted_scopes under action_data.
#      This rule therefore flags the sign-in METHOD that Required SSO does not cover, not the
#      absence of a second factor. Help 10468051 (Enterprise/Edu) and 11489188 (Business):
#      "Invited members from other domains may still use another permitted sign-in method",
#      and help 7967234: "MFA cannot currently be enforced at the ChatGPT workspace or API
#      Platform organization level." Confirm each flagged member's personal MFA by hand.
#   2. 'password' is the only auth_provider_name value the spec gives ("e.g. password").
#      OpenAI documents social login (Google, Microsoft, Apple) as a separate ChatGPT
#      sign-in method, and for those users MFA is set up "with your social login provider",
#      not on the ChatGPT account (learn.chatgpt.com/docs/auth, Secure your Codex cloud
#      account). The spec gives no auth_provider_name value for social login or SSO, so
#      this rule does NOT match social sign-ins. During validate-hth-guide, sign in once
#      through SSO and once through each permitted social provider, record the values,
#      and add the social values to the selection (or, once the tenant's SSO value is
#      recorded, use `selection and not sso`).
#   3. There is no dots event_type, actor type or field. AUTH_LOG cannot say whether the
#      account owns a dot. Scope the alert by enriching actor.user_id / actor.user_email with
#      the members of the groups bound to your dots-granting custom role (control 1.1).
#      Without enrichment it fires for every password sign-in in the workspace.
#   4. native_login_success and signup_success are listed in the spec as action values
#      without further description; they are matched because they are success actions that
#      carry the same auth_provider_name field as login_success.
#   5. Plan gap: the Compliance API and audit logs are unavailable on Business (learn pricing)
#      and on Pro. Business Premium and Pro dot owners produce no AUTH_LOG at all.
#   6. Delivery is at-least-once with a p99 under 30 minutes and 30-day file retention.
#      Deduplicate on event_id before alerting.
title: ChatGPT Password Sign-In Outside Required SSO (Dot Owner MFA Gap)
id: 5bcf97d6-0e3d-47e3-948a-710dbbf3455e
status: experimental
description: |
    Fires on a successful ChatGPT sign-in whose auth provider is password, read from the
    Compliance Logs Platform AUTH_LOG feed. Required SSO covers only members whose email
    uses a verified domain; invited members from other domains may still sign in another
    permitted way, and OpenAI cannot enforce MFA at the workspace level. A password sign-in
    on a Required-SSO workspace is therefore one documented part of the population whose
    second factor nobody can see or enforce. Social-login sign-ins (Google, Microsoft,
    Apple) are another documented non-SSO path, which this rule cannot see until their
    auth_provider_name values are recorded. If that account owns a dot, whoever holds the
    password directs an always-on agent with the member's plugin connections and
    cloud-browser sessions. AUTH_LOG has no MFA field and no dots attribute: enrich with
    dots-role group membership and confirm personal MFA (Settings > Security and login)
    for every flagged owner.
    This corresponds to HTH ChatGPT Dots control 1.2 (section 1.2, L1).
references:
    - https://howtoharden.com/guides/chatgpt-dots/#12-require-sso-or-personal-mfa-on-every-account-that-owns-a-dot
    - https://chatgpt.com/public/admin/api-reference
    - https://help.openai.com/en/articles/7967234-managing-multi-factor-authentication-mfa
    - https://help.openai.com/en/articles/10468051
    - https://help.openai.com/en/articles/20001529-dots-privacy-security-and-safety-faqs
    - https://learn.chatgpt.com/docs/auth
author: How to Harden
date: 2026/10/08
tags:
    - attack.initial_access
    - attack.persistence
    - attack.t1078.004
# HTH Guide Excerpt: begin password-login-detection
logsource:
    product: openai
    service: chatgpt-compliance
    definition: 'ChatGPT Compliance Logs Platform JSONL records with type AUTH_LOG; nested keys flattened with dots (action_data.auth_provider_name)'
detection:
    selection:
        type: 'AUTH_LOG'
        action_data.action:
            - 'login_success'
            - 'native_login_success'
            - 'signup_success'
        action_data.auth_provider_name: 'password'
    condition: selection
fields:
    - timestamp
    - event_id
    - actor.user_id
    - actor.user_email
    - action_data.action
    - action_data.auth_provider_name
    - request_metadata.client_ip
    - request_metadata.client_user_agent
# HTH Guide Excerpt: end password-login-detection
falsepositives:
    - External-domain members deliberately allowed on password sign-in who have turned on personal MFA (Settings > Security and login)
    - Break-glass or owner accounts kept on password sign-in by design and outside the dots role
    - Workspaces where the ChatGPT sign-in policy is not yet set to Required SSO (every password member matches)
    - 'Limitation, not a false positive: social-login sign-ins (Google, Microsoft, Apple) bypass Required SSO but are not matched until their auth_provider_name values are recorded (TRAP 2)'
level: medium
