# HTH Pack Contract: v1
#   control: asana-2.5
#   guide:   https://howtoharden.com/guides/asana/#25-control-third-party-apps-and-integrations
#   profile: L1
#   mode:    read-only
#   requires: audit-log ingestion from GET /workspaces/{workspace_gid}/audit_log_events (Enterprise+ or Legacy Enterprise)
# Frameworks: CIS Controls 2.3, 2.7 | NIST 800-53 CM-7, SA-9, AC-20
# Feed: packs/asana/api/hth-asana-4.01-export-audit-log-events.sh (NDJSON, one AuditLogEvent per line)
title: Asana App Approval or Token Policy Changed
id: 3a5e25c7-5579-4bc2-ba76-b0d9909cefed
status: experimental
description: |
    Fires when the organization's app-governance settings change: the global
    app approval mode, a specific app's approval setting, guest app or personal
    access token usage, personal access tokens being turned back on, or the
    token expiration policy. Any of these can turn the reviewed integration
    perimeter back into default-allow. App approval mode has no API, so these
    events are the only machine-readable evidence that it moved.
    Individual app authorizations (user_app_authorized) are deliberately not
    selected here: they are routine in approval mode and belong in a separate,
    lower-severity review.
    Event types are taken verbatim from the Admin settings table of Asana's
    supported audit log events.
    This corresponds to HTH Asana control 2.5 (Control Third-Party Apps and Integrations, L1).
references:
    - https://howtoharden.com/guides/asana/#25-control-third-party-apps-and-integrations
    - https://developers.asana.com/docs/audit-log-events
author: How to Harden
date: 2026/09/24
tags:
    - attack.persistence
    - attack.t1098.001
    - attack.initial_access
    - attack.t1199
logsource:
    product: asana
    service: audit_log
# HTH Guide Excerpt: begin detection
detection:
    selection:
        event_type:
            - 'workspace_require_app_approvals_of_type_changed'
            - 'workspace_app_admin_approval_setting_changed'
            - 'workspace_guest_app_usage_setting_changed'
            - 'workspace_guest_pat_usage_setting_changed'
            - 'workspace_personal_access_token_enabled'
            - 'workspace_personal_access_token_expiry_changed'
    condition: selection
fields:
    - created_at
    - event_type
    - actor.gid
    - actor.name
    - details.old_value
    - details.new_value
# HTH Guide Excerpt: end detection
falsepositives:
    - An approved app's approval setting changed as part of its vendor review
    - Token expiration tightened (for example from the 10-year default to 90 days)
level: medium
