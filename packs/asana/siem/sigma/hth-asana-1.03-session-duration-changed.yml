# HTH Pack Contract: v1
#   control: asana-1.3
#   guide:   https://howtoharden.com/guides/asana/#13-configure-session-timeout
#   profile: L1
#   mode:    read-only
#   requires: audit-log ingestion from GET /workspaces/{workspace_gid}/audit_log_events (Enterprise+ or Legacy Enterprise)
# Frameworks: CIS Controls 6.2 | NIST 800-53 AC-12
# Feed: packs/asana/api/hth-asana-4.01-export-audit-log-events.sh (NDJSON, one AuditLogEvent per line)
title: Asana Session Duration Setting Changed
id: 50aeeb03-3221-4d33-8cc4-3f6969eeed6c
status: experimental
description: |
    Fires when the workspace's default or idle session duration changes. A
    longer session lifetime widens the window in which a stolen session token
    stays usable, and the setting has no API to read it back, so the change
    event is the only signal. When the event carries details.old_value and
    details.new_value, compare new_value against the recorded baseline; a longer
    value is the regression.
    Event types are taken verbatim from the Admin settings table of Asana's
    supported audit log events.
    This corresponds to HTH Asana control 1.3 (Configure Session Timeout, L1).
references:
    - https://howtoharden.com/guides/asana/#13-configure-session-timeout
    - https://developers.asana.com/docs/audit-log-events
author: How to Harden
date: 2026/09/24
tags:
    - attack.defense_evasion
    - attack.t1550.004
logsource:
    product: asana
    service: audit_log
# HTH Guide Excerpt: begin detection
detection:
    selection:
        event_type:
            - 'workspace_default_session_duration_changed'
            - 'workspace_idle_session_duration_changed'
    condition: selection
fields:
    - created_at
    - event_type
    - actor.gid
    - actor.name
    - details.old_value
    - details.new_value
# HTH Guide Excerpt: end detection
falsepositives:
    - Deliberate tightening of the session lifetime; the new value is shorter than the old one
level: medium
