# HTH Pack Contract: v1
#   control: asana-2.4
#   guide:   https://howtoharden.com/guides/asana/#24-restrict-access-by-ip-address
#   profile: L2
#   mode:    read-only
#   requires: audit-log ingestion from GET /workspaces/{workspace_gid}/audit_log_events (Enterprise+ or Legacy Enterprise)
# Frameworks: CIS Controls 13.5 | NIST 800-53 AC-17, SC-7
# Feed: packs/asana/api/hth-asana-4.01-export-audit-log-events.sh (NDJSON, one AuditLogEvent per line)
title: Asana IP Allowlist Disabled or Widened
id: 9731534f-9b37-4f9b-870d-2ef0fd9b8fb3
status: experimental
description: |
    Fires when the workspace IP allowlist is turned off (for all traffic or for
    API traffic), when a range is added or changed, or when the set of users it
    applies to changes. Each of these can re-admit sessions from networks the
    allowlist exists to exclude, and Asana exposes no API to read the allowlist,
    so these events are the only machine-readable record of it moving.
    Removals (workspace_allowed_ip_range_removed) narrow access and are not
    selected.
    Event types are taken verbatim from the Admin settings table of Asana's
    supported audit log events.
    This corresponds to HTH Asana control 2.4 (Restrict Access by IP Address, L2).
references:
    - https://howtoharden.com/guides/asana/#24-restrict-access-by-ip-address
    - https://developers.asana.com/docs/audit-log-events
author: How to Harden
date: 2026/09/24
tags:
    - attack.defense_evasion
    - attack.t1562
logsource:
    product: asana
    service: audit_log
# HTH Guide Excerpt: begin detection
detection:
    selection:
        event_type:
            - 'workspace_ip_allowlist_disabled'
            - 'workspace_ip_allowlist_api_traffic_disabled'
            - 'workspace_allowed_ip_range_added'
            - 'workspace_allowed_ip_range_changed'
            - 'workspace_ip_allowlist_member_type_changed'
    condition: selection
fields:
    - created_at
    - event_type
    - actor.gid
    - actor.name
    - context.client_ip_address
    - details.old_value
    - details.new_value
# HTH Guide Excerpt: end detection
falsepositives:
    - A new office or VPN egress range added through change control
    - Break-glass disablement during a documented network outage
level: high
