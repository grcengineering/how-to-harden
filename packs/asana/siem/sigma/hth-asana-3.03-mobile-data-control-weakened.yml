# HTH Pack Contract: v1
#   control: asana-3.3
#   guide:   https://howtoharden.com/guides/asana/#33-configure-mobile-security
#   profile: L2
#   mode:    read-only
#   requires: audit-log ingestion from GET /workspaces/{workspace_gid}/audit_log_events (Enterprise+ or Legacy Enterprise)
# Frameworks: CIS Controls 13.7 | NIST 800-53 AC-19
# Feed: packs/asana/api/hth-asana-4.01-export-audit-log-events.sh (NDJSON, one AuditLogEvent per line)
title: Asana Mobile Data Control Weakened
id: 19bf531b-34eb-49e1-b083-ed0b49389775
status: experimental
description: |
    Fires when a mobile data control is loosened: biometric authentication no
    longer required, screen capture (Android) or copy-paste re-enabled, or
    attachment downloading and sharing re-enabled. These controls have no read
    or write API, so the events are the only machine-readable record of them
    changing.
    Asana's event table describes workspace_mobile_app_attachments_sharing_disabled
    as "...was enabled."; the event NAME is the contract, so this rule keys on
    workspace_mobile_app_attachments_sharing_enabled for the loosening direction.
    Event types are taken verbatim from the Admin settings table of Asana's
    supported audit log events.
    This corresponds to HTH Asana control 3.3 (Configure Mobile Security, L2).
references:
    - https://howtoharden.com/guides/asana/#33-configure-mobile-security
    - https://developers.asana.com/docs/audit-log-events
author: How to Harden
date: 2026/09/24
tags:
    - attack.collection
    - attack.exfiltration
logsource:
    product: asana
    service: audit_log
# HTH Guide Excerpt: begin detection
detection:
    selection:
        event_type:
            - 'workspace_mobile_app_biometric_authentication_required_disabled'
            - 'workspace_mobile_app_screen_capture_enabled'
            - 'workspace_mobile_app_copy_paste_enabled'
            - 'workspace_mobile_app_attachments_sharing_enabled'
    condition: selection
fields:
    - created_at
    - event_type
    - actor.gid
    - actor.name
    - context.client_ip_address
# HTH Guide Excerpt: end detection
falsepositives:
    - A documented exception for a team whose mobile workflow needs attachment access
level: medium
