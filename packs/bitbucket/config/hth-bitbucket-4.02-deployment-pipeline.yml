# HTH Bitbucket Control 4.2: Secure Deployment Pipeline
# Profile: L2 | NIST: CM-3
# https://howtoharden.com/guides/bitbucket/#42-configure-deployment-permissions

# HTH Guide Excerpt: begin cli-deployment-pipeline
pipelines:
  branches:
    main:
      - step:
          name: Build
          script:
            # Use `ci`, never the resolving installer: `ci` honours the lockfile
            # exactly, while the resolving form can silently pick up a newer
            # transitive version at build time.
            # --ignore-scripts blocks pre/post-install hooks, the execution path
            # used by the chalk/debug, solana-web3.js and Shai-Hulud npm
            # compromises. Drop it only for a dependency that genuinely needs a
            # build step, and say which one in review.
            - npm ci --ignore-scripts
            - npm run build
      - step:
          name: Deploy to Production
          deployment: production
          trigger: manual
          script:
            - ./deploy.sh
# HTH Guide Excerpt: end cli-deployment-pipeline
