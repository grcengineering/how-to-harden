# HTH Control claude-code 4.2: Harden Claude Code in CI/CD Pipelines
# Profile: L2 | NIST: SA-11, SA-15 | SOC 2: CC7.1, CC8.1
# https://howtoharden.com/guides/claude-code/#42-harden-claude-code-in-cicd-pipelines
# Source: https://code.claude.com/docs/en/github-actions (2026-11-05)
# Configure the named environment with required reviewers before using this recipe.
# The selected commit and its instruction files must already be reviewed.
# No untrusted PR trigger, write token, posting tool or automatic installer.
# Apply your runner network policy separately; this file does not create a firewall.
# HTH Guide Excerpt: begin cicd-hardened-workflow
name: Reviewed Claude Code analysis
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Reviewed immutable commit (40 lowercase hex characters)
        required: true
        type: string
permissions: {}
jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: claude-code-reviewed
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Validate selected revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: '[[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: anthropics/claude-code-action@f9fffe565bf81a7fcadb308a9d688a74e3b029f7 # v1 resolved 2026-11-05
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read the reviewed repository and report security observations in the workflow log. Do not execute repository code or publish findings.
          settings: '{"disableAllHooks":true}'
          claude_args: >-
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Agent"
            --max-turns 10
# HTH Guide Excerpt: end cicd-hardened-workflow
