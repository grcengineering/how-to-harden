# HTH Buildkite Control 3.6: Use OIDC Instead of Static Cloud Credentials
#   — PIPELINE half (pipeline.yml plugin blocks + step-level trust scoping)
# Profile Level: L2 (Walk)
# Frameworks: CIS Controls 5.4 | NIST 800-53 IA-5, IA-9
# Source: https://howtoharden.com/guides/buildkite/#36-use-oidc-instead-of-static-cloud-credentials
#
# PAIRS WITH: packs/buildkite/cli/hth-buildkite-3.06-oidc-subject.sh
# This file is the pipeline-author half: which steps exchange a token, for what
# role, with what lifetime. The .sh pack is the AGENT-OPERATOR half: the
# `environment` hook that mints/scopes the token subject before any of these
# plugins run. Neither half is the control on its own — see "WHY THE SCOPING IS
# SPLIT ACROSS TWO FILES" below, which is the single most important thing here.
#
# AGENT MAJOR VERSION: buildkite-agent v3 and v4 are IDENTICAL for everything in
# this file. Verified by diffing clicommand/oidc_request_token.go at tag v3.137.0
# (module github.com/buildkite/agent/v3) against branch main (module .../agent/v4,
# read 2026-08-18): same flags, same env var sources, same validation. The only
# delta is the urfave/cli generation used to declare them. State v3 in your
# runbook only because that is what is released today; nothing here breaks on v4.
#
# AUTHORING STATUS: DRIFT-CHECKED-ONLY.
# No build was executed against the principal's tenant, so no token was minted and
# no role was assumed here. Every plugin option below was read from that plugin's
# own plugin.yml at the pinned tag, and every runtime behaviour claimed in the
# comments was read from that plugin's hook/lib source at the SAME pinned tag,
# 2026-08-18:
#   aws-assume-role-with-web-identity  v1.7.0  (plugin.yml, hooks/environment,
#                                               hooks/pre-command, lib/plugin.bash)
#   gcp-workload-identity-federation   v1.6.0  (plugin.yml, hooks/environment,
#                                               lib/plugin.bash, hooks/pre-exit)
#   vault-secrets                      v2.4.2  (plugin.yml, hooks/environment,
#                                               lib/shared.bash)
# Claim names, the default `sub` format and the token defaults were read from
# buildkite/docs at main: pages/agent/cli/reference/oidc.md.
#
# -----------------------------------------------------------------------------
# WHY THE SCOPING IS SPLIT ACROSS TWO FILES (read this before editing)
# -----------------------------------------------------------------------------
# `buildkite-agent oidc request-token --subject-claim` also reads its value from
# the environment variable BUILDKITE_OIDC_TOKEN_SUBJECT_CLAIM (verified: the flag
# declares Sources: cli.EnvVars("BUILDKITE_OIDC_TOKEN_SUBJECT_CLAIM")).
#
# Buildkite `pipeline.yml` can set environment variables. Therefore ANYONE WHO CAN
# MERGE TO THE PIPELINE'S REPOSITORY CAN CHOOSE THE SUBJECT OF THE OIDC TOKEN
# THE AGENT MINTS — including broadening it from this pipeline's UUID to the
# organization UUID, which every other pipeline in the org also presents. If your
# cloud trust policy matches on `sub`, that is trust inheritance by pull request.
#
# So: this file deliberately sets NO `env:` block and never names
# BUILDKITE_OIDC_TOKEN_SUBJECT_CLAIM. Subject selection belongs in the agent-side
# `environment` hook, which lives on the agent host, is not in the build's
# repository, and runs BEFORE any plugin hook (verified ordering, docs/agent/v3/hooks:
# agent `environment` -> non-vendored plugin `environment`; vendored plugin
# environment hooks are explicitly called out as running after checkout instead).
# That hook, scoped on BUILDKITE_PIPELINE_SLUG / BUILDKITE_STEP_KEY, is region
# `cli-oidc-environment-hook` of the paired .sh pack.
#
# -----------------------------------------------------------------------------
# NON-OBVIOUS TRAPS
# -----------------------------------------------------------------------------
# T1  NEITHER CLOUD PLUGIN PASSES --subject-claim. Read lib/plugin.bash in both:
#     the AWS plugin builds `(buildkite-agent oidc request-token --audience
#     sts.amazonaws.com)` and appends only --lifetime and --aws-session-tag; the
#     GCP plugin appends only --audience, --lifetime and --claim. If you write an
#     AWS/Azure/GCP trust policy that matches a bare pipeline UUID in `sub`, these
#     plugins will present the DEFAULT COMPOUND SUBJECT and the exchange fails
#     shut — until the agent-side env var above supplies the subject. Getting this
#     wrong looks like a broken cloud policy, not a missing agent config.
# T2  THE AWS PLUGIN'S AUDIENCE IS HARDCODED to sts.amazonaws.com. There is no
#     `audience` option in its plugin.yml. Do not write a trust policy expecting a
#     custom aud for the AWS path.
# T3  `role-session-duration` AND `oidc-token-lifetime` ARE NOT THE SAME CLOCK, and
#     the plugin couples them only one way. From lib/plugin.bash: if
#     oidc-token-lifetime is unset and role-session-duration IS set, the token
#     lifetime becomes min(role-session-duration, 7200). The reverse never happens
#     — a role-session-duration above the IAM role's MaxSessionDuration is passed
#     straight to `sts assume-role-with-web-identity --duration-seconds` and AWS
#     rejects it. Set both explicitly, as done below.
# T4  `hook:` IS A THREE-WAY SWITCH WITH NO ERROR ON THE THIRD WAY. Both cloud
#     plugins ship hooks/environment AND hooks/pre-command, each guarded by an
#     exact string compare on the `hook` value. `hook: "pre-command"` is valid;
#     `hook: "environment"` is the default. Any other value — a typo like
#     "pre_command" — makes BOTH guards fail, both hooks `exit 0` printing
#     "Skipping ... hook", and the step runs WITH NO CREDENTIALS EXCHANGED and a
#     green plugin section in the log. If the agent host has ambient instance
#     credentials, the step silently runs as the HOST, not as the intended role.
# T5  PINNING TO A TAG IS NOT PINNING. Buildkite's own guidance is to use the
#     commit SHA "to avoid a plugin's git tag contents being changed"
#     (docs/pipelines/integrations/plugins/using). Tags are mutable refs on
#     repositories you do not control; a moved tag is arbitrary code execution on
#     every agent. The scoping region below pins by SHA for exactly this reason.
# T6  NO `$` INTERPOLATION ANYWHERE IN THIS FILE, ON PURPOSE. Control 3.4's
#     offline signing (`buildkite-agent tool sign` without --graphql-token) runs
#     validateNoInterpolations() and REFUSES to sign a pipeline containing `$`
#     interpolations. A `role-session-name: "bk-${BUILDKITE_BUILD_NUMBER}"` that
#     reads fine here makes the pipeline unsignable under 3.4. Static values keep
#     3.4 and 3.6 compatible. (AWS also caps role-session-name at 64 chars.)
# T7  THE GCP PLUGIN WRITES A BARE JWT TO A FILE NAMED token.json AND THAT IS
#     CORRECT. It calls `request-token` WITHOUT --format gcp and redirects stdout;
#     the generated credentials.json uses `credential_source: {file: ...}` with no
#     `format` block, which is GCP's plain-text-token form. Do not "fix" this by
#     adding --format gcp — the JSON envelope would then be read as the raw token.
# T8  VAULT'S JWT PATH IGNORES THE `server` OPTION. lib/shared.bash passes
#     -address="$server" on the approle and aws branches but NOT on the jwt branch
#     (`vault write -field=token auth/jwt/login role=... jwt=...`). Export VAULT_ADDR
#     on the agent or JWT auth talks to the wrong Vault. `server` is still used for
#     the subsequent secret reads, so a mismatch authenticates one place and reads
#     another.
# T9  VAULT'S auth METHOD FAILS OPEN ON A TYPO. plugin.yml's method enum is
#     ['approle','aws','jwt',''] — the EMPTY STRING IS SCHEMA-VALID — and
#     vault_auth()'s `case` has no `*)` default. An unknown or empty method falls
#     through, sets no VAULT_TOKEN, and the plugin proceeds to read secrets
#     unauthenticated. Pin `method: "jwt"` and assert it in review.
# T10 VAULT ENV SECRETS ARE EVAL'D. processEnvSecrets() runs `set -o allexport;
#     eval "$envscript"`. Write access to the Vault path is code execution on the
#     agent. Scope the Vault policy to the exact path, and never point `path` at a
#     tree other teams can write.
# T11 A STEP WITH NO `key:` HAS step_key = "" IN THE TOKEN. The default `sub`
#     ends in `:step:` with nothing after it, and as an AWS session tag a null
#     claim is presented as "" rather than being omitted. A trust policy keyed on
#     step_key silently matches every keyless step. Every privileged step below
#     carries an explicit `key:`.
#
# This file is a FRAGMENT. Merge these steps into your own .buildkite/pipeline.yml;
# do not commit it as-is. Replace every account id, ARN, project number, service
# account, Vault address and role name.
# =============================================================================

# HTH Guide Excerpt: begin config-oidc-cloud-plugins
# .buildkite/pipeline.yml — exchange a Buildkite OIDC token for short-lived cloud
# credentials. No static cloud key is stored in Buildkite, in the repository, or
# on the agent host.
steps:
  # ---- AWS: STS AssumeRoleWithWebIdentity -----------------------------------
  # Pinned by tag for readability here; the scoping region below shows the SHA
  # pin you should actually ship (T5).
  - key: "build-artifacts"
    label: ":aws: build and publish artifacts"
    agents:
      queue: "build"
    plugins:
      - aws-assume-role-with-web-identity#v1.7.0:
          role-arn: "arn:aws:iam::111122223333:role/buildkite-build-artifacts"
          # Static: no `$` interpolation, <= 64 chars, charset [\w+=,.@-] (T6).
          role-session-name: "bk-build-artifacts"
          # Both clocks set explicitly so neither is inferred (T3). 900s is the
          # AWS minimum for --duration-seconds; keep the token no longer-lived
          # than the credential it buys.
          role-session-duration: 900
          oidc-token-lifetime: 900
          region: "us-east-1"
          # Emitted under the nested "https://aws.amazon.com/tags" claim as
          # principal_tags, usable in the role's trust policy via
          # sts:RequestTag/<name> and aws:PrincipalTag/<name>. Requires the trust
          # policy to allow sts:TagSession as well as
          # sts:AssumeRoleWithWebIdentity, or the exchange is denied.
          session-tags:
            - "organization_slug"
            - "pipeline_id"
            - "build_branch"
            - "build_source"
    command: ".buildkite/steps/build-artifacts.sh"

  # ---- GCP: Workload Identity Federation -------------------------------------
  - key: "deploy-gcp"
    label: ":googlecloud: deploy"
    depends_on: "build-artifacts"
    agents:
      queue: "deploy"
    plugins:
      - gcp-workload-identity-federation#v1.6.0:
          # This exact string is echoed into credentials.json as the STS audience,
          # so it must match the provider resource name byte for byte.
          audience: "//iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/buildkite/providers/buildkite-oidc"
          service-account: "buildkite-deploy@my-project.iam.gserviceaccount.com"
          lifetime: 900
          # Passed through as repeated `--claim` flags. Constrain the WIF provider
          # attribute mapping on these, not on the mutable slugs.
          claims:
            - "pipeline_id"
            - "cluster_id"
            - "build_source"
    command: ".buildkite/steps/deploy-gcp.sh"

  # ---- HashiCorp Vault: JWT auth ---------------------------------------------
  # The Vault plugin does NOT mint a token. It reads one out of the environment
  # (T1 applies doubly here). BUILDKITE_OIDC_VAULT_JWT is populated by the agent
  # `environment` hook in the paired .sh pack, which runs first.
  - key: "db-migrate"
    label: ":vault: run migrations"
    depends_on: "deploy-gcp"
    agents:
      queue: "deploy"
    plugins:
      - vault-secrets#v2.4.2:
          server: "https://vault.internal.example.com:8200"
          path: "secret/buildkite/db-migrate"
          auth:
            # Never leave this empty or misspelled — it fails open (T9).
            method: "jwt"
            # Name of the env var holding the JWT. If omitted the plugin falls
            # back to $VAULT_JWT and hard-fails when that is unset.
            jwt-env: "BUILDKITE_OIDC_VAULT_JWT"
            # Omitting this silently defaults to the Vault role literally named
            # "buildkite" — almost certainly broader than this step needs.
            jwt-role: "buildkite-db-migrate"
    command: ".buildkite/steps/db-migrate.sh"
# HTH Guide Excerpt: end config-oidc-cloud-plugins

---
# HTH Guide Excerpt: begin config-oidc-step-scoping
# Narrow the blast radius on the Buildkite side, before the cloud policy is ever
# consulted. A step that is never scheduled cannot mint a token, which is strictly
# stronger than minting one and relying on the cloud provider to reject it.
steps:
  - key: "deploy-prod"
    label: ":rocket: deploy production"
    # `pipeline.slug` and `build.source` are Buildkite conditional variables.
    # Gating on build.source blocks API- and trigger-initiated builds, which can
    # nominate an arbitrary branch and commit, from reaching the privileged role.
    if: >-
      pipeline.slug == "payments-service" &&
      build.branch == "main" &&
      (build.source == "webhook" || build.source == "ui")
    agents:
      # Pair with control 3.2: only agents in the production cluster/queue ever
      # see this step, so cluster_id in the token is a meaningful assertion.
      queue: "prod-deploy"
    plugins:
      # SHA pin of tag v1.7.0 (T5). Re-resolve with:
      #   git ls-remote https://github.com/buildkite-plugins/aws-assume-role-with-web-identity-buildkite-plugin refs/tags/v1.7.0
      - aws-assume-role-with-web-identity#ed5cff4f02493c0f0edff5a899aa03817efe0b24:
          role-arn: "arn:aws:iam::111122223333:role/buildkite-deploy-prod"
          role-session-name: "bk-deploy-prod"
          role-session-duration: 900
          oidc-token-lifetime: 900
          region: "us-east-1"
          # Keeps credentials out of the environment for checkout and for the
          # repository's own post-checkout hook, which is editable by anyone who
          # can open a pull request. The plugin's pre-command hook still runs
          # before the repository's pre-command hook (agent -> plugin -> local),
          # so the command itself is unaffected. Exact-string switch — see T4.
          hook: "pre-command"
          session-tags:
            - "pipeline_id"
            - "build_branch"
            - "build_source"
    command: ".buildkite/steps/deploy-prod.sh"

  # The unprivileged majority of the pipeline carries no plugin and therefore no
  # path to a cloud credential. This is the shape to aim for: OIDC on the two
  # steps that deploy, not on the pipeline.
  - key: "unit-tests"
    label: ":test_tube: unit tests"
    command: ".buildkite/steps/test.sh"
# HTH Guide Excerpt: end config-oidc-step-scoping
