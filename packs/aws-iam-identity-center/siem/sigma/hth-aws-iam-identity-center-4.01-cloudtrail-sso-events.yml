# HTH Pack Contract: v1
#   control: aws-iam-identity-center-4.1
#   guide:   https://howtoharden.com/guides/aws-iam-identity-center/#41-configure-cloudtrail-logging
#   profile: L1
#   mode:    read-only
#   requires: CloudTrail management events from the IAM Identity Center home Region delivered to the SIEM
title: AWS IAM Identity Center Sensitive Admin Actions
id: hth-aws-iic-4.01-cloudtrail-sso-events
status: test
description: |
    Detects sensitive administrative actions in IAM Identity Center including
    identity provider configuration changes, MFA device modifications, and
    instance-level setting changes. These events indicate potential identity
    infrastructure tampering or account takeover attempts.
    This corresponds to HTH AWS IAM Identity Center control 4.1: Configure
    CloudTrail Logging (L1, NIST AU-2).
references:
    - https://howtoharden.com/guides/aws-iam-identity-center/
    - https://docs.aws.amazon.com/singlesignon/latest/userguide/logging-using-cloudtrail.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/cloudtrail-integration.html
author: How to Harden
date: 2026/02/16
tags:
    - attack.defense_evasion
    - attack.t1562.008
    - attack.persistence
    - attack.t1556.006
logsource:
    product: aws
    service: cloudtrail
# HTH Guide Excerpt: begin detection
detection:
    selection_idp_changes:
        eventSource: sso.amazonaws.com
        eventName:
            - 'AssociateDirectory'
            - 'DisassociateDirectory'
            - 'CreateInstanceAccessControlAttributeConfiguration'
            - 'UpdateInstanceAccessControlAttributeConfiguration'
            - 'DeleteInstanceAccessControlAttributeConfiguration'
    # External IdP (SAML) configuration changes are console APIs on the
    # sso-directory.amazonaws.com event source, not sso.amazonaws.com.
    selection_idp_config_changes:
        eventSource: sso-directory.amazonaws.com
        eventName:
            - 'CreateExternalIdPConfigurationForDirectory'
            - 'UpdateExternalIdPConfigurationForDirectory'
            - 'DeleteExternalIdPConfigurationForDirectory'
            - 'DisableExternalIdPConfigurationForDirectory'
    # MFA device registration and removal are sso-directory console APIs too.
    selection_mfa_changes:
        eventSource: sso-directory.amazonaws.com
        eventName:
            - 'StartVirtualMfaDeviceRegistration'
            - 'CompleteVirtualMfaDeviceRegistration'
            - 'StartWebAuthnDeviceRegistration'
            - 'CompleteWebAuthnDeviceRegistration'
            - 'DeleteMfaDeviceForUser'
            - 'UpdateMfaDeviceForUser'
    # The directory's MFA device-management settings (control 1.1) are written by
    # this sso console action.
    selection_mfa_settings_changes:
        eventSource: sso.amazonaws.com
        eventName:
            - 'PutMfaDeviceManagementForDirectory'
    selection_instance_changes:
        eventSource: sso.amazonaws.com
        eventName:
            - 'CreateInstance'
            - 'DeleteInstance'
            - 'UpdateInstance'
    condition: 1 of selection_*
fields:
    - eventTime
    - eventName
    - userIdentity.arn
    - userIdentity.principalId
    - sourceIPAddress
    - errorCode
    - errorMessage
# HTH Guide Excerpt: end detection
falsepositives:
    - Initial IAM Identity Center setup and configuration
    - Planned identity provider migrations
    - Authorized MFA device enrollment by users
level: critical
