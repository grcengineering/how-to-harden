title: ChatGPT Workspace Agent New App Grant
id: chatgpt-enterprise-6006-new-app-grant
status: experimental
description: |
    Detects when a workspace agent is granted access to a new
    connected app. App grants expand the agent's read or write
    surface and may push an agent across the lethal-trifecta
    threshold (private data + untrusted content + external send).
    This rule surfaces every new grant so the agents-admin can
    re-evaluate whether the approval policy still matches the
    expanded capability.
    This rule is written in a SCHEMA-AGNOSTIC form: no public Tier 1
    document enumerates Compliance Logs Platform event types beyond
    AUTH_LOG, so the event_type value below is a placeholder that MUST
    be mapped to your tenant's schema before deployment (see the
    inline note under logsource).
    This corresponds to HTH ChatGPT Enterprise control 6.4
    (section 6.4, L2).
references:
    - https://howtoharden.com/guides/chatgpt-enterprise/#64-detect-lethal-trifecta-agents-and-first-use-mcp-tools
    - https://developers.openai.com/cookbook/examples/chatgpt/compliance_api/logs_platform
    - https://learn.chatgpt.com/docs/enterprise/compliance-api.md
    - https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
author: How to Harden
date: 2026/08/08
tags:
    - attack.privilege_escalation
    - attack.t1098
logsource:
    product: openai
    service: chatgpt-compliance
# HTH Guide Excerpt: begin detection
# SCHEMA WARNING: per-event Compliance Logs Platform schemas are
# login-gated at the tenant Admin API reference
# (chatgpt.com/admin/api-reference) and MUST be confirmed there before
# deployment. The only publicly documented event_type value is AUTH_LOG
# (SCREAMING_SNAKE_CASE). Replace the placeholder selection below with
# the connector/app grant (OAuth resolution) event type your tenant
# actually emits.
detection:
    selection:
        # PLACEHOLDER — map to your tenant's app-grant / connector
        # OAuth event type from the authenticated Admin API reference:
        event_type: 'CONFIRM_IN_TENANT_ADMIN_API_REFERENCE'
    condition: selection
fields:
    - id
    - timestamp
# HTH Guide Excerpt: end detection
falsepositives:
    - Approved publish of a new agent that requires the granted app
    - Builder iteration on an agent draft (Preview state)
level: medium
