title: ChatGPT Workspace Agent First MCP Tool Invocation
id: chatgpt-enterprise-6004-mcp-first-use
status: experimental
description: |
    Detects the first invocation of a custom MCP tool by a workspace
    agent. Custom MCP servers (Developer Mode beta) extend the agent's
    trust boundary beyond OpenAI's vetted apps catalog. A first
    invocation is the most informative observation because the agent
    is exercising a capability that has not yet been seen in
    production traffic. Pair with the approval policy from control 6.3
    so the first call requires human approval before completion.
    This rule is written in a SCHEMA-AGNOSTIC form: no public Tier 1
    document enumerates Compliance Logs Platform event types beyond
    AUTH_LOG, so the event_type value and field names below are
    placeholders that MUST be mapped to your tenant's schema before
    deployment (see the inline note under logsource).
    This corresponds to HTH ChatGPT Enterprise control 6.4
    (section 6.4, L2).
references:
    - https://howtoharden.com/guides/chatgpt-enterprise/#64-detect-lethal-trifecta-agents-and-first-use-mcp-tools
    - https://developers.openai.com/cookbook/examples/chatgpt/compliance_api/logs_platform
    - https://learn.chatgpt.com/docs/enterprise/compliance-api.md
    - https://help.openai.com/en/articles/12584461-developer-mode-apps-and-full-mcp-connectors-in-chatgpt-beta
author: How to Harden
date: 2026/08/08
tags:
    - attack.execution
    - attack.t1059
    - attack.t1204
logsource:
    product: openai
    service: chatgpt-compliance
# HTH Guide Excerpt: begin detection
# SCHEMA WARNING: per-event Compliance Logs Platform schemas are
# login-gated at the tenant Admin API reference
# (chatgpt.com/admin/api-reference) and MUST be confirmed there before
# deployment. The only publicly documented event_type value is AUTH_LOG
# (SCREAMING_SNAKE_CASE). Replace the placeholder selection below with
# the MCP/connector tool-call event type your tenant actually emits.
detection:
    selection:
        # PLACEHOLDER — map to your tenant's connector/MCP tool-call
        # event type from the authenticated Admin API reference:
        event_type: 'CONFIRM_IN_TENANT_ADMIN_API_REFERENCE'
    condition: selection
    timeframe: 30d
fields:
    - id
    - timestamp
# HTH Guide Excerpt: end detection
falsepositives:
    - Approved enrollment of a new MCP tool with documented business case
    - Builder testing a tool during agent development (should fire only in Preview)
level: high
