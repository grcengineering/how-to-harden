title: Stripe Account Configuration Changed
id: c7816d13-aa1f-4567-8dd9-5012677ab978
status: test
description: |
    Detects account.updated events from Stripe, which record changes to
    the Account object's configuration (business details, capabilities,
    settings). It does NOT see API key lifecycle, team membership, or
    role changes: the v1 Events API carries no api_key.* or team event
    types.
    Those events are recorded elsewhere. The Dashboard security history
    (dashboard.stripe.com/security_history) lists logins, bank account
    changes and API key creation and expiry, and is user-exportable.
    The Activity Logs API (GET /v2/iam/activity_logs, public preview,
    https://docs.stripe.com/activity-logs) returns api_key_created,
    api_key_deleted, api_key_updated, api_key_viewed, user_invite_* and
    user_roles_* records for 6 months. It is polled, not delivered
    through event destinations, so a SIEM that wants key lifecycle must
    poll that API rather than rely on this rule.
    Delivery pipeline: this rule is written against Stripe Events
    delivered through a Workbench event destination to Amazon
    EventBridge (or Azure Event Grid), then forwarded to the SIEM.
    FIELD MAPPING NOTE: EventBridge wraps the Stripe event object
    under a top-level "detail" field, so the selection and fields
    below must be prefixed accordingly (type -> detail.type,
    data.object.id -> detail.data.object.id, and so on) unless the
    SIEM ingest pipeline unwraps "detail" before indexing.
    This corresponds to HTH Stripe control 3.1 (section 3.1, L1).
references:
    - https://howtoharden.com/guides/stripe/
    - https://docs.stripe.com/api/events/types
    - https://docs.stripe.com/activity-logs
    - https://docs.stripe.com/security
author: How to Harden
date: 2026/02/16
modified: 2026/09/24
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    product: stripe
    service: webhook
# HTH Guide Excerpt: begin detection
detection:
    selection:
        type: 'account.updated'
    condition: selection
fields:
    - id
    - created
    - type
    - data.object.id
    - data.previous_attributes
# HTH Guide Excerpt: end detection
falsepositives:
    - Routine account settings updates
    - Planned configuration changes
level: medium
