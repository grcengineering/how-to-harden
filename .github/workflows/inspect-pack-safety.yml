name: Inspect Pack Safety
on:
  pull_request:
    paths:
      - 'packs/inspect/**'
      - 'scripts/test-inspect-*.py'
      - '.github/workflows/inspect-pack-safety.yml'
  push:
    branches: [main]
    paths:
      - 'packs/inspect/**'
      - 'scripts/test-inspect-*.py'
      - '.github/workflows/inspect-pack-safety.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Run all offline Inspect tests
        run: |
          for test in scripts/test-inspect-*.py; do
            python "$test"
          done
