# How to Harden — CI Test Suite
#
# Runs content lint and build verification on every push/PR.
# Rust-based tooling has moved to grcengineering/OCEAN — Rust lint
# and Rust unit tests are no longer run from this repo.
# Jobs run in parallel for speed; any failure blocks merge.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Content Lint (validate-guides.sh — 7 checks) ──────────────────────────
  lint-content:
    name: Content Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: make lint-content
      - name: Source-discovery fixture integrity (offline)
        run: make test-source-discovery-fixtures
      - name: Factory pack safety tests (offline)
        run: make test-factory-packs
      - name: Tailscale pack safety tests (offline)
        run: make test-tailscale-packs
      - name: Pluto reconciliation pack safety tests (offline)
        run: |
          python3 scripts/test-pluto-anthropic.py
          python3 scripts/test-pluto-crosscut-packs.py
          python3 scripts/test-pluto-browser-inventory.py
          python3 -m unittest discover -s tests -p 'test_copilot_studio_packs.py'

  # ─── Pack Validation (validate-packs.sh — 17 checks) ───────────────────────
  # This job exists because the repo already owned the detectors and never ran
  # them: `make validate-packs` was invoked by no workflow, no hook, and no skill
  # checkpoint, so a PR could add nine prose-only packs and merge green.
  #
  # Two modes on purpose. --touched BLOCKS, scoped to files the branch changed,
  # so the gate bites new work today instead of after a corpus backfill. --all is
  # advisory and keeps the coverage ratio and pre-existing debt visible on every
  # run — invisible debt is how this corpus reached 33% automation coverage.
  validate-packs:
    name: Pack Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --touched needs the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      # No `|| true` here, ever: exit 2 means a check could not run, and a gate
      # that goes green when it could not look is worse than no gate.
      - name: Touched packs (blocking)
        run: bash scripts/validate-packs.sh --touched
      - name: Whole corpus (advisory — coverage + debt visibility)
        run: bash scripts/validate-packs.sh --all
        continue-on-error: true

  # Runs plans against the real pinned schema with a mocked provider, never a tailnet.
  tailscale-terraform:
    name: Tailscale Terraform Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - run: terraform -chdir=packs/tailscale/terraform fmt -check -recursive
      - run: terraform -chdir=packs/tailscale/terraform init -backend=false -input=false
      - run: terraform -chdir=packs/tailscale/terraform validate
      - run: terraform -chdir=packs/tailscale/terraform test

  tailscale-sdk:
    name: Tailscale SDK Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packs/tailscale/sdk/go.mod
          cache: false
      - name: Download pinned SDK dependencies
        working-directory: packs/tailscale/sdk
        run: go mod download all
      - name: Test constrained SDK transport (offline)
        working-directory: packs/tailscale/sdk
        run: go test -count=1 -v ./...

  # ─── Build Verification (pack sync + Jekyll) ───────────────────────────────
  test-build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs
      - run: make test-build
