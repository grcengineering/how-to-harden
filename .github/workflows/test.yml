# How to Harden — CI Test Suite
#
# Runs content lint and build verification on every push/PR.
# Rust-based tooling has moved to grcengineering/OCEAN — Rust lint
# and Rust unit tests are no longer run from this repo.
# Jobs run in parallel for speed; any failure blocks merge.
#
# Supply-chain posture (enforced by `sscsb verify`, controls
# actions-audit / workflow-audit-extended / dependency-pinning / harden-runner):
#   - every `uses:` is pinned to a full 40-char commit SHA, never a mutable tag
#   - an explicit least-privilege `permissions:` block, narrowed per job
#   - `persist-credentials: false` so GITHUB_TOKEN is not left on disk
#   - harden-runner first in every job for egress/tamper monitoring
#   - Python deps installed from a hash-pinned requirements file, never
#     `pip install <name>` which resolves to whatever is current

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level; no job needs more than read.
permissions:
  contents: read

jobs:
  # ─── Content Lint (validate-guides.sh — 7 checks) ──────────────────────────
  lint-content:
    name: Content Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-ci.txt
      - run: make lint-content

  # ─── Pack Validation (validate-packs.sh — 17 checks) ───────────────────────
  # This job exists because the repo already owned the detectors and never ran
  # them: `make validate-packs` was invoked by no workflow, no hook, and no skill
  # checkpoint, so a PR could add nine prose-only packs and merge green.
  #
  # Two modes on purpose. --touched BLOCKS, scoped to files the branch changed,
  # so the gate bites new work today instead of after a corpus backfill. --all is
  # advisory and keeps the coverage ratio and pre-existing debt visible on every
  # run — invisible debt is how this corpus reached 33% automation coverage.
  validate-packs:
    name: Pack Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # --touched needs the merge base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-ci.txt
      # No `|| true` here, ever: exit 2 means a check could not run, and a gate
      # that goes green when it could not look is worse than no gate.
      - name: Touched packs (blocking)
        run: bash scripts/validate-packs.sh --touched
      - name: Whole corpus (advisory — coverage + debt visibility)
        run: bash scripts/validate-packs.sh --all
        continue-on-error: true

  # ─── Build Verification (pack sync + Jekyll) ───────────────────────────────
  test-build:
    name: Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-ci.txt
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs
      - run: make test-build
