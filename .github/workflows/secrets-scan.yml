# sscsb: CI secret scanning — TruffleHog + Gitleaks.
#
# Both scanners run (.sscsb/config.toml → [controls.secrets] trufflehog = true,
# gitleaks = true). TruffleHog VERIFIES candidate secrets against the issuing
# provider and, with --results=verified,unknown, reports only those confirmed
# live or whose check errored. It has no detector for generic secrets and drops
# keys it cannot verify. Gitleaks catches that detection class, except
# for three rules .gitleaks.toml exempts in the published content directories
# and the vendored docs/assets/monaco/ bundle, which it skips entirely.
# Local hooks block first; this catches anything that slips past (e.g. commits
# made through the GitHub web UI).
#
# On pull_request the exact tree is the GitHub test merge, not the PR head.
# Do not weaken the added tree scan by replacing it with commit-range scanning.
# All actions and downloaded scanner binaries are pinned.
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install TruffleHog (pinned release, checksum-verified before execution)
        env:
          VERSION: "3.100.0"
          SHA256: "b2d85eba59865e98f45c9fc9f77d2c6d62df529fdd5755af121304ea5a7cecbb"
        run: |
          set -euo pipefail
          tarball="trufflehog_${VERSION}_linux_amd64.tar.gz"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o "$workdir/$tarball" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/${tarball}"
          ( cd "$workdir" && printf '%s  %s\n' "$SHA256" "$tarball" | sha256sum -c - )
          install_dir="${RUNNER_TEMP}/trufflehog-bin"
          mkdir -p "$install_dir"
          tar -xzf "$workdir/$tarball" -C "$install_dir" trufflehog
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: TruffleHog scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          scanner="${RUNNER_TEMP}/trufflehog-bin/trufflehog"
          "$scanner" --version

          run_scan() {
            local label="$1" result
            shift
            # Never echo scanner output: some TruffleHog formats contain
            # raw matches or adjacent source. Report only the stage/status.
            if "$scanner" "$@" --results=verified,unknown --fail \
              --fail-on-scan-errors --no-update >/dev/null 2>&1; then
              printf '%s: passed\n' "$label"
            else
              result=$?
              if [ "$result" -eq 183 ]; then
                printf '::error::%s reported protected findings (values not logged).\n' "$label"
              else
                printf '::error::%s failed (exit %s).\n' "$label" "$result"
              fi
              return "$result"
            fi
          }

          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA"; head="$PR_HEAD_SHA" ;;
            push) base="$PUSH_BEFORE_SHA"; head="$GITHUB_SHA" ;;
            *) exit 1 ;;
          esac
          git cat-file -e "${head}^{commit}"
          history=(--branch "$head")
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "${base}^{commit}" 2>/dev/null; then
              [ "$base" != "$head" ]
              history+=(--since-commit "$base")
            elif [ "$EVENT_NAME" = pull_request ]; then
              echo "::error::Cannot resolve PR base commit."
              exit 1
            fi
            # When a pushed-away commit is unavailable, scan full head history.
          elif [ "$EVENT_NAME" = pull_request ]; then
            echo "::error::Missing PR base commit."
            exit 1
          fi

          tree="$(mktemp -d)"
          trap 'rm -rf "$tree"' EXIT
          python3 scripts/export-ci-scan-tree.py "$GITHUB_SHA" "$tree"
          # Run both even if one fails; then propagate a failing status.
          scan_status=0
          run_scan "TruffleHog history" git "file://${GITHUB_WORKSPACE}/" "${history[@]}" || scan_status=$?
          run_scan "TruffleHog event tree" filesystem "$tree" || scan_status=$?
          exit "$scan_status"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks/gitleaks-action is commercially licensed: for organization-owned
      # repos it hard-fails before scanning unless a GITLEAKS_LICENSE secret exists
      # ("[org] is an organization. License key is required." -- src/index.js).
      # This org has no license, so that action never actually scanned anything.
      # The gitleaks BINARY is MIT-licensed OSS, so we run it directly.
      # actions-audit mandates full-SHA pinning for ACTIONS; the equivalent for a
      # downloaded binary is a pinned version plus a checksum verified BEFORE exec.
      - name: Install gitleaks (pinned release, checksum-verified before execution)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          workdir="$(mktemp -d)"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o "${workdir}/${tarball}" "${base_url}/${tarball}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o "${workdir}/checksums.txt" \
            "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # 1. the digest pinned here must be the digest this release publishes
          grep -Fxq "${GITLEAKS_SHA256}  ${tarball}" "${workdir}/checksums.txt"
          # 2. the bytes we downloaded must match that digest -- checked before exec
          ( cd "${workdir}" \
            && printf '%s  %s\n' "${GITLEAKS_SHA256}" "${tarball}" | sha256sum -c - )

          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          tar -xzf "${workdir}/${tarball}" -C "${install_dir}" gitleaks
          chmod +x "${install_dir}/gitleaks"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Gitleaks scan
        env:
          # Context values are passed as env vars, never interpolated into the
          # script body (GitHub Actions expression-injection hardening).
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gitleaks version

          null_sha="0000000000000000000000000000000000000000"
          case "${EVENT_NAME}" in
            pull_request) base_sha="${PR_BASE_SHA}";    head_sha="${PR_HEAD_SHA}"  ;;
            push)         base_sha="${PUSH_BEFORE_SHA}"; head_sha="${PUSH_HEAD_SHA}" ;;
            *)            base_sha="";                   head_sha="${PUSH_HEAD_SHA}" ;;
          esac

          # Scope = the commits under review. This is exactly the scope the
          # licensed action scanned on push/pull_request events
          # (src/gitleaks.js: --log-opts=--no-merges --first-parent BASE..HEAD);
          # it is a scan-scope choice, not a rule/finding suppression.
          if [ -n "${base_sha}" ] && [ "${base_sha}" != "${null_sha}" ] \
             && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            log_opts="--no-merges --first-parent ${base_sha}..${head_sha}"
          else
            # No resolvable base (new branch / force push): scan the head commit.
            # No --no-merges here: it could filter out a merge head and leave us
            # silently scanning zero commits, which would pass without checking.
            log_opts="-1 ${head_sha}"
          fi
          echo "Scanning commit range: ${log_opts}"

          # --redact keeps any match out of the job log. Exit code is left at the
          # gitleaks default (1 when leaks are found), so a leak fails this check.
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --log-opts="${log_opts}" \
            .

      - name: Gitleaks event tree scan
        # If history finds leaks, still scan the event tree for diagnostics.
        # A missing pinned binary fails the step, never falls back to PATH.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          scanner="${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          test -x "$scanner"
          tree="$(mktemp -d)"
          trap 'rm -rf "$tree"' EXIT
          python3 scripts/export-ci-scan-tree.py "$GITHUB_SHA" "$tree"
          # Relative paths keep the existing allowlist semantics consistent.
          config="${GITHUB_WORKSPACE}/.gitleaks.toml"
          ( cd "$tree" && "$scanner" dir --config "$config" --redact --no-banner . )
