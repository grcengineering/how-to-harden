# sscsb: CI secret scanning — TruffleHog only.
#
# Strongest-tool-only policy (.sscsb/config.toml → [controls.secrets] gitleaks = false):
# TruffleHog VERIFIES candidate secrets against the issuing provider, so a finding
# means a live credential rather than a regex shape. Gitleaks is regex-only; running
# both adds false positives without adding detection power, and a noisy gate is a
# gate people learn to skip. Local hooks block first; this catches anything that
# slips past (e.g. commits made through the GitHub web UI).
#
# All actions pinned to full commit SHAs (sscsb actions-audit enforces this).
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Upstream README suggests @main; sscsb pins the release SHA instead (v3.95.9).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown
