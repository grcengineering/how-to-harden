name: Cognition Pack Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'packs/devin/**'
      - 'packs/devin-cli/**'
      - 'packs/devin-desktop/**'
      - 'packs/devin-federal/**'
      - 'packs/deepwiki/**'
      - 'packs/poke/**'
      - 'scripts/test-cognition-refresh.test.ts'
      - '.github/workflows/cognition-pack-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun test --timeout 30000 scripts/test-cognition-refresh.test.ts
      - run: python3 scripts/test-devin-api-packs.py
      - run: python3 scripts/test-devin-cli-packs.py
      - run: python3 scripts/test-devin-desktop-packs.py
      - run: python3 scripts/test-deepwiki-packs.py
