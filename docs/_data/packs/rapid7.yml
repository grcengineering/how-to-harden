"3.1":
  api:
    lang: "bash"
    filename: "hth-rapid7-3.01-rbac-role-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/rapid7/api/hth-rapid7-3.01-rbac-role-audit.sh"
    excerpts:
      audit-roles-and-privileges:
        content: |2
          
          # --- Inventory all roles and their privilege footprint ---
          # GET /api/3/roles returns every role users may be assigned
          echo "=== Role inventory (name | id | privilege count) ==="
          api "/api/3/roles" | jq -r '
            .resources[]
            | [.name, .id, (.privileges | length | tostring)] | join(" | ")'
          
          # --- Flag roles that carry the all-permissions privilege ---
          # Any role granting all-permissions is a Global Administrator equivalent;
          # custom roles should never carry it
          echo ""
          echo "=== Roles granting all-permissions (Global Administrator scope) ==="
          api "/api/3/roles" | jq -r '
            .resources[]
            | select(.privileges | index("all-permissions"))
            | "FLAG: role \(.name) (\(.id)) grants all-permissions"'
          
          # --- Map users to roles to make access reviews enforceable ---
          # GET /api/3/users is paged (page/size); walk every page
          echo ""
          echo "=== User-to-role assignments ==="
          page=0
          while :; do
            body=$(api "/api/3/users?page=${page}&size=500")
            echo "${body}" | jq -r '
              .resources[]
              | [.login, .role.name,
                 (if .role.allSites then "all-sites" else "scoped-sites" end),
                 (if .role.allAssetGroups then "all-asset-groups" else "scoped-groups" end)]
              | join(" | ")'
            total=$(echo "${body}" | jq -r '.page.totalPages')
            page=$((page + 1))
            [ "${page}" -ge "${total}" ] && break
          done

"3.2":
  api:
    lang: "bash"
    filename: "hth-rapid7-3.02-admin-account-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/rapid7/api/hth-rapid7-3.02-admin-account-audit.sh"
    excerpts:
      audit-admin-accounts:
        content: |2
          
          # --- Inventory administrator (superuser) accounts ---
          # GET /api/3/users is paged; collect every account, then filter on
          # role.superuser to find Global Administrators
          echo "=== Collecting user accounts ==="
          users="[]"
          page=0
          while :; do
            body=$(api "/api/3/users?page=${page}&size=500")
            users=$(jq -s '.[0] + .[1].resources' <(echo "${users}") <(echo "${body}"))
            total=$(echo "${body}" | jq -r '.page.totalPages')
            page=$((page + 1))
            [ "${page}" -ge "${total}" ] && break
          done
          
          echo ""
          echo "=== Administrator accounts (login | enabled | locked | auth source) ==="
          echo "${users}" | jq -r '
            .[] | select(.role.superuser == true)
            | [.login, (.enabled | tostring), (.locked | tostring), .authentication.type]
            | join(" | ")'
          
          # --- Enforce the admin headcount ceiling (limit Global Admins to 2-3) ---
          admin_count=$(echo "${users}" | jq '[.[] | select(.role.superuser == true)] | length')
          echo ""
          if [ "${admin_count}" -gt "${MAX_ADMINS}" ]; then
            echo "FLAG: ${admin_count} Global Administrator accounts exceed the ${MAX_ADMINS}-admin ceiling"
          else
            echo "OK: ${admin_count} Global Administrator account(s) within the ${MAX_ADMINS}-admin ceiling"
          fi
          
          # --- Flag enabled admins without console two-factor authentication ---
          # GET /api/3/users/{id}/2FA returns 200 when a token seed is configured and
          # 404 when it is not; only the status code is inspected here
          echo ""
          echo "=== Console 2FA status for enabled administrator accounts ==="
          for id in $(echo "${users}" | jq -r '
              .[] | select(.role.superuser == true and .enabled == true) | .id'); do
            login=$(echo "${users}" | jq -r --argjson id "${id}" '.[] | select(.id == $id) | .login')
            status=$(curl -sk -o /dev/null -w "%{http_code}" \
              -u "${CONSOLE_USER}:${CONSOLE_PASS}" \
              -H "Accept: application/json" "${CONSOLE_URL}/api/3/users/${id}/2FA")
            if [ "${status}" = "200" ]; then
              echo "OK: ${login} has console 2FA configured"
            else
              echo "FLAG: ${login} has no console 2FA token configured (HTTP ${status})"
            fi
          done

