      audit-program-members:
        content: |2
          set +x
          set -euo pipefail
          umask 077
          
          username="${HACKERONE_API_USERNAME:?Set HACKERONE_API_USERNAME}"
          token="${HACKERONE_API_TOKEN:?Set HACKERONE_API_TOKEN from your secret manager}"
