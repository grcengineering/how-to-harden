    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grafana-cloud/api/hth-grafana-cloud-1.01-read-organization-mfa.sh"
    excerpts:
      read-grafana-cloud-org-mfa:
        content: |2
          set +x
          set -euo pipefail
          
          : "${GRAFANA_CLOUD_ORG_SLUG:?Set the Grafana Cloud organization slug}"
          : "${GRAFANA_CLOUD_API_TOKEN:?Inject an authorized Grafana Cloud API token}"
          [[ "$GRAFANA_CLOUD_ORG_SLUG" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]] || exit 2
          [[ "$GRAFANA_CLOUD_API_TOKEN" =~ ^[A-Za-z0-9._~+/=-]+$ ]] || exit 2
          
          response=$(
            printf 'Authorization: Bearer %s\n' "$GRAFANA_CLOUD_API_TOKEN" |
              curl -q --fail --silent --show-error --proto '=https' --max-time 30 \
                --header @- "https://grafana.com/api/orgs/$GRAFANA_CLOUD_ORG_SLUG/settings"
          )
          jq -e 'if (.mfaRequired | type) == "boolean" then {mfaRequired} else error("invalid MFA settings response") end' <<< "$response"

"1.2":
  terraform:
    lang: "hcl"
    filename: "hth-grafana-cloud-1.02-scope-stack-metrics-policy.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grafana-cloud/terraform/hth-grafana-cloud-1.02-scope-stack-metrics-policy.tf"
    excerpts:
      scope-grafana-stack-metrics-policy:
        content: |2
          terraform {
            required_providers {
              grafana = {
                source  = "grafana/grafana"
                version = "4.55.0"
              }
            }
          }
          
          # Authenticate with GRAFANA_CLOUD_ACCESS_POLICY_TOKEN; do not put it in this file.
          provider "grafana" {}
          
          variable "stack_id" {
            type        = string
            description = "Existing authorized Grafana Cloud stack ID."
          }
          
          variable "region" {
            type        = string
            description = "Exact region returned for the selected Grafana Cloud stack."
          }
          
          resource "grafana_cloud_access_policy" "stack_metrics_reader" {
            region = var.region
            name   = "stack-metrics-reader"
            scopes = ["metrics:read"]
          
            realm {
              type       = "stack"
              identifier = var.stack_id
            }
          }
  api:
    lang: "bash"
    filename: "hth-grafana-cloud-1.02-read-regional-access-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grafana-cloud/api/hth-grafana-cloud-1.02-read-regional-access-policy.sh"
    excerpts:
      read-grafana-cloud-regional-policy:
        content: |2
          set +x
          set -euo pipefail
          
          : "${GRAFANA_CLOUD_POLICY_ID:?Set the access policy UUID}"
          : "${GRAFANA_CLOUD_REGION:?Set the access policy region}"
          : "${GRAFANA_CLOUD_API_TOKEN:?Inject an authorized Grafana Cloud API token}"
          [[ "$GRAFANA_CLOUD_POLICY_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || exit 2
          [[ "$GRAFANA_CLOUD_REGION" =~ ^[A-Za-z0-9-]+$ ]] || exit 2
          [[ "$GRAFANA_CLOUD_API_TOKEN" =~ ^[A-Za-z0-9._~+/=-]+$ ]] || exit 2
          
          response=$(
            printf 'Authorization: Bearer %s\n' "$GRAFANA_CLOUD_API_TOKEN" |
              curl -q --fail --silent --show-error --proto '=https' --max-time 30 \
                --header @- --get --data-urlencode "region=$GRAFANA_CLOUD_REGION" \
                "https://www.grafana.com/api/v1/accesspolicies/$GRAFANA_CLOUD_POLICY_ID"
          )
          jq -e --arg id "$GRAFANA_CLOUD_POLICY_ID" '
              if (.id != $id) or ((.scopes | type) != "array") or ((.realms | type) != "array")
              then error("invalid access policy response")
              else {id, orgId, name, scopes, realms, allowedSubnets: (.conditions.allowedSubnets // [])}
              end' <<< "$response"

