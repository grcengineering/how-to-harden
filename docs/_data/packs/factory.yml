"4.1":
  config:
    lang: "bash"
    filename: "hth-factory-4.01-build-source-ip-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/factory/config/hth-factory-4.01-build-source-ip-policy.sh"
    excerpts:
      build-source-ip-policy:
        content: |2
          hth_init 3
          [[ -n "${FACTORY_ALLOWED_IPS_FILE:-}" ]] || hth_unknown 'provide FACTORY_ALLOWED_IPS_FILE; no default source IP is safe'
          python3 - "$FACTORY_ALLOWED_IPS_FILE" <<'PY'
          import ipaddress
          import json
          import sys
          try:
              with open(sys.argv[1], encoding='utf-8') as source:
                  entries = json.load(source)
              if not isinstance(entries, list) or not entries or any(not isinstance(x, str) for x in entries):
                  raise ValueError()
              networks = [ipaddress.ip_network(x, strict=False) for x in entries]
              if any(n.version != 4 or n.prefixlen == 0 or n.is_loopback or n.is_multicast or n.is_unspecified for n in networks):
                  raise ValueError()
          except (OSError, ValueError, TypeError):
              print('UNKNOWN: provide a nonempty IPv4 list; IPv6 and unrestricted /0 are refused', file=sys.stderr)
              sys.exit(2)
          print(json.dumps({'networkPolicy': {'allowedIps': sorted({str(n) for n in networks})}}, indent=2))
          PY

"4.2":
  config:
    lang: "bash"
    filename: "hth-factory-4.02-build-model-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/factory/config/hth-factory-4.02-build-model-policy.sh"
    excerpts:
      build-model-policy:
        content: |2
          hth_init 2
          [[ -n "${FACTORY_APPROVED_MODEL_IDS_FILE:-}" ]] || hth_unknown 'provide FACTORY_APPROVED_MODEL_IDS_FILE'
          python3 - "$FACTORY_APPROVED_MODEL_IDS_FILE" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding='utf-8') as source:
                  ids = json.load(source)
              if not isinstance(ids, list) or not ids or any(
                  not isinstance(x, str) or not x or x != x.strip() or len(x) > 256 or
                  any(ord(c) < 32 for c in x) for x in ids
              ) or len(set(ids)) != len(ids):
                  raise ValueError()
          except (OSError, ValueError, TypeError):
              print('UNKNOWN: provide a nonempty array of unique current model IDs', file=sys.stderr)
              sys.exit(2)
          print(json.dumps({
              'modelPolicy': {'allowedModelIds': ids, 'allowAllFactoryModels': False, 'allowCustomModels': False},
              'imageGenerationEnabled': False
          }, indent=2))
          PY
  sdk:
    lang: "python"
    filename: "hth-factory-4.02-verify-model-catalog.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/factory/sdk/hth-factory-4.02-verify-model-catalog.py"
    excerpts:
      verify-model-catalog:
        content: |2
          async def main():
              level = os.environ.get('HTH_PROFILE_LEVEL', '1')
              if level not in ('1', '2', '3', '4') or int(level) < 2:
                  unknown('requires HTH_PROFILE_LEVEL >= 2')
              project = Path(os.environ.get('FACTORY_PROJECT_DIR', ''))
              output = os.environ.get('FACTORY_MODEL_OUTPUT', '')
              if not project.is_absolute() or not project.is_dir() or not output:
                  unknown('provide a trusted absolute FACTORY_PROJECT_DIR and new FACTORY_MODEL_OUTPUT')
              try:
                  with open(os.environ['FACTORY_APPROVED_MODEL_IDS_FILE'], encoding='utf-8') as source:
                      approved = json.load(source)
                  if not isinstance(approved, list) or not approved or any(
                      not isinstance(x, str) or not x or x != x.strip() for x in approved
                  ) or len(set(approved)) != len(approved):
                      raise ValueError()
              except (KeyError, OSError, ValueError, TypeError):
                  unknown('provide a nonempty JSON array of unique approved model IDs')
              try:
                  from droid_sdk import list_models
                  models = await asyncio.wait_for(list_models(include_disabled=True, cwd=project), timeout=60)
                  if not isinstance(models, list) or any(
                      not isinstance(m.id, str) or not m.id or type(m.disabled) is not bool for m in models
                  ) or len({m.id for m in models}) != len(models):
                      raise ValueError()
              except Exception:
                  unknown('SDK discovery failed; check supported versions, authentication and policy')
              available = {m.id for m in models if not m.disabled}
              report = {'approved': approved, 'available': sorted(available),
                        'unapproved': sorted(available - set(approved)),
                        'missingOrDisabled': sorted(set(approved) - available)}
              try:
                  fd = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              except OSError:
                  unknown('output must be a new file in a trusted existing directory')
              try:
                  with os.fdopen(fd, 'w', encoding='utf-8') as target:
                      json.dump(report, target, indent=2)
                      target.write('\n')
              except OSError:
                  os.unlink(output)
                  unknown('could not save complete catalog evidence')
              if report['unapproved'] or report['missingOrDisabled']:
                  print('DRIFT: selectable models differ from the reviewed list; inspect private evidence.')
                  return 1
              print('MATCH: selectable model IDs match the reviewed list in this account and project.')
              return 0
          
          
          if __name__ == '__main__':
              sys.exit(asyncio.run(main()))

