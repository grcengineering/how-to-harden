"1.2":
  api:
    lang: "bash"
    filename: "hth-replit-1.02-audit-members-vs-idp.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/api/hth-replit-1.02-audit-members-vs-idp.sh"
    excerpts:
      members-vs-idp-audit:
        content: |2
          # Diff every non-guest Replit member against the emails your IdP assigns to Replit.
          [ -r "${REPLIT_IDP_EXPORT:-}" ] || { echo "PRECONDITION: set REPLIT_IDP_EXPORT to a readable file of IdP-assigned emails" >&2; exit 2; }
          IDP=$(jq -R 'ascii_downcase | gsub("^\\s+|\\s+$"; "") | select(length > 0 and (startswith("#") | not))' \
                  "${REPLIT_IDP_EXPORT}" | jq -s 'unique')
          if [ "$(printf '%s' "${IDP}" | jq 'length')" -eq 0 ]; then
            echo "PRECONDITION: ${REPLIT_IDP_EXPORT} holds no emails — nothing to compare against" >&2; exit 2
          fi
          
          paginate "/members"
          MEMBERS="${ITEMS}"
          TOTAL=$(printf '%s' "${MEMBERS}" | jq 'length')
          if [ "${TOTAL}" -eq 0 ]; then
            echo "PRECONDITION: /members returned no members — an Enterprise account always has its account admin" >&2; exit 2
          fi
          
          # Classify each member: "disabled" = has memberships, every one disabled, not an account
          # admin; "guest" = every ENABLED membership is a guest role, not an account admin;
          # anything else holds access. A missing isDisabled counts as enabled.
          CLASSED=$(printf '%s' "${MEMBERS}" | jq -c --argjson idp "${IDP}" '
            [ .[]
              | [.workspaces[] | select(.isDisabled != true)] as $on
              | . + { assigned: ((.user.email | ascii_downcase) as $e | any($idp[]; . == $e)),
                      class: (if .isAccountAdmin == true then "access"
                              elif (.workspaces | length) > 0 and ($on | length) == 0 then "disabled"
                              elif ($on | length) > 0 and ($on | all(.role == "guest")) then "guest"
                              else "access" end) } ]')
          ORPHANS=$(printf '%s' "${CLASSED}" | jq -c '[.[] | select(.class == "access" and (.assigned | not))]')
          DORMANT=$(printf '%s' "${CLASSED}" | jq -c '[.[] | select(.class == "disabled" and (.assigned | not))]')
          GUESTS=$(printf '%s' "${CLASSED}" | jq '[.[] | select(.class == "guest")] | length')
          DISABLED=$(printf '%s' "${CLASSED}" | jq '[.[] | select(.class == "disabled")] | length')
          COUNT=$(printf '%s' "${ORPHANS}" | jq 'length')
          LINE='"    - \(.user.username) (@\(.user.email | split("@") | last)) roles=\([.workspaces[] | "\(.slug):\(.role)\(if .isDisabled == true then "(disabled)" else "" end)"] | join(",")) accountAdmin=\(.isAccountAdmin) lastSeen=\(.lastSeen // "never")"'
          
          echo "Replit 1.2 — Account members vs IdP assignment"
          echo "  members: ${TOTAL} (guest-only, excluded: ${GUESTS}; every membership disabled: ${DISABLED}); IdP-assigned emails: $(printf '%s' "${IDP}" | jq 'length')"
          if [ "$(printf '%s' "${DORMANT}" | jq 'length')" -gt 0 ]; then
            echo "NOTE: outside the IdP but every workspace membership is disabled (no workspace access, so not a finding; review on the Members page):"
            printf '%s' "${DORMANT}" | jq -r ".[] | ${LINE}"
          fi
          if [ "${COUNT}" -gt 0 ]; then
            echo "FINDING: ${COUNT} member(s) hold Replit access your IdP does not assign — SCIM will never remove them:"
            printf '%s' "${ORPHANS}" | jq -r ".[] | ${LINE}"
            exit 1
          fi
          echo "COMPLIANT: every non-guest member with an enabled membership (or account admin) is assigned to Replit in the IdP."
          exit 0

"1.3":
  api:
    lang: "bash"
    filename: "hth-replit-1.03-audit-admin-roster.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/api/hth-replit-1.03-audit-admin-roster.sh"
    excerpts:
      admin-roster-audit:
        content: |2
          # Account admins against a ceiling and (optionally) a governed allowlist; workspace
          # admins reported per workspace.
          MAX="${REPLIT_MAX_ACCOUNT_ADMINS:-3}"
          case "${MAX}" in
            ''|*[!0-9]*) echo "PRECONDITION: REPLIT_MAX_ACCOUNT_ADMINS must be a whole number (got '${MAX}')" >&2; exit 2 ;;
          esac
          paginate "/members"
          MEMBERS="${ITEMS}"
          ADMINS=$(printf '%s' "${MEMBERS}" | jq -c '[.[] | select(.isAccountAdmin == true) | .user.username]')
          N=$(printf '%s' "${ADMINS}" | jq 'length')
          if [ "${N}" -eq 0 ]; then
            echo "PRECONDITION: no account admin in /members — the key itself belongs to one, so this read is wrong" >&2; exit 2
          fi
          FINDING=0
          echo "Replit 1.3 — admin roster"
          echo "  account admins: ${N} (ceiling REPLIT_MAX_ACCOUNT_ADMINS=${MAX})"
          printf '%s' "${ADMINS}" | jq -r '.[] | "    - \(.)"'
          if [ "${N}" -gt "${MAX}" ]; then
            echo "FINDING: ${N} account admins exceeds ${MAX} — demote the surplus (Settings -> Seats, or the Account admin group under SCIM)."
            FINDING=1
          fi
          if [ -n "${REPLIT_ADMIN_ALLOWLIST:-}" ]; then
            [ -r "${REPLIT_ADMIN_ALLOWLIST}" ] || { echo "PRECONDITION: REPLIT_ADMIN_ALLOWLIST is not readable" >&2; exit 2; }
            ALLOW=$(jq -R 'ascii_downcase | gsub("^\\s+|\\s+$"; "") | select(length > 0 and (startswith("#") | not))' \
                      "${REPLIT_ADMIN_ALLOWLIST}" | jq -s 'unique')
            UNAPPROVED=$(printf '%s' "${ADMINS}" | jq -c --argjson a "${ALLOW}" '[.[] | select((ascii_downcase) as $u | any($a[]; . == $u) | not)]')
            if [ "$(printf '%s' "${UNAPPROVED}" | jq 'length')" -gt 0 ]; then
              echo "FINDING: account admins missing from the governed list: $(printf '%s' "${UNAPPROVED}" | jq -r 'join(", ")')"
              FINDING=1
            fi
          fi
          # Workspace admins who are NOT account admins, grouped by workspace slug. A disabled
          # membership grants nothing, so it is shown but not counted.
          echo "  workspace admins (not account admins), per workspace:"
          printf '%s' "${MEMBERS}" | jq -r '
            [ .[] | select(.isAccountAdmin != true) | .user.username as $u
              | .workspaces[] | select(.role == "admin")
              | {slug, on: (.isDisabled != true), u: ($u + (if .isDisabled == true then " (disabled)" else "" end))} ]
            | group_by(.slug) | .[] | "    - \(.[0].slug): \([.[] | select(.on)] | length) enabled — \([.[].u] | join(", "))"'
          if [ "${FINDING}" -eq 0 ]; then
            echo "COMPLIANT: account admins are within the ceiling and on the governed list (when one was supplied)."
          fi
          exit "${FINDING}"

"1.4":
  api:
    lang: "bash"
    filename: "hth-replit-1.04-audit-guests.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/api/hth-replit-1.04-audit-guests.sh"
    excerpts:
      guest-review-audit:
        content: |2
          # Stale guests (never seen, or idle past REPLIT_GUEST_STALE_DAYS) and guests inside your
          # SSO domains are findings; pending seat requests are listed for review.
          STALE_DAYS="${REPLIT_GUEST_STALE_DAYS:-90}"
          DOMAINS=$(jq -cn --arg d "${REPLIT_SSO_DOMAINS:-}" '$d | ascii_downcase | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          paginate "/members" "role=guest"
          GUESTS="${ITEMS}"
          # lastSeen is RFC 3339; drop fractional seconds before fromdateiso8601. An unparseable
          # or null timestamp counts as stale — absence of evidence is not activity.
          REVIEWED=$(printf '%s' "${GUESTS}" | jq -c --argjson days "${STALE_DAYS}" --argjson doms "${DOMAINS}" '
            (now - ($days * 86400)) as $cutoff
            | [ .[]
                | (.user.email | split("@") | last | ascii_downcase) as $dom
                | (try (.lastSeen | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601) catch null) as $seen
                | [.workspaces[] | select(.role == "guest")] as $g
                | [$g[] | select(.isDisabled != true)] as $on
                | { username: .user.username, domain: $dom,
                    workspaces: ([$on[].slug] | join(",")),
                    disabledIn: ([$g[] | select(.isDisabled == true) | .slug] | join(",")),
                    dormant: (($g | length) > 0 and ($on | length) == 0),
                    lastSeen: (.lastSeen // "never"),
                    stale: ($seen == null or $seen < $cutoff),
                    internal: any($doms[]; . == $dom) } ]')
          FLAGGED=$(printf '%s' "${REVIEWED}" | jq -c '[.[] | select((.dormant | not) and (.stale or .internal))]')
          DORMANT=$(printf '%s' "${REVIEWED}" | jq -c '[.[] | select(.dormant)]')
          N_GUESTS=$(printf '%s' "${GUESTS}" | jq 'length')
          N_FLAGGED=$(printf '%s' "${FLAGGED}" | jq 'length')
          
          paginate "/members/access-requests" "status=pending"
          PENDING=$(printf '%s' "${ITEMS}" | jq 'length')
          
          echo "Replit 1.4 — guest review"
          echo "  guests: ${N_GUESTS}; stale threshold: ${STALE_DAYS} days; SSO domains checked: $(printf '%s' "${DOMAINS}" | jq -r 'if length == 0 then "none supplied" else join(",") end')"
          echo "  pending Viewer -> Member seat requests: ${PENDING}"
          if [ "$(printf '%s' "${DORMANT}" | jq 'length')" -gt 0 ]; then
            echo "NOTE: every guest membership disabled (no guest access, so not a finding; review on the Members page -> Guests table):"
            printf '%s' "${DORMANT}" | jq -r '.[] | "    - \(.username) (@\(.domain)) disabled-in=\(.disabledIn) lastSeen=\(.lastSeen)"'
          fi
          if [ "${N_FLAGGED}" -gt 0 ]; then
            echo "FINDING: ${N_FLAGGED} guest(s) to revoke or justify (Members page -> Guests table -> Revoke):"
            printf '%s' "${FLAGGED}" | jq -r '.[] | "    - \(.username) (@\(.domain)) workspaces=\(.workspaces) lastSeen=\(.lastSeen)\(if .internal then " INTERNAL-DOMAIN" else "" end)\(if .stale then " STALE" else "" end)"'
            exit 1
          fi
          echo "COMPLIANT: every guest with an enabled guest membership was seen within ${STALE_DAYS} days and none uses an SSO domain."
          exit 0

"3.4":
  api:
    lang: "bash"
    filename: "hth-replit-3.04-audit-budgets.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/api/hth-replit-3.04-audit-budgets.sh"
    excerpts:
      budgets-audit:
        content: |2
          # Account spending controls must both be set; every workspace needs a default per-user
          # Agent limit.
          FINDING=0
          paginate "/budgets" "type=account_spending_controls"
          ACCOUNT=$(printf '%s' "${ITEMS}" | jq -c '[.[] | select(.type == "account_spending_controls")]')
          if [ "$(printf '%s' "${ACCOUNT}" | jq 'length')" -ne 1 ]; then
            echo "PRECONDITION: expected exactly one account_spending_controls entry from /budgets" >&2; exit 2
          fi
          ALERT=$(printf '%s' "${ACCOUNT}" | jq -r '.[0].usageAlertThresholdUsd // "unset"')
          SHUTDOWN=$(printf '%s' "${ACCOUNT}" | jq -r '.[0].serviceShutdownLimitUsd // "unset"')
          echo "Replit 3.4 — budgets and Agent usage limits"
          echo "  account: usageAlertThresholdUsd=${ALERT} serviceShutdownLimitUsd=${SHUTDOWN}"
          if [ "${SHUTDOWN}" = "unset" ]; then
            echo "FINDING: no service shutdown limit — usage-based services (Agent included) are never suspended."
            FINDING=1
          fi
          if [ "${ALERT}" = "unset" ]; then
            echo "FINDING: no usage alert threshold — nobody is told before the cap is reached."
            FINDING=1
          fi
          
          paginate "/workspaces"
          WORKSPACES=$(printf '%s' "${ITEMS}" | jq -c '[.[] | {id, slug}]')
          if [ "$(printf '%s' "${WORKSPACES}" | jq 'length')" -eq 0 ]; then
            echo "PRECONDITION: /workspaces returned no workspaces" >&2; exit 2
          fi
          paginate "/budgets" "type=workspace_default_user_limit"
          UNCAPPED=$(printf '%s' "${WORKSPACES}" | jq -c --argjson limits "${ITEMS}" '
            [ .[] | select(.id as $w | any($limits[]; .workspaceId == $w) | not) | .slug ]')
          echo "  workspaces: $(printf '%s' "${WORKSPACES}" | jq 'length'); with a default per-user Agent limit: $(printf '%s' "${ITEMS}" | jq 'length')"
          if [ "$(printf '%s' "${UNCAPPED}" | jq 'length')" -gt 0 ]; then
            echo "FINDING: workspaces with no default per-user Agent limit: $(printf '%s' "${UNCAPPED}" | jq -r 'join(", ")')"
            FINDING=1
          fi
          if [ "${FINDING}" -eq 0 ]; then
            echo "COMPLIANT: account alert + shutdown thresholds set; every workspace caps per-user Agent spend."
          fi
          exit "${FINDING}"

"4.1":
  api:
    lang: "bash"
    filename: "hth-replit-4.01-audit-deployment-privacy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/api/hth-replit-4.01-audit-deployment-privacy.sh"
    excerpts:
      deployment-privacy-audit:
        content: |2
          # Every team-workspace deployment that is public or password protected, minus the
          # approved list, is a finding. Suspended deployments are not serving and are skipped.
          ALLOW='[]'
          if [ -n "${REPLIT_PUBLIC_ALLOWLIST:-}" ]; then
            [ -r "${REPLIT_PUBLIC_ALLOWLIST}" ] || { echo "PRECONDITION: REPLIT_PUBLIC_ALLOWLIST is not readable" >&2; exit 2; }
            ALLOW=$(jq -R 'ascii_downcase | gsub("^\\s+|\\s+$"; "") | select(length > 0 and (startswith("#") | not))' \
                      "${REPLIT_PUBLIC_ALLOWLIST}" | jq -s 'unique')
          fi
          paginate "/workspaces"
          WS_IDS=$(printf '%s' "${ITEMS}" | jq -r '.[].id')
          if [ -z "${WS_IDS}" ]; then echo "PRECONDITION: /workspaces returned no workspaces" >&2; exit 2; fi
          if printf '%s\n' "${WS_IDS}" | grep -qvE '^[A-Za-z0-9]+$'; then
            echo "PRECONDITION: /workspaces returned an id outside ^[A-Za-z0-9]+$ — refusing to build URLs from it" >&2; exit 2
          fi
          : > "${ALL_FILE}"
          for ws in ${WS_IDS}; do
            paginate "/deployments" "workspaceId=${ws}"
            printf '%s\n' "${ITEMS}" >> "${ALL_FILE}"
          done
          DEPLOYMENTS=$(jq -s 'add // []' "${ALL_FILE}")
          EXPOSED=$(printf '%s' "${DEPLOYMENTS}" | jq -c --argjson allow "${ALLOW}" '
            [ .[] | select(.deploymentPrivacy != "private" and .status != "suspended")
                  | select((.project.id | ascii_downcase) as $p | any($allow[]; . == $p) | not) ]')
          echo "Replit 4.1 — deployment access across $(printf '%s\n' "${WS_IDS}" | wc -l | tr -d ' ') workspace(s)"
          printf '%s' "${DEPLOYMENTS}" | jq -r 'group_by(.deploymentPrivacy) | .[] | "  \(.[0].deploymentPrivacy): \(length)"'
          if [ "$(printf '%s' "${EXPOSED}" | jq 'length')" -gt 0 ]; then
            echo "FINDING: deployments reachable without a Replit identity and not on the approved list:"
            printf '%s' "${EXPOSED}" | jq -r '.[] | "    - \(.workspace.slug // "?")/\(.project.title) privacy=\(.deploymentPrivacy) status=\(.status) url=\(.url // "none") project=\(.project.id)"'
            echo "  Fix: Publishing tool -> unpublish -> Who can access your app -> Workspace only / Invite only -> publish."
            exit 1
          fi
          echo "COMPLIANT: every serving team-workspace deployment is private or explicitly approved."
          exit 0

"4.3":
  api:
    lang: "bash"
    filename: "hth-replit-4.03-external-access-tokens.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/api/hth-replit-4.03-external-access-tokens.sh"
    excerpts:
      token-ci-hygiene-scan:
        content: |2
          # CI hygiene gate: fail the build if any tracked file uses the query-parameter token
          # form or hardcodes a Bearer literal. It refuses to report "clean" when it could not
          # scan: outside a git work tree `git grep` exits 128, which an `if` would silently
          # read as "no match". It reports locations (path:line) only: printing the matched line
          # would copy the credential into the CI log, which more people can usually read than the
          # repository. The body runs in a subshell so pipefail stays local to it.
          token_scan() (
            set -o pipefail   # the pipe below must report git grep's status, not sed's
            if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "ERROR 4.3: not inside a git work tree — nothing was scanned" >&2
              return 2
            fi
            local fail=0 rc label pattern
            for label in query-parameter bearer-literal; do
              case "${label}" in
                query-parameter) pattern='project-protection-bypass=' ;;
                # Replit external tokens are opaque; catch obvious inline Bearer literals.
                bearer-literal)  pattern='Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' ;;
              esac
              rc=0
              git grep -nE "${pattern}" -- . | cut -d: -f1,2 | sed 's/^/  /' || rc=$?
              if [ "${rc}" -gt 1 ]; then
                echo "ERROR 4.3: git grep failed (rc=${rc}) — the ${label} check did not run" >&2
                return 2
              fi
              if [ "${rc}" -eq 0 ]; then
                echo "FAIL 4.3: ${label} token form at the location(s) above (line content withheld) — rotate that credential, keep it in a secret manager, and send it as an Authorization: Bearer header"
                fail=1
              fi
            done
            if [ "${fail}" -eq 0 ]; then
              echo "PASS 4.3: no query-parameter tokens or inline Bearer literals in tracked files."
            fi
            return "${fail}"
          )
      token-bearer-usage:
        content: |2
          # CORRECT usage: send the token as an Authorization: Bearer header. The docs also
          # accept ?project-protection-bypass=<token>, but a credential in a URL leaks to
          # server logs, proxy logs, shell history and Referer headers — use the header form.
          token_probe() {
            if [ -z "${REPLIT_EXTERNAL_TOKEN:-}" ] || [ -z "${REPLIT_APP_URL:-}" ]; then
              echo "ERROR 4.3: set REPLIT_EXTERNAL_TOKEN (from a secret manager — never inline it) and REPLIT_APP_URL (e.g. https://myapp.replit.app)" >&2
              return 2
            fi
            local path="${REPLIT_HEALTH_PATH:-/health}" code rc=0
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${REPLIT_EXTERNAL_TOKEN}" \
              "${REPLIT_APP_URL}${path}") || rc=$?
            if [ "${rc}" -ne 0 ]; then
              echo "ERROR 4.3: no HTTP response from ${REPLIT_APP_URL} (curl exit ${rc})" >&2
              return 2
            fi
            case "${code}" in
              2??) echo "PASS 4.3: bearer-header token reached ${path} (HTTP ${code})"; return 0 ;;
              3??) echo "FAIL 4.3: HTTP ${code} — redirected (usually to sign-in): the token was not accepted for this environment"; return 1 ;;
              401|403) echo "FAIL 4.3: HTTP ${code} — token rejected (expired, revoked, or minted for the other environment)"; return 1 ;;
              *) echo "ERROR 4.3: HTTP ${code} from ${path} — the app answered but the probe path is wrong; set REPLIT_HEALTH_PATH" >&2; return 2 ;;
            esac
          }
      token-rotation-notes:
        content: |2
          # Operational rules transcribed from the docs (2026-09-24) — encode them in your runbook:
          #   * One token = one environment: Development (*.replit.dev) OR Production
          #     (*.replit.app + custom domains).
          #   * PRODUCTION TOKENS SURVIVE REPUBLISH (including a new version). Replit revokes them
          #     when you unpublish the deployment, delete it, or switch the Project from private
          #     to public.
          #   * Expiry choices: 1 hour, 24 hours, 7 days, 30 days, 3 months, 1 year, 5 years.
          #     There is no permanent option; prefer <= 30 days for CI. Do not pick 5 years.
          #   * Revocation is immediate and irreversible, and you can only revoke tokens you created.
          #     You also only SEE tokens you created — a Project owner cannot list collaborators' tokens.
          #   * Automatic revocation: removing a member from a Workspace revokes the tokens they
          #     minted for every Project in it; removing a collaborator revokes their tokens for that
          #     Project; removing a Project from a custom group's access revokes the group members'
          #     tokens for that Project.

"4.4":
  config:
    lang: "bash"
    filename: "hth-replit-4.04-ports-and-headers.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/config/hth-replit-4.04-ports-and-headers.sh"
    excerpts:
      ports-audit:
        content: |2
          # Audit every [[ports]] mapping. Replit binds the first port you open to external 80;
          # services on localhost are NOT exposed unless exposeLocalhost = true (or unless a user
          # sets "automatic port forwarding" to "All ports" in the User Settings tool) — each
          # exposeLocalhost line publishes something that was written assuming it was local-only.
          ports_audit() {
            local external rc=0
            echo "== [[ports]] mappings in ${REPLIT_FILE} =="
            awk '/^\[\[ports\]\]/{p=1; print; next} /^\[/{p=0} p&&/localPort|externalPort|exposeLocalhost/{print "  " $0}' "${REPLIT_FILE}"
            external=$(grep -cE '^[[:space:]]*externalPort[[:space:]]*=' "${REPLIT_FILE}" || true)
            echo "external ports mapped: ${external}"
            if [ "${external}" -gt 1 ]; then
              echo "REVIEW 4.4: Autoscale and Reserved VM deployments support ONE external port — publishing fails with more; keep only the port the internet needs."
            fi
            if grep -nE '^[[:space:]]*exposeLocalhost[[:space:]]*=[[:space:]]*true' "${REPLIT_FILE}"; then
              echo "FAIL 4.4: exposeLocalhost = true (above) publishes a localhost-bound service — remove it unless that service is meant to face the internet."
              rc=1
            else
              echo "PASS 4.4: no exposeLocalhost = true entries."
            fi
            # Supported extra external ports: 3000-3003, 4200, 5000, 5173, 6000, 6800, 8000, 8008,
            # 8080, 8081 (80 is the default). Ports 22 and 8283 are used internally, not forwardable.
            return "${rc}"
          }
      static-security-headers:
        content: |2
          # Static Deployments have no backend, so [[deployment.responseHeaders]] in .replit is the
          # only place browser-side defenses can live. Append only the headers that are missing, so
          # a re-run never duplicates a block, then republish. Replit reserves (and rejects) headers
          # such as Set-Cookie, Server, Location, Content-Length and Content-Encoding. The docs name
          # no .replit key that identifies a Static Deployment, so confirm the deployment type in
          # the Publishing tool before running this.
          apply_headers() {
            local name value added=0
            for name in ${HEADERS}; do
              if grep -qE "^[[:space:]]*name[[:space:]]*=[[:space:]]*\"${name}\"" "${REPLIT_FILE}"; then
                echo "present: ${name}"
                continue
              fi
              case "${name}" in
                X-Frame-Options)           value="DENY" ;;
                X-Content-Type-Options)    value="nosniff" ;;
                Strict-Transport-Security) value="max-age=31536000; includeSubDomains" ;;
                Referrer-Policy)           value="strict-origin-when-cross-origin" ;;
              esac
              printf '\n[[deployment.responseHeaders]]\npath = "/*"\nname = "%s"\nvalue = "%s"\n' "${name}" "${value}" >> "${REPLIT_FILE}"
              echo "appended: ${name}"
              added=$((added + 1))
            done
            echo "${added} header block(s) appended to ${REPLIT_FILE} — republish, then run this pack again with REPLIT_APP_URL set."
            # The wildcard '*' is only valid at the END of a path pattern.
          }
      verify-headers-live:
        content: |2
          # Verify the published app returns EVERY header (republish first). A fetch failure or a
          # redirect proves nothing, so both are reported as errors rather than as a pass.
          verify_headers() {
            local hdrs code rc=0 miss=0 name
            hdrs=$(curl -sS -D - -o /dev/null --max-time 30 "${REPLIT_APP_URL}") || rc=$?
            if [ "${rc}" -ne 0 ]; then
              echo "ERROR 4.4: could not fetch ${REPLIT_APP_URL} (curl exit ${rc}) — headers not verified" >&2
              return 2
            fi
            code=$(printf '%s\n' "${hdrs}" | awk 'NR==1{print $2}')
            case "${code}" in
              2??) ;;
              *) echo "ERROR 4.4: ${REPLIT_APP_URL} answered HTTP ${code} — point REPLIT_APP_URL at a public page of the Static Deployment" >&2; return 2 ;;
            esac
            for name in ${HEADERS}; do
              if printf '%s\n' "${hdrs}" | grep -qi "^${name}:"; then
                echo "present: ${name}"
              else
                echo "FAIL 4.4: ${name} missing from ${REPLIT_APP_URL}"
                miss=1
              fi
            done
            return "${miss}"
          }

"5.3":
  sdk:
    lang: "javascript"
    filename: "hth-replit-5.03-object-storage-audit.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/sdk/hth-replit-5.03-object-storage-audit.js"
    excerpts:
      storage-inventory:
        content: |2
          // Inventory what this project's bucket holds. Every object listed here is readable by any
          // code running in the project — in development as well as in production.
          const { ok, value: objects, error } = await client.list();
          if (!ok) {
            console.error('5.3 ERROR: could not list bucket contents — nothing was audited:', error);
            process.exit(2);
          }
          console.log(`5.3 Bucket contains ${objects.length} objects.`);
          for (const obj of objects.slice(0, 50)) {
            console.log(`  ${obj.name}`);
          }
          if (objects.length > 50) console.log(`  … and ${objects.length - 50} more`);
      storage-sensitivity-flag:
        content: |2
          // Flag objects whose names suggest they do not belong in storage that development work can
          // reach. Buckets cannot be shared across projects, so the only real segmentation is to keep
          // such data in its own project — or delete it (App Storage → Settings view → Delete Bucket
          // removes the bucket and every object in it, irreversibly: back up first).
          const SENSITIVE = /(\.env|secret|credential|password|token|key|dump|backup|export|customer|pii)/i;
          const flagged = objects.filter((o) => SENSITIVE.test(o.name));
          if (flagged.length > 0) {
            finding = true;
            console.warn(`5.3 REVIEW: ${flagged.length} object(s) look sensitive — this bucket is readable from development as well as production:`);
            for (const f of flagged) console.warn(`  ${f.name}`);
            console.warn('  Move sensitive objects into their own project, or delete them.');
          } else {
            console.log('5.3 PASS: no obviously sensitive object names in this bucket.');
          }
      storage-existence-check:
        content: |2
          // Targeted check: prove that a specific object is gone from this project's bucket (for
          // example after removing a sensitive export). A failed call is reported as an error, never
          // as "not present" — an error is not evidence that the object was removed.
          const target = process.argv[2];
          if (target) {
            const r = await client.exists(target);
            if (!r.ok) {
              console.error('5.3 ERROR: exists() failed — the result is NOT evidence of removal:', r.error);
              process.exit(2);
            }
            if (r.value) {
              finding = true;
              console.log(`5.3 STILL PRESENT in this project's bucket: ${target}`);
            } else {
              console.log(`5.3 NOT PRESENT in this project's bucket: ${target}`);
            }
          }

