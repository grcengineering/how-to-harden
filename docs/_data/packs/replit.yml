"4.3":
  api:
    lang: "bash"
    filename: "hth-replit-4.03-external-access-tokens.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/api/hth-replit-4.03-external-access-tokens.sh"
    excerpts:
      token-bearer-usage:
        content: |2
          # CORRECT: send the token as an Authorization Bearer header.
          # The docs also permit ?project-protection-bypass=<token>, but a credential in a URL leaks to
          # server logs, proxy logs, browser history, and Referer headers — use the header form only.
          curl -fsS "${REPLIT_APP_URL}/healthz" \
            -H "Authorization: Bearer ${REPLIT_EXTERNAL_TOKEN}" \
            -H "Accept: application/json"
      token-ci-hygiene-scan:
        content: |2
          # CI hygiene gate: fail the build if any tracked file uses the query-parameter form or
          # hardcodes a token. Run this in the pipeline that deploys Replit-hosted apps.
          FAIL=0
          if git grep -nE 'project-protection-bypass=' -- . >/dev/null 2>&1; then
            echo "FAIL 4.3: query-parameter token form found (credential will leak to logs):"
            git grep -nE 'project-protection-bypass=' -- .
            FAIL=1
          fi
          # Replit external tokens are opaque; catch obvious inline Bearer literals in tracked files.
          if git grep -nE 'Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' -- . >/dev/null 2>&1; then
            echo "FAIL 4.3: hardcoded Bearer literal found — move it to a secret manager:"
            git grep -nE 'Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' -- .
            FAIL=1
          fi
          [ "${FAIL}" -eq 0 ] && echo "PASS 4.3: no query-param tokens or inline Bearer literals in tracked files."
          exit "${FAIL}"
      token-rotation-notes:
        content: |2
          # Operational rules transcribed from the docs — encode these in your runbook:
          #   * One token = one environment: Development (*.replit.dev) OR Production
          #     (*.replit.app + custom domains). Production tokens bind to a specific deployment.
          #   * PRODUCTION TOKENS ARE INVALIDATED ON REPUBLISH — plan re-issuance into the deploy job.
          #   * Expiry choices: 1 hour, 24 hours, 7 days, 30 days, 3 months, 1 year, 5 years.
          #     There is no permanent option; prefer <= 30 days for CI. Do not pick 5 years.
          #   * Revocation is immediate and irreversible, and ONLY the token's creator can revoke it.
          #     Removing a collaborator auto-revokes their tokens — verify this during offboarding.

"4.4":
  config:
    lang: "bash"
    filename: "hth-replit-4.04-ports-and-headers.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/config/hth-replit-4.04-ports-and-headers.sh"
    excerpts:
      ports-audit:
        content: |2
          # Audit every port mapping. Replit auto-binds the first non-localhost port to external 80.
          # Services bound to localhost are NOT exposed unless exposeLocalhost is true — each such
          # line is a deliberate decision to publish something that assumed it was local-only.
          echo "== [[ports]] mappings in ${REPLIT_FILE} =="
          awk '/^\[\[ports\]\]/{p=1} p&&/localPort|externalPort|exposeLocalhost/{print} /^$/{p=0}' "${REPLIT_FILE}"
          
          if grep -qE '^[[:space:]]*exposeLocalhost[[:space:]]*=[[:space:]]*true' "${REPLIT_FILE}"; then
            echo "REVIEW 4.4: exposeLocalhost = true is set — confirm this service is meant to be public:"
            grep -nE '^[[:space:]]*exposeLocalhost[[:space:]]*=[[:space:]]*true' "${REPLIT_FILE}"
          else
            echo "PASS 4.4: no exposeLocalhost = true entries."
          fi
          # Supported external ports: 80, 3000-3003, 4200, 5000, 5173, 6000, 6800, 8000, 8008, 8080, 8081.
          # Ports 22 and 8283 are reserved by the platform and are not forwardable.
      static-security-headers:
        content: |2
          # Static deployments have no backend, so response headers are the only place browser-side
          # defenses can live. Append this to .replit, then republish. Reserved headers that Replit
          # blocks (do not attempt): Set-Cookie, Content-Length, Content-Encoding, Server, Location.
          cat >> "${REPLIT_FILE}" <<'TOML'
          
          [[deployment.responseHeaders]]
          path = "/*"
          name = "X-Frame-Options"
          value = "DENY"
          
          [[deployment.responseHeaders]]
          path = "/*"
          name = "X-Content-Type-Options"
          value = "nosniff"
          
          [[deployment.responseHeaders]]
          path = "/*"
          name = "Strict-Transport-Security"
          value = "max-age=31536000; includeSubDomains"
          
          [[deployment.responseHeaders]]
          path = "/*"
          name = "Referrer-Policy"
          value = "strict-origin-when-cross-origin"
          TOML
          echo "Appended hardening headers to ${REPLIT_FILE} — republish, then verify at securityheaders.com"
          # Note: the wildcard '*' is only supported at the END of a path pattern.
      verify-headers-live:
        content: |2
          # Verify the published app actually returns the headers (republish first).
          APP_URL="${REPLIT_APP_URL:-}"
          if [ -n "${APP_URL}" ]; then
            curl -fsSI "${APP_URL}" | grep -iE 'x-frame-options|x-content-type-options|strict-transport-security|referrer-policy' \
              || echo "FAIL 4.4: expected headers not present — confirm the app was republished after the .replit change."
          fi

"5.3":
  sdk:
    lang: "javascript"
    filename: "hth-replit-5.03-object-storage-audit.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/replit/sdk/hth-replit-5.03-object-storage-audit.js"
    excerpts:
      storage-inventory:
        content: |2
          // Inventory what the CURRENTLY ATTACHED bucket holds. Because buckets are account-wide and
          // available to every App you attach them to, this listing is the practical answer to
          // "what data would a newly attached App be able to read?"
          const { ok, value: objects, error } = await client.list();
          if (!ok) {
            console.error('5.3 FAIL: could not list bucket contents:', error);
            process.exit(1);
          }
          console.log(`5.3 Bucket contains ${objects.length} objects.`);
          for (const obj of objects.slice(0, 50)) {
            console.log(`  ${obj.name}`);
          }
          if (objects.length > 50) console.log(`  … and ${objects.length - 50} more`);
      storage-sensitivity-flag:
        content: |2
          // Flag objects whose names suggest they do not belong in a bucket shared with experimental
          // Apps. Bucket-per-purpose is the only segmentation Replit documents — a hit here means the
          // bucket should be split, or detached from every App that does not need it.
          const SENSITIVE = /(\.env|secret|credential|password|token|key|dump|backup|export|customer|pii)/i;
          const flagged = objects.filter((o) => SENSITIVE.test(o.name));
          if (flagged.length > 0) {
            console.warn(`5.3 REVIEW: ${flagged.length} object(s) look sensitive — confirm every App attached to this bucket should read them:`);
            for (const f of flagged) console.warn(`  ${f.name}`);
            console.warn('  Detach unneeded Apps: App Storage → Settings view → select bucket → "Remove Bucket from Repl".');
          } else {
            console.log('5.3 PASS: no obviously sensitive object names in this bucket.');
          }
      storage-existence-check:
        content: |2
          // Targeted check: confirm whether a specific object is reachable from THIS App. Use it to
          // prove a detach actually revoked access — run it from an App that should no longer have it.
          const target = process.argv[2];
          if (target) {
            const { ok: exists, value: present } = await client.exists(target);
            console.log(
              exists && present
                ? `5.3 REACHABLE from this App: ${target}`
                : `5.3 NOT reachable from this App: ${target}`
            );
          }

