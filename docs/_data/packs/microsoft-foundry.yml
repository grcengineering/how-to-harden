        content: |2
          set +x
          set -euo pipefail
          fail() { printf 'UNKNOWN: %s\n' "$*" >&2; exit 2; }
          [[ "${HTH_FOUNDRY_TENANT:-}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]] || fail 'Missing or invalid HTH_FOUNDRY_TENANT'
