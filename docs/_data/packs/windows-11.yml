"1.1":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-1.01-account-hardening.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-1.01-account-hardening.ps1"
    excerpts:
      ps-baseline-lgpo:
        content: |2
          # ENTERPRISE (Pro/Enterprise/Education): apply a downloaded Microsoft security
          # baseline to Local Group Policy on a standalone machine with LGPO.exe (shipped
          # in the Security Compliance Toolkit). Import the baseline's GPO backup:
          #   LGPO.exe /g ".\Windows 11 v25H2 Security Baseline\GPOs"
          # Verify drift afterward with Policy Analyzer against the baseline .PolicyRules.
          # NOTE: Group Policy tooling and the baselines are NOT supported on Windows Home.
      ps-account-audit:
        content: |2
          # CONSUMER + ENTERPRISE: enumerate local administrators and flag whether the
          # current interactive user runs as admin day-to-day (the highest-value control).
          $admins = Get-LocalGroupMember -Group "Administrators" |
            Select-Object -ExpandProperty Name
          Write-Output "Local administrators:"
          $admins | ForEach-Object { Write-Output "  $_" }
          
          $me = "$env:USERDOMAIN\$env:USERNAME"
          if ($admins -contains $me) {
            Write-Warning "1.1 Daily account '$me' is a local administrator - create and use a STANDARD account for daily work."
          } else {
            Write-Output "1.1 PASS: daily account is not a local administrator."
          }

"1.2":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-1.02-credential-protection.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-1.02-credential-protection.ps1"
    excerpts:
      ps-verify-credential-guard:
        content: |2
          # ENTERPRISE/EDUCATION: Credential Guard is default-on for qualifying domain-joined
          # devices since 22H2. Verify it is running via the Win32_DeviceGuard WMI class.
          $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard
          Write-Output "VBS status: $($dg.VirtualizationBasedSecurityStatus) (2 = enabled and running)"
          if ($dg.SecurityServicesRunning -contains 1) {
            Write-Output "1.2 PASS: Credential Guard is running."
          } else {
            Write-Warning "1.2 Credential Guard NOT running (Enterprise/Education only; requires VBS + Secure Boot)."
          }
      ps-lsa-protection:
        content: |2
          # BOTH: confirm/enable LSA protection (RunAsPPL). Default-on for new 22H2+ installs.
          #   Value 1 = protected with a UEFI variable; 2 = without a UEFI variable (22H2+).
          $lsa = Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name RunAsPPL -ErrorAction SilentlyContinue
          if ($lsa.RunAsPPL -in 1,2) {
            Write-Output "1.2 PASS: LSA protection enabled (RunAsPPL=$($lsa.RunAsPPL))."
          } else {
            Write-Warning "1.2 LSA protection not set. To enable (UEFI-lock variant):"
            Write-Output '  Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name RunAsPPL -Type DWord -Value 1'
          }

"1.3":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-1.03-windows-laps.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-1.03-windows-laps.ps1"
    excerpts:
      ps-laps-configure:
        content: |2
          # Set the master switch via policy registry (BackupDirectory):
          #   0 = Disabled, 1 = Back up to Microsoft Entra only, 2 = Back up to Active Directory only.
          # (You cannot back up to both.) Delivered via GPO (System > LAPS) or the LAPS CSP;
          # shown here as the resulting registry value under the Group Policy root.
          New-Item -Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\LAPS" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\LAPS" `
            -Name BackupDirectory -Type DWord -Value 2   # 2 = Active Directory
          
          # For AD, one-time schema extension + device self-permission (run with rights):
          #   Update-LapsADSchema
          #   Set-LapsADComputerSelfPermission -Identity "OU=Workstations,DC=contoso,DC=com"
      ps-laps-operate:
        content: |2
          # Retrieve the current managed password (choose the cmdlet matching your backup target):
          #   Get-LapsADPassword  -Identity "WORKSTATION01" -AsPlainText   # Active Directory
          #   Get-LapsAADPassword -DeviceIds "WORKSTATION01"               # Microsoft Entra
          
          # Force an immediate rotation (works for either backup target):
          Reset-LapsPassword -Verbose
          
          # Diagnostics:
          Get-LapsDiagnostics

"2.1":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-2.01-secureboot-tpm.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-2.01-secureboot-tpm.ps1"
    excerpts:
      ps-verify-secureboot-tpm:
        content: |2
          # Secure Boot: returns $True when supported AND enabled; a BIOS/non-UEFI machine
          # raises "Cmdlet not supported on this platform." Do not reconfigure the TPM via
          # TPM.msc - Windows auto-initializes and owns it; verify state only.
          try {
            if (Confirm-SecureBootUEFI) {
              Write-Output "2.1 PASS: Secure Boot is enabled."
            } else {
              Write-Warning "2.1 Secure Boot is supported but DISABLED - enable it in UEFI firmware."
            }
          } catch {
            Write-Warning "2.1 Secure Boot not available (legacy BIOS / non-UEFI): $($_.Exception.Message)"
          }
          
          $tpm = Get-Tpm
          if ($tpm.TpmPresent -and $tpm.TpmReady) {
            Write-Output "2.1 PASS: TPM present and ready."
          } else {
            Write-Warning "2.1 TPM not present/ready (TpmPresent=$($tpm.TpmPresent), TpmReady=$($tpm.TpmReady))."
          }

"2.2":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-2.02-memory-integrity.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-2.02-memory-integrity.ps1"
    excerpts:
      ps-enable-hvci:
        content: |2
          # ENTERPRISE registry set (equivalent to GPO "Turn on Virtualization Based Security"
          # with "Enabled without UEFI lock" for Code Integrity):
          $dgRoot = "HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard"
          $hvci   = "$dgRoot\Scenarios\HypervisorEnforcedCodeIntegrity"
          New-Item -Path $hvci -Force | Out-Null
          Set-ItemProperty -Path $dgRoot -Name EnableVirtualizationBasedSecurity -Type DWord -Value 1
          Set-ItemProperty -Path $dgRoot -Name RequirePlatformSecurityFeatures    -Type DWord -Value 1  # 1 = Secure Boot
          Set-ItemProperty -Path $hvci   -Name Enabled -Type DWord -Value 1
          Set-ItemProperty -Path $hvci   -Name Locked  -Type DWord -Value 0  # 0 = no UEFI lock
          Write-Output "2.2 HVCI registry set. Reboot to apply."
          # CONSUMER: Windows Security > Device security > Core isolation details > Memory integrity > On.
      ps-verify-hvci:
        content: |2
          $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard
          $vbs = $dg.VirtualizationBasedSecurityStatus   # 0 not enabled, 1 enabled-not-running, 2 running
          if ($vbs -eq 2 -and ($dg.SecurityServicesRunning -contains 2)) {
            Write-Output "2.2 PASS: VBS running and memory integrity (HVCI) active."
          } else {
            Write-Warning "2.2 Memory integrity not fully running (VBS status=$vbs). Reboot may be pending, or a driver is incompatible."
          }

"3.1":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-3.01-defender-antivirus.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-3.01-defender-antivirus.ps1"
    excerpts:
      ps-defender-cloud-pua:
        content: |2
          # Cloud-delivered protection (MAPS) + safe-sample submission + PUA blocking.
          # SubmitSamplesConsent: SendSafeSamples is the recommended default; NeverSend
          # lowers protection and disables Block-at-First-Sight.
          Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent SendSafeSamples
          Set-MpPreference -PUAProtection Enabled   # Enabled(1) = block; AuditMode(2) to observe first
      ps-defender-verify:
        content: |2
          # Tamper protection is turned ON via Windows Security > Virus & threat protection >
          # Manage settings > Tamper Protection (on unmanaged devices), or via Intune/MDE on
          # managed fleets. Verify the overall posture:
          $s = Get-MpComputerStatus
          "IsTamperProtected      : $($s.IsTamperProtected)"
          "RealTimeProtection     : $($s.RealTimeProtectionEnabled)"
          "AntivirusEnabled       : $($s.AntivirusEnabled)"
          $p = Get-MpPreference
          "MAPSReporting          : $($p.MAPSReporting)"       # 2 = Advanced
          "SubmitSamplesConsent   : $($p.SubmitSamplesConsent)" # 1 = SendSafeSamples
          "PUAProtection          : $($p.PUAProtection)"        # 1 = Enabled (block)
          if (-not $s.IsTamperProtected) { Write-Warning "3.1 Tamper protection is OFF - enable it in Windows Security." }

"3.2":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-3.02-asr-rules.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-3.02-asr-rules.ps1"
    excerpts:
      ps-asr-standard-block:
        content: |2
          # The three "standard protection" rules Microsoft recommends enabling in Block
          # without extensive testing:
          $standard = @(
            '56a863a9-875e-4185-98a7-b882c64b5ce5',  # Block abuse of exploited vulnerable signed drivers
            '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2',  # Block credential stealing from LSASS
            'e6db77e5-3df2-4cf1-b95a-636979351e5b'   # Block persistence through WMI event subscription
          )
          Add-MpPreference -AttackSurfaceReductionRules_Ids $standard `
            -AttackSurfaceReductionRules_Actions Enabled,Enabled,Enabled
      ps-asr-audit-then-block:
        content: |2
          # Other high-value rules - start in AUDIT (2), review events, then promote to Block (1).
          $audit = @(
            'd4f940ab-401b-4efc-aadc-ad5f3c50688a',  # Block all Office apps from creating child processes
            'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550',  # Block executable content from email client and webmail
            'd3e037e1-3eb8-44c8-a917-57927947596d',  # Block JS/VBScript from launching downloaded executable content
            '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c'   # Block Adobe Reader from creating child processes
          )
          Add-MpPreference -AttackSurfaceReductionRules_Ids $audit `
            -AttackSurfaceReductionRules_Actions AuditMode,AuditMode,AuditMode,AuditMode
          
          # Review configured state:
          $p = Get-MpPreference
          for ($i=0; $i -lt $p.AttackSurfaceReductionRules_Ids.Count; $i++) {
            "{0} => {1}" -f $p.AttackSurfaceReductionRules_Ids[$i], $p.AttackSurfaceReductionRules_Actions[$i]
          }

"3.3":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-3.03-cfa-network-protection.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-3.03-cfa-network-protection.ps1"
    excerpts:
      ps-controlled-folder-access:
        content: |2
          # Ransomware protection: only allowed apps may modify protected folders.
          #   Modes: 0 Disabled, 1 Enabled, 2 AuditMode, 3 BlockDiskModificationOnly, 4 AuditDiskModificationOnly
          Set-MpPreference -EnableControlledFolderAccess Enabled
          # Add extra protected folders / allow a trusted line-of-business app if needed:
          #   Add-MpPreference -ControlledFolderAccessProtectedFolders "D:\Sensitive"
          #   Add-MpPreference -ControlledFolderAccessAllowedApplications "C:\Apps\app1.exe"
      ps-network-protection:
        content: |2
          # Block connections to low-reputation/malicious domains for ALL apps (not just browsers).
          Set-MpPreference -EnableNetworkProtection Enabled   # Enabled(1) = block; AuditMode to observe
          
          # Verify both:
          $p = Get-MpPreference
          "EnableControlledFolderAccess : $($p.EnableControlledFolderAccess)"  # 1 = Enabled
          "EnableNetworkProtection      : $($p.EnableNetworkProtection)"       # 1 = Enabled

"4.1":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-4.01-drive-encryption.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-4.01-drive-encryption.ps1"
    excerpts:
      ps-bitlocker-enable:
        content: |2
          # ENTERPRISE/PRO: enable BitLocker on the OS drive with XTS-AES 256. For L2/L3 add a
          # TPM+PIN protector (materially harder against VMK-extraction/bitpixie-class attacks
          # than TPM-only). This example prompts for a PIN.
          $pin = Read-Host -AsSecureString "Enter a BitLocker startup PIN"
          Enable-BitLocker -MountPoint "C:" -EncryptionMethod XtsAes256 -UsedSpaceOnly `
            -Pin $pin -TpmAndPinProtector -SkipHardwareTest
          # Add a recovery password protector (escrow it per control 4.2):
          Add-BitLockerKeyProtector -MountPoint "C:" -RecoveryPasswordProtector
      ps-bitlocker-status:
        content: |2
          # Verify full protection. "Waiting for Activation" / a clear key present means the
          # drive is encrypted but NOT yet protected - resolve the recovery-key escrow (4.2).
          $v = Get-BitLockerVolume -MountPoint "C:"
          "ProtectionStatus : $($v.ProtectionStatus)"   # On = protected
          "VolumeStatus     : $($v.VolumeStatus)"        # FullyEncrypted
          "EncryptionMethod : $($v.EncryptionMethod)"    # XtsAes256 for hardened deployments
          $v.KeyProtector | Format-Table KeyProtectorType, KeyProtectorId

"4.2":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-4.02-recovery-key-governance.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-4.02-recovery-key-governance.ps1"
    excerpts:
      ps-escrow-enterprise:
        content: |2
          # ENTERPRISE: back the recovery password up to Active Directory or Microsoft Entra.
          # (Driven fleet-wide by the GPO "Choose how BitLocker-protected operating system
          # drives can be recovered"; per-device escrow cmdlets shown here.)
          $kp = (Get-BitLockerVolume -MountPoint "C:").KeyProtector |
            Where-Object KeyProtectorType -eq 'RecoveryPassword' | Select-Object -First 1
          # To Microsoft Entra ID:
          BackupToAAD-BitLockerKeyProtector -MountPoint "C:" -KeyProtectorId $kp.KeyProtectorId
          # To Active Directory (domain-joined):
          #   Backup-BitLockerKeyProtector -MountPoint "C:" -KeyProtectorId $kp.KeyProtectorId
      ps-consumer-key-custody:
        content: |2
          # CONSUMER privacy choice: Home Device Encryption escrows the recovery key to your
          # Microsoft account by DEFAULT. To take manual custody instead, export the recovery
          # password and store it OFFLINE (USB / printed / file on removable media):
          $rp = (Get-BitLockerVolume -MountPoint "C:").KeyProtector |
            Where-Object KeyProtectorType -eq 'RecoveryPassword'
          $rp | ForEach-Object { "ID: $($_.KeyProtectorId)  KEY: $($_.RecoveryPassword)" }
          # Also available via: Manage BitLocker > "Back up your recovery key" (USB / file / print).
          
          # To PREVENT automatic Device Encryption entirely (so you manage BitLocker yourself
          # on Pro, with NO Microsoft-account escrow), set BEFORE encryption is enabled:
          #   New-Item -Path "HKLM:\SYSTEM\CurrentControlSet\Control\BitLocker" -Force | Out-Null
          #   Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\BitLocker" `
          #     -Name PreventDeviceEncryption -Type DWord -Value 1
          # NOTE: a local-account-only device leaves the clear key in place - "unprotected
          # even though the data is encrypted." Manual offline custody is the private, protected path.

"5.1":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-5.01-diagnostic-data.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-5.01-diagnostic-data.ps1"
    excerpts:
      ps-telemetry-off:
        content: |2
          # ENTERPRISE/EDUCATION: set diagnostic data to OFF (0). On Pro/Home this same value
          # is coerced to Required (1) - it will NOT achieve zero.
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" `
            -Name AllowTelemetry -Type DWord -Value 0
          # The Security/off level set by policy is NOT reflected in the Settings UI - verify
          # via this registry value, not the toggle.
          $edition = (Get-CimInstance Win32_OperatingSystem).Caption
          if ($edition -notmatch 'Enterprise|Education') {
            Write-Warning "5.1 $edition cannot honor AllowTelemetry=0 - the floor here is Required (1). Minimize via consumer toggles + restricted traffic (5.2/5.3)."
          }
      ps-diag-data-viewer:
        content: |2
          # BOTH: inspect exactly what the device is sending with the Diagnostic Data Viewer.
          Install-Module -Name Microsoft.DiagnosticDataViewer -Scope CurrentUser -Force
          Enable-DiagnosticDataViewing
          Get-DiagnosticData -StartTime (Get-Date).AddHours(-12) -EndTime (Get-Date)
          # CONSUMER: turn off optional diagnostics + inking/typing in
          #   Settings > Privacy & security > Diagnostics & feedback (Required remains the floor).

"5.2":
  config:
    lang: "powershell"
    filename: "hth-windows-11-5.02-restricted-traffic.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/config/hth-windows-11-5.02-restricted-traffic.ps1"
    excerpts:
      ps-restrict-connected-experiences:
        content: |2
          # Web-connected search / Cortana:
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search" -Name AllowCortana         -Type DWord -Value 0
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search" -Name DisableWebSearch      -Type DWord -Value 1
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search" -Name ConnectedSearchUseWeb -Type DWord -Value 0
          
          # Find My Device:
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\FindMyDevice" -Name AllowFindMyDevice -Type DWord -Value 0
          
          # OneDrive file sync + pre-sign-in traffic:
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive" -Name DisableFileSyncNGSC -Type DWord -Value 1
          
          # Settings sync to the cloud:
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync" -Name DisableSettingSync            -Type DWord -Value 2
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync" -Name DisableSettingSyncUserOverride -Type DWord -Value 1
          
          # Activity feed:
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name EnableActivityFeed     -Type DWord -Value 0
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name PublishUserActivities  -Type DWord -Value 0
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name UploadUserActivities   -Type DWord -Value 0
      ps-smartscreen-keep-on:
        content: |2
          # SMARTSCREEN IS A SECURITY CONTROL. The restricted-traffic doc CAN disable it, but
          # doing so removes anti-phishing/anti-malware URL+app reputation. This guide keeps it
          # ON. Only disable it under an explicit threat-model decision - do NOT run this to
          # turn it off. Confirm it is enabled:
          $ss = Get-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name EnableSmartScreen -ErrorAction SilentlyContinue
          if ($ss.EnableSmartScreen -eq 0) { Write-Warning "5.2 SmartScreen is DISABLED by policy - re-enable unless deliberately overridden." }

"5.3":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-5.03-advertising-activity.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-5.03-advertising-activity.ps1"
    excerpts:
      ps-advertising-id:
        content: |2
          # Advertising ID off (per-machine policy + per-user value):
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo" -Name DisabledByGroupPolicy -Type DWord -Value 1
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo" -Name Enabled -Type DWord -Value 0
      ps-tailored-activity:
        content: |2
          # Tailored experiences (stop diagnostic data driving personalized tips/ads):
          New-Item -Path "HKCU:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Name DisableTailoredExperiencesWithDiagnosticData -Type DWord -Value 1
          # Turn off Microsoft consumer experiences (Enterprise/Education-effective; harmless elsewhere):
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Name DisableWindowsConsumerFeatures -Type DWord -Value 1
          
          # Activity history is local-only since Jan 2024; stop it entirely (mirrors 5.2's System keys):
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name PublishUserActivities -Type DWord -Value 0 -ErrorAction SilentlyContinue
          
          Write-Output "5.3 Applied. CONSUMER: also clear activity history and set Location services off in Settings > Privacy & security (desktop apps are exempt from per-app location control, so device-wide off is stronger)."

"5.4":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-5.04-recall-copilot.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-5.04-recall-copilot.ps1"
    excerpts:
      ps-recall-remove:
        content: |2
          # CONSUMER: remove the Recall optional feature entirely (requires a restart).
          Disable-WindowsOptionalFeature -Online -FeatureName "Recall" -Remove
          # Verify:
          Get-WindowsOptionalFeature -Online -FeatureName "Recall" | Select-Object FeatureName, State
      ps-recall-policy:
        content: |2
          # ENTERPRISE / managed (Pro-capable): turn off Recall snapshots and/or remove Recall
          # by policy (equivalent to the WindowsAI GPO settings).
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsAI" -Force | Out-Null
          # "Turn off saving snapshots for Recall" (DisableAIDataAnalysis): 1 = disable saving snapshots
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsAI" -Name DisableAIDataAnalysis -Type DWord -Value 1
          # "Allow Recall to be enabled" (AllowRecallEnablement): 0 = Recall is not available
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsAI" -Name AllowRecallEnablement -Type DWord -Value 0
      ps-copilot-uninstall:
        content: |2
          # Copilot app: the legacy TurnOffWindowsCopilot policy is DEPRECATED and does not
          # govern the current app. Uninstall it directly (per user):
          $pkg = Get-AppxPackage -Name "Microsoft.Copilot" -ErrorAction SilentlyContinue
          if ($pkg) {
            Remove-AppxPackage -Package $pkg.PackageFullName
            Write-Output "5.4 Copilot app removed."
          } else {
            Write-Output "5.4 Copilot app not present."
          }
          # For managed fleets, enforce removal with the WindowsAI RemoveMicrosoftCopilotApp
          # policy or App Control for Business / AppLocker.

"6.1":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-6.01-firewall.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-6.01-firewall.ps1"
    excerpts:
      ps-firewall-enable:
        content: |2
          # Enable all three profiles with default-deny inbound, allow outbound.
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True `
            -DefaultInboundAction Block -DefaultOutboundAction Allow
      ps-firewall-logging:
        content: |2
          # Turn on dropped-packet and successful-connection logging; grow the log to >= 20 MB.
          Set-NetFirewallProfile -Profile Domain,Public,Private `
            -LogFileName "%SystemRoot%\System32\LogFiles\Firewall\pfirewall.log" `
            -LogMaxSizeKilobytes 20480 -LogAllowed True -LogBlocked True
          
          # Verify posture:
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultInboundAction, DefaultOutboundAction, LogBlocked

"6.2":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-6.02-smb-ntlm.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-6.02-smb-ntlm.ps1"
    excerpts:
      ps-smb-signing:
        content: |2
          # Require SMB signing on both client and server sides (default on 24H2 Ent/Pro/Edu;
          # enforce explicitly and verify).
          Set-SmbClientConfiguration -RequireSecuritySignature $true -Force
          Set-SmbServerConfiguration -RequireSecuritySignature $true -Force
          Get-SmbClientConfiguration | Format-List RequireSecuritySignature
          Get-SmbServerConfiguration | Format-List RequireSecuritySignature
      ps-smb-audit-then-blockntlm:
        content: |2
          # STEP 1 (24H2): audit for peers that don't support signing/encryption BEFORE enforcing.
          Set-SmbServerConfiguration -AuditClientDoesNotSupportSigning  $true -Force
          Set-SmbClientConfiguration -AuditServerDoesNotSupportSigning  $true -Force
          # Review events, then STEP 2: block NTLM on the SMB client (allowlist real dependencies).
          Set-SmbClientConfiguration -BlockNTLM $true -Force
          Get-SmbClientConfiguration | Format-List BlockNTLM
          # Per-connection exception when a specific server legitimately needs NTLM:
          #   New-SmbMapping -RemotePath \\server\share -BlockNTLM $false

"6.3":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-6.03-delivery-optimization-updates.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-6.03-delivery-optimization-updates.ps1"
    excerpts:
      ps-delivery-optimization:
        content: |2
          # Disable peer-to-peer update sharing (DODownloadMode 0 = HTTP only). Use 1 (LAN) with
          # subnet peer restriction if you want LAN peering without internet peers.
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization" `
            -Name DODownloadMode -Type DWord -Value 0
          Get-DeliveryOptimizationStatus | Select-Object -First 1 DownloadMode
      ps-update-deferral:
        content: |2
          # ENTERPRISE (Pro+): stage updates for testing WITHOUT ever turning updates off.
          # Defer feature updates up to 365 days, quality updates up to 30 days.
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate" -Name DeferFeatureUpdates            -Type DWord -Value 1
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate" -Name DeferFeatureUpdatesPeriodInDays -Type DWord -Value 30
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate" -Name DeferQualityUpdates            -Type DWord -Value 1
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate" -Name DeferQualityUpdatesPeriodInDays -Type DWord -Value 7
          # CONSUMER (Home): keep automatic updates on; use Settings > Windows Update > Pause
          # only briefly (35-day maximum). Confirm the build is current and supported.

"7.1":
  sdk:
    lang: "powershell"
    filename: "hth-windows-11-7.01-audit-logging.ps1"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/windows-11/sdk/hth-windows-11-7.01-audit-logging.ps1"
    excerpts:
      ps-process-audit:
        content: |2
          # Enable process-creation auditing and INCLUDE THE COMMAND LINE in Event ID 4688
          # (the single highest-value telemetry for detecting living-off-the-land attacks; the
          # 25H2 security baseline enables this).
          auditpol /set /subcategory:"Process Creation" /success:enable /failure:enable
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit" `
            -Name ProcessCreationIncludeCmdLine_Enabled -Type DWord -Value 1
      ps-review-security-events:
        content: |2
          # Review the signal locally (CONSUMER) or forward to a SIEM (ENTERPRISE via Windows
          # Event Forwarding / Sentinel connector). Recent process-creation events:
          Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4688 } -MaxEvents 20 |
            Format-Table TimeCreated, @{n='CmdLine';e={ ($_.Properties[8].Value) }} -AutoSize
          
          # Defender / ASR detections:
          Get-WinEvent -LogName "Microsoft-Windows-Windows Defender/Operational" -MaxEvents 20 -ErrorAction SilentlyContinue |
            Where-Object Id -in 1116,1117,1121,1122 | Format-Table TimeCreated, Id, Message -AutoSize

