            if .id==$user and (.active|type=="boolean")
            then {id, active, matches:(.active==$desired)}
            else error("Lucid SCIM ID or active flag not verified") end
          ' <<<"$body")
          printf '%s\n' "$result"
          jq -e '.matches' <<<"$result" >/dev/null

