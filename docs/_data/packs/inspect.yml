"4.2":
  config:
    lang: "bash"
    filename: "hth-inspect-4.02-review-verification-config.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/inspect/config/hth-inspect-4.02-review-verification-config.sh"
    excerpts:
      review-verification-config:
        content: |2
          set -euo pipefail
          python3 - "$@" <<'PY'
          import argparse
          import json
          from pathlib import Path
          import re
          
          p = argparse.ArgumentParser(description='Emit a review or verification candidate without applying it.')
          p.add_argument('kind', choices=['review', 'verification'])
          p.add_argument('--repo', required=True, help='Trusted repository root')
          p.add_argument('--skill', required=True, help='Review: local skill slug. Verification: repository-relative SKILL.md path')
          a = p.parse_args()
          root = Path(a.repo).resolve()
          if not root.is_dir():
              p.error('repo must be an existing directory')
          if a.kind == 'review':
              if not re.fullmatch(r'[a-z0-9][a-z0-9-]*', a.skill):
                  p.error('review skill must be a local non-namespaced slug')
              relative = Path('.claude') / 'skills' / a.skill / 'SKILL.md'
          else:
              relative = Path(a.skill)
              if relative.is_absolute() or '..' in relative.parts or relative.name != 'SKILL.md':
                  p.error('verification skill must be a repository-relative SKILL.md path without parent traversal')
          resolved = (root / relative).resolve()
          try:
              resolved.relative_to(root)
          except ValueError:
              p.error('skill resolves outside the repository')
          if not resolved.is_file():
              p.error('required local skill does not exist; create and test it before generating configuration')
          if a.kind == 'review':
              config = {'version': 1, 'rules': [{'id': 'hth-security', 'skill': a.skill}]}
          else:
              config = {
                  'skill': relative.as_posix(),
                  'model': 'auto',
                  'instructions': 'Check changed authorization and failure behavior. Report each claim as verified, failed, or skipped with evidence tied to the pushed commit; do not present skipped checks as proof.',
              }
          print(json.dumps(config, indent=2))
          PY
  api:
    lang: "bash"
    filename: "hth-inspect-4.02-request-verification.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/inspect/api/hth-inspect-4.02-request-verification.sh"
    excerpts:
      request-verification:
        content: |2
          source "$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)/common.sh"
          hth_init
          id=${INSPECT_SESSION_ID:-}; hth_id "$id"; hth_apply_gate "$id"
          repo=${INSPECT_REPOSITORY_ID:-}; hth_id "$repo"
          pr=${INSPECT_PULL_REQUEST_NUMBER:-}; [[ "$pr" =~ ^[1-9][0-9]*$ ]] || hth_unknown 'supply exact INSPECT_PULL_REQUEST_NUMBER'
          sha=${INSPECT_EXPECTED_HEAD_SHA:-}; [[ "$sha" =~ ^[a-fA-F0-9]{40}$ ]] || hth_unknown 'supply the reviewed 40-character INSPECT_EXPECTED_HEAD_SHA'
          check_target() {
            jq -e --arg id "$id" --arg repo "$repo" --argjson pr "$pr" --arg sha "$sha" '
              .data | .id==$id and .read_only==false and has("deleted_at") and .deleted_at==null
              and (.pull_requests|type)=="array" and (.repositories|type)=="array"
              and ([.pull_requests[]|select(.repository==$repo)]|length)==1
              and any(.pull_requests[]; .repository==$repo and .pull_request_number==$pr and has("merged_at") and .merged_at==null)
              and ([.repositories[]|select(.id==$repo)]|length)==1
              and any(.repositories[]; .id==$repo and .latest_commit_sha==$sha)' "$1" >/dev/null || hth_unknown 'session/PR/head mismatch or archived/read-only/merged target; no verified target'
          }
          hth_request GET "/api/v2/sessions/$id" "$HTH_TEMP/session.json"
          check_target "$HTH_TEMP/session.json"
          jq -n --arg repository "$repo" '{repository:$repository}' > "$HTH_TEMP/body.json"
          if [[ "${HTH_APPLY:-0}" == 0 ]]; then
            printf 'PREVIEW: would start or rerun verification; this can incur cost and supersede older runs. No invocation.\n'; exit 0
          fi
          hth_snapshot_dir
          # Keep only target identifiers, not session transcripts, URLs, participants, or deployment details.
          jq -n --arg session "$id" --arg repository "$repo" --argjson pr "$pr" --arg head "$sha" '{session,repository,pull_request_number:$pr,expected_head:$head}' > "$HTH_EVIDENCE/target.json"
          hth_request GET "/api/v2/sessions/$id" "$HTH_TEMP/recheck.json"
          check_target "$HTH_TEMP/recheck.json"
          hth_request POST "/api/v2/sessions/$id/verification" "$HTH_EVIDENCE/receipt.json" "$HTH_TEMP/body.json" 202
          jq -e --arg repo "$repo" --argjson pr "$pr" '.data | (.status=="started" or .status=="already_running") and .repository==$repo and .pull_request_number==$pr' "$HTH_EVIDENCE/receipt.json" >/dev/null || hth_unknown 'unexpected receipt; invocation may have happened, inspect before retrying'
          printf 'ACCEPTED: %s. Review results and tested commit in Inspect; no pass or isolation verdict.\n' "$(jq -r '.data.status' "$HTH_EVIDENCE/receipt.json")"

"4.3":
  api:
    lang: "bash"
    filename: "hth-inspect-4.03-inventory-automations.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/inspect/api/hth-inspect-4.03-inventory-automations.sh"
    excerpts:
      inventory-automations:
        content: |2
          source "$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)/common.sh"
          hth_init
          max=${HTH_MAX_PAGES:-1000}; [[ "$max" =~ ^[1-9][0-9]{0,3}$ ]] || hth_unknown 'HTH_MAX_PAGES must be 1..9999'
          cursor=''; pages=0; : > "$HTH_TEMP/items.jsonl"; : > "$HTH_TEMP/cursors.jsonl"
          while :; do
            path='/api/v2/automations?first=100&scope=all'
            [[ -z "$cursor" ]] || path+="&after=$(jq -rn --arg c "$cursor" '$c|@uri')"
            hth_request GET "$path" "$HTH_TEMP/page.json"
            jq -e '(.data|type)=="array" and (.meta.has_next_page|type)=="boolean" and (.meta|has("next_cursor")) and (.meta.next_cursor==null or (.meta.next_cursor|type)=="string") and all(.data[]; (.id|type)=="string" and (.enabled|type)=="boolean" and (.viewer_can_edit|type)=="boolean" and (.triggers|type)=="array" and (.repositories|type)=="array" and all(.repositories[];type=="string") and (.name|type)=="string" and (.run_as=="owner" or .run_as=="inspect") and has("agent_id") and (.agent_id==null or (.agent_id|type)=="string") and (.autofix_ci_failures|type)=="boolean" and has("auto_address_pull_request_reviews_policy") and all(.triggers[]; (.type|type)=="string"))' "$HTH_TEMP/page.json" >/dev/null || hth_unknown 'malformed automation page'
            jq -c '.data[]|{id,name,enabled,viewer_can_edit,repositories,run_as,agent_id,trigger_types:[.triggers[].type],autofix_ci_failures,auto_address_pull_request_reviews_policy}' "$HTH_TEMP/page.json" >> "$HTH_TEMP/items.jsonl"
            pages=$((pages+1))
            [[ $(jq -r '.meta.has_next_page' "$HTH_TEMP/page.json") == true ]] || break
            cursor=$(jq -r '.meta.next_cursor // empty' "$HTH_TEMP/page.json")
            [[ -n "$cursor" ]] || hth_unknown 'next page without cursor'
            jq -se --arg c "$cursor" 'index($c)==null' "$HTH_TEMP/cursors.jsonl" >/dev/null || hth_unknown 'cursor repeated; partial evidence discarded'
            (( pages < max )) || hth_unknown 'page limit reached; partial evidence discarded'
            jq -nc --arg c "$cursor" '$c' >> "$HTH_TEMP/cursors.jsonl"
          done
          jq -se '(map(.id)|unique|length)==length' "$HTH_TEMP/items.jsonl" >/dev/null || hth_unknown 'duplicate items across pages; retry after inventory stabilizes'
          jq -s '{scope:"Visible automations, including published/soft forks; archived excluded; not all tenant automations",warning:"viewer_can_edit=false means destinations, collaborators and execution settings are redacted; do not treat them as absent. Prompts, trigger details, and recipients omitted; inspect these in the console.",automations:.}' "$HTH_TEMP/items.jsonl" > "$HTH_TEMP/output.json"
          hth_save "$HTH_TEMP/output.json"
          printf 'COLLECTED: %s visible automations; review redaction and trigger details in Inspect.\n' "$(jq '.automations|length' "$HTH_TEMP/output.json")"

