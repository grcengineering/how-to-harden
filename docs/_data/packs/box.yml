"1.2":
  cli:
    lang: "bash"
    filename: "hth-box-1.02-user-role-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/box/cli/hth-box-1.02-user-role-audit.sh"
    excerpts:
      cli-audit-user-roles:
        content: |2
          # List every enterprise user with their role and status.
          # --all-users includes managed, app, and external users; --fields limits the
          # response to the attributes this audit needs (role values: admin, coadmin, user).
          USERS_JSON=$(box users --all-users --json --fields id,name,login,role,status)
          
          TOTAL=$(echo "${USERS_JSON}" | jq 'length')
          ADMINS=$(echo "${USERS_JSON}" | jq '[.[] | select(.role == "admin")] | length')
          COADMINS=$(echo "${USERS_JSON}" | jq '[.[] | select(.role == "coadmin")] | length')
          
          echo "Total users:   ${TOTAL}"
          echo "Admins:        ${ADMINS}"
          echo "Co-admins:     ${COADMINS}"
          
          # List every privileged account for review — each of these can change
          # sharing settings, reach enterprise content, or modify other accounts.
          echo "Privileged accounts (admin/coadmin):"
          echo "${USERS_JSON}" | jq -r \
            '.[] | select(.role == "admin" or .role == "coadmin")
                 | "  \(.role)\t\(.login)\t\(.status)"'
      cli-flag-inactive-privileged:
        content: |2
          # Privileged accounts that are not active should be removed, not left parked:
          # a disabled co-admin is one re-enable away from full enterprise reach.
          echo "Privileged accounts not in active status:"
          echo "${USERS_JSON}" | jq -r \
            '.[] | select((.role == "admin" or .role == "coadmin") and .status != "active")
                 | "  REVIEW: \(.role) \(.login) status=\(.status)"'

"3.2":
  cli:
    lang: "bash"
    filename: "hth-box-3.02-service-account-inventory.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/box/cli/hth-box-3.02-service-account-inventory.sh"
    excerpts:
      cli-inventory-app-users:
        content: |2
          # Inventory every app user (service account). Each row is a non-human identity
          # holding standing, non-interactive access that user MFA does not protect.
          APP_USERS_JSON=$(box users --app-users --json --fields id,name,login,created_at,modified_at)
          
          echo "App users (service accounts): $(echo "${APP_USERS_JSON}" | jq 'length')"
          echo "${APP_USERS_JSON}" | jq -r '.[] | "  \(.id)\t\(.name)\t\(.login)"'
      cli-service-account-activity:
        content: |2
          # Pull recent enterprise events and keep only those performed by an app user,
          # so anomalous automated access stands out for review.
          EVENTS_JSON=$(box events --enterprise --stream-type admin_logs \
            --created-after "${LOOKBACK}" --json)
          
          APP_USER_IDS=$(echo "${APP_USERS_JSON}" | jq '[.[].id]')
          
          echo "Enterprise events by service accounts (last ${LOOKBACK}):"
          echo "${EVENTS_JSON}" | jq -r --argjson ids "${APP_USER_IDS}" \
            '.[] | select(.created_by.id as $u | $ids | index($u))
                 | "  \(.created_at)\t\(.event_type)\t\(.created_by.login // .created_by.id)"'
      cli-flag-dormant-service-accounts:
        content: |2
          # Service accounts with zero activity in the lookback window are candidates
          # for removal — dormant automation is a forgotten access path into Box data.
          ACTIVE_IDS=$(echo "${EVENTS_JSON}" | jq '[.[].created_by.id] | unique')
          echo "App users with NO events in the last ${LOOKBACK} (review for removal):"
          echo "${APP_USERS_JSON}" | jq -r --argjson active "${ACTIVE_IDS}" \
            '.[] | select(.id as $u | $active | index($u) | not)
                 | "  DORMANT: \(.id)\t\(.name)\t\(.login)"'

"4.1":
  cli:
    lang: "bash"
    filename: "hth-box-4.01-shield-alert-events.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/box/cli/hth-box-4.01-shield-alert-events.sh"
    excerpts:
      cli-fetch-shield-alerts:
        content: |2
          # Pull SHIELD_ALERT events from the enterprise event stream. Shield produces
          # these for suspicious locations, suspicious sessions, anomalous downloads,
          # malicious content, and (Shield Pro) ransomware activity.
          ALERTS_JSON=$(box events --enterprise --stream-type admin_logs \
            --event-types SHIELD_ALERT --created-after "${LOOKBACK}" --json)
          
          echo "Shield alerts in the last ${LOOKBACK}: $(echo "${ALERTS_JSON}" | jq 'length')"
          
          # Summarize each alert from the documented additional_details.shield_alert
          # payload: rule category, risk score, priority, and alert summary.
          echo "${ALERTS_JSON}" | jq -r \
            '.[] | .additional_details.shield_alert as $a
                 | "  \(.created_at)\tcategory=\($a.rule_category)\trisk=\($a.risk_score)\tpriority=\($a.priority)\tid=\($a.alert_id)"'
      cli-shield-alert-triage:
        content: |2
          # Surface the highest-risk alerts first so triage starts where it matters.
          RISK_THRESHOLD="${RISK_THRESHOLD:-50}"
          echo "Alerts at or above risk score ${RISK_THRESHOLD}:"
          echo "${ALERTS_JSON}" | jq -r --argjson t "${RISK_THRESHOLD}" \
            '.[] | .additional_details.shield_alert as $a
                 | select(($a.risk_score // 0) >= $t)
                 | "  HIGH-RISK: \(.created_at) category=\($a.rule_category) risk=\($a.risk_score) summary=\($a.alert_summary // "n/a")"'
          
          # Emit the full alert objects as JSON Lines for SIEM ingestion.
          OUT_FILE="${OUT_FILE:-shield-alerts.jsonl}"
          echo "${ALERTS_JSON}" | jq -c '.[]' > "${OUT_FILE}"
          echo "Wrote full alert payloads to ${OUT_FILE}"

