"4.5":
  api:
    lang: "bash"
    filename: "hth-slack-4.05-exclude-channels-from-ai.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/slack/api/hth-slack-4.05-exclude-channels-from-ai.sh"
    excerpts:
      api-exclude-channels-from-ai:
        content: |2
          : "${SLACK_ADMIN_TOKEN:?set SLACK_ADMIN_TOKEN (admin.conversations:write)}"
          exclude="${EXCLUDE:-true}"
          case "${exclude}" in true|false) ;; *) echo "EXCLUDE must be true or false" >&2; exit 2 ;; esac
          [ "$#" -ge 1 ] && [ "$#" -le 100 ] || { echo "usage: $0 <channel_id> ... (1-100 IDs)" >&2; exit 2; }
          
          payload="$(printf '%s\n' "$@" | jq -Rn --argjson ex "${exclude}" '{channel_ids: [inputs], exclude: $ex}')"
          out="$(curl -sS -X POST "https://slack.com/api/admin.conversations.bulkSetExcludeFromSlackAi" \
            -H @<(printf 'Authorization: Bearer %s\n' "${SLACK_ADMIN_TOKEN}") \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "${payload}" \
            -w '\n%{http_code}')"
          code="${out##*$'\n'}"
          body="${out%$'\n'*}"
          [ "${code}" = "200" ] || { echo "bulkSetExcludeFromSlackAi failed: HTTP ${code}" >&2; exit 1; }
          if [ "$(printf '%s' "${body}" | jq -r '.ok')" != "true" ]; then
            echo "bulkSetExcludeFromSlackAi failed: $(printf '%s' "${body}" | jq -r '.error // "unknown"')" >&2
            exit 1
          fi
          
          echo "bulk_action_id: $(printf '%s' "${body}" | jq -r '.bulk_action_id')"
          not_added="$(printf '%s' "${body}" | jq -r '(.not_added // [])[] | [.channel_id, .error] | @tsv')"
          if [ -n "${not_added}" ]; then
            printf 'not added:\n%s\n' "${not_added}" >&2
            exit 1
          fi

"5.1":
  sdk:
    lang: "python"
    filename: "hth-slack-5.01-audit-logs-api.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/slack/sdk/hth-slack-5.01-audit-logs-api.py"
    excerpts:
      sdk-audit-logs-api:
        content: |2
          import os
          import sys
          import time
          
          import requests
          
          token = os.environ.get("SLACK_AUDIT_TOKEN") or sys.exit("set SLACK_AUDIT_TOKEN (auditlogs:read)")
          headers = {"Authorization": f"Bearer {token}"}
          params = {"limit": 1000, "action": "user_login", "oldest": int(time.time()) - 86400}
          seen = set()
          
          while True:
              r = requests.get("https://api.slack.com/audit/v1/logs", headers=headers, params=params, timeout=30)
              if r.status_code != 200:
                  sys.exit(f"audit logs request failed: HTTP {r.status_code}")
              body = r.json()
              if body.get("ok") is False:
                  sys.exit(f"audit logs request failed: {body.get('error')}")
              for entry in body.get("entries", []):
                  user = entry.get("actor", {}).get("user", {})
                  print(f"Action: {entry['action']}, User: {user.get('email') or user.get('id')}")
              cursor = body.get("response_metadata", {}).get("next_cursor")
              if not cursor:
                  break
              if cursor in seen:
                  sys.exit("audit logs request failed: pagination cursor repeated, listing incomplete")
              seen.add(cursor)
              params["cursor"] = cursor
  siem:
    lang: "spl"
    filename: "hth-slack-5.01-siem-splunk-queries.spl"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/slack/siem/hth-slack-5.01-siem-splunk-queries.spl"
    excerpts:
      db-siem-splunk-queries:
        content: |2
          # Failed login attempts
          index=slack sourcetype=slack:audit action="user_login_failed"
          | stats count by actor.user.email
          | where count > 5
          
          # Admin role changes
          index=slack sourcetype=slack:audit action="role_change_to_admin"
          | table _time actor.user.email entity.user.email
          
          # App installations
          index=slack sourcetype=slack:audit action="app_installed"
          | table _time actor.user.email entity.app.name

