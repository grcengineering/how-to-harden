    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/slack/sdk/hth-slack-1.02-scim-user-listing.py"
    excerpts:
      sdk-scim-user-listing:
        content: |2
          import os
          import sys
          
          import requests
          
          token = os.environ.get("SLACK_ADMIN_TOKEN") or sys.exit("set SLACK_ADMIN_TOKEN (admin scope)")
          headers = {"Authorization": f"Bearer {token}"}
          
          start = 1
          while True:
              r = requests.get(
                  "https://api.slack.com/scim/v1/Users",
                  headers=headers,
                  params={"startIndex": start, "count": 1000},
                  timeout=30,
              )
              if r.status_code != 200:
                  sys.exit(f"SCIM request failed: HTTP {r.status_code}")
              body = r.json()
              resources = body.get("Resources", [])
              if start == 1 and not resources:
                  sys.exit("SCIM returned no users: the listing is empty, not clean")
              for user in resources:
                  print(f"User: {user['userName']}, Active: {user['active']}")
              start += len(resources)
              if not resources or start > body.get("totalResults", 0):
                  break

"1.3":
  api:
    lang: "bash"
    filename: "hth-slack-1.03-list-privileged-members.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/slack/api/hth-slack-1.03-list-privileged-members.sh"
    excerpts:
      api-list-privileged-members:
        content: |2
          : "${SLACK_USER_TOKEN:?set SLACK_USER_TOKEN (users:read)}"
          
          cursor=""
          seen=" "
          primary_owners=0
          while :; do
            out="$(curl -sS --get "https://slack.com/api/users.list" \
              -H @<(printf 'Authorization: Bearer %s\n' "${SLACK_USER_TOKEN}") \
              --data-urlencode "limit=200" --data-urlencode "cursor=${cursor}" \
              -w '\n%{http_code}')"
            code="${out##*$'\n'}"
            body="${out%$'\n'*}"
            [ "${code}" = "200" ] || { echo "users.list failed: HTTP ${code}" >&2; exit 1; }
            if [ "$(printf '%s' "${body}" | jq -r '.ok')" != "true" ]; then
              echo "users.list failed: $(printf '%s' "${body}" | jq -r '.error // "unknown"')" >&2
              exit 1
            fi
          
            printf '%s' "${body}" | jq -r '
              .members[]
              | select((.deleted // false) | not)
              | select((.is_primary_owner // false) or (.is_owner // false) or (.is_admin // false))
              | [.id, .name,
                 (if .is_primary_owner then "primary_owner"
                  elif .is_owner then "owner" else "admin" end)]
              | @tsv'
            n="$(printf '%s' "${body}" | jq '[.members[] | select(.is_primary_owner == true)] | length')"
            primary_owners=$((primary_owners + n))
          
            cursor="$(printf '%s' "${body}" | jq -r '.response_metadata.next_cursor // ""')"
            [ -n "${cursor}" ] || break
            case "${seen}" in *" ${cursor} "*) echo "users.list: pagination cursor repeated, listing incomplete" >&2; exit 1 ;; esac
            seen="${seen}${cursor} "
          done
          
          if [ "${primary_owners}" -eq 0 ]; then
            echo "no primary owner in the roster: the read was incomplete" >&2
            exit 1
          fi

