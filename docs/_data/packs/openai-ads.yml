"3.1":
  sdk:
    lang: "javascript"
    filename: "hth-openai-ads-3.01-pixel-consent.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/openai-ads/sdk/hth-openai-ads-3.01-pixel-consent.js"
    excerpts:
      pixel-consent:
        content: |2
          export function initializeConsentControlledPixel(oaiq, pixelId) {
            if (typeof oaiq !== "function" || typeof pixelId !== "string" || !pixelId.trim()) {
              throw new Error("Load the official Pixel queue and choose the approved Pixel ID");
            }
            // Queue this BEFORE init; the vendor default is consent=true.
            oaiq("consent", false);
            oaiq("init", { pixelId, debug: false });
            return {
              grant: () => oaiq("consent", true),
              withdraw: () => oaiq("consent", false),
            };
          }
          // Connect grant/withdraw to actual consent state before emitting events.
          // Consent is not a per-Pixel isolation mechanism. For multiple pixels, review
          // every recipient and keep server-side forwarding consistent with withdrawal.

"3.2":
  api:
    lang: "bash"
    filename: "hth-openai-ads-3.02-validate-conversions.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/openai-ads/api/hth-openai-ads-3.02-validate-conversions.sh"
    excerpts:
      validate-conversions:
        content: |2
          body=$(jq -ce 'if (.events|type == "array") and (.events|length > 0 and length <= 1000)
            then . + {validate_only:true} else error("Supply 1–1000 approved fixture events") end')
          if [[ "${1:-}" != '--send' ]]; then printf '%s\n' "$body"; exit 0; fi
          : "${OPENAI_ADS_CONVERSION_KEY:?Inject a server-side Conversions API key}"
          : "${OPENAI_ADS_PIXEL_ID:?Set the approved Web data-source Pixel ID}"
          [[ "$OPENAI_ADS_PIXEL_ID" =~ ^[A-Za-z0-9_-]+$ ]] || exit 2
          base=$(ads_checked_base "${OPENAI_ADS_CONVERSION_BASE_URL:-https://bzr.openai.com}" 'https://bzr.openai.com')
          umask 077
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          trap 'exit 1' HUP INT TERM
          printf '%s' "$body" > "$work/request"
          (( $(wc -c < "$work/request") <= 8388608 )) || { echo 'Conversion request exceeds 8 MiB safety bound' >&2; exit 2; }
          status=$(ads_http_to_file "$base" "$OPENAI_ADS_CONVERSION_KEY" \
            "/v1/events?pid=${OPENAI_ADS_PIXEL_ID}" "$work/response" \
            --request POST -H 'Content-Type: application/json' --data-binary "@$work/request")
          [[ "$status" == 200 ]] || { echo "Conversion validation failed: HTTP $status; response body withheld" >&2; exit 1; }
          cat "$work/response"
          # Never change validate_only to false as part of a retry. Browser and server
          # senders must retain the same event id AND Pixel ID for the same conversion.

"3.3":
  config:
    lang: "bash"
    filename: "hth-openai-ads-3.03-hashed-audience.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/openai-ads/config/hth-openai-ads-3.03-hashed-audience.sh"
    excerpts:
      hashed-audience:
        content: |2
          emails=$(jq -er 'if type == "array" and all(.[]; type == "string" and
            test("^[[:space:]]*[A-Za-z0-9.!#$%&\u0027*+/=?^_`{|}~-]+@[A-Za-z0-9.-]+[[:space:]]*$"))
            then .[] | gsub("^[[:space:]]+|[[:space:]]+$"; "") | ascii_downcase
            else error("Expected approved ASCII emails; handle international identifiers separately") end')
          printf 'email_sha256\n'
          while IFS= read -r email; do
            [[ -n "$email" ]] || continue
            printf '%s' "$email" | shasum -a 256 | cut -d ' ' -f 1
          done <<<"$emails"
          # Preserve email plus tags and dots. Hash UTF-8 without a trailing newline.
          # Phone normalization differs between custom audiences and Pixel matching;
          # never reuse a Pixel phone hash for the E.164 audience contract.

