"1.2":
  api:
    lang: "bash"
    filename: "hth-tenable-1.02-user-role-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tenable/api/hth-tenable-1.02-user-role-audit.sh"
    excerpts:
      api-list-users-with-roles:
        content: |2
          # Pull every user with role assignments. The permissions integer encodes the
          # built-in tier (64 = Administrator, 40 = Scan Manager, 16 = Basic);
          # withRoles=true adds the rbac_roles array covering VM Custom Role assignments.
          USERS_JSON=$(curl -sf -H "${AUTH}" \
            "https://cloud.tenable.com/users?withRoles=true")
          
          echo "Total users: $(echo "${USERS_JSON}" | jq '.users | length')"
          echo "Users by permissions tier:"
          echo "${USERS_JSON}" | jq -r \
            '.users | group_by(.permissions) | .[]
              | "  permissions=\(.[0].permissions) (\(if .[0].permissions == 64 then "Administrator"
                  elif .[0].permissions == 40 then "Scan Manager"
                  elif .[0].permissions == 16 then "Basic"
                  else "other built-in tier" end)): \(length)"'
      api-flag-privileged-and-risky:
        content: |2
          # Administrators, enabled accounts that never logged in, and accounts still
          # permitted to authenticate to the API are the review set: every role grant in
          # Tenable is implicitly an API-key grant, since Basic and above can mint keys.
          echo "Administrator [64] accounts:"
          echo "${USERS_JSON}" | jq -r \
            '.users[] | select(.permissions == 64)
              | "  ADMIN: \(.username)\tenabled=\(.enabled)\tapi_permitted=\(.api_permitted)"'
          
          echo "Enabled accounts with API access permitted:"
          echo "${USERS_JSON}" | jq -r \
            '.users[] | select(.enabled == true and .api_permitted == true)
              | "  API-CAPABLE: \(.username)\tpermissions=\(.permissions)"'
          
          echo "Enabled non-SSO accounts without SMS or email two-factor:"
          echo "${USERS_JSON}" | jq -r \
            '.users[] | select(.enabled == true
                and ((.two_factor.sms_enabled // 0) != 1)
                and ((.two_factor.email_enabled // 0) != 1))
              | "  NO-MFA: \(.username)\tpermissions=\(.permissions)"'

"1.3":
  api:
    lang: "bash"
    filename: "hth-tenable-1.03-audit-log-export.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tenable/api/hth-tenable-1.03-audit-log-export.sh"
    excerpts:
      api-export-audit-log:
        content: |2
          # Page through every audit-log event since ${SINCE} and write JSON Lines for
          # SIEM forwarding. Each event carries action, actor {id,name}, crud (C/R/U/D),
          # received (ISO 8601), and target {id,name,type}.
          : > "${OUT_FILE}"
          OFFSET=0
          TOTAL=0
          while :; do
            PAGE=$(curl -sf -H "${AUTH}" \
              "https://cloud.tenable.com/audit-log/v1/events?f=date.gt:${SINCE}&limit=${LIMIT}&offset=${OFFSET}")
            COUNT=$(echo "${PAGE}" | jq '.events | length')
            [ "${COUNT}" -eq 0 ] && break
            echo "${PAGE}" | jq -c '.events[]' >> "${OUT_FILE}"
            TOTAL=$((TOTAL + COUNT))
            OFFSET=$((OFFSET + LIMIT))
            [ "${COUNT}" -lt "${LIMIT}" ] && break
          done
          echo "Exported ${TOTAL} audit events since ${SINCE} to ${OUT_FILE}"
      api-review-admin-events:
        content: |2
          # Surface the account-and-configuration changes an attacker covering their
          # tracks would generate: user creation/deletion and updates (crud C/U/D
          # against user targets), grouped by actor for anomaly review.
          echo "Create/update/delete events against user accounts:"
          jq -r 'select(.target.type == "user" and ((.crud | ascii_downcase) as $c | $c == "c" or $c == "u" or $c == "d"))
            | "  \(.received)\t\(.action)\tactor=\(.actor.name)\ttarget=\(.target.name)"' \
            "${OUT_FILE}"
          
          echo "Event volume by actor (top 20):"
          jq -r '.actor.name // "unknown"' "${OUT_FILE}" | sort | uniq -c | sort -rn | head -20

"3.4":
  api:
    lang: "bash"
    filename: "hth-tenable-3.04-api-key-rotation.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tenable/api/hth-tenable-3.04-api-key-rotation.sh"
    excerpts:
      api-inventory-api-capable-users:
        content: |2
          # Every enabled account with api_permitted=true can hold a standing API
          # credential. This is the inventory to reconcile against your list of named
          # applications and owners — one key pair per application.
          USERS_JSON=$(curl -sf -H "${AUTH}" "https://cloud.tenable.com/users")
          
          echo "Enabled accounts permitted to authenticate to the API:"
          echo "${USERS_JSON}" | jq -r \
            '.users[] | select(.enabled == true and .api_permitted == true)
              | "  id=\(.id)\t\(.username)\tpermissions=\(.permissions)\tlast_ui_login=\(.lastlogin // "never")"'
      api-rotate-user-keys:
        content: |2
          # Regenerate API keys for one user (rotation cadence, offboarding, or
          # suspected exposure). Requires Administrator [64]. The new secret is shown
          # only in this response — store it in a secrets manager immediately.
          if [ "${CONFIRM_ROTATION:-no}" = "yes" ] && [ -n "${ROTATE_USER_ID:-}" ]; then
            echo "Regenerating API keys for user id ${ROTATE_USER_ID} — existing keys are invalidated immediately"
            NEW_KEYS=$(curl -sf -X PUT -H "${AUTH}" \
              "https://cloud.tenable.com/users/${ROTATE_USER_ID}/keys")
            # Do not echo the keys to the terminal or CI logs; write them to a
            # restricted file for transfer into your secrets manager.
            KEY_FILE="tenable-keys-${ROTATE_USER_ID}.json"
            umask 177
            echo "${NEW_KEYS}" | jq '{accessKey, secretKey}' > "${KEY_FILE}"
            echo "New key pair written to ${KEY_FILE} (mode 600) — move it to your secrets manager and delete the file"
          else
            echo "Rotation skipped: set ROTATE_USER_ID and CONFIRM_ROTATION=yes to regenerate a user's keys"
          fi

