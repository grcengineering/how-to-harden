"1.2":
  api:
    lang: "bash"
    filename: "hth-lovable-1.02-enforce-sso-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/lovable/api/hth-lovable-1.02-enforce-sso-audit.sh"
    excerpts:
      audit-enforce-sso:
        content: |2
          # Read the workspace and assert Enforce SSO is on. A missing or non-boolean field is
          # an unreadable response (exit 2), never a pass.
          WS_PATH="/v1/workspaces/$(printf '%s' "${LOVABLE_WORKSPACE_ID}" | jq -sRr @uri)"
          WS="$(lov_get "${WS_PATH}")" || exit 2
          
          # (jq -r, not -e: -e would turn a legitimate `false` into a non-zero exit.)
          ENFORCE_SSO="$(printf '%s' "${WS}" | jq -r 'if (.enforce_sso | type) == "boolean" then .enforce_sso else error("enforce_sso missing") end')" || {
            echo "ERROR 1.2: workspace response carries no boolean enforce_sso; SSO state UNKNOWN" >&2
            exit 2
          }
          PLAN="$(printf '%s' "${WS}" | jq -r '.plan // "unknown"')"
          
          if [ "${ENFORCE_SSO}" = "true" ]; then
            echo "PASS 1.2: Enforce SSO is on (plan: ${PLAN}). Session duration is console-only: review it at Settings -> Access -> Identity."
            exit 0
          fi
          echo "FAIL 1.2: Enforce SSO is off (plan: ${PLAN}). Members can sign in without your IdP; enable it at Settings -> Access -> Identity."
          exit 1

"1.3":
  api:
    lang: "bash"
    filename: "hth-lovable-1.03-scim-access-review.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/lovable/api/hth-lovable-1.03-scim-access-review.sh"
    excerpts:
      scim-user-review:
        content: |2
          # Access review: list every SCIM-provisioned user with active state and role-bearing groups.
          # Reconcile this against your IdP; anyone here who is inactive in the IdP is a deprovisioning gap.
          USERS_JSON=$(scim_get "/Users?count=200") || { echo "ERROR 1.3: GET /Users failed — review INCOMPLETE" >&2; exit 2; }
          printf '%s' "${USERS_JSON}" | scim_complete || {
            echo "ERROR 1.3: /Users returned a partial or unreadable listing (over 200 users, or an unexpected body) — review INCOMPLETE" >&2
            exit 2
          }
          printf '%s' "${USERS_JSON}" | jq -r '
            ["ACTIVE","USERNAME","DISPLAY_NAME","GROUPS"],
            (.Resources[] | [
                (.active | tostring),
                .userName,
                (.displayName // "-"),
                ([.groups[]?.display] | join(",") // "-")
            ]) | @tsv' | column -t -s$'\t'
      scim-group-role-map:
        content: |2
          # Group -> role mapping review. Lovable assigns workspace roles (viewer/editor/admin) via
          # SCIM group membership; when a user is in several mapped groups the HIGHEST role wins.
          # Flag any group mapped to admin and confirm its IdP membership is deliberately small.
          GROUPS_JSON=$(scim_get "/Groups?count=200") || { echo "ERROR 1.3: GET /Groups failed — review INCOMPLETE" >&2; exit 2; }
          printf '%s' "${GROUPS_JSON}" | scim_complete || {
            echo "ERROR 1.3: /Groups returned a partial or unreadable listing — review INCOMPLETE" >&2
            exit 2
          }
          printf '%s' "${GROUPS_JSON}" | jq -r '
            .Resources[] | [
                .displayName,
                ((.members // []) | length | tostring)
            ] | @tsv' | column -t -s$'\t'
      scim-deprovision-check:
        content: |2
          # Leaver verification: confirm a departed user is gone. IdP deactivation should remove them
          # from the workspace and block login. An "active: true" result here means the leaver still
          # has workspace access — investigate the IdP assignment before closing the offboarding ticket.
          LEAVER_EMAIL="${1:-}"
          if [ -n "${LEAVER_EMAIL}" ]; then
            ENCODED=$(printf '%s' "userName eq \"${LEAVER_EMAIL}\"" | jq -sRr @uri)
            RESULT=$(scim_get "/Users?filter=${ENCODED}") || { echo "ERROR 1.3: SCIM search for ${LEAVER_EMAIL} failed; leaver status UNKNOWN" >&2; exit 2; }
            # Fail closed: only a numeric totalResults that is consistent with Resources is evidence
            # that a search actually ran. An error envelope, {} or a null count means UNKNOWN, never PASS.
            COUNT=$(printf '%s' "${RESULT}" | jq -er 'select((.totalResults | type) == "number" and ((.Resources // []) | length) <= .totalResults) | .totalResults') || {
              echo "ERROR 1.3: unexpected SCIM response for ${LEAVER_EMAIL}; leaver status UNKNOWN" >&2
              exit 2
            }
            if [ "${COUNT}" = "0" ]; then
              echo "PASS 1.3: ${LEAVER_EMAIL} is not provisioned in the workspace."
            else
              printf '%s' "${RESULT}" | jq -r '.Resources[] | "FAIL 1.3: \(.userName) still present (active=\(.active))"'
              exit 1
            fi
          fi

"2.1":
  api:
    lang: "bash"
    filename: "hth-lovable-2.01-member-role-review.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/lovable/api/hth-lovable-2.01-member-role-review.sh"
    excerpts:
      audit-privileged-members:
        content: |2
          # Owners and admins, one role at a time (the member object has no role field).
          OWNERS="$(lov_list "/v1/workspaces/${WS_ID_ENC}/members?role=owner&limit=100" | jq -s '.')" || exit 2
          ADMINS="$(lov_list "/v1/workspaces/${WS_ID_ENC}/members?role=admin&limit=100" | jq -s '.')" || exit 2
          N_OWNERS="$(printf '%s' "${OWNERS}" | jq 'length')"
          N_ADMINS="$(printf '%s' "${ADMINS}" | jq 'length')"
          
          echo "Owners (${N_OWNERS}, policy max ${HTH_MAX_OWNERS}):"
          printf '%s' "${OWNERS}" | jq -r '.[] | "  \(.name // "(no display name)")  \(.user_id)"'
          echo "Admins (${N_ADMINS}, policy max ${HTH_MAX_ADMINS}):"
          printf '%s' "${ADMINS}" | jq -r '.[] | "  \(.name // "(no display name)")  \(.user_id)"'
          
          RC=0
          if [ "${N_OWNERS}" -lt 1 ]; then
            echo "ERROR 2.1: the owner query returned zero owners; a workspace always has one — result UNKNOWN" >&2
            exit 2
          fi
          if [ "${N_OWNERS}" -gt "${HTH_MAX_OWNERS}" ]; then
            echo "FAIL 2.1: ${N_OWNERS} owners exceed the policy maximum of ${HTH_MAX_OWNERS}"; RC=1
          fi
          if [ "${N_ADMINS}" -gt "${HTH_MAX_ADMINS}" ]; then
            echo "FAIL 2.1: ${N_ADMINS} admins exceed the policy maximum of ${HTH_MAX_ADMINS}"; RC=1
          fi
      audit-credit-limit:
        content: |2
          # Resource-abuse cap: the default monthly build-credit limit for members without their
          # own limit. The API returns null both when it is unset and when the key cannot view
          # workspace usage, so null is reported for review rather than failed.
          WS="$(lov_get "/v1/workspaces/${WS_ID_ENC}")" || exit 2
          printf '%s' "${WS}" | jq -e 'has("default_monthly_member_credit_limit")' >/dev/null || {
            echo "ERROR 2.1: workspace response lacks default_monthly_member_credit_limit" >&2; exit 2; }
          LIMIT="$(printf '%s' "${WS}" | jq -r '.default_monthly_member_credit_limit // "null"')"
          if [ "${LIMIT}" = "null" ]; then
            echo "REVIEW 2.1: no default member credit limit visible (unset, or the key cannot view usage) — review it in the workspace settings"
          else
            echo "INFO 2.1: default monthly member credit limit = ${LIMIT} credits"
          fi
          
          [ "${RC}" -eq 0 ] && echo "PASS 2.1: privileged membership within policy (pending invites not covered — review Settings -> People)"
          exit "${RC}"

