"5.1":
  db:
    lang: "sql"
    filename: "hth-lovable-5.01-rls-coverage-audit.sql"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/lovable/db/hth-lovable-5.01-rls-coverage-audit.sql"
    excerpts:
      db-rls-disabled-tables:
        content: |2
          -- Tables (ordinary and partitioned) in the exposed schema with row-level security OFF:
          -- every row is readable and writable by any client the API lets through.
          SELECT n.nspname AS schema_name,
                 c.relname AS table_name
          FROM pg_catalog.pg_class AS c
          JOIN pg_catalog.pg_namespace AS n ON n.oid = c.relnamespace
          WHERE c.relkind IN ('r', 'p')
            AND n.nspname = 'public'
            AND NOT c.relrowsecurity
          ORDER BY n.nspname, c.relname;
      db-rls-open-policies:
        content: |2
          -- Permissive policies that let anonymous callers (role anon, or PUBLIC = every role)
          -- through unconditionally: USING (true) or WITH CHECK (true). Intentionally public
          -- read-only data is a legitimate exception — document it; anything writable is not.
          SELECT schemaname,
                 tablename,
                 policyname,
                 cmd,
                 roles,
                 qual,
                 with_check
          FROM pg_catalog.pg_policies
          WHERE schemaname = 'public'
            AND permissive = 'PERMISSIVE'
            AND roles && ARRAY['anon', 'public']::name[]
            AND (qual = 'true' OR with_check = 'true')
          ORDER BY schemaname, tablename, policyname;

"5.3":
  api:
    lang: "bash"
    filename: "hth-lovable-5.03-published-app-scan-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/lovable/api/hth-lovable-5.03-published-app-scan-audit.sh"
    excerpts:
      audit-published-app-scans:
        content: |2
          PUBLISHED="$(lov_list "/v1/projects?workspace_id=${WS_ID_ENC}&is_published=true&limit=100" \
            | jq -s '[.[] | select(.is_published == true)]')" || exit 2
          
          FINDINGS=0; UNKNOWN=0
          while IFS=$'\t' read -r PID PNAME; do
            [ -n "${PID}" ] || continue
            PID_ENC="$(printf '%s' "${PID}" | jq -sRr @uri)"
            # Newest completed scan (the list is newest first; a running/failed scan is skipped).
            SCAN="$(lov_list "/v1/projects/${PID_ENC}/security-scans?limit=100" \
              | jq -s -c '[.[] | select(.status == "completed")][0] // empty')" || exit 2
            if [ -z "${SCAN}" ]; then
              echo "UNKNOWN 5.3: ${PNAME} (${PID}) is published with no completed security scan"; UNKNOWN=$((UNKNOWN + 1))
              continue
            fi
            SID="$(printf '%s' "${SCAN}" | jq -r '.id')"
            SID_ENC="$(printf '%s' "${SID}" | jq -sRr @uri)"
            ERRORS="$(lov_list "/v1/projects/${PID_ENC}/security-scans/${SID_ENC}/findings?limit=100" \
              | jq -s '[.[] | select(.level == "error" and (.status == "open" or .status == "suppressed"))] | length')" || exit 2
            if [ "${ERRORS}" -gt 0 ]; then
              echo "FAIL 5.3: ${PNAME} (${PID}) is published with ${ERRORS} unresolved error-level finding(s) (scan ${SID}, finished $(printf '%s' "${SCAN}" | jq -r '.finished_at // "?"'))"
              FINDINGS=$((FINDINGS + 1))
            fi
          done < <(printf '%s' "${PUBLISHED}" | jq -r '.[] | [.id, (.name // "(unnamed)")] | @tsv')
          
          TOTAL="$(printf '%s' "${PUBLISHED}" | jq 'length')"
          if [ "${FINDINGS}" -gt 0 ]; then exit 1; fi
          if [ "${UNKNOWN}" -gt 0 ]; then echo "ERROR 5.3: ${UNKNOWN} of ${TOTAL} published project(s) could not be shown clean" >&2; exit 2; fi
          echo "PASS 5.3: all ${TOTAL} published project(s) have a completed scan with no unresolved error-level findings"
          exit 0

"7.2":
  api:
    lang: "bash"
    filename: "hth-lovable-7.02-security-insights.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/lovable/api/hth-lovable-7.02-security-insights.sh"
    excerpts:
      audit-security-insights:
        content: |2
          INSIGHTS="$(lov_get "/v1/workspaces/${WS_ID_ENC}/security-center/insights")" || exit 2
          
          printf '%s' "${INSIGHTS}" | jq -e '
            (.findings | type) == "array" and (.findings | length) > 0
            and all(.findings[]; (.review_priority | type) == "string" and (.project_count | type) == "number")
            and (.summary.total_projects.value | type) == "number"' >/dev/null || {
            echo "ERROR 7.2: insights response is empty or malformed — workspace posture UNKNOWN" >&2; exit 2; }
          
          printf '%s' "${INSIGHTS}" | jq -r '
            "Workspace: \(.summary.total_projects.value) projects, \(.summary.externally_published.value) public, \(.summary.workspace_members.value) members (as of \(.as_of // "unknown"))",
            "Review priority: high=\(.summary.risk.needs_review) medium=\(.summary.risk.review_recommended) low=\(.summary.risk.no_review_needed)",
            (.findings[] | "  [\(.review_priority)] \(.title): \(.project_count) project(s)")'
          
          HIGH="$(printf '%s' "${INSIGHTS}" | jq '[.findings[] | select(.review_priority == "needs_review" and .project_count > 0)] | length')"
          if [ "${HIGH}" -gt 0 ]; then
            echo "FAIL 7.2: ${HIGH} high-priority finding type(s) match at least one project — triage them in Settings -> Security -> Security center"
            exit 1
          fi
          echo "PASS 7.2: no high-priority (needs_review) finding type matches any project"
          exit 0

