"2.2":
  cli:
    lang: "bash"
    filename: "hth-keeper-2.02-enforce-two-factor.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/keeper/cli/hth-keeper-2.02-enforce-two-factor.sh"
    excerpts:
      cli-enforce-2fa:
        content: |2
          # Require two-factor authentication via the REQUIRE_TWO_FACTOR (BOOLEAN)
          # role enforcement policy. Commands are piped to Commander in batch mode.
          keeper --batch-mode - <<'EOF'
          enterprise-role "Keeper Administrator" --enforcement "REQUIRE_TWO_FACTOR:True"
          enterprise-role "Everyone" --enforcement "REQUIRE_TWO_FACTOR:True"
          EOF
      cli-verify-2fa-enforcement:
        content: |2
          # Verbose role view (-v) lists the enforcement policies applied to a role;
          # confirm REQUIRE_TWO_FACTOR appears for every role that holds vault users.
          keeper --batch-mode - <<'EOF'
          enterprise-role "Keeper Administrator" -v
          enterprise-role "Everyone" -v
          EOF

"2.5":
  cli:
    lang: "bash"
    filename: "hth-keeper-2.05-account-transfer.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/keeper/cli/hth-keeper-2.05-account-transfer.sh"
    excerpts:
      cli-transfer-departed-user:
        content: |2
          # Transfer a departing employee's vault to an authorized recipient
          # as part of the offboarding runbook, before the account is deleted.
          keeper --batch-mode - <<'EOF'
          transfer-user departing.user@example.com --target-user security-vault-recipient@example.com
          EOF
      cli-bulk-transfer-locked-users:
        content: |2
          # action-report can act on users by status: transfer the vaults of accounts
          # that have been locked for 90+ days to a designated recipient in one pass.
          # Run with -n / --dry-run first to preview the affected users.
          keeper --batch-mode - <<'EOF'
          action-report -t locked -d 90 -a transfer --target-user security-vault-recipient@example.com --dry-run
          EOF

"5.1":
  cli:
    lang: "bash"
    filename: "hth-keeper-5.01-audit-log-siem.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/keeper/cli/hth-keeper-5.01-audit-log-siem.sh"
    excerpts:
      cli-audit-log-siem-export:
        content: |2
          # Push Keeper event data to a SIEM. Supported targets:
          # splunk, sumo, syslog, syslog-port, azure-la, json.
          # The --record argument names a Keeper record that stores the export
          # state and the SIEM credentials, so the connection details never
          # leave the vault. --anonymize replaces emails with enterprise user IDs.
          keeper --batch-mode - <<'EOF'
          audit-log --target=splunk
          EOF
          
          # Local JSON export of the last 30 days (no SIEM required):
          keeper --batch-mode - <<'EOF'
          audit-log --record=audit-log-json --target=json --days=30
          EOF
      cli-audit-report-review:
        content: |2
          # Ad-hoc audit review with audit-report. Daily rollup of who generated
          # which event types, then a raw dump of the last 30 days for triage.
          keeper --batch-mode - <<'EOF'
          audit-report --report-type day --columns username --columns audit_event_type
          audit-report --report-type raw --report-format fields --created last_30_days --limit -1
          EOF

"5.2":
  cli:
    lang: "bash"
    filename: "hth-keeper-5.02-security-audit-report.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/keeper/cli/hth-keeper-5.02-security-audit-report.sh"
    excerpts:
      cli-security-audit-report:
        content: |2
          # Per-user password security strength report. -su previews recalculated
          # scores; -s calculates and pushes updated scores; -b adds BreachWatch
          # scores to the output. Export to CSV for tracking over time.
          keeper --batch-mode - <<'EOF'
          security-audit-report -s
          security-audit-report -b --format csv
          security-audit-report --score-type=strong_passwords --save
          EOF
      cli-user-login-report:
        content: |2
          # User status and last-login report — surfaces accounts that have not
          # signed in recently and feeds the remediation follow-up in this control.
          keeper --batch-mode - <<'EOF'
          user-report --format csv --output logins.csv --days 30
          EOF

