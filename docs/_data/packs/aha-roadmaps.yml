            next_total=$(jq -er --argjson page "$page" '
              .pagination | if type=="object" then . elif type=="array" and length==1 then .[0] else error("invalid pagination") end
              | if .current_page==$page and (.total_pages|type=="number" and floor==. and .>=0)
