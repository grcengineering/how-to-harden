  config:
    lang: "json"
    filename: "hth-tailscale-3.02-isolate-ci-workloads.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/config/hth-tailscale-3.02-isolate-ci-workloads.jsonc"
    excerpts:
      isolate-ci-workloads:
        content: |2
          {
            "grants": [
              {"src": ["tag:ci"], "dst": ["tag:build"], "ip": ["tcp:443"]}
            ],
            "tests": [
              {"src": "tag:ci", "proto": "tcp", "accept": ["tag:build:443"], "deny": ["tag:prod:22", "tag:prod:443", "tag:build:22"]}
            ]
          }
  api:
    lang: "bash"
    filename: "hth-tailscale-3.02-inventory-auth-key-capabilities.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-3.02-inventory-auth-key-capabilities.sh"
    excerpts:
      inventory-auth-keys:
        content: |2
          hth_api_init 1
          hth_get "/api/v2/tailnet/${HTH_TAILNET}/keys" "$HTH_TEMP/keys.json"
          jq -e '(.keys | type == "array") and (.keys | length <= 1000) and
            all(.keys[]; (.id | type == "string" and test("^[A-Za-z0-9]{1,128}$"))) and
            (([.keys[].id] | unique | length) == (.keys | length))' "$HTH_TEMP/keys.json" >/dev/null 2>&1 || hth_unknown 'invalid, duplicate or excessive key list'
          jq -r '.keys[].id' "$HTH_TEMP/keys.json" > "$HTH_TEMP/ids"
          : > "$HTH_TEMP/records"
          while IFS= read -r id; do
            hth_get "/api/v2/tailnet/${HTH_TAILNET}/keys/${id}" "$HTH_TEMP/key.json"
            jq -e --arg id "$id" '.id == $id and (.capabilities.devices.create | type == "object")' "$HTH_TEMP/key.json" >/dev/null 2>&1 || hth_unknown 'auth-key metadata mismatch'
            jq -c '{id, description, created, expires, revoked, capabilities}' "$HTH_TEMP/key.json" >> "$HTH_TEMP/records"
          done < "$HTH_TEMP/ids"
          jq -s '{keys:., coverage:"credential-visible auth keys only"}' "$HTH_TEMP/records" > "$HTH_TEMP/report.json"
          hth_save "$HTH_TEMP/report.json"
          printf 'COLLECTED: visible auth-key capabilities; reconcile other owners and tailnet credentials in the console.\n'

"3.3":
  terraform:
    lang: "hcl"
    filename: "hth-tailscale-3.03-manage-reviewed-subnet-routes.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/terraform/hth-tailscale-3.03-manage-reviewed-subnet-routes.tf"
    excerpts:
      reviewed-subnet-routes:
        content: |2
          variable "reviewed_subnet_routes" {
            description = "Stable node ID to complete approved CIDR set. Empty means no changes. Default routes are deliberately excluded."
            type        = map(set(string))
            default     = {}
            validation {
              condition = alltrue(flatten([
                for id, routes in var.reviewed_subnet_routes : [
                  can(regex("^[A-Za-z0-9]+$", id)),
                  alltrue([for route in routes : can(cidrhost(route, 0)) && !can(regex("/0$", route))])
                ]
              ]))
              error_message = "Use stable node IDs and valid subnet CIDRs; this pack does not approve exit-node default routes."
            }
          }
          
          resource "tailscale_device_subnet_routes" "reviewed" {
            for_each  = var.reviewed_subnet_routes
            device_id = each.key
            routes    = each.value
            lifecycle {
              prevent_destroy = true
              precondition {
                condition     = var.hth_profile_level >= 2
                error_message = "Route management requires L2 and an independently verified recovery path."
              }
            }
          }
  api:
    lang: "bash"
    filename: "hth-tailscale-3.03-inventory-route-approvals.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-3.03-inventory-route-approvals.sh"
    excerpts:
      inventory-route-approvals:
        content: |2
          hth_api_init 2
          hth_get "/api/v2/tailnet/${HTH_TAILNET}/devices?fields=all" "$HTH_TEMP/devices.json"
          jq -e '(.devices | type == "array") and (.devices | length <= 1000) and
            all(.devices[]; ((.nodeId // .id) | type == "string" and test("^[A-Za-z0-9]{1,128}$"))) and
            (([.devices[] | .nodeId // .id] | unique | length) == (.devices | length))' "$HTH_TEMP/devices.json" >/dev/null 2>&1 || hth_unknown 'invalid, duplicate or excessive device inventory'
          jq -r '.devices[] | .nodeId // .id' "$HTH_TEMP/devices.json" > "$HTH_TEMP/ids"
          : > "$HTH_TEMP/records"
          while IFS= read -r id; do
            hth_get "/api/v2/device/${id}/routes" "$HTH_TEMP/routes.json"
            jq -e '(.advertisedRoutes | type == "array") and (.enabledRoutes | type == "array") and
              all(.advertisedRoutes[], .enabledRoutes[]; type == "string")' "$HTH_TEMP/routes.json" >/dev/null 2>&1 || hth_unknown 'invalid route response'
            jq -c --arg id "$id" '{deviceId:$id, advertisedRoutes, enabledRoutes}' "$HTH_TEMP/routes.json" >> "$HTH_TEMP/records"
          done < "$HTH_TEMP/ids"
          jq -s '{routes:.}' "$HTH_TEMP/records" > "$HTH_TEMP/report.json"
          hth_save "$HTH_TEMP/report.json"
          printf 'COLLECTED: advertised and enabled routes for the device snapshot; compare default routes and autoApprovers separately.\n'
  cli:
    lang: "bash"
    filename: "hth-tailscale-3.03-inspect-local-service-publication.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/cli/hth-tailscale-3.03-inspect-local-service-publication.sh"
    excerpts:
      inspect-local-service-publication:
        content: |2
          hth_init 2
          hth_cli serve status --json
          jq -e 'type == "object"' "$HTH_TEMP/cli" >/dev/null 2>&1 || hth_unknown 'invalid Serve configuration response'
          hth_save "$HTH_TEMP/cli"
          printf 'COLLECTED: local Serve/Service-host configuration only; reconcile central approvals, grants and other hosts separately.\n'

"4.1":
  api:
    lang: "bash"
    filename: "hth-tailscale-4.01-inventory-external-devices.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-4.01-inventory-external-devices.sh"
    excerpts:
      inventory-external-devices:
        content: |2
          hth_api_init 2
          hth_get "/api/v2/tailnet/${HTH_TAILNET}/devices?fields=all" "$HTH_TEMP/devices.json"
          jq -e '(.devices | type == "array") and all(.devices[];
            (.id | type == "string" and length > 0) and (.isExternal | type == "boolean")) and
            (([.devices[].id] | unique | length) == (.devices | length))' "$HTH_TEMP/devices.json" >/dev/null 2>&1 || hth_unknown 'external-device state missing or invalid'
          jq '{externalDevices:[.devices[] | select(.isExternal)],
            coverage:"inbound external nodes only; review outbound recipients and invites in console"}' "$HTH_TEMP/devices.json" > "$HTH_TEMP/report.json"
          hth_save "$HTH_TEMP/report.json"
          printf 'COLLECTED: inbound external devices; this does not prove that outbound sharing is disabled.\n'

"4.2":
  cli:
    lang: "bash"
    filename: "hth-tailscale-4.02-inspect-funnel.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/cli/hth-tailscale-4.02-inspect-funnel.sh"
    excerpts:
      inspect-funnel:
        content: |2
          hth_init 1
          hth_cli funnel status --json
          jq -e 'type == "object"' "$HTH_TEMP/cli" >/dev/null 2>&1 || hth_unknown 'invalid Funnel status response'
          hth_save "$HTH_TEMP/cli"
          printf 'COLLECTED: local Funnel status; inspect every managed node and review funnel nodeAttrs in the full policy.\n'

"4.3":
  cli:
    lang: "bash"
    filename: "hth-tailscale-4.03-inventory-client-version.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/cli/hth-tailscale-4.03-inventory-client-version.sh"
    excerpts:
      inventory-client-version:
        content: |2
          hth_init 1
          hth_cli version --json
          jq -e 'type == "object"' "$HTH_TEMP/cli" >/dev/null 2>&1 || hth_unknown 'invalid version response'
          hth_save "$HTH_TEMP/cli"
          printf 'COLLECTED: installed local client version; compare with approved releases and security bulletins.\n'

"4.4":
  config:
    lang: "json"
    filename: "hth-tailscale-4.04-disable-client-web-interface.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/config/hth-tailscale-4.04-disable-client-web-interface.jsonc"
    excerpts:
      disable-client-web-interface:
        content: |2
          {
            "nodeAttrs": [
              {"target": ["autogroup:member"], "attr": ["disable-web-client"]}
            ]
          }
  cli:
    lang: "bash"
    filename: "hth-tailscale-4.04-inspect-inbound-preferences.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/cli/hth-tailscale-4.04-inspect-inbound-preferences.sh"
    excerpts:
      inspect-inbound-preferences:
        content: |2
          hth_init 1
          hth_cli get --json shields-up
          jq -e '."shields-up" | type == "boolean"' "$HTH_TEMP/cli" >/dev/null 2>&1 || hth_unknown 'missing shields-up preference'
          jq '{shieldsUp:."shields-up"}' "$HTH_TEMP/cli" > "$HTH_TEMP/inbound"
          hth_cli get --json webclient
          jq -e '.webclient | type == "boolean"' "$HTH_TEMP/cli" >/dev/null 2>&1 || hth_unknown 'missing webclient preference'
          jq --slurpfile inbound "$HTH_TEMP/inbound" '$inbound[0] + {remoteWebClient:.webclient}' \
            "$HTH_TEMP/cli" > "$HTH_TEMP/evidence"
          hth_save "$HTH_TEMP/evidence"
          printf 'COLLECTED: active-tailnet preferences only; remoteWebClient=false does not disable the local web interface.\n'

"4.5":
  config:
    lang: "bash"
    filename: "hth-tailscale-4.05-prepare-managed-client-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/config/hth-tailscale-4.05-prepare-managed-client-policy.sh"
    excerpts:
      prepare-managed-client-policy:
        content: |2
          # On Apple platforms these AlwaysOn policies cannot coexist with an independently
          # managed VPN profile. Review deployment/recovery before merging the candidate:
          # https://tailscale.com/docs/features/client/ios-vpn-on-demand
          hth_policy_init 2 86 102
          [[ "${TAILSCALE_ALLOWED_TAILNET_ID:-}" =~ ^[To][A-Za-z0-9]{5,63}$ ]] ||
            hth_unknown 'set one reviewed tailnet/organization unique ID, not a domain or credential'
          jq -n --arg tailnet "required:${TAILSCALE_ALLOWED_TAILNET_ID}" \
            '{Tailnet:$tailnet,PostureChecking:"always"}' > "$HTH_TEMP/settings"
          if [[ "$TAILSCALE_PLATFORM" != linux ]]; then
            jq '. + {"AlwaysOn.Enabled":true,"AlwaysOn.OverrideWithReason":true,ReconnectAfter:"5m"}' \
              "$HTH_TEMP/settings" > "$HTH_TEMP/desktop"
            mv "$HTH_TEMP/desktop" "$HTH_TEMP/settings"
          fi
          hth_policy_emit "$HTH_TEMP/settings"
  cli:
    lang: "bash"
    filename: "hth-tailscale-4.05-review-managed-system-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/cli/hth-tailscale-4.05-review-managed-system-policy.sh"
    excerpts:
      review-managed-system-policy:
        content: |2
          hth_init 2
          hth_cli syspolicy list --json
          jq -e 'type == "object" and ((.Settings|type) == "object" or length == 0)' "$HTH_TEMP/cli" >/dev/null 2>&1 ||
            hth_unknown 'unrecognized system-policy snapshot'
          # AuthKey, raw errors, origins and unknown keys are deliberately not exported.
          jq '(.Settings // {}) | with_entries(select(.key == "EncryptState" or .key == "Tailnet" or
            .key == "PostureChecking" or .key == "AllowIncomingConnections" or .key == "AlwaysOn.Enabled" or
            .key == "AlwaysOn.OverrideWithReason" or .key == "ReconnectAfter" or .key == "UseTailscaleDNSSettings" or
            .key == "UseTailscaleSubnets" or .key == "InstallUpdates" or .key == "CheckUpdates" or
            .key == "SUAutomaticallyUpdate")) |
            map_values({value:.Value,hasError:(.Error != null)}) |
            {policies:.,assessment:"CONFIGURATION-ONLY"}' "$HTH_TEMP/cli" > "$HTH_TEMP/evidence"
          jq -e '.policies | all(.[]; (.value|type) == "boolean" or (.value|type) == "string" or .value == null)' \
            "$HTH_TEMP/evidence" >/dev/null 2>&1 || hth_unknown 'unrecognized system-policy value'
          hth_save "$HTH_TEMP/evidence"
          printf 'COLLECTED: selected system-policy values and error flags; not proof that node state is encrypted or all host controls are enforced.\n'

"4.6":
  config:
    lang: "json"
    filename: "hth-tailscale-4.06-constrain-taildrive-sharing.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/config/hth-tailscale-4.06-constrain-taildrive-sharing.jsonc"
    excerpts:
      constrain-taildrive-sharing:
        content: |2
          {
            "tagOwners": {"tag:fileserver": ["group:admins"]},
            "nodeAttrs": [
              {"target": ["tag:fileserver"], "attr": ["drive:share"]},
              {"target": ["group:admins"], "attr": ["drive:access"]}
            ],
            "grants": [
              {
                "src": ["group:admins"],
                "dst": ["tag:fileserver"],
                "app": {"tailscale.com/cap/drive": [{"shares": ["approved-docs"], "access": "ro"}]}
              }
            ]
          }
  cli:
    lang: "bash"
    filename: "hth-tailscale-4.06-list-local-taildrive-shares.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/cli/hth-tailscale-4.06-list-local-taildrive-shares.sh"
    excerpts:
      list-local-taildrive-shares:
        content: |2
          hth_init 2
          hth_cli drive list
          hth_save "$HTH_TEMP/cli"
          printf 'COLLECTED: private text listing of local Taildrive shares, not file contents or tailnet-wide permission proof.\n'

"4.7":
  terraform:
    lang: "hcl"
    filename: "hth-tailscale-4.07-manage-reviewed-dns.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/terraform/hth-tailscale-4.07-manage-reviewed-dns.tf"
    excerpts:
      manage-reviewed-dns:
        content: |2
          variable "reviewed_dns_configuration" {
            type = object({
              nameservers = list(object({
                address            = string
                use_with_exit_node = bool
              }))
              split_dns = map(list(object({
                address            = string
                use_with_exit_node = bool
              })))
              search_paths       = list(string)
              override_local_dns = bool
              magic_dns          = bool
            })
            default  = null
            nullable = true
            validation {
              condition = var.reviewed_dns_configuration == null ? true : alltrue([
                for server in concat(var.reviewed_dns_configuration.nameservers, flatten(values(var.reviewed_dns_configuration.split_dns))) :
                can(cidrhost("${server.address}/32", 0)) || can(cidrhost("${server.address}/128", 0))
              ])
              error_message = "Each reviewed resolver must be an IPv4 or IPv6 address."
            }
            validation {
              condition = var.reviewed_dns_configuration == null ? true : alltrue([
                for domain in concat(keys(var.reviewed_dns_configuration.split_dns), var.reviewed_dns_configuration.search_paths) :
                length(trimspace(domain)) > 0 && can(regex("^[A-Za-z0-9][A-Za-z0-9.-]*$", domain))
              ])
              error_message = "Supply explicit nonempty DNS domains without whitespace or URL syntax."
            }
          }
          
          variable "dns_clients_support_exit_node_resolvers" {
            type        = bool
            default     = false
            description = "Acknowledge verified Tailscale 1.88.1+ client support before using use_with_exit_node. This is not an API check."
          }
          
          resource "tailscale_dns_configuration" "reviewed" {
            for_each = var.reviewed_dns_configuration == null ? {} : { dns = var.reviewed_dns_configuration }
          
            magic_dns          = each.value.magic_dns
            override_local_dns = each.value.override_local_dns
            search_paths       = each.value.search_paths
            dynamic "nameservers" {
              for_each = each.value.nameservers
              content {
                address            = nameservers.value.address
                use_with_exit_node = nameservers.value.use_with_exit_node
              }
            }
            dynamic "split_dns" {
              for_each = each.value.split_dns
              content {
                domain = split_dns.key
                dynamic "nameservers" {
                  for_each = split_dns.value
                  content {
                    address            = nameservers.value.address
                    use_with_exit_node = nameservers.value.use_with_exit_node
                  }
                }
              }
            }
          
            lifecycle {
              prevent_destroy = true
              precondition {
                condition     = var.hth_profile_level >= 2
                error_message = "Reviewed complete DNS management requires profile L2+."
              }
              precondition {
                condition = var.dns_clients_support_exit_node_resolvers || alltrue([
                  for server in concat(each.value.nameservers, flatten(values(each.value.split_dns))) : !server.use_with_exit_node
                ])
                error_message = "Verify client support before configuring exit-node DNS resolvers."
              }
            }
          }
  api:
    lang: "bash"
    filename: "hth-tailscale-4.07-review-dns-configuration.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-4.07-review-dns-configuration.sh"
    excerpts:
      review-dns-configuration:
        content: |2
          hth_api_init 2
          for setting in nameservers preferences searchpaths split-dns; do
            hth_get "/api/v2/tailnet/${HTH_TAILNET}/dns/${setting}" "$HTH_TEMP/$setting"
          done
          jq -e '.dns | type == "array" and all(.[]; type == "string")' "$HTH_TEMP/nameservers" >/dev/null 2>&1 || hth_unknown 'invalid nameserver response'
          jq -e '.magicDNS | type == "boolean"' "$HTH_TEMP/preferences" >/dev/null 2>&1 || hth_unknown 'missing MagicDNS preference'
          jq -e '.searchPaths | type == "array" and all(.[]; type == "string")' "$HTH_TEMP/searchpaths" >/dev/null 2>&1 || hth_unknown 'invalid search-domain response'
          jq -e 'all(.[]; type == "array" and all(.[]; type == "string"))' "$HTH_TEMP/split-dns" >/dev/null 2>&1 || hth_unknown 'invalid split-DNS response'
          jq -n --slurpfile servers "$HTH_TEMP/nameservers" --slurpfile preferences "$HTH_TEMP/preferences" \
            --slurpfile searches "$HTH_TEMP/searchpaths" --slurpfile split "$HTH_TEMP/split-dns" \
            '{nameservers:$servers[0].dns,magicDNS:$preferences[0].magicDNS,searchPaths:$searches[0].searchPaths,
              splitDNS:$split[0],coverage:"legacy read endpoints; review Override DNS, exit-node DNS and HTTPS/certificate settings separately"}' \
            > "$HTH_TEMP/evidence"
          hth_save "$HTH_TEMP/evidence"
          printf 'COLLECTED: DNS metadata snapshot; verify actual client resolution, override behavior and certificate disclosure separately.\n'
  cli:
    lang: "bash"
    filename: "hth-tailscale-4.07-inspect-local-dns.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/cli/hth-tailscale-4.07-inspect-local-dns.sh"
    excerpts:
      inspect-local-dns:
        content: |2
          hth_init 2
          hth_cli dns status --json
          jq -e 'type == "object"' "$HTH_TEMP/cli" >/dev/null 2>&1 || hth_unknown 'invalid local DNS status response'
          hth_save "$HTH_TEMP/cli"
          printf 'COLLECTED: local DNS configuration; verify real name resolution and certificate disclosure separately.\n'

"5.1":
  api:
    lang: "bash"
    filename: "hth-tailscale-5.01-collect-configuration-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-5.01-collect-configuration-audit.sh"
    excerpts:
      collect-configuration-audit:
        content: |2
          hth_api_init 1
          hth_window
          hth_get "/api/v2/tailnet/${HTH_TAILNET}/logging/configuration?${HTH_WINDOW}" "$HTH_TEMP/logs.json"
          jq -e '(.logs | type == "array") and (.version | type == "string") and
            all(.logs[]; (.eventTime | type == "string") and (.action | type == "string") and
              (.actor | type == "object") and (.target | type == "object"))' "$HTH_TEMP/logs.json" >/dev/null 2>&1 || hth_unknown 'invalid audit-log envelope or event'
          # The vendor documents no pagination: all events in the time window are returned.
          # A 20 MiB transport cap fails closed; shorten the window if it is exceeded.
          hth_save "$HTH_TEMP/logs.json"
          printf 'COLLECTED: %s configuration events for the requested window; account for delivery delay.\n' "$(jq '.logs | length' "$HTH_TEMP/logs.json")"
  siem:
    lang: "spl"
    filename: "hth-tailscale-5.01-review-privileged-changes.spl"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/siem/hth-tailscale-5.01-review-privileged-changes.spl"
    excerpts:
      review-privileged-changes:
        content: |2
          index=tailscale sourcetype=tailscale:configuration
          | spath
          | rename actor.id AS actorId target.type AS targetType target.id AS targetId target.property AS property
          | where type="CONFIG" AND in(targetType, "TAILNET", "USER", "API_KEY", "NODE")
          | table eventTime eventGroupID action actorId targetType targetId property origin
          | sort - eventTime

"5.2":
  terraform:
    lang: "hcl"
    filename: "hth-tailscale-5.02-stream-logs-to-reviewed-s3.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/terraform/hth-tailscale-5.02-stream-logs-to-reviewed-s3.tf"
    excerpts:
      stream-logs-to-s3:
        content: |2
          variable "reviewed_log_streams" {
            description = "configuration/network keys mapped to an existing approved S3 destination. Empty means no stream changes."
            type = map(object({
              bucket      = string
              region      = string
              role_arn    = string
              external_id = string
            }))
            default = {}
            validation {
              condition = alltrue([
                for kind, destination in var.reviewed_log_streams :
                contains(["configuration", "network"], kind) &&
                length(destination.bucket) > 2 && length(destination.region) > 0 &&
                can(regex("^arn:aws:iam::[0-9]{12}:role/.+$", destination.role_arn)) &&
                length(destination.external_id) > 0
              ])
              error_message = "Use configuration/network and an approved bucket, region, role ARN and external ID."
            }
          }
          
          resource "tailscale_logstream_configuration" "reviewed" {
            for_each               = var.reviewed_log_streams
            log_type               = each.key
            destination_type       = "s3"
            s3_authentication_type = "rolearn"
            s3_bucket              = each.value.bucket
            s3_region              = each.value.region
            s3_role_arn            = each.value.role_arn
            s3_external_id         = each.value.external_id
            lifecycle {
              prevent_destroy = true
              precondition {
                condition     = var.hth_profile_level >= 2
                error_message = "Log streaming requires L2, plan entitlement and destination/privacy review."
              }
            }
          }
  api:
    lang: "bash"
    filename: "hth-tailscale-5.02-read-log-stream-status.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-5.02-read-log-stream-status.sh"
    excerpts:
      log-stream-status:
        content: |2
          hth_api_init 2
          for kind in configuration network; do
            hth_get "/api/v2/tailnet/${HTH_TAILNET}/logging/${kind}/status" "$HTH_TEMP/${kind}.json"
          done
          jq -n --slurpfile configuration "$HTH_TEMP/configuration.json" --slurpfile network "$HTH_TEMP/network.json" \
            '{configuration:$configuration[0], network:$network[0]}' > "$HTH_TEMP/report.json"
          hth_save "$HTH_TEMP/report.json"
          printf 'COLLECTED: stream status responses; verify fresh events at the actual destination before claiming delivery.\n'

