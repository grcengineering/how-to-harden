            lifecycle {
              prevent_destroy = true
            }
          }
  config:
    lang: "bash"
    filename: "hth-tailscale-2.01-build-grants-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/config/hth-tailscale-2.01-build-grants-policy.sh"
    excerpts:
      build-grants-policy:
        content: |2
          hth_init 1
          [[ -f "${TAILSCALE_POLICY_INPUT:-}" ]] || hth_unknown 'provide TAILSCALE_POLICY_INPUT with reviewed admins and staff'
          python3 - "$TAILSCALE_POLICY_INPUT" "$HTH_TEMP/candidate.json" <<'PY'
          import json
          import pathlib
          import re
          import sys
          
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError()
                  result[key] = value
              return result
          
          try:
              raw = pathlib.Path(sys.argv[1]).read_bytes()
              if len(raw) > 65536:
                  raise ValueError()
              approved = json.loads(raw, object_pairs_hook=unique_object)
              if not isinstance(approved, dict) or set(approved) != {'admins', 'staff'}:
                  raise ValueError()
              for names in approved.values():
                  if not isinstance(names, list) or not 1 <= len(names) <= 100:
                      raise ValueError()
                  if not all(isinstance(x, str) and x == x.lower() and len(x) <= 254 and
                             re.fullmatch(r'[a-z0-9_.+\-]+@[a-z0-9.\-]+\.[a-z]{2,63}', x) for x in names):
                      raise ValueError()
                  if len(set(names)) != len(names):
                      raise ValueError()
              if set(approved['admins']) & set(approved['staff']):
                  raise ValueError()
          except (OSError, ValueError, TypeError):
              sys.exit('UNKNOWN: require distinct, nonempty lowercase email arrays named admins and staff')
          
          policy = {
              'groups': {'group:admins': approved['admins'], 'group:staff': approved['staff']},
              'tagOwners': {tag: ['group:admins'] for tag in ('tag:prod', 'tag:build', 'tag:ci')},
              # Explicitly empty legacy ACLs prevent an omitted-section allow-all fallback.
              'acls': [],
              'grants': [
                  {'src':['group:admins'], 'dst':['tag:prod'], 'ip':['tcp:22', 'tcp:443']},
                  {'src':['group:staff'], 'dst':['tag:prod'], 'ip':['tcp:443']},
                  {'src':['tag:ci'], 'dst':['tag:build'], 'ip':['tcp:443']},
              ],
              'ssh': [],
              'tests': [
                  {'src':approved['admins'][0], 'proto':'tcp', 'accept':['tag:prod:22', 'tag:prod:443'], 'deny':['tag:prod:5432']},
                  {'src':approved['staff'][0], 'proto':'tcp', 'accept':['tag:prod:443'], 'deny':['tag:prod:22', 'tag:build:443']},
                  {'src':'tag:ci', 'proto':'tcp', 'accept':['tag:build:443'], 'deny':['tag:prod:22', 'tag:prod:443']},
              ],
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(policy, indent=2)+'\n')
          PY
          hth_save "$HTH_TEMP/candidate.json"
          printf 'GENERATED-CANDIDATE: adapt the complete policy, retain required settings, and run server validation before deployment.\n'
  api:
    lang: "bash"
    filename: "hth-tailscale-2.01-snapshot-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-2.01-snapshot-policy.sh"
    excerpts:
      snapshot-policy:
        content: |2
          hth_api_init 1
          hth_request GET "/api/v2/tailnet/${HTH_TAILNET}/acl" "$HTH_TEMP/policy.hujson" application/hujson
          # Preserve comments, trailing commas, and the version needed for a future
          # conditional write. Collection is not a syntax or authorization proof.
          etag="$(awk 'tolower($1)=="etag:" {sub(/^[^:]*:[ \t]*/, ""); sub(/\r$/, ""); value=$0} END {print value}' "$HTH_TEMP/headers")"
          [[ -n "$etag" && -s "$HTH_TEMP/policy.hujson" ]] || hth_unknown 'missing policy or ETag'
          jq -n --arg etag "$etag" --rawfile hujson "$HTH_TEMP/policy.hujson" \
            '{etag:$etag, hujson:$hujson}' > "$HTH_TEMP/snapshot.json"
          hth_save "$HTH_TEMP/snapshot.json"
          printf 'COLLECTED: raw policy and ETag; review all existing allows before preparing a replacement.\n'

"2.2":
  api:
    lang: "bash"
    filename: "hth-tailscale-2.02-validate-candidate-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tailscale/api/hth-tailscale-2.02-validate-candidate-policy.sh"
    excerpts:
      validate-candidate:
        content: |2
          hth_api_init 1
          [[ -n "${TAILSCALE_POLICY_FILE:-}" && -f "$TAILSCALE_POLICY_FILE" ]] || hth_unknown 'set TAILSCALE_POLICY_FILE to the complete reviewed candidate'
          [[ $(wc -c < "$TAILSCALE_POLICY_FILE") -le 2097152 && -s "$TAILSCALE_POLICY_FILE" ]] || hth_unknown 'candidate must be nonempty and at most 2 MiB'
          # Copy once to avoid validating a moving local input. No credential is placed in it.
          cp -- "$TAILSCALE_POLICY_FILE" "$HTH_TEMP/candidate.hujson"
          hth_request POST "/api/v2/tailnet/${HTH_TAILNET}/acl/validate" "$HTH_TEMP/result" application/json "$HTH_TEMP/candidate.hujson"
          # The documented successful validation response is HTTP 200 with an EMPTY body.
          # Some failures use HTTP 200 with error content; never turn that into success.
          [[ ! -s "$HTH_TEMP/result" ]] || hth_unknown 'candidate validation returned content; review through the policy editor, no pass claimed'
          printf '{"candidateValidated":true,"applied":false}\n' > "$HTH_TEMP/report.json"
          hth_save "$HTH_TEMP/report.json"
          printf 'VALIDATED-CANDIDATE: server accepted candidate tests; policy was not applied.\n'

