  api:
    lang: "bash"
    filename: "hth-sendgrid-1.04-ip-access-management.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/sendgrid/api/hth-sendgrid-1.04-ip-access-management.sh"
    excerpts:
      api-audit-allowlist:
        content: |2
          
          # --- Audit: which IPs are currently allowed to access the account? ---
          # Review every entry against your inventory of offices, VPN egress, and
          # CI/CD ranges; anything unrecognized is either stale or an implant.
          echo "=== Current IP allowlist ==="
          curl -s -X GET "https://api.sendgrid.com/v3/access_settings/whitelist" \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}" | \
            jq '.result[] | {id, ip, created_at, updated_at}'
      api-add-allowed-ips:
        content: |2
          
          # --- Enforce: add approved networks to the allowlist ---
          # Supports single IPs and CIDR blocks. Add YOUR CURRENT IP and every
          # integration's egress range BEFORE enabling enforcement, or you lock
          # yourself and your senders out the moment it takes effect.
          curl -s -X POST "https://api.sendgrid.com/v3/access_settings/whitelist" \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{
              "ips": [
                {"ip": "203.0.113.10"},
                {"ip": "198.51.100.0/24"}
              ]
            }'

"2.3":
  api:
    lang: "bash"
    filename: "hth-sendgrid-2.03-least-privilege-api-keys.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/sendgrid/api/hth-sendgrid-2.03-least-privilege-api-keys.sh"
    excerpts:
      api-audit-key-scopes:
        content: |2
          
          # --- Audit: enumerate every API key and its granted scopes ---
          # The list endpoint returns id + name; each key must be fetched individually
          # to see its scopes. Flag keys with broad grants for replacement.
          echo "=== API keys and their scopes ==="
          for KEY_ID in $(curl -s -X GET "https://api.sendgrid.com/v3/api_keys" \
              --header "Authorization: Bearer ${SENDGRID_API_KEY}" | \
              jq -r '.result[].api_key_id'); do
            curl -s -X GET "https://api.sendgrid.com/v3/api_keys/${KEY_ID}" \
              --header "Authorization: Bearer ${SENDGRID_API_KEY}" | \
              jq '{api_key_id, name, scope_count: (.scopes | length), scopes}'
          done
      api-create-scoped-key:
        content: |2
          
          # --- Enforce: create a purpose-scoped key for one integration ---
          # This example issues a transactional-send-only key. The scopes array is the
          # entire grant: nothing outside it is reachable with this key.
          curl -s -X POST "https://api.sendgrid.com/v3/api_keys" \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"name": "transactional-sender", "scopes": ["mail.send"]}'
          
          # --- Retire: delete an over-privileged or unused key ---
          # Cut the owning integration over to its scoped replacement first.
          curl -s -X DELETE "https://api.sendgrid.com/v3/api_keys/${SENDGRID_OLD_KEY_ID:?Set SENDGRID_OLD_KEY_ID}" \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}"

"3.2":
  api:
    lang: "bash"
    filename: "hth-sendgrid-3.02-teammate-permissions-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/sendgrid/api/hth-sendgrid-3.02-teammate-permissions-audit.sh"
    excerpts:
      api-audit-teammates:
        content: |2
          
          # --- Audit: list every teammate with their access level ---
          # (SendGrid's reference shows the array as "results" in the example response
          # and "result" in the schema — accept either.)
          echo "=== All teammates ==="
          curl -s -G -X GET "https://api.sendgrid.com/v3/teammates?limit=500&offset=0" \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}" | \
            jq '(.results // .result)[] | {username, email, user_type, is_admin}'
          
          # --- Flag: administrators (full-account credentials — should be 2-3 people) ---
          echo ""
          echo "=== Teammates holding the Administrator grant (review each) ==="
          curl -s -G -X GET "https://api.sendgrid.com/v3/teammates?limit=500&offset=0" \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}" | \
            jq '[(.results // .result)[] | select(.is_admin == true) | {username, email, user_type}]
                | {admin_count: length, admins: .}'

