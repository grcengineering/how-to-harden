    excerpts:
      audit-two-factor:
        content: |2
          set -euo pipefail
          umask 077
          
          token="${MERAKI_DASHBOARD_API_KEY:?Set MERAKI_DASHBOARD_API_KEY using your secret manager}"
          [[ "$token" =~ ^[A-Za-z0-9._~+/=-]+$ ]] || { printf '%s\n' 'Invalid bearer token format.' >&2; exit 2; }
          org="${MERAKI_ORG_ID:?Set MERAKI_ORG_ID}"
          [[ "$org" =~ ^[0-9]+$ ]] || { printf '%s\n' 'MERAKI_ORG_ID must be numeric.' >&2; exit 2; }
          printf 'header = "Authorization: Bearer %s"\n' "$token" |
            curl -q --config - --proto '=https' --fail --silent --show-error --connect-timeout 10 --max-time 45 \
              "https://api.meraki.com/api/v1/organizations/$org/loginSecurity" |
            jq -e 'if (.enforceTwoFactorAuth | type) == "boolean" then {enforceTwoFactorAuth} else error("Missing expected Dashboard policy field") end'
  sdk:
    lang: "python"
    filename: "hth-cisco-meraki-1.01-audit-two-factor.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cisco-meraki/sdk/hth-cisco-meraki-1.01-audit-two-factor.py"
    excerpts:
      audit-two-factor-sdk:
        content: |2
          import json
          import os
          import re
          
          import meraki
          
          
          def main():
              """Report the configured organization policy, not individual enrollment."""
              org = os.environ.get("MERAKI_ORG_ID", "")
              if not re.fullmatch(r"[0-9]+", org):
                  raise SystemExit("MERAKI_ORG_ID must be numeric.")
              token = os.environ.get("MERAKI_DASHBOARD_API_KEY")
              if not token:
                  raise SystemExit("Provide MERAKI_DASHBOARD_API_KEY via a secret manager.")
              dashboard = meraki.DashboardAPI(
                  api_key=token,
                  output_log=False,
                  print_console=False,
                  maximum_retries=0,
              )
              policy = dashboard.organizations.getOrganizationLoginSecurity(org)
              enabled = policy.get("enforceTwoFactorAuth") if isinstance(policy, dict) else None
              if not isinstance(enabled, bool):
                  raise SystemExit("Missing expected Dashboard policy field.")
              print(json.dumps({"enforceTwoFactorAuth": enabled}))
          
          
          if __name__ == "__main__":
              main()

