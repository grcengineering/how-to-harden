"1.2":
  api:
    lang: "bash"
    filename: "hth-dropbox-1.02-audit-team-folder-access.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/dropbox/api/hth-dropbox-1.02-audit-team-folder-access.sh"
    excerpts:
      team-folder-access-audit:
        content: |2
          rc=0
          rpc_strict "team/get_info" 'null'
          top_level=$(printf '%s' "${RPC_BODY}" | jq -r '.policies.top_level_content_policy[".tag"] // "(absent)"')
          if [ "${top_level}" = "admin_only" ]; then
            echo "ok  top-level team folders: admin_only"
          else
            echo "FINDING: top_level_content_policy = ${top_level} - members, not just admins, can edit team folders at the top level (want admin_only)"
            rc=1
          fi
          
          # Enumerate top-level team folders (namespaces/list, then /continue).
          route="team/namespaces/list"; body='{}'; pages=0
          while :; do
            rpc_strict "${route}" "${body}"
            printf '%s' "${RPC_BODY}" | jq -c '.namespaces[]? | select(.namespace_type[".tag"] == "team_folder")' >> "${NS_FILE}"
            more=$(printf '%s' "${RPC_BODY}" | jq -r '.has_more // false')
            cursor=$(printf '%s' "${RPC_BODY}" | jq -r '.cursor // ""')
            pages=$((pages + 1))
            [ "${more}" = "true" ] || break
            # TRAP 4: a folder list that stops early would skip folders and still pass.
            [ -n "${cursor}" ] || { echo "PRECONDITION: ${route} answered has_more=true with no cursor after ${pages} page(s) - the team folder list cannot be read to the end, so no result is claimed" >&2; exit 2; }
            [ "${pages}" -lt 500 ] || { echo "PRECONDITION: ${route} stopped after 500 pages with has_more still true - the team folder list was not read to the end, so no result is claimed" >&2; exit 2; }
            route="team/namespaces/list/continue"; body=$(jq -nc --arg c "${cursor}" '{cursor: $c}')
          done
          jq -rs 'unique_by(.namespace_id | tostring) | .[] | .namespace_id | tostring' "${NS_FILE}" > "${IDS_FILE}"   # TRAP 1
          folders=$(wc -l < "${IDS_FILE}" | tr -d ' ')
          if [ "${folders}" -eq 0 ]; then
            echo "PRECONDITION: no team_folder namespaces returned - there are no team folders to audit, so no folder result is claimed" >&2
            exit 2
          fi
          echo "team folders: ${folders}"
          
          unreadable=0
          while IFS= read -r ns; do
            name=$(jq -rs --arg id "${ns}" '[.[] | select((.namespace_id | tostring) == $id)][0].name' "${NS_FILE}")
            : > "${MEM_FILE}"
            route="sharing/list_folder_members"
            body=$(jq -nc --arg id "${ns}" '{shared_folder_id: $id, limit: 1000}')
            ok=1; pages=0
            while :; do
              rpc "${route}" "${body}" -H "Dropbox-API-Select-Admin: ${DROPBOX_ADMIN_MEMBER_ID}"
              if [ "${RPC_CODE}" != "200" ]; then
                echo "  UNREADABLE  ${name}  HTTP ${RPC_CODE} $(printf '%s' "${RPC_BODY}" | jq -r '.error_summary // ""' 2>/dev/null || true)"
                ok=0; break
              fi
              printf '%s' "${RPC_BODY}" | jq -c '{users: (.users // []), groups: (.groups // []), invitees: (.invitees // [])}' >> "${MEM_FILE}"
              cursor=$(printf '%s' "${RPC_BODY}" | jq -r '.cursor // ""')
              pages=$((pages + 1))
              # This route has no has_more: a cursor is present only while members remain.
              [ -n "${cursor}" ] || break
              [ "${pages}" -lt 500 ] || { echo "PRECONDITION: ${route} stopped after 500 pages with members still listed on team folder '${name}' - its membership was not read to the end, so no result is claimed" >&2; exit 2; }
              route="sharing/list_folder_members/continue"; body=$(jq -nc --arg c "${cursor}" '{cursor: $c}')
            done
            if [ "${ok}" -eq 0 ]; then unreadable=$((unreadable + 1)); continue; fi
          
            summary=$(jq -s '
              { users: [ .[].users[] ], groups: [ .[].groups[] ], invitees: [ .[].invitees[] ] }
              | { u: (.users | length), g: (.groups | length), i: (.invitees | length),
                  ext: [ .users[] | select(.user.same_team == false) | .user.email ],
                  sys: ([ .groups[] | select(.group.group_management_type[".tag"] == "system_managed") ] | length),
                  edit: ([ (.users + .groups + .invitees)[] | select(.access_type[".tag"] == "editor" or .access_type[".tag"] == "owner") ] | length) }' "${MEM_FILE}")
            line=$(printf '%s' "${summary}" | jq -r '"users=\(.u) groups=\(.g) (system-managed \(.sys)) invitees=\(.i) editors/owners=\(.edit) external=\(.ext | length)"')
            echo "  ${name}  ${line}"
            ext=$(printf '%s' "${summary}" | jq '.ext | length')
            inv=$(printf '%s' "${summary}" | jq '.i')
            if [ "${ext}" -gt 0 ]; then
              echo "  FINDING: ${ext} member(s) from outside the team on team folder '${name}'"
              [ "${SHOW_IDS}" = "1" ] && printf '%s' "${summary}" | jq -r '.ext[] | "    - \(.)"'
              rc=1
            fi
            if [ "${inv}" -gt 0 ]; then
              echo "  FINDING: ${inv} pending invitation(s) on team folder '${name}' - confirm or revoke them"
              rc=1
            fi
          done < "${IDS_FILE}"
          
          if [ "${unreadable}" -gt 0 ]; then
            echo "INCOMPLETE: ${unreadable} of ${folders} team folder(s) could not be read with this admin id (TRAP 2)"
            [ "${rc}" -eq 1 ] && exit 1
            exit 2
          fi
          [ "${rc}" -eq 0 ] && echo "COMPLIANT: top-level folders are admin-only and no team folder has outside members or pending invitations."
          exit "${rc}"

"1.3":
  api:
    lang: "bash"
    filename: "hth-dropbox-1.03-audit-device-sessions.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/dropbox/api/hth-dropbox-1.03-audit-device-sessions.sh"
    excerpts:
      device-session-audit:
        content: |2
          # TRAP 1: same route, cursor in the body, until has_more is false.
          body='{"include_desktop_clients": true, "include_mobile_clients": true, "include_web_sessions": true}'
          pages=0
          while :; do
            rpc_strict "team/devices/list_members_devices" "${body}"
            printf '%s' "${RPC_BODY}" | jq -c '.devices[]?' >> "${DEV_FILE}"
            more=$(printf '%s' "${RPC_BODY}" | jq -r '.has_more // false')
            cursor=$(printf '%s' "${RPC_BODY}" | jq -r '.cursor // ""')
            pages=$((pages + 1))
            [ "${more}" = "true" ] || break
            # TRAP 3: a device list that stops early would judge part of the team.
            [ -n "${cursor}" ] || { echo "PRECONDITION: team/devices/list_members_devices answered has_more=true with no cursor after ${pages} page(s) - the device list cannot be read to the end, so no result is claimed" >&2; exit 2; }
            [ "${pages}" -lt 500 ] || { echo "PRECONDITION: team/devices/list_members_devices stopped after 500 pages with has_more still true - the device list was not read to the end, so no result is claimed" >&2; exit 2; }
            body=$(jq -nc --arg c "${cursor}" \
              '{cursor: $c, include_desktop_clients: true, include_mobile_clients: true, include_web_sessions: true}')
          done
          
          members=$(jq -s 'length' "${DEV_FILE}")
          [ "${members}" -gt 0 ] || { echo "PRECONDITION: list_members_devices returned no members - nothing was audited" >&2; exit 2; }
          jq -rs '"members read: \(length) | desktop clients: \([.[] | (.desktop_clients // [])[]] | length) | mobile clients: \([.[] | (.mobile_clients // [])[]] | length) | web sessions: \([.[] | (.web_sessions // [])[]] | length)"' "${DEV_FILE}"
          
          rc=0
          over=$(jq -rs --argjson d "${MAX_DESKTOP}" --argjson m "${MAX_MOBILE}" '
            .[] | select(((.desktop_clients // []) | length) > $d or ((.mobile_clients // []) | length) > $m)
            | "  \(.team_member_id)  desktop=\((.desktop_clients // []) | length) mobile=\((.mobile_clients // []) | length)"' "${DEV_FILE}")
          if [ -n "${over}" ]; then
            echo "FINDING: members above the device cap (desktop ${MAX_DESKTOP}, mobile ${MAX_MOBILE}):"
            printf '%s\n' "${over}"
            rc=1
          fi
          
          # Dropbox datetimes are ISO 8601 UTC (YYYY-MM-DDTHH:MM:SSZ), which fromdateiso8601 parses.
          old_web=$(jq -s --argjson days "${MAX_WEB_DAYS}" '
            [ .[] | (.web_sessions // [])[] | select(.created != null)
              | select((now - (.created | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) / 86400 > $days) ] | length' "${DEV_FILE}")
          if [ "${old_web}" -gt 0 ]; then
            echo "FINDING: ${old_web} web session(s) were created more than ${MAX_WEB_DAYS} days ago - longer than the fixed-session window you intend"
            rc=1
          fi
          
          no_wipe=$(jq -s '[ .[] | (.desktop_clients // [])[] | select(.is_delete_on_unlink_supported == false) ] | length' "${DEV_FILE}")
          [ "${no_wipe}" -eq 0 ] || echo "NOTE: ${no_wipe} desktop client(s) cannot be remote-wiped (is_delete_on_unlink_supported = false)"
          
          [ "${rc}" -eq 0 ] && echo "COMPLIANT: every member is within the device caps and no web session outlives ${MAX_WEB_DAYS} days."
          exit "${rc}"

"1.4":
  api:
    lang: "bash"
    filename: "hth-dropbox-1.04-audit-admin-roles.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/dropbox/api/hth-dropbox-1.04-audit-admin-roles.sh"
    excerpts:
      admin-role-audit:
        content: |2
          rpc_strict "team/members/get_available_team_member_roles" 'null'
          ROLES=$(printf '%s' "${RPC_BODY}" | jq -c '.roles // []')
          [ "$(printf '%s' "${ROLES}" | jq 'length')" -gt 0 ] || { echo "PRECONDITION: no assignable roles returned" >&2; exit 2; }
          
          # TRAP 2: identify the Team admin role by name unless its id is pinned.
          TEAM_ROLE_ID="${HTH_DROPBOX_TEAM_ADMIN_ROLE_ID:-}"
          if [ -z "${TEAM_ROLE_ID}" ]; then
            TEAM_ROLE_ID=$(printf '%s' "${ROLES}" | jq -r \
              '[.[] | select(.name | ascii_downcase | test("^team( admin)?$"))][0].role_id // ""')
          fi
          if [ -z "${TEAM_ROLE_ID}" ]; then
            echo "PRECONDITION: no available role is named like 'Team admin'. Roles returned:" >&2
            printf '%s' "${ROLES}" | jq -r '.[] | "  \(.role_id)  \(.name)"' >&2
            echo "  Set HTH_DROPBOX_TEAM_ADMIN_ROLE_ID to the Team admin role_id and re-run." >&2
            exit 2
          fi
          
          # Page through every member (list_v2, then list/continue_v2 while has_more).
          route="team/members/list_v2"; body='{"limit": 1000, "include_removed": false}'; pages=0
          while :; do
            rpc_strict "${route}" "${body}"
            printf '%s' "${RPC_BODY}" | jq -c '.members[]?' >> "${MEMBERS_FILE}"
            more=$(printf '%s' "${RPC_BODY}" | jq -r '.has_more // false')
            cursor=$(printf '%s' "${RPC_BODY}" | jq -r '.cursor // ""')
            pages=$((pages + 1))
            [ "${more}" = "true" ] || break
            # TRAP 5: a member list that stops early counts admins over part of the team.
            [ -n "${cursor}" ] || { echo "PRECONDITION: ${route} answered has_more=true with no cursor after ${pages} page(s) - the member list cannot be read to the end, so no result is claimed" >&2; exit 2; }
            [ "${pages}" -lt 500 ] || { echo "PRECONDITION: ${route} stopped after 500 pages with has_more still true - the member list was not read to the end, so no result is claimed" >&2; exit 2; }
            route="team/members/list/continue_v2"
            body=$(jq -nc --arg c "${cursor}" '{cursor: $c}')
          done
          
          total=$(jq -s 'length' "${MEMBERS_FILE}")
          [ "${total}" -gt 0 ] || { echo "PRECONDITION: team/members/list_v2 returned no members - nothing was audited" >&2; exit 2; }
          echo "members read: ${total}"
          echo "holders per role:"
          jq -rs --argjson roles "${ROLES}" '
            . as $m | $roles[]
            | . as $r
            | "  \($r.name): \([ $m[] | select(any((.roles // [])[]; .role_id == $r.role_id)) ] | length)"
          ' "${MEMBERS_FILE}"
          
          admins=$(jq -s --arg id "${TEAM_ROLE_ID}" \
            '[ .[] | select(any((.roles // [])[]; .role_id == $id)) ] | length' "${MEMBERS_FILE}")
          with_role=$(jq -s '[ .[] | select((.roles // []) | length > 0) ] | length' "${MEMBERS_FILE}")
          echo "members with a non-empty roles list: ${with_role}"
          
          # TRAP 4: every team has at least one Team admin. Zero role holders, or zero
          # Team admins, means the roles were not returned or the pinned id is wrong.
          if [ "${with_role}" -eq 0 ]; then
            echo "PRECONDITION: no member carries a roles list (the field is optional in team/members/list_v2) - admin roles were not returned, so no admin count is claimed" >&2
            exit 2
          fi
          if [ "${admins}" -eq 0 ]; then
            echo "PRECONDITION: no member holds the Team admin role ${TEAM_ROLE_ID}, and every team has at least one - check HTH_DROPBOX_TEAM_ADMIN_ROLE_ID against the roles listed above; no admin count is claimed" >&2
            exit 2
          fi
          
          rc=0
          if [ "${admins}" -gt "${MAX_ADMINS}" ]; then
            echo "FINDING: ${admins} members hold the Team admin role (limit ${MAX_ADMINS}). Move each to the narrowest role that covers their duties:"
            jq -rs --arg id "${TEAM_ROLE_ID}" \
              '.[] | select(any((.roles // [])[]; .role_id == $id)) | "  \(.profile.team_member_id)  status=\(.profile.status[".tag"] // "?")"' "${MEMBERS_FILE}"
            rc=1
          elif [ "${admins}" -le 1 ]; then
            echo "NOTE: ${admins} Team admin(s). One admin is a continuity risk; keep a second, protected Team admin."
          fi
          [ "${rc}" -eq 0 ] && echo "COMPLIANT: ${admins} Team admin(s), within the limit of ${MAX_ADMINS}."
          exit "${rc}"

"2.1":
  api:
    lang: "bash"
    filename: "hth-dropbox-2.01-audit-sharing-policies.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/dropbox/api/hth-dropbox-2.01-audit-sharing-policies.sh"
    excerpts:
      sharing-policy-audit:
        content: |2
          rpc_strict "team/get_info" 'null'
          SHARING=$(printf '%s' "${RPC_BODY}" | jq -c '.policies.sharing // empty')
          [ -n "${SHARING}" ] || { echo "PRECONDITION: team/get_info returned no policies.sharing object" >&2; exit 2; }
          
          tag() { printf '%s' "${SHARING}" | jq -r --arg f "$1" '.[$f][".tag"] // "(absent)"'; }
          member_policy=$(tag shared_folder_member_policy)
          link_create=$(tag shared_link_create_policy)
          link_perms=$(tag shared_link_default_permissions_policy)
          expiry=$(tag default_link_expiration_days_policy)
          password=$(tag enforce_link_password_policy)
          blanket=$(tag shared_folder_link_restriction_policy)
          join_policy=$(tag shared_folder_join_policy)
          
          rc=0
          finding() { echo "FINDING: $*"; rc=1; }
          
          case "${member_policy}" in
            team|team_and_approved) echo "ok  Who can be added to files and folders: ${member_policy}" ;;
            *) finding "Who can be added to files and folders = ${member_policy} (want team or team_and_approved)" ;;
          esac
          case "${link_create}" in
            team_only|default_team_only|default_no_one) echo "ok  Who can access links by default: ${link_create}" ;;
            *) finding "Who can access links by default = ${link_create} (want team_only, default_team_only or default_no_one)" ;;
          esac
          # TRAP 1: the documented reading of the same field for the on/off toggle.
          case "${link_create}" in
            team_only) echo "info Sharing links to files and folders: reads as Off (team_only: every shared link is team-only, no per-link override)" ;;
            default_*) echo "info Sharing links to files and folders: reads as On (${link_create} is a default that members can override per link)" ;;
            *)         echo "info Sharing links to files and folders: not determinable from shared_link_create_policy = ${link_create}" ;;
          esac
          case "${link_perms}" in
            view) echo "ok  What permissions recipients have by default: view" ;;
            *) finding "What permissions recipients have by default = ${link_perms} (want view)" ;;
          esac
          case "${expiry}" in
            day_1) days=1 ;; day_3) days=3 ;; day_7) days=7 ;; day_30) days=30 ;;
            day_90) days=90 ;; day_180) days=180 ;; year_1) days=365 ;; *) days="" ;;
          esac
          if [ -n "${days}" ] && [ "${days}" -le "${MAX_DAYS}" ]; then
            echo "ok  Expiration for links: ${expiry} (limit ${MAX_DAYS} days)"
          else
            finding "Expiration for links = ${expiry} (want ${MAX_DAYS} days or less)"
          fi
          case "${password}" in
            required) echo "ok  Passwords for links: required" ;;
            *) finding "Passwords for links = ${password} (want required)" ;;
          esac
          case "${blanket}" in
            members) echo "ok  Universal link restriction for folders: members" ;;
            *) finding "Universal link restriction for folders = ${blanket} (want members)" ;;
          esac
          # TRAP 2: password and expiry are inert while default access is Anyone.
          if [ "${link_create}" = "default_public" ]; then
            echo "NOTE: default access is Anyone, so the expiration and password settings above do not apply to new links."
          fi
          echo "info Shared folders members may join: ${join_policy} (from_team_only keeps members out of outside folders)"
          
          # Approved list: counted, never printed - entries are other organisations' domains and addresses.
          domains=0; emails=0; body='{"limit": 1000}'; route="team/sharing_allowlist/list"; pages=0
          while :; do
            rpc_strict "${route}" "${body}"
            domains=$(( domains + $(printf '%s' "${RPC_BODY}" | jq '(.domains // []) | length') ))
            emails=$(( emails + $(printf '%s' "${RPC_BODY}" | jq '(.emails // []) | length') ))
            more=$(printf '%s' "${RPC_BODY}" | jq -r '.has_more // false')
            cursor=$(printf '%s' "${RPC_BODY}" | jq -r '.cursor // ""')
            pages=$((pages + 1))
            [ "${more}" = "true" ] || break
            # TRAP 4: a partly read approved list would under-count who can be added.
            [ -n "${cursor}" ] || { echo "PRECONDITION: ${route} answered has_more=true with no cursor after ${pages} page(s) - the approved list cannot be read to the end, so no result is claimed" >&2; exit 2; }
            [ "${pages}" -lt 500 ] || { echo "PRECONDITION: ${route} stopped after 500 pages with has_more still true - the approved list was not read to the end, so no result is claimed" >&2; exit 2; }
            route="team/sharing_allowlist/list/continue"
            body=$(jq -nc --arg c "${cursor}" '{cursor: $c}')
          done
          echo "info Approved list: ${domains} domain(s), ${emails} address(es)"
          if [ "${member_policy}" = "team_and_approved" ] && [ $((domains + emails)) -eq 0 ]; then
            echo "NOTE: members + approved people is set, but the approved list is empty."
          fi
          
          [ "${rc}" -eq 0 ] && echo "COMPLIANT: every readable 2.1 sharing policy meets the guide."
          exit "${rc}"

"3.1":
  api:
    lang: "bash"
    filename: "hth-dropbox-3.01-audit-linked-apps.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/dropbox/api/hth-dropbox-3.01-audit-linked-apps.sh"
    excerpts:
      linked-apps-audit:
        content: |2
          body='{}'; pages=0
          while :; do
            rpc_strict "team/linked_apps/list_members_linked_apps" "${body}"
            printf '%s' "${RPC_BODY}" | jq -c '.apps[]?' >> "${APPS_FILE}"
            more=$(printf '%s' "${RPC_BODY}" | jq -r '.has_more // false')
            cursor=$(printf '%s' "${RPC_BODY}" | jq -r '.cursor // ""')
            pages=$((pages + 1))
            [ "${more}" = "true" ] || break
            # TRAP 4: a partly read list would pass on the apps it never saw.
            [ -n "${cursor}" ] || { echo "PRECONDITION: team/linked_apps/list_members_linked_apps answered has_more=true with no cursor after ${pages} page(s) - the list cannot be read to the end, so no result is claimed" >&2; exit 2; }
            [ "${pages}" -lt 500 ] || { echo "PRECONDITION: team/linked_apps/list_members_linked_apps stopped after 500 pages with has_more still true - the list was not read to the end, so no result is claimed" >&2; exit 2; }
            body=$(jq -nc --arg c "${cursor}" '{cursor: $c}')
          done
          
          # TRAP 5: zero member entries cannot be told apart from a read that saw nobody.
          entries=$(jq -s 'length' "${APPS_FILE}")
          if [ "${entries}" -eq 0 ]; then
            echo "PRECONDITION: team/linked_apps/list_members_linked_apps returned no member entries across ${pages} page(s). Dropbox does not document whether a member with no linked app is listed, so this cannot be told apart from a read that saw no members - check Settings -> Integrations in the Admin console; no result is claimed" >&2
            exit 2
          fi
          
          # One row per app_id: name, publisher, members linked, oldest link.
          REPORT=$(jq -s --arg approved "${APPROVED}" '
            ($approved | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ok
            | [ .[] | .team_member_id as $m | (.linked_api_apps // [])[] | . + {member: $m} ]
            | group_by(.app_id)
            | map({ app_id: .[0].app_id, app_name: .[0].app_name,
                    publisher: (.[0].publisher // "(unknown)"),
                    members: ([ .[].member ] | unique | length),
                    oldest: ([ .[].linked | select(. != null) ] | sort | first // "(unknown)"),
                    approved: (.[0].app_id as $id | any($ok[]; . == $id)) })
            | sort_by(-.members)' "${APPS_FILE}")
          
          apps=$(printf '%s' "${REPORT}" | jq 'length')
          echo "member entries read: ${entries} | distinct linked apps: ${apps}"
          printf '%s' "${REPORT}" | jq -r '.[] |
            "  \(if .approved then "approved  " else "UNREVIEWED" end)  \(.app_id)  \(.app_name)  publisher=\(.publisher)  members=\(.members)  oldest=\(.oldest)"'
          
          unreviewed=$(printf '%s' "${REPORT}" | jq '[ .[] | select(.approved | not) ] | length')
          if [ "${unreviewed}" -gt 0 ]; then
            if [ -z "${APPROVED}" ]; then
              echo "FINDING: ${unreviewed} linked app(s) and no approved list (HTH_DROPBOX_APPROVED_APP_IDS) - none of them has been reviewed."
            else
              echo "FINDING: ${unreviewed} linked app(s) are not on the approved list. Revoke each in Dropbox; blocking alone does not disconnect members already linked."
            fi
            exit 1
          fi
          if [ "${apps}" -eq 0 ]; then
            echo "COMPLIANT: ${entries} member entries read across the fully paginated list, and none has a third-party app linked."
          else
            echo "COMPLIANT: all ${apps} linked app(s) are on the approved list."
          fi
          exit 0

"4.1":
  api:
    lang: "bash"
    filename: "hth-dropbox-4.01-export-team-events.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/dropbox/api/hth-dropbox-4.01-export-team-events.sh"
    excerpts:
      team-log-ndjson-export:
        content: |2
          # Portable ISO 8601: GNU and BSD date disagree on relative arithmetic.
          iso_now()       { date -u '+%Y-%m-%dT%H:%M:%SZ'; }
          iso_hours_ago() {
            date -u -d "$1 hours ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
              || date -u -v-"$1"H '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
              || { echo "PRECONDITION: neither GNU nor BSD date worked - set HTH_DROPBOX_EVENTS_START" >&2; exit 2; }
          }
          
          END="${HTH_DROPBOX_EVENTS_END:-$(iso_now)}"
          START="${HTH_DROPBOX_EVENTS_START:-$(iso_hours_ago 24)}"
          echo "window [start, end) = [${START}, ${END})  (reuse end, unchanged, as the next start)" >&2
          
          # category and event_type must not be combined; this pack only filters by category.
          body=$(jq -nc --arg s "${START}" --arg e "${END}" --arg c "${CATEGORY}" \
            '{limit: 1000, time: {start_time: $s, end_time: $e}}
             + (if $c == "" then {} else {category: {".tag": $c}} end)')
          route="team_log/get_events"; pages=0; emitted=0
          while :; do
            rpc_strict "${route}" "${body}"
            n=$(printf '%s' "${RPC_BODY}" | jq '(.events // []) | length')
            printf '%s' "${RPC_BODY}" | jq -c '.events[]?'
            emitted=$((emitted + n))
            more=$(printf '%s' "${RPC_BODY}" | jq -r '.has_more // false')
            cursor=$(printf '%s' "${RPC_BODY}" | jq -r '.cursor // ""')
            pages=$((pages + 1))
            # TRAP 1 + TRAP 2: follow the newest cursor until has_more is false.
            [ "${more}" = "true" ] || break
            if [ -z "${cursor}" ]; then
              echo "PRECONDITION: ${route} answered has_more=true with no cursor after ${pages} page(s) - the window cannot be exported to the end; ${emitted} event(s) already written are a partial window" >&2
              exit 2
            fi
            if [ "${pages}" -ge 5000 ]; then
              echo "PRECONDITION: stopped after ${pages} pages with has_more still true - narrow the window and re-run" >&2
              exit 2
            fi
            route="team_log/get_events/continue"
            body=$(jq -nc --arg c "${cursor}" '{cursor: $c}')
          done
          
          echo "pages: ${pages} | events exported: ${emitted}" >&2
          if [ "${emitted}" -eq 0 ]; then
            echo "no events returned for [${START}, ${END})${CATEGORY:+ in category ${CATEGORY}} - not a success: an empty feed and a broken feed look the same downstream" >&2
            exit 1
          fi
          exit 0

