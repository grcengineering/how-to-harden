    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/terraform/hth-devin-1.03-inventory-roles-and-service-users.tf"
    excerpts:
      role-inventory:
        content: |2
          data "devin_roles" "hth_roles" {}
          data "devin_service_users" "hth_service_users" {}
          output "hth_identity_inventory_counts" {
            value = {
              enterprise_roles = length([
                for role in data.devin_roles.hth_roles.roles : role.role_id
                if role.role_type == "enterprise"
              ])
              org_roles     = length([for role in data.devin_roles.hth_roles.roles : role.role_id if role.role_type == "org"])
              service_users = length(data.devin_service_users.hth_service_users.service_users)
              enterprise_service_user_assignments = sum(concat([0], [
                for su in data.devin_service_users.hth_service_users.service_users : length([
                  for assignment in su.role_assignments : assignment.role_id if assignment.org_id == null
                ])
              ]))
            }
          }
          # Role names/IDs alone do not expose permission definitions: inspect the Roles tab.
  api:
    lang: "bash"
    filename: "hth-devin-1.03-inventory-roles-and-service-users.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/api/hth-devin-1.03-inventory-roles-and-service-users.sh"
    excerpts:
      inventory-roles-and-service-users:
        content: |2
          hth_init 1
          [[ -n "${DEVIN_INVENTORY_OUTPUT:-}" ]] || hth_unknown 'set DEVIN_INVENTORY_OUTPUT to a new evidence file'
          hth_get '/v3/self' "$HTH_TEMP/self.json"
          jq -e '.principal_type == "service_user" and (.service_user_id | type == "string")' \
            "$HTH_TEMP/self.json" >/dev/null || hth_unknown 'use a dedicated service user, not a personal token, for this inventory'
          hth_paginate '/v3/enterprise/roles' "$HTH_TEMP/roles.jsonl"
          hth_paginate '/v3/enterprise/members/service-users' "$HTH_TEMP/service-users.jsonl" 'include_inactive=true'
          jq -se 'all(.[]; (.role_id | type == "string" and length > 0) and
            (.role_name | type == "string") and (.role_type == "enterprise" or .role_type == "org"))' \
            "$HTH_TEMP/roles.jsonl" >/dev/null || hth_unknown 'invalid role record'
          jq -se 'all(.[]; (.service_user_id | type == "string") and (.name | type == "string") and
            has("expires_at") and has("deleted_at") and (.role_assignments | type == "array") and
            all(.role_assignments[]; (.role.role_id | type == "string")))' \
            "$HTH_TEMP/service-users.jsonl" >/dev/null || hth_unknown 'invalid service-user record'
          # Role listings omit permissions; fetch each detail instead of inventing them.
          (( $(jq -s 'length' "$HTH_TEMP/roles.jsonl") <= 1000 )) || hth_unknown 'more than 1000 roles; scope and review before collecting details'
          : > "$HTH_TEMP/role-details.jsonl"
          while IFS= read -r role_id; do
            hth_get "/v3/enterprise/roles/$(jq -rn --arg id "$role_id" '$id | @uri')" "$HTH_TEMP/role.json"
            jq -e --arg id "$role_id" '.role_id == $id and (.permissions | type == "array") and
              all(.permissions[]; type == "string")' "$HTH_TEMP/role.json" >/dev/null || hth_unknown 'role permissions missing or malformed'
            jq -c '.' "$HTH_TEMP/role.json" >> "$HTH_TEMP/role-details.jsonl"
          done < <(jq -r '.role_id' "$HTH_TEMP/roles.jsonl")
          jq -n --slurpfile identity "$HTH_TEMP/self.json" --slurpfile roles "$HTH_TEMP/role-details.jsonl" \
            --slurpfile service_users "$HTH_TEMP/service-users.jsonl" \
            '{identity:$identity[0],roles:$roles,service_users:$service_users}' > "$HTH_TEMP/inventory.json"
          hth_save_private "$HTH_TEMP/inventory.json" "$DEVIN_INVENTORY_OUTPUT"
          printf 'COLLECTED: %s roles and %s service users (including inactive); review the private inventory against approved access.\n' \
            "$(jq -s 'length' "$HTH_TEMP/roles.jsonl")" "$(jq -s 'length' "$HTH_TEMP/service-users.jsonl")"

"2.1":
  terraform:
    lang: "hcl"
    filename: "hth-devin-2.01-restrict-inbound-access.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/terraform/hth-devin-2.01-restrict-inbound-access.tf"
    excerpts:
      inbound-policy:
        content: |2
          variable "approved_cidrs" {
            type        = list(string)
            description = "Complete approved enterprise IPv4/IPv6 CIDRs, including operator and recovery egress; no defaults."
            validation {
              condition = length(var.approved_cidrs) > 0 && alltrue([
                for cidr in var.approved_cidrs : can(cidrhost(cidr, 0)) && !endswith(cidr, "/0")
              ])
              error_message = "Supply nonempty, valid CIDRs; unrestricted /0 is forbidden."
            }
          }
          variable "independent_access_verified" {
            type        = bool
            description = "True only after an independent administrator proves an allowed recovery route."
            default     = false
          }
          resource "devin_ip_access_list" "hth_approved" {
            ip_ranges = var.approved_cidrs
            lifecycle {
              prevent_destroy = true
              precondition {
                condition     = var.independent_access_verified
                error_message = "STOP: prove a separate allowed administrative recovery route before planning a replacement."
              }
            }
          }
  api:
    lang: "bash"
    filename: "hth-devin-2.01-verify-ip-access-list.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/api/hth-devin-2.01-verify-ip-access-list.sh"
    excerpts:
      verify-ip-access-list:
        content: |2
          hth_init 2
          [[ -r "${DEVIN_EXPECTED_IP_RANGES:-}" ]] || hth_unknown 'set DEVIN_EXPECTED_IP_RANGES to a readable approved JSON array'
          hth_get '/v3/enterprise/ip-access-list' "$HTH_TEMP/ip-access-list.json"
          # ipaddress canonicalizes IPv4/IPv6 networks; no addresses are printed.
          # Conditional execution preserves finding (1) versus unknown (2) exit codes.
          if python3 - "$HTH_TEMP/ip-access-list.json" "$DEVIN_EXPECTED_IP_RANGES" <<'PY'
          import ipaddress, json, sys
          try:
              with open(sys.argv[1]) as source:
                  actual = json.load(source)['ip_ranges']
              with open(sys.argv[2]) as source:
                  expected = json.load(source)
              def networks(values):
                  if not isinstance(values, list) or any(not isinstance(v, str) for v in values):
                      raise ValueError('not an array of strings')
                  return {ipaddress.ip_network(v, strict=False) for v in values}
              current, approved = networks(actual), networks(expected)
              if not approved or any(n.prefixlen == 0 for n in approved):
                  raise ValueError('approved baseline must restrict access')
          except (OSError, ValueError, KeyError, TypeError):
              print('UNKNOWN: malformed response or missing/unsafe approved CIDR baseline', file=sys.stderr)
              sys.exit(2)
          if not current or any(n.prefixlen == 0 for n in current):
              print('FINDING: no effective IP restriction for at least one address family')
              sys.exit(1)
          if current != approved:
              print(f'FINDING: CIDR drift ({len(current - approved)} unexpected, {len(approved - current)} missing)')
              sys.exit(1)
          print(f'MATCH: {len(current)} canonical CIDRs match the approved baseline; live access denial not tested')
          PY
          then
            exit 0
          else
            result=$?
            exit "$result"
          fi

"2.2":
  api:
    lang: "bash"
    filename: "hth-devin-2.02-audit-security-profile-default.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/api/hth-devin-2.02-audit-security-profile-default.sh"
    excerpts:
      audit-security-profile-default:
        content: |2
          hth_init 2
          hth_paginate '/v3beta1/enterprise/security-profiles' "$HTH_TEMP/profiles.jsonl"
          hth_get '/v3beta1/enterprise/security-profile-settings' "$HTH_TEMP/settings.json"
          jq -e '.default | (.selection == "none" or .selection == "profile")' \
            "$HTH_TEMP/settings.json" >/dev/null || hth_unknown 'malformed enterprise default selection'
          if [[ "$(jq -r '.default.selection' "$HTH_TEMP/settings.json")" != profile ]]; then
            echo 'FINDING: no enterprise default security profile'; exit 1
          fi
          profile_id="$(jq -r '.default.profile_id // empty' "$HTH_TEMP/settings.json")"
          [[ -n "$profile_id" ]] || hth_unknown 'profile selection has no profile_id'
          jq -s --arg id "$profile_id" '[.[] | select(.profile_id == $id)]' \
            "$HTH_TEMP/profiles.jsonl" > "$HTH_TEMP/selected.json"
          [[ "$(jq 'length' "$HTH_TEMP/selected.json")" == 1 ]] || hth_unknown 'default does not resolve to exactly one visible enterprise profile'
          jq '.[0]' "$HTH_TEMP/selected.json" > "$HTH_TEMP/profile.json"
          jq -e '(.enforcement_level == "mandatory" or .enforcement_level == "recommended") and
            (.git_access_level == "read_only" or .git_access_level == "read_write") and
            (.devin_mcp_read_only | type == "boolean") and (.remove_github_cli_token | type == "boolean") and
            (.net_policy == null or ((.net_policy | type == "object" and keys == ["allow"]) and
              (.net_policy.allow | type == "array") and
              all(.net_policy.allow[]; type == "object" and
                ((keys == ["hostname"] and (.hostname | type == "string" and length > 0)) or
                 (keys == ["ipv4"] and (.ipv4 | type == "string" and length > 0)) or
                 (keys == ["ipv6"] and (.ipv6 | type == "string" and length > 0)))))) and
            (.mcp_config == null or ((.mcp_config | type == "object" and keys == ["servers"]) and
              (.mcp_config.servers | type == "array") and all(.mcp_config.servers[]; type == "string" and length > 0)))' \
            "$HTH_TEMP/profile.json" >/dev/null || hth_unknown 'malformed security profile fields'
          # Validate CIDR address families as well as JSON types; unknown schema never passes.
          if python3 - "$HTH_TEMP/profile.json" <<'PYCODE'
          import ipaddress, json, sys
          with open(sys.argv[1]) as source:
              profile = json.load(source)
          try:
              unrestricted = False
              for entry in (profile.get('net_policy') or {}).get('allow', []):
                  for key, version in [('ipv4', 4), ('ipv6', 6)]:
                      if key in entry:
                          network = ipaddress.ip_network(entry[key], strict=False)
                          if network.version != version:
                              raise ValueError('address-family mismatch')
                          unrestricted = unrestricted or network.prefixlen == 0
          except ValueError:
              print('UNKNOWN: invalid network-policy CIDR', file=sys.stderr)
              sys.exit(2)
          if unrestricted:
              print('FINDING: network policy contains an unrestricted CIDR')
              sys.exit(1)
          PYCODE
          then
            :
          else
            result=$?
            exit "$result"
          fi
          # This baseline is intentionally restrictive. An approved write workflow needs a separate review.
          jq '[
            if .enforcement_level != "mandatory" then "default is only recommended" else empty end,
            if .net_policy == null then "network policy has no opinion" else empty end,
            if any((.net_policy.allow // [])[]; .hostname == "*" or .ipv4 == "0.0.0.0/0" or .ipv6 == "::/0")
              then "network policy contains an unrestricted destination" else empty end,
            if .mcp_config == null then "MCP policy has no opinion" else empty end,
            if .git_access_level != "read_only" then "git writes are permitted" else empty end,
            if .devin_mcp_read_only != true then "Devin management MCP writes are permitted" else empty end,
            if .remove_github_cli_token != true then "GitHub CLI token is retained" else empty end
          ]' "$HTH_TEMP/profile.json" > "$HTH_TEMP/findings.json"
          if [[ "$(jq 'length' "$HTH_TEMP/findings.json")" != 0 ]]; then
            jq -r '.[] | "FINDING: " + .' "$HTH_TEMP/findings.json"; exit 1
          fi
          echo 'CONFIGURED: mandatory read-only enterprise default with explicit network/MCP policies; review allowlists and verify a newly booted session separately'

"3.1":
  terraform:
    lang: "hcl"
    filename: "hth-devin-3.01-limit-repository-access.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/terraform/hth-devin-3.01-limit-repository-access.tf"
    excerpts:
      exact-repo-read-only:
        content: |2
          variable "org_id" {
            type = string
          }
          variable "git_connection_id" {
            type = string
          }
          variable "approved_repo_path" {
            type        = string
            description = "One exact owner/repository path approved for this organization."
            validation {
              condition     = can(regex("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", var.approved_repo_path))
              error_message = "Provide an exact owner/repository path, never a wildcard or group prefix."
            }
          }
          resource "devin_git_permission" "hth_one_repo" {
            org_id            = var.org_id
            git_connection_id = var.git_connection_id
            repo_path         = var.approved_repo_path
            read_only         = true
          }

"4.1":
  api:
    lang: "bash"
    filename: "hth-devin-4.01-collect-audit-logs.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/api/hth-devin-4.01-collect-audit-logs.sh"
    excerpts:
      collect-audit-logs:
        content: |2
          hth_init 1
          [[ -n "${DEVIN_AUDIT_OUTPUT:-}" ]] || hth_unknown 'set DEVIN_AUDIT_OUTPUT to a new private evidence file'
          [[ "${DEVIN_AUDIT_AFTER:-}" =~ ^[0-9]{1,11}$ && "${DEVIN_AUDIT_BEFORE:-}" =~ ^[0-9]{1,11}$ ]] || \
            hth_unknown 'set DEVIN_AUDIT_AFTER and DEVIN_AUDIT_BEFORE to Unix seconds'
          after=$((10#$DEVIN_AUDIT_AFTER)); before=$((10#$DEVIN_AUDIT_BEFORE))
          (( before > after && before - after <= 2678400 )) || hth_unknown 'request a positive time window of at most 31 days'
          query="order=asc&time_after=${after}&time_before=${before}"
          if [[ -n "${DEVIN_AUDIT_ACTION:-}" ]]; then
            [[ "$DEVIN_AUDIT_ACTION" =~ ^[a-z][a-z0-9_]*$ ]] || hth_unknown 'invalid audit action name'
            query+="&action=${DEVIN_AUDIT_ACTION}"
          fi
          hth_paginate '/v3/enterprise/audit-logs' "$HTH_TEMP/events.jsonl" "$query"
          jq -se --argjson after "$after" --argjson before "$before" --arg action "${DEVIN_AUDIT_ACTION:-}" '
            all(.[]; (.audit_log_id | type == "string" and length > 0) and
              (.action | type == "string") and ($action == "" or .action == $action) and
              (.created_at | type == "number" and . == floor) and
              .created_at >= $after and .created_at <= $before and (.data | type == "object"))' \
            "$HTH_TEMP/events.jsonl" >/dev/null || hth_unknown 'malformed audit event or response outside requested filter'
          jq -sc 'unique_by(.audit_log_id) | sort_by(.created_at, .audit_log_id)[]' \
            "$HTH_TEMP/events.jsonl" > "$HTH_TEMP/export.jsonl"
          hth_save_private "$HTH_TEMP/export.jsonl" "$DEVIN_AUDIT_OUTPUT"
          printf 'COLLECTED: %s unique audit events in the requested window; verify expected activity and ingest the private JSONL into your SIEM.\n' \
            "$(wc -l < "$HTH_TEMP/export.jsonl" | tr -d ' ')"

