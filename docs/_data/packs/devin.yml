"3.3":
  terraform:
    lang: "hcl"
    filename: "hth-devin-3.03-bound-automations.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/terraform/hth-devin-3.03-bound-automations.tf"
    excerpts:
      bound-automations:
        content: |2
          variable "org_id" { type = string }
          variable "hth_profile_level" {
            type    = number
            default = 1
            validation {
              condition     = contains([1, 2, 3, 4], var.hth_profile_level)
              error_message = "hth_profile_level must be 1..4."
            }
          }
          variable "create_disabled_automation" {
            type    = bool
            default = false
          }
          variable "service_user_id" {
            type    = string
            default = ""
          }
          variable "approved_triggers" {
            description = "Reviewed nonempty trigger array; triggers OR together. No generic unfiltered event default."
            type        = any
            default     = []
          }
          variable "approved_actions" {
            description = "Reviewed actions, including required enterprise tags; no prompt-as-security-boundary assumption."
            type        = any
            default     = []
          }
          data "devin_oncall_schemas" "capabilities" {
            org_id = var.org_id
            lifecycle {
              precondition {
                condition     = var.hth_profile_level >= 2
                error_message = "Select hth_profile_level >= 2 before reading automation capabilities."
              }
            }
          }
          resource "devin_automation" "reviewed_disabled" {
            count                  = var.create_disabled_automation ? 1 : 0
            org_id                 = var.org_id
            name                   = "Reviewed disabled intake"
            enabled                = false
            run_as                 = "service_user"
            run_as_service_user_id = var.service_user_id
            slack_reply_access     = "devin_users"
            teams_reply_access     = "devin_users"
            triggers               = jsonencode(var.approved_triggers)
            actions                = jsonencode(var.approved_actions)
            limits = jsonencode({
              max_acu_limit = 5
              invocations   = { max_per_window = 1, window_seconds = 3600 }
            })
            concurrency = jsonencode({ max_concurrent_runs = 1, max_queue_depth = 0 })
            lifecycle {
              prevent_destroy = true
              precondition {
                condition     = length(trimspace(var.service_user_id)) > 0 && length(var.approved_triggers) > 0 && length(var.approved_actions) > 0
                error_message = "Creating even a disabled automation requires a reviewed principal, triggers and actions."
              }
            }
          }
          # No credentials/URL/secret outputs. Webhook secrets can nevertheless enter state.
          # JSON groups are config-authoritative; out-of-band edits are NOT detected as drift.
          # Import does not recover them; review the full first post-import plan.
  api:
    lang: "bash"
    filename: "hth-devin-3.03-inventory-automations.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin/api/hth-devin-3.03-inventory-automations.sh"
    excerpts:
      inventory-automations:
        content: |2
          source "$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)/common.sh"
          hth_init 2
          [[ "${DEVIN_ORG_ID:-}" =~ ^[A-Za-z0-9_-]+$ ]] || hth_unknown 'set a confirmed DEVIN_ORG_ID'
          [[ -n "${HTH_OUTPUT_FILE:-}" ]] || hth_unknown 'set HTH_OUTPUT_FILE to a new private evidence file'
          hth_paginate "/v3/organizations/${DEVIN_ORG_ID}/automations" "$HTH_TEMP/automations.jsonl"
          hth_paginate "/v3/organizations/${DEVIN_ORG_ID}/oncall/responders" "$HTH_TEMP/responders.jsonl"
          jq -se 'all(.[]; (.automation_id|type=="string") and (.name|type=="string") and (.enabled|type=="boolean") and (.triggers|type=="array") and (.actions|type=="array"))' "$HTH_TEMP/automations.jsonl" >/dev/null || hth_unknown 'malformed automation item; partial evidence discarded'
          jq -se 'all(.[]; (.id|type=="string") and (.name|type=="string") and (.enabled|type=="boolean") and (.triggers|type=="array"))' "$HTH_TEMP/responders.jsonl" >/dev/null || hth_unknown 'malformed responder item; partial evidence discarded'
          # Event/condition configuration can itself contain secrets; keep all output private.
          # Omit prompt/runbook text, actions, tools, URL/secret fields and arbitrary metadata.
          jq -n --arg org "$DEVIN_ORG_ID" --slurpfile a "$HTH_TEMP/automations.jsonl" --slurpfile r "$HTH_TEMP/responders.jsonl" '
           {org_id:$org,scope:"visible to supplied credential; not an enterprise-completeness claim",
           automations:[$a[]|{automation_id,name,enabled,run_as,slack_reply_access,teams_reply_access,limits,concurrency,security_profile,
             triggers:[.triggers[]|{event_type,conditions}]}],
           responders:[$r[]|{id,name,enabled,run_as,source_channel_id,
             triggers:[.triggers[]|{event_type,conditions}]}]}' > "$HTH_TEMP/evidence.json"
          hth_save_private "$HTH_TEMP/evidence.json" "$HTH_OUTPUT_FILE"
          printf 'COLLECTED: %s automations; %s responders. Review scope, identity, triggers, tools and active runs separately.\n' \
           "$(jq '.automations|length' "$HTH_TEMP/evidence.json")" "$(jq '.responders|length' "$HTH_TEMP/evidence.json")"

