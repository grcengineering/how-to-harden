    filename: "hth-ramp-1.04-reconcile-provisioning-and-offboarding.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/ramp/api/hth-ramp-1.04-reconcile-provisioning-and-offboarding.sh"
    excerpts:
      reconcile-provisioning-and-offboarding:
        content: |2
          source "$(dirname -- "$0")/common.sh"
          # Read-only reconciliation, NOT an approved deactivation list. No PATCH is sent.
          # List explicitly suspended users as well: the default endpoint omits them.
          ramp_collect users /developer/v1/users "?page_size=100" yes
          cp "$RAMP_TMP/users.ndjson" "$RAMP_TMP/default-users"
          ramp_collect users /developer/v1/users "?page_size=100&status=USER_SUSPENDED" yes
          cat "$RAMP_TMP/default-users" >> "$RAMP_TMP/users.ndjson"
          ramp_report users

"2.2":
  cli:
    lang: "bash"
    filename: "hth-ramp-2.02-restrict-ai-connections-and-cli-access.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/ramp/cli/hth-ramp-2.02-restrict-ai-connections-and-cli-access.sh"
    excerpts:
      inspect-cli-identity:
        content: |2
          set +x
          set -euo pipefail
          umask 077
          [[ $# == 0 ]] || { echo 'No arguments accepted.' >&2; exit 1; }
          command -v ramp >/dev/null || { echo 'Install the official Ramp CLI first.' >&2; exit 1; }
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          # Never enroll, install or change tenant settings. Existing sessions may auto-refresh.
          # Official CLI commit a29141b5293c4e1ad15befc9587314b52c1b0bc6:
          # auth.status emits authenticated/base_url/scopes/access, not credential values.
          # GetSimplifiedUserDetailRequestBody requires rationale. Explicit production target.
          ramp auth status --env production --no-input --output json > "$tmp/status" 2>/dev/null || {
            echo 'Cannot read CLI sign-in state; no report emitted.' >&2; exit 1;
          }
          ramp users me --env production --no-input --output json \
            --rationale "Review authenticated identity for the HTH CLI access assessment" > "$tmp/me" 2>/dev/null || {
            echo 'Cannot read CLI identity; no report emitted.' >&2; exit 1;
          }
          # CLI output is for manual review; not interpreted as proof of least privilege.
          cat "$tmp/status" "$tmp/me"

