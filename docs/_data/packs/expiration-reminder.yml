              'https://api.expirationreminder.com/v1/eventlogs' |
            jq -e --argjson page "$page" '
              if type != "object" or (.eventlogs | type) != "array"
                 or (.page | type) != "number" or (.pages | type) != "number" or (.total | type) != "number"
