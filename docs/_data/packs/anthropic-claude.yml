"2.2":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-2.02-rotate-api-keys-regularly.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-2.02-rotate-api-keys-regularly.sh"
    excerpts:
      api-find-stale-keys:
        content: |2
          # Two-part key-lifetime audit.
          #   Part 1 — NON-EXPIRING keys: the Admin API reports each key's expires_at
          #   (null = never expires). With native key expiration available, expires_at
          #   == null is a finding in itself, not an unavoidable state.
          #   Part 2 — stale keys: anything older than the 90-day rotation window.
          info "Auditing key expirations and staleness..."
          API_KEYS=$(anthropic_list_all "/v1/organizations/api_keys?status=active") || {
            fail "2.2 Failed to list API keys"
            summary; exit 0
          }
          
          NEVER_EXPIRING=$(echo "${API_KEYS}" | jq '[.[] | select(.expires_at == null)]')
          NEVER_COUNT=$(echo "${NEVER_EXPIRING}" | jq 'length')
          if [[ "${NEVER_COUNT}" -gt 0 ]]; then
            warn "2.2 ${NEVER_COUNT} active keys NEVER expire (expires_at=null) — prefer expiring keys; adopt the org maximum expiration policy"
            echo "${NEVER_EXPIRING}" | jq -r '.[] | "  \(.name // "unnamed") | Created: \(.created_at) | Workspace: \(.workspace_id)"'
          else
            pass "2.2 Every active key carries an expiration (expires_at set)"
          fi
          
          CUTOFF=$(date -d '90 days ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                   date -v-90d '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null)
          
          STALE_KEYS=$(echo "${API_KEYS}" | jq --arg cutoff "${CUTOFF}" \
            '[.[] | select(.created_at < $cutoff)]')
          STALE_COUNT=$(echo "${STALE_KEYS}" | jq 'length')
          
          if [[ "${STALE_COUNT}" -gt 0 ]]; then
            warn "2.2 ${STALE_COUNT} API keys are older than 90 days:"
            echo "${STALE_KEYS}" | jq -r '.[] | "  \(.name // "unnamed") | Created: \(.created_at) | Expires: \(.expires_at // "never") | Workspace: \(.workspace_id)"'
          else
            pass "2.2 All API keys are within 90-day rotation window"
          fi
      api-archive-old-key:
        content: |2
          # Archive an old API key after rotation
          # Usage: Set OLD_KEY_ID before running
          if [[ -n "${OLD_KEY_ID:-}" ]]; then
            info "Archiving old API key ${OLD_KEY_ID}..."
            anthropic_post "/v1/organizations/api_keys/${OLD_KEY_ID}" \
              '{"status": "archived"}' || {
              fail "2.2 Failed to archive API key"
              summary; exit 0
            }
            pass "2.2 API key ${OLD_KEY_ID} archived"
          fi

"2.3":
  config:
    lang: "json"
    filename: "hth-anthropic-claude-2.03-wif-profile.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-2.03-wif-profile.jsonc"
    excerpts:
      config-wif-profile:
        content: |2
          {
            "version": "1.0",
            "authentication": {
              "type": "oidc_federation",
              "federation_rule_id": "fdrl_REPLACE_ME",
              "service_account_id": "svac_REPLACE_ME",
              "identity_token": {
                "source": "file",
                "path": "/var/run/secrets/anthropic.com/token"
              }
            },
            "organization_id": "00000000-0000-0000-0000-000000000000",
            "workspace_id": "wrkspc_REPLACE_ME",
            "base_url": "https://api.anthropic.com"
          }
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-2.03-wif-token-exchange.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-2.03-wif-token-exchange.sh"
    excerpts:
      api-wif-token-exchange:
        content: |2
          # Read the IdP-issued JWT from the projected token file (Kubernetes / GHA / etc.)
          JWT=$(cat "${ANTHROPIC_IDENTITY_TOKEN_FILE}")
          
          # Build the token-exchange body — workspace_id is required when the rule
          # is enabled for more than one workspace
          WORKSPACE_FIELD=""
          if [ -n "${ANTHROPIC_WORKSPACE_ID:-}" ]; then
            WORKSPACE_FIELD=$(printf ',\n  "workspace_id": "%s"' "${ANTHROPIC_WORKSPACE_ID}")
          fi
          
          RESPONSE=$(curl -sS -f --max-time 10 "${ANTHROPIC_API_BASE}/v1/oauth/token" \
            -H "content-type: application/json" \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "${JWT}",
            "federation_rule_id": "${ANTHROPIC_FEDERATION_RULE_ID}",
            "organization_id": "${ANTHROPIC_ORGANIZATION_ID}",
            "service_account_id": "${ANTHROPIC_SERVICE_ACCOUNT_ID}"${WORKSPACE_FIELD}
          }
          JSON
          )
          
          ACCESS_TOKEN=$(echo "${RESPONSE}" | jq -r '.access_token')
          EXPIRES_IN=$(echo "${RESPONSE}" | jq -r '.expires_in')
          SCOPE=$(echo "${RESPONSE}" | jq -r '.scope')
          
          # Sanity-check the prefix — federated tokens are sk-ant-oat01-…
          case "${ACCESS_TOKEN}" in
            sk-ant-oat01-*) echo "Got federated access token (scope=${SCOPE}, expires_in=${EXPIRES_IN}s)" ;;
            *) echo "ERROR: token-exchange did not return an oat01 token: ${RESPONSE}" >&2; exit 1 ;;
          esac
      api-wif-call-messages:
        content: |2
          # Call the Claude API with the short-lived federated token (Bearer auth)
          curl -sS -f "${ANTHROPIC_API_BASE}/v1/messages" \
            -H "authorization: Bearer ${ACCESS_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            --data @- <<'JSON' | jq -r '.content[0].text'
          {
            "model": "claude-sonnet-4-6",
            "max_tokens": 1024,
            "messages": [{"role": "user", "content": "Hello, Claude"}]
          }
          JSON
      api-wif-detect-static-keys-in-env:
        content: |2
          # Pre-deploy guardrail: fail the build if a static API key is present in
          # the environment of a workload that is supposed to use WIF. ANTHROPIC_API_KEY
          # sits ABOVE federation in the SDK's credential precedence chain, so a
          # leftover key silently shadows federation.
          for VAR in ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN; do
            if [ -n "${!VAR:-}" ]; then
              echo "FAIL: \$${VAR} is set; it will shadow Workload Identity Federation." >&2
              echo "      Unset it (\`unset ${VAR}\`) — empty-string also wins precedence." >&2
              exit 2
            fi
          done
          echo "OK: no static API key shadows the federation credentials"
  sdk:
    lang: "python"
    filename: "hth-anthropic-claude-2.03-wif-python.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/sdk/hth-anthropic-claude-2.03-wif-python.py"
    excerpts:
      sdk-wif-python-explicit:
        content: |2
          from anthropic import Anthropic, WorkloadIdentityCredentials, IdentityTokenFile
          
          # Explicit construction — recommended when you ship one image to multiple
          # environments and want the federation parameters in code rather than env.
          client = Anthropic(
              credentials=WorkloadIdentityCredentials(
                  identity_token_provider=IdentityTokenFile(
                      "/var/run/secrets/anthropic.com/token"
                  ),
                  federation_rule_id="fdrl_REPLACE_ME",
                  organization_id="00000000-0000-0000-0000-000000000000",
                  service_account_id="svac_REPLACE_ME",
                  workspace_id="wrkspc_REPLACE_ME",
              ),
          )
          
          message = client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=1024,
              messages=[{"role": "user", "content": "Hello, Claude"}],
          )
          print(message.content[0].text)
      sdk-wif-python-env:
        content: |2
          # Zero-argument construction — recommended for production. Ship the same
          # container image everywhere; inject these env vars per environment:
          #   ANTHROPIC_FEDERATION_RULE_ID
          #   ANTHROPIC_ORGANIZATION_ID
          #   ANTHROPIC_SERVICE_ACCOUNT_ID
          #   ANTHROPIC_WORKSPACE_ID         (required when the rule covers >1 workspace)
          #   ANTHROPIC_IDENTITY_TOKEN_FILE  (or ANTHROPIC_IDENTITY_TOKEN literal)
          #
          # IMPORTANT: ANTHROPIC_API_KEY sits ABOVE federation in the SDK's credential
          # precedence chain. A leftover key silently shadows federation. The next block
          # is a defensive startup check.
          import os, sys
          
          for var in ("ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"):
              if os.environ.get(var):
                  sys.exit(
                      f"FATAL: {var} is set; it will shadow Workload Identity Federation. "
                      "Unset it (empty-string also wins precedence)."
                  )
          
          from anthropic import Anthropic
          client = Anthropic()  # SDK reads the ANTHROPIC_FEDERATION_* vars from env

"3.1":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-3.01-segment-workspaces.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-3.01-segment-workspaces.sh"
    excerpts:
      api-list-workspaces:
        content: |2
          # List all workspaces and their configuration
          info "Listing all workspaces..."
          WORKSPACES=$(anthropic_list_all "/v1/organizations/workspaces") || {
            fail "3.1 Failed to list workspaces"
            summary; exit 0
          }
          
          WS_COUNT=$(echo "${WORKSPACES}" | jq 'length')
          info "Found ${WS_COUNT} workspaces (limit: 100 per organization)"
          
          echo "${WORKSPACES}" | jq -r '.[] |
            "  \(.display_name) | ID: \(.id) | Geo: \(.settings.workspace_geo // "default") | Archived: \(.archived_at // "no")"'
          
          pass "3.1 Workspace inventory complete"
      api-create-workspace:
        content: |2
          # Create a new workspace for environment segmentation
          # Usage: Set WS_NAME and optionally WS_GEO before running
          if [[ -n "${WS_NAME:-}" ]]; then
            BODY="{\"name\": \"${WS_NAME}\"}"
            if [[ -n "${WS_GEO:-}" ]]; then
              BODY=$(echo "${BODY}" | jq --arg geo "${WS_GEO}" '. + {settings: {workspace_geo: $geo}}')
            fi
            info "Creating workspace '${WS_NAME}'..."
            RESULT=$(anthropic_post "/v1/organizations/workspaces" "${BODY}") || {
              fail "3.1 Failed to create workspace"
              summary; exit 0
            }
            NEW_ID=$(echo "${RESULT}" | jq -r '.id')
            pass "3.1 Workspace created: ${NEW_ID}"
          fi

"3.2":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-3.02-manage-workspace-membership.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-3.02-manage-workspace-membership.sh"
    excerpts:
      api-audit-workspace-members:
        content: |2
          # Audit membership for a specific workspace
          # Usage: Set WORKSPACE_ID before running
          WORKSPACE_ID="${WORKSPACE_ID:-}"
          if [[ -z "${WORKSPACE_ID}" ]]; then
            info "Listing all workspaces to select for audit..."
            WORKSPACES=$(anthropic_list_all "/v1/organizations/workspaces") || {
              fail "3.2 Failed to list workspaces"
              summary; exit 0
            }
            echo "${WORKSPACES}" | jq -r '.[] | "  \(.id)\t\(.display_name)"' | column -t -s $'\t'
            info "Set WORKSPACE_ID=<id> and re-run to audit a specific workspace"
            summary; exit 0
          fi
          
          info "Auditing members of workspace ${WORKSPACE_ID}..."
          MEMBERS=$(anthropic_list_all "/v1/organizations/workspaces/${WORKSPACE_ID}/members") || {
            fail "3.2 Failed to list workspace members"
            summary; exit 0
          }
          
          MEMBER_COUNT=$(echo "${MEMBERS}" | jq 'length')
          info "Workspace has ${MEMBER_COUNT} members"
          
          # List members with roles
          echo "${MEMBERS}" | jq -r '.[] | "  \(.user_id)\t\(.workspace_role)"' | \
            column -t -s $'\t' -N "USER_ID,ROLE"
          
          # Flag workspace admins
          ADMIN_COUNT=$(echo "${MEMBERS}" | jq '[.[] | select(.workspace_role == "workspace_admin")] | length')
          if [[ "${ADMIN_COUNT}" -gt 2 ]]; then
            warn "3.2 ${ADMIN_COUNT} workspace admins found — review for least privilege"
          else
            pass "3.2 Workspace admin count (${ADMIN_COUNT}) is appropriate"
          fi
      api-remove-workspace-member:
        content: |2
          # Remove a user from a workspace
          # Usage: Set WORKSPACE_ID and REMOVE_USER_ID before running
          if [[ -n "${REMOVE_USER_ID:-}" ]]; then
            info "Removing user ${REMOVE_USER_ID} from workspace ${WORKSPACE_ID}..."
            anthropic_delete "/v1/organizations/workspaces/${WORKSPACE_ID}/members/${REMOVE_USER_ID}" || {
              fail "3.2 Failed to remove workspace member"
              summary; exit 0
            }
            pass "3.2 User ${REMOVE_USER_ID} removed from workspace"
          fi

"4.1":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-4.01-enforce-data-residency.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-4.01-enforce-data-residency.sh"
    excerpts:
      api-audit-data-residency:
        content: |2
          # Audit data residency settings across all workspaces
          info "Auditing data residency configuration per workspace..."
          WORKSPACES=$(anthropic_list_all "/v1/organizations/workspaces") || {
            fail "4.1 Failed to list workspaces"
            summary; exit 0
          }
          
          echo "${WORKSPACES}" | jq -r '.[] | {
            name: .display_name,
            id: .id,
            workspace_geo: (.settings.workspace_geo // "not set"),
            default_inference_geo: (.settings.default_inference_geo // "not set"),
            allowed_inference_geos: (.settings.allowed_inference_geos // ["not restricted"])
          } | "  \(.name) | Geo: \(.workspace_geo) | Default Inference: \(.default_inference_geo) | Allowed: \(.allowed_inference_geos | join(", "))"'
          
          # Flag workspaces without data residency configured
          UNCONFIGURED=$(echo "${WORKSPACES}" | jq '[.[] | select(
            .settings.workspace_geo == null or .settings.workspace_geo == ""
          )] | length')
          
          if [[ "${UNCONFIGURED}" -gt 0 ]]; then
            warn "4.1 ${UNCONFIGURED} workspaces have no explicit data residency setting"
          else
            pass "4.1 All workspaces have data residency configured"
          fi
      api-restrict-inference-geo:
        content: |2
          # Restrict a workspace to US-only inference
          # Usage: Set WORKSPACE_ID before running
          if [[ -n "${WORKSPACE_ID:-}" ]]; then
            info "Restricting workspace ${WORKSPACE_ID} to US-only inference..."
            anthropic_post "/v1/organizations/workspaces/${WORKSPACE_ID}" '{
              "settings": {
                "default_inference_geo": "us",
                "allowed_inference_geos": ["us"]
              }
            }' || {
              fail "4.1 Failed to update workspace data residency"
              summary; exit 0
            }
            pass "4.1 Workspace ${WORKSPACE_ID} restricted to US-only inference"
          fi

"5.1":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-5.01-monitor-usage-and-costs.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-5.01-monitor-usage-and-costs.sh"
    excerpts:
      api-usage-report:
        content: |2
          # Generate a daily usage report for the past 7 days, grouped by workspace
          START_DATE=$(date -d '7 days ago' '+%Y-%m-%dT00:00:00Z' 2>/dev/null || \
                       date -v-7d '+%Y-%m-%dT00:00:00Z' 2>/dev/null)
          END_DATE=$(date '+%Y-%m-%dT23:59:59Z')
          
          info "Fetching usage report from ${START_DATE} to ${END_DATE}..."
          USAGE=$(anthropic_get "/v1/organizations/usage_report/messages?start_time=${START_DATE}&end_time=${END_DATE}&group_by=workspace&bucket_width=1d") || {
            fail "5.1 Failed to fetch usage report"
            summary; exit 0
          }
          
          echo "${USAGE}" | jq -r '.data[] | "  \(.workspace_id // "default") | Input: \(.input_tokens) | Output: \(.output_tokens) | Date: \(.bucket_start_time)"'
          pass "5.1 Usage report retrieved"
      api-cost-report:
        content: |2
          # Generate a cost report for the past 30 days, grouped by workspace
          COST_START=$(date -d '30 days ago' '+%Y-%m-%dT00:00:00Z' 2>/dev/null || \
                       date -v-30d '+%Y-%m-%dT00:00:00Z' 2>/dev/null)
          
          info "Fetching cost report from ${COST_START}..."
          COST=$(anthropic_get "/v1/organizations/cost_report?start_time=${COST_START}&end_time=${END_DATE}&group_by=workspace") || {
            fail "5.1 Failed to fetch cost report"
            summary; exit 0
          }
          
          echo "${COST}" | jq -r '.data[] | "  \(.workspace_id // "default") | Cost: $\(.cost_usd) | Date: \(.bucket_start_time)"'
          pass "5.1 Cost report retrieved"

"5.2":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-5.02-configure-spend-limits.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-5.02-configure-spend-limits.sh"
    excerpts:
      api-cost-anomaly:
        content: |2
          # Check for cost anomalies — alert if any workspace exceeds a threshold
          THRESHOLD_USD="${THRESHOLD_USD:-1000}"
          PERIOD_DAYS="${PERIOD_DAYS:-7}"
          
          START_DATE=$(date -d "${PERIOD_DAYS} days ago" '+%Y-%m-%dT00:00:00Z' 2>/dev/null || \
                       date -v-"${PERIOD_DAYS}"d '+%Y-%m-%dT00:00:00Z' 2>/dev/null)
          END_DATE=$(date '+%Y-%m-%dT23:59:59Z')
          
          info "Checking for workspaces exceeding \$${THRESHOLD_USD} in the past ${PERIOD_DAYS} days..."
          COST=$(anthropic_get "/v1/organizations/cost_report?start_time=${START_DATE}&end_time=${END_DATE}&group_by=workspace") || {
            fail "5.2 Failed to fetch cost report"
            summary; exit 0
          }
          
          # Aggregate cost per workspace
          OVER_THRESHOLD=$(echo "${COST}" | jq --argjson threshold "${THRESHOLD_USD}" '
            [.data | group_by(.workspace_id)[] |
             {workspace: .[0].workspace_id, total: ([.[].cost_usd] | add)} |
             select(.total > $threshold)]')
          
          ALERT_COUNT=$(echo "${OVER_THRESHOLD}" | jq 'length')
          if [[ "${ALERT_COUNT}" -gt 0 ]]; then
            warn "5.2 ${ALERT_COUNT} workspace(s) exceed \$${THRESHOLD_USD} threshold:"
            echo "${OVER_THRESHOLD}" | jq -r '.[] | "  \(.workspace) — $\(.total)"'
          else
            pass "5.2 No workspaces exceed \$${THRESHOLD_USD} threshold in ${PERIOD_DAYS}-day window"
          fi

"6.1":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-6.01-audit-pending-invites.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-6.01-audit-pending-invites.sh"
    excerpts:
      api-audit-invites:
        content: |2
          # List all pending invites and identify stale ones
          info "Listing all organization invites..."
          INVITES=$(anthropic_list_all "/v1/organizations/invites") || {
            fail "2.1 Failed to list invites"
            summary; exit 1
          }
          
          TOTAL=$(echo "${INVITES}" | jq 'length')
          PENDING=$(echo "${INVITES}" | jq '[.[] | select(.status == "pending")] | length')
          EXPIRED=$(echo "${INVITES}" | jq '[.[] | select(.status == "expired")] | length')
          ACCEPTED=$(echo "${INVITES}" | jq '[.[] | select(.status == "accepted")] | length')
          
          info "Invites: total=${TOTAL}, pending=${PENDING}, expired=${EXPIRED}, accepted=${ACCEPTED}"
          
          if [[ "${PENDING}" -gt 0 ]]; then
            warn "2.1 ${PENDING} pending invites found — review for stale or unauthorized invitations:"
            echo "${INVITES}" | jq -r '.[] | select(.status == "pending") |
              "  \(.email) | Role: \(.role) | Invited: \(.invited_at) | Expires: \(.expires_at)"'
          else
            pass "2.1 No pending invites"
          fi
      api-revoke-invite:
        content: |2
          # WRITE: revoke one pending invite. Runs only when INVITE_ID is set.
          if [[ -n "${INVITE_ID:-}" ]]; then
            [[ "${INVITE_ID}" =~ ^[A-Za-z0-9_-]+$ ]] || { fail "2.1 INVITE_ID is not a valid invite id"; summary; exit 1; }
            info "Revoking invite ${INVITE_ID}..."
            anthropic_delete "/v1/organizations/invites/${INVITE_ID}" || {
              fail "2.1 Failed to revoke invite"
              summary; exit 1
            }
            pass "2.1 Invite ${INVITE_ID} revoked"
          fi

"6.2":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-6.02-integration-key-inventory.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-6.02-integration-key-inventory.sh"
    excerpts:
      api-integration-key-inventory:
        content: |2
          # Inventory every ACTIVE API key by where it can act (the matrix's Key Scope).
          info "Listing active API keys and workspaces..."
          KEYS=$(anthropic_list_all "/v1/organizations/api_keys?status=active") || {
            fail "2.2 Failed to list API keys"
            summary; exit 1
          }
          WORKSPACES=$(anthropic_list_all "/v1/organizations/workspaces") || {
            fail "2.2 Failed to list workspaces"
            summary; exit 1
          }
          
          # Label each key: a named workspace, the Default Workspace, or ORGANIZATION
          # (principal-bound, no workspace). Only scope.type decides the tier.
          INVENTORY=$(echo "${KEYS}" | jq -c --argjson ws "${WORKSPACES}" '
            ($ws | map({key: .id, value: .name}) | from_entries) as $names
            | map(
                (.scope.workspace_id // "") as $wid
                | (if .scope.type == "organization" then "organization"
                 elif .scope.type == "workspace" and ($names | has($wid)) then "workspace"
                 elif .scope.type == "workspace" and .workspace_id == null then "default"
                 elif .scope.type == "workspace" then "workspace"
                 else "unknown" end) as $tier
                | {
                    name: (.name // "unnamed"),
                    principal: (.principal.type // "unbound"),
                    expires: (.expires_at // "never"),
                    tier: $tier,
                    where: (if $tier == "organization" then "ORGANIZATION (no workspace)"
                            elif $tier == "default" then "Default Workspace"
                            elif $tier == "workspace" then ($names[$wid] // $wid)
                            else "UNKNOWN (no scope field)" end)
                  })')
          
          TOTAL=$(echo "${INVENTORY}" | jq 'length')
          ORG_SCOPED=$(echo "${INVENTORY}" | jq '[.[] | select(.tier == "organization")] | length')
          DEFAULT_WS=$(echo "${INVENTORY}" | jq '[.[] | select(.tier == "default")] | length')
          UNKNOWN=$(echo "${INVENTORY}" | jq '[.[] | select(.tier == "unknown")] | length')
          NEVER_EXPIRE=$(echo "${INVENTORY}" | jq '[.[] | select(.expires == "never")] | length')
          info "Active keys: ${TOTAL} (organization-scoped=${ORG_SCOPED}, default-workspace=${DEFAULT_WS}, never-expiring=${NEVER_EXPIRE})"
          
          {
            printf 'WHERE\tKEY NAME\tPRINCIPAL\tEXPIRES\n'
            echo "${INVENTORY}" | jq -r 'sort_by(.where) | .[] | "\(.where)\t\(.name)\t\(.principal)\t\(.expires)"'
          } | column -t -s $'\t'
          
          # Shared workspaces are the matrix's Medium tier: one workspace, several consumers
          echo "${INVENTORY}" | jq -r '[.[] | select(.tier == "workspace" or .tier == "default")]
            | group_by(.where) | map(select(length > 1)) | .[]
            | "  shared: \(.[0].where) holds \(length) active keys"'
          
          if [[ "${ORG_SCOPED}" -gt 0 || "${DEFAULT_WS}" -gt 0 || "${UNKNOWN}" -gt 0 ]]; then
            warn "2.2 ${ORG_SCOPED} organization-scoped, ${DEFAULT_WS} Default Workspace, ${UNKNOWN} unclassified key(s) — give each consumer a dedicated workspace with its own limits"
          else
            pass "2.2 Every active key belongs to a named workspace"
          fi

"7.1":
  config:
    lang: "json"
    filename: "hth-anthropic-claude-7.01-managed-settings.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-7.01-managed-settings.jsonc"
    excerpts:
      managed-settings-baseline:
        content: |2
          // Anthropic official example: settings-lax.json (L1 Crawl)
          // Source: github.com/anthropics/claude-code/blob/main/examples/settings/settings-lax.json
          // Prevents --dangerously-skip-permissions and blocks plugin marketplaces.
            {
              "permissions": {
                "disableBypassPermissionsMode": "disable"
              },
              "strictKnownMarketplaces": []
            }
      managed-settings-hardened:
        content: |2
          // Anthropic official example: settings-strict.json (L2 Walk)
          // Source: github.com/anthropics/claude-code/blob/main/examples/settings/settings-strict.json
          // Blocks bypass, enforces managed-only permissions and hooks,
          // denies web access, requires Bash approval, locks sandbox settings.
            {
              "permissions": {
                "disableBypassPermissionsMode": "disable",
                "ask": [
                  "Bash"
                ],
                "deny": [
                  "WebSearch",
                  "WebFetch"
                ]
              },
              "allowManagedPermissionRulesOnly": true,
              "allowManagedHooksOnly": true,
              "strictKnownMarketplaces": [],
              "sandbox": {
                "autoAllowBashIfSandboxed": false,
                "excludedCommands": [],
                "network": {
                  "allowUnixSockets": [],
                  "allowAllUnixSockets": false,
                  "allowLocalBinding": false,
                  "allowedDomains": []
                },
                "enableWeakerNestedSandbox": false
              }
            }
      managed-settings-sandbox:
        content: |2
          // Anthropic official example: settings-bash-sandbox.json (L3 Sandbox)
          // Source: github.com/anthropics/claude-code/blob/main/examples/settings/settings-bash-sandbox.json
          // Enables OS-level bash sandboxing with no escape hatch.
          // Platform support: macOS (Seatbelt), Linux/WSL2 (bubblewrap).
            {
              "allowManagedPermissionRulesOnly": true,
              "sandbox": {
                "enabled": true,
                "autoAllowBashIfSandboxed": false,
                "allowUnsandboxedCommands": false,
                "excludedCommands": [],
                "network": {
                  "allowUnixSockets": [],
                  "allowAllUnixSockets": false,
                  "allowLocalBinding": false,
                  "allowedDomains": []
                },
                "enableWeakerNestedSandbox": false
              }
            }
      managed-settings-comprehensive:
        content: |2
          // Comprehensive managed-settings.json — combines all security controls.
          // Reference: code.claude.com/docs/en/settings
          // Extends the official examples with practical deny rules, model
          // restrictions, org login enforcement, and MCP server controls.
            {
              "$schema": "https://json.schemastore.org/claude-code-settings.json",
              "permissions": {
                "disableBypassPermissionsMode": "disable",
                "deny": [
                  "Bash(curl *)",
                  "Bash(wget *)",
                  "Bash(rm -rf *)",
                  "Bash(ssh *)",
                  "Bash(scp *)",
                  "Read(./.env)",
                  "Read(./.env.*)",
                  "Read(./secrets/**)",
                  "Read(./credentials/**)",
                  "Read(~/.ssh/**)",
                  "Read(~/.aws/**)",
                  "WebSearch",
                  "WebFetch"
                ],
                "ask": [
                  "Bash"
                ],
                "allow": [
                  "Bash(npm run *)",
                  "Bash(npm test)",
                  "Bash(git status)",
                  "Bash(git diff *)",
                  "Bash(git log *)"
                ]
              },
              "allowManagedPermissionRulesOnly": true,
              "allowManagedHooksOnly": true,
              "strictKnownMarketplaces": [],
              "env": {
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
              },
              "model": "claude-sonnet-4-6",
              "availableModels": ["sonnet", "haiku"],
              "forceLoginMethod": "claudeai",
              "forceLoginOrgUUID": "REPLACE-WITH-YOUR-ORG-UUID",
              "cleanupPeriodDays": 7,
              "allowedMcpServers": [
                {"serverName": "github"},
                {"serverName": "memory"}
              ],
              "deniedMcpServers": [
                {"serverName": "filesystem"},
                {"serverName": "shell"},
                {"serverName": "puppeteer"}
              ],
              "allowManagedMcpServersOnly": true,
              "channelsEnabled": false,
              "disableAutoMode": "disable",
              "disableDeepLinkRegistration": "disable",
              "useAutoModeDuringPlan": false,
              "autoMode": {
                "environment": [
                  "Organization: REPLACE-WITH-YOUR-ORG. Primary use: software development",
                  "Source control: REPLACE-WITH-YOUR-SCM-HOST and all repos under it",
                  "Trusted internal domains: REPLACE-WITH-YOUR-INTERNAL-DOMAINS"
                ]
              },
              "blockedMarketplaces": [],
              "pluginTrustMessage": "Only IT-approved plugins are permitted.",
              "allowedHttpHookUrls": ["https://hooks.example.com/*"],
              "httpHookAllowedEnvVars": ["HOOK_AUTH_TOKEN"],
              "sandbox": {
                "enabled": true,
                "failIfUnavailable": true,
                "autoAllowBashIfSandboxed": false,
                "allowUnsandboxedCommands": false,
                "excludedCommands": ["docker"],
                "filesystem": {
                  "denyRead": ["~/.aws/credentials", "~/.ssh/id_*"],
                  "denyWrite": ["/etc", "/usr/local/bin"],
                  "allowWrite": ["/tmp/build"]
                },
                "network": {
                  "allowUnixSockets": [],
                  "allowAllUnixSockets": false,
                  "allowLocalBinding": false,
                  "allowedDomains": [
                    "github.com",
                    "*.npmjs.org",
                    "registry.yarnpkg.com"
                  ],
                  "allowManagedDomainsOnly": true
                },
                "enableWeakerNestedSandbox": false
              }
            }
      managed-settings-custom-scripts-audit:
        content: |2
          // Security note: Custom script settings that execute arbitrary commands.
          // These settings run shell scripts during Claude Code operation.
          // Audit any scripts referenced by these settings for injection risks.
          //
          // apiKeyHelper       — runs a script to generate auth headers for model requests
          // otelHeadersHelper  — runs a script to generate OpenTelemetry headers
          // awsAuthRefresh     — runs a script that modifies the .aws directory
          // awsCredentialExport — runs a script that outputs AWS credentials as JSON
          //
          // Recommendation: In managed settings, either omit these (use standard auth)
          // or restrict to vetted scripts at known paths. Monitor script contents
          // for changes via file integrity monitoring.
      managed-settings-automode-warning:
        content: |2
          // DANGER: autoMode.allow and autoMode.soft_deny REPLACE the entire default
          // rule lists when set. Setting soft_deny with a single entry discards ALL
          // built-in block rules: force push, data exfiltration, curl|bash, production
          // deploys, and every other default block rule become allowed.
          //
          // Safe approach:
          //   1. Run: claude auto-mode defaults — to get the full built-in lists
          //   2. Copy the entire list into your settings
          //   3. Add or remove individual rules
          //   4. Run: claude auto-mode config — to verify effective rules
          //   5. Run: claude auto-mode critique — to get AI feedback on custom rules
          //
          // Only autoMode.environment is safe to set without side effects — it does
          // not replace any default lists, only tells the classifier what is trusted.
          //
          // autoMode is NOT read from shared project settings (.claude/settings.json)
          // to prevent checked-in repos from injecting their own allow rules.
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-7.01-deploy-managed-settings.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-7.01-deploy-managed-settings.sh"
    excerpts:
      validate-managed-settings:
        content: |2
          # Locate the file-based managed settings directory for this OS
          STAGED=0
          if [[ -n "${HTH_CLAUDE_MANAGED_DIR:-}" ]]; then
            MANAGED_DIR="${HTH_CLAUDE_MANAGED_DIR}"; STAGED=1
          else
            case "$(uname -s)" in
              Darwin) MANAGED_DIR="/Library/Application Support/ClaudeCode" ;;
              Linux)  MANAGED_DIR="/etc/claude-code" ;;
              MINGW*|MSYS*|CYGWIN*) MANAGED_DIR="C:/Program Files/ClaudeCode" ;;
              *)
                fail "7.1 Unknown OS — cannot locate the managed settings directory"
                summary; exit 1
                ;;
            esac
          fi
          info "Checking file-based managed settings in: ${MANAGED_DIR}"
          
          # Base file first, then drop-ins in alphabetical order (hidden files ignored)
          SOURCES=()
          if [[ -f "${MANAGED_DIR}/managed-settings.json" ]]; then
            SOURCES+=("${MANAGED_DIR}/managed-settings.json")
          fi
          LC_COLLATE=C
          for f in "${MANAGED_DIR}/managed-settings.d/"*.json; do
            if [[ -f "${f}" ]]; then SOURCES+=("${f}"); fi
          done
          
          if [[ ${#SOURCES[@]} -eq 0 ]]; then
            fail "7.1 No managed-settings.json or managed-settings.d/*.json found — file-based managed settings are not deployed"
            summary; exit 1
          fi
          
          # Claude Code refuses to start when a managed file is not a JSON object
          for f in "${SOURCES[@]}"; do
            if jq -e 'type == "object"' "${f}" >/dev/null 2>&1; then
              pass "7.1 ${f} is a valid JSON object"
            else
              fail "7.1 ${f} is not a JSON object — Claude Code refuses to start when it cannot parse a managed file"
            fi
          done
          if [[ ${FAILED} -gt 0 ]]; then summary; exit 1; fi
          
          # Merge the sources the way Claude Code does
          MERGED=$(jq -s '
            def m($a; $b):
              if ($a|type) == "object" and ($b|type) == "object" then
                reduce ($b|keys[]) as $k ($a; .[$k] = m($a[$k]; $b[$k]))
              elif ($a|type) == "array" and ($b|type) == "array" then ($a + $b | unique)
              else $b end;
            reduce .[] as $x ({}; m(.; $x))' "${SOURCES[@]}")
          merged() { printf '%s' "${MERGED}" | jq "$@"; }
          
          # disableBypassPermissionsMode is read only under "permissions"; a root-level
          # copy is accepted by the file but never applied
          if [[ "$(merged -r 'has("disableBypassPermissionsMode")')" == "true" ]]; then
            fail "7.1 disableBypassPermissionsMode is at the root — Claude Code reads it only as permissions.disableBypassPermissionsMode"
          fi
          
          BYPASS=$(merged -r '.permissions.disableBypassPermissionsMode // "not set"')
          DENY_COUNT=$(merged '.permissions.deny // [] | length')
          DEFAULT_MODE=$(merged -r '.permissions.defaultMode // "not set"')
          MANAGED_PERMS_ONLY=$(merged -r 'if .allowManagedPermissionRulesOnly == null then "not set" else .allowManagedPermissionRulesOnly end')
          
          info "Merged policy (${#SOURCES[@]} file(s)):"
          info "  permissions.disableBypassPermissionsMode: ${BYPASS}"
          info "  permissions.deny rules: ${DENY_COUNT}"
          info "  permissions.defaultMode: ${DEFAULT_MODE}"
          info "  allowManagedPermissionRulesOnly: ${MANAGED_PERMS_ONLY}"
          
          if [[ "${BYPASS}" == "disable" ]]; then
            pass "7.1 Bypass permissions mode is disabled"
          else
            fail "7.1 permissions.disableBypassPermissionsMode is not \"disable\" — --dangerously-skip-permissions still works"
          fi
          
          if [[ "${DENY_COUNT}" -gt 0 ]]; then
            merged -r '.permissions.deny[]' | while IFS= read -r rule; do info "    - ${rule}"; done
            pass "7.1 Deny rules are configured (${DENY_COUNT} rules)"
          else
            fail "7.1 No permissions.deny rules in the managed policy"
          fi
          
          if [[ "${DEFAULT_MODE}" == "not set" ]]; then
            warn "7.1 permissions.defaultMode is not set in the managed policy"
          fi
          
          if [[ "${MANAGED_PERMS_ONLY}" == "true" ]]; then
            pass "7.1 Only managed permission rules are enforced"
          else
            warn "7.1 allowManagedPermissionRulesOnly is not enabled (see Control 7.2)"
          fi
          
          # Sources are first-wins by default: a higher-ranked source that carries any
          # policy key is used and this file is skipped without a warning
          if [[ ${STAGED} -eq 0 ]]; then
            if [[ -f "/Library/Managed Preferences/com.anthropic.claudecode.plist" ]]; then
              warn "7.1 An MDM profile (com.anthropic.claudecode) outranks this file — unless it sets managedSourcesBehavior: \"merge\", Claude Code skips the file"
            fi
            if command -v reg.exe >/dev/null 2>&1 && reg.exe query 'HKLM\SOFTWARE\Policies\ClaudeCode' >/dev/null 2>&1; then
              warn "7.1 An HKLM policy (SOFTWARE\\Policies\\ClaudeCode) outranks this file — unless it sets managedSourcesBehavior: \"merge\", Claude Code skips the file"
            fi
            info "Server-managed settings (claude.ai) also outrank this file; run /status in Claude Code and read the Setting sources line to confirm which source is in force"
          fi

"7.2":
  config:
    lang: "json"
    filename: "hth-anthropic-claude-7.02-permission-rules.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-7.02-permission-rules.jsonc"
    excerpts:
      permission-deny-rules:
        content: |2
          // Example permission deny/ask/allow rules for managed-settings.json
          // Deny blocks access. Ask prompts the user. Allow auto-approves.
          // Glob patterns: * matches files in one directory, ** matches recursively.
            {
              "permissions": {
                "deny": [
                  "Read(./.env)",
                  "Read(./.env.*)",
                  "Read(./secrets/**)",
                  "Read(./credentials/**)",
                  "Read(~/.ssh/**)",
                  "Read(~/.aws/**)",
                  "Bash(curl *)",
                  "Bash(wget *)",
                  "Bash(rm -rf *)",
                  "Bash(ssh *)",
                  "Bash(scp *)",
                  "Bash(nc *)",
                  "Bash(base64 *)",
                  "WebSearch",
                  "WebFetch"
                ],
                "ask": [
                  "Bash",
                  "Bash(git push *)",
                  "Bash(git commit *)",
                  "Bash(docker *)",
                  "Bash(kubectl *)"
                ],
                "allow": [
                  "Bash(npm run *)",
                  "Bash(npm test)",
                  "Bash(git status)",
                  "Bash(git diff *)",
                  "Bash(git log *)",
                  "Bash(ls *)",
                  "Bash(cat package.json)",
                  "Read",
                  "Edit"
                ]
              }
            }
      permission-agent-rules:
        content: |2
          // Agent() permission rules — control subagent spawning
          // Reference: code.claude.com/docs/en/permissions
          // Agent() rules follow the same deny/ask/allow evaluation as other tools.
          // Specifier is the subagent_type name from the Agent tool definition.
          // Use this to prevent Claude from spawning unrestricted background agents.
            {
              "permissions": {
                "deny": [
                  "Agent(general-purpose)",
                  "Agent(BrowserAgent)"
                ],
                "ask": [
                  "Agent"
                ],
                "allow": [
                  "Agent(Explore)",
                  "Agent(Plan)"
                ]
              }
            }
      permission-deny-limitations:
        content: |2
          // Security note: Permission deny rules have tool-specific scope.
          // Read(./.env) only blocks the Read tool — it does NOT prevent:
          //   Bash(cat .env)    — the Bash tool is a separate permission
          //   Bash(grep -r PASSWORD .env)
          //   Bash(base64 .env)
          //
          // To fully protect sensitive files, you MUST combine:
          //   1. Read() deny rules for the Read tool
          //   2. Bash() deny rules for common exfiltration commands (curl, cat, etc.)
          //   3. Sandbox filesystem.denyRead for OS-level enforcement (strongest)
          //
          // Only sandbox denyRead provides true defense-in-depth because it operates
          // at the OS level and cannot be bypassed by creative Bash commands.
          //
          // Also note: permissions.additionalDirectories grants Claude Code
          // access to directories outside the project root. If set, ensure deny
          // rules also cover those paths (e.g., Read(/data/secrets/**)).
      permission-enforcement:
        content: |2
          // Enforce managed-only permission rules
          // Reference: code.claude.com/docs/en/settings
          // When allowManagedPermissionRulesOnly is true, user and project
          // settings cannot define allow, ask, or deny rules — only rules
          // from managed settings apply.
            {
              "permissions": {
                "disableBypassPermissionsMode": "disable",
                "defaultMode": "default"
              },
              "allowManagedPermissionRulesOnly": true,
              "allowManagedHooksOnly": true,
              "disableAllHooks": false
            }
      sandbox-config:
        content: |2
          // OS-level bash sandbox configuration (L3 — Run)
          // Reference: code.claude.com/docs/en/sandboxing
          // Sandboxing provides filesystem and network isolation for Bash commands.
          // Platform support:
          //   macOS:     Seatbelt (built-in, no install needed)
          //   Linux/WSL2: bubblewrap (apt install bubblewrap socat)
          //   Windows:   Not yet supported
            {
              "sandbox": {
                "enabled": true,
                "autoAllowBashIfSandboxed": false,
                "allowUnsandboxedCommands": false,
                "excludedCommands": [
                  "docker"
                ],
                "network": {
                  "allowUnixSockets": [],
                  "allowAllUnixSockets": false,
                  "allowLocalBinding": false,
                  "allowedDomains": [
                    "*.npmjs.org",
                    "registry.npmjs.org",
                    "github.com"
                  ]
                },
                "enableWeakerNestedSandbox": false
              }
            }
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-7.02-restrict-permissions.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-7.02-restrict-permissions.sh"
    excerpts:
      validate-permissions:
        content: |2
          # Validate permission configuration on this machine
          if [[ -n "${HTH_CLAUDE_MANAGED_DIR:-}" ]]; then
            MANAGED_DIR="${HTH_CLAUDE_MANAGED_DIR}"
          else
            case "$(uname -s)" in
              Darwin)  MANAGED_DIR="/Library/Application Support/ClaudeCode" ;;
              Linux)   MANAGED_DIR="/etc/claude-code" ;;
              MINGW*|MSYS*|CYGWIN*) MANAGED_DIR="C:/Program Files/ClaudeCode" ;;
              *) fail "7.2 Unknown OS — cannot locate the managed settings directory"; summary; exit 1 ;;
            esac
          fi
          
          # Base file first, then drop-ins in alphabetical order (hidden files ignored)
          SOURCES=()
          if [[ -f "${MANAGED_DIR}/managed-settings.json" ]]; then
            SOURCES+=("${MANAGED_DIR}/managed-settings.json")
          fi
          LC_COLLATE=C
          for f in "${MANAGED_DIR}/managed-settings.d/"*.json; do
            if [[ -f "${f}" ]]; then SOURCES+=("${f}"); fi
          done
          
          if [[ ${#SOURCES[@]} -eq 0 ]]; then
            fail "7.2 No managed-settings.json or managed-settings.d/*.json in ${MANAGED_DIR} — permissions are not restricted by managed policy"
            summary; exit 1
          fi
          
          MERGED=$(jq -s '
            def m($a; $b):
              if ($a|type) == "object" and ($b|type) == "object" then
                reduce ($b|keys[]) as $k ($a; .[$k] = m($a[$k]; $b[$k]))
              elif ($a|type) == "array" and ($b|type) == "array" then ($a + $b | unique)
              else $b end;
            reduce .[] as $x ({}; m(.; $x))' "${SOURCES[@]}") || {
            fail "7.2 A managed settings file is not valid JSON"; summary; exit 1
          }
          merged() { printf '%s' "${MERGED}" | jq "$@"; }
          
          DENY_COUNT=$(merged '.permissions.deny // [] | length')
          ALLOW_COUNT=$(merged '.permissions.allow // [] | length')
          ASK_COUNT=$(merged '.permissions.ask // [] | length')
          info "Permission rules across ${#SOURCES[@]} file(s): deny=${DENY_COUNT}, allow=${ALLOW_COUNT}, ask=${ASK_COUNT}"
          
          if [[ "${DENY_COUNT}" -gt 0 ]]; then
            pass "7.2 Deny rules configured (${DENY_COUNT} rules)"
          else
            fail "7.2 No deny rules — sensitive files and commands are unrestricted"
          fi
          
          PERMS_ONLY=$(merged -r '.allowManagedPermissionRulesOnly // false')
          if [[ "${PERMS_ONLY}" == "true" ]]; then
            pass "7.2 Managed-only permission rules enforced"
          else
            fail "7.2 allowManagedPermissionRulesOnly is not enabled — users can add their own allow rules"
          fi
          
          # Step 2.3: bypass mode must be disabled inside the permissions object
          if [[ "$(merged -r 'has("disableBypassPermissionsMode")')" == "true" ]]; then
            fail "7.2 disableBypassPermissionsMode is at the root — Claude Code reads it only as permissions.disableBypassPermissionsMode"
          fi
          BYPASS=$(merged -r '.permissions.disableBypassPermissionsMode // "not set"')
          if [[ "${BYPASS}" == "disable" ]]; then
            pass "7.2 Bypass permissions mode is disabled"
          else
            fail "7.2 permissions.disableBypassPermissionsMode is not \"disable\""
          fi
          
          SANDBOX_ENABLED=$(merged -r '.sandbox.enabled // false')
          if [[ "${SANDBOX_ENABLED}" == "true" ]]; then
            pass "7.2 Bash sandbox is enabled"
            # jq's // treats false as missing, so read the boolean explicitly (default: true)
            UNSANDBOXED=$(merged -r 'if .sandbox.allowUnsandboxedCommands == null then true else .sandbox.allowUnsandboxedCommands end')
            if [[ "${UNSANDBOXED}" == "false" ]]; then
              pass "7.2 Unsandboxed command escape hatch is disabled"
            else
              warn "7.2 sandbox.allowUnsandboxedCommands is not false — users can bypass the sandbox"
            fi
          else
            info "7.2 Bash sandbox is not enabled (optional L3 control)"
          fi

"7.3":
  config:
    lang: "json"
    filename: "hth-anthropic-claude-7.03-mcp-access.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-7.03-mcp-access.jsonc"
    excerpts:
      managed-mcp-config:
        content: |2
          // managed-mcp.json — exclusive MCP server control
          // Reference: code.claude.com/docs/en/mcp#managed-mcp-configuration
          // When this file exists at the system path, it takes exclusive control:
          // users cannot add, modify, or use any MCP servers not defined here.
          // Deploy alongside managed-settings.json at the same OS-specific path:
          //   macOS:   /Library/Application Support/ClaudeCode/managed-mcp.json
          //   Linux:   /etc/claude-code/managed-mcp.json
          //   Windows: C:\Program Files\ClaudeCode\managed-mcp.json
          //
          // Note: Server-managed settings cannot distribute MCP server configs —
          // this file must be deployed via MDM, Group Policy, or Ansible.
            {
              "mcpServers": {
                "approved-github": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-github"],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                },
                "approved-postgres": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-postgres"],
                  "env": {
                    "DATABASE_URL": "${APPROVED_DB_URL}"
                  }
                }
              }
            }
      mcp-allowlist-denylist:
        content: |2
          // MCP server allowlist/denylist via managed-settings.json
          // Reference: code.claude.com/docs/en/settings#mcp-configuration-managed
          // Use this when you want guardrails without exclusive MCP control.
          // Deny rules always take precedence over allow rules.
          // undefined = no restrictions; empty array [] = complete lockdown.
          // allowManagedMcpServersOnly: true makes this allowlist authoritative. Without
          // it, allowlists from every settings scope merge (including a user's own
          // ~/.claude/settings.json), so a user can broaden what this list permits.
          // Denylists merge from every scope regardless.
          // Reference: code.claude.com/docs/en/managed-mcp
            {
              "allowedMcpServers": [
                {"serverName": "github"},
                {"serverName": "memory"},
                {"serverName": "postgres"}
              ],
              "deniedMcpServers": [
                {"serverName": "filesystem"},
                {"serverName": "shell"},
                {"serverName": "puppeteer"}
              ],
              "allowManagedMcpServersOnly": true,
              "enableAllProjectMcpServers": false
            }
      mcp-project-server-control:
        content: |2
          // Granular control over project-level MCP servers (.mcp.json)
          // Reference: code.claude.com/docs/en/settings
          // By default, Claude Code prompts users to approve .mcp.json servers.
          // enableAllProjectMcpServers: true auto-approves all project MCP servers.
          // For fine-grained control, use enabledMcpjsonServers / disabledMcpjsonServers
          // to pre-approve or block specific server names from .mcp.json files.
          // Both lists take plain server-name strings (not {"serverName": ...} objects,
          // which fail validation and are dropped from a managed file).
            {
              "enableAllProjectMcpServers": false,
              "enabledMcpjsonServers": ["github", "memory"],
              "disabledMcpjsonServers": ["filesystem", "shell", "puppeteer", "everything"],
              "allowManagedMcpServersOnly": true
            }
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-7.03-control-mcp-access.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-7.03-control-mcp-access.sh"
    excerpts:
      validate-mcp-access:
        content: |2
          # Validate MCP configuration on this machine
          if [[ -n "${HTH_CLAUDE_MANAGED_DIR:-}" ]]; then
            MANAGED_DIR="${HTH_CLAUDE_MANAGED_DIR}"
          else
            case "$(uname -s)" in
              Darwin) MANAGED_DIR="/Library/Application Support/ClaudeCode" ;;
              Linux)  MANAGED_DIR="/etc/claude-code" ;;
              MINGW*|MSYS*|CYGWIN*) MANAGED_DIR="C:/Program Files/ClaudeCode" ;;
              *) fail "7.3 Unknown OS — cannot locate the managed settings directory"; summary; exit 1 ;;
            esac
          fi
          
          # managed-mcp.json takes exclusive control: users cannot add other servers
          EXCLUSIVE=0
          MCP_PATH="${MANAGED_DIR}/managed-mcp.json"
          if [[ -f "${MCP_PATH}" ]]; then
            if jq -e '(.mcpServers | type) == "object"' "${MCP_PATH}" >/dev/null 2>&1; then
              EXCLUSIVE=1
              SERVER_COUNT=$(jq '.mcpServers | length' "${MCP_PATH}")
              pass "7.3 managed-mcp.json deployed — exclusive control, ${SERVER_COUNT} approved MCP servers"
              jq -r '.mcpServers | keys[]' "${MCP_PATH}" | while IFS= read -r server; do info "  - ${server}"; done
            else
              fail "7.3 managed-mcp.json exists but is not a JSON object with an mcpServers map"
            fi
          else
            info "7.3 No managed-mcp.json — checking the allowlist/denylist in managed settings"
          fi
          
          # Managed settings: base file first, then drop-ins in alphabetical order
          SOURCES=()
          if [[ -f "${MANAGED_DIR}/managed-settings.json" ]]; then
            SOURCES+=("${MANAGED_DIR}/managed-settings.json")
          fi
          LC_COLLATE=C
          for f in "${MANAGED_DIR}/managed-settings.d/"*.json; do
            if [[ -f "${f}" ]]; then SOURCES+=("${f}"); fi
          done
          
          if [[ ${#SOURCES[@]} -eq 0 ]]; then
            if [[ ${EXCLUSIVE} -eq 1 ]]; then
              info "7.3 No managed settings file — MCP is governed by managed-mcp.json alone"
            else
              fail "7.3 No managed-mcp.json and no managed settings — MCP is uncontrolled"
            fi
            summary
            if [[ ${FAILED} -eq 0 ]]; then exit 0; fi
            exit 1
          fi
          
          MERGED=$(jq -s '
            def m($a; $b):
              if ($a|type) == "object" and ($b|type) == "object" then
                reduce ($b|keys[]) as $k ($a; .[$k] = m($a[$k]; $b[$k]))
              elif ($a|type) == "array" and ($b|type) == "array" then ($a + $b | unique)
              else $b end;
            reduce .[] as $x ({}; m(.; $x))' "${SOURCES[@]}") || {
            fail "7.3 A managed settings file is not valid JSON"; summary; exit 1
          }
          merged() { printf '%s' "${MERGED}" | jq "$@"; }
          
          ALLOWED=$(merged '.allowedMcpServers // [] | length')
          DENIED=$(merged '.deniedMcpServers // [] | length')
          LOCKED=$(merged -r '.allowManagedMcpServersOnly // false')
          info "MCP allowlist: ${ALLOWED} servers, denylist: ${DENIED} servers, allowManagedMcpServersOnly: ${LOCKED}"
          
          if [[ ${EXCLUSIVE} -eq 0 ]] && [[ "${ALLOWED}" -eq 0 ]] && [[ "${DENIED}" -eq 0 ]]; then
            fail "7.3 No managed-mcp.json, allowlist, or denylist — all MCP servers are permitted"
          fi
          
          if [[ "${DENIED}" -gt 0 ]]; then
            pass "7.3 MCP deny rules configured (${DENIED} servers blocked)"
          fi
          
          if [[ "${ALLOWED}" -gt 0 ]]; then
            if [[ "${LOCKED}" == "true" ]]; then
              pass "7.3 MCP allowlist configured and authoritative (${ALLOWED} servers approved)"
            elif [[ ${EXCLUSIVE} -eq 1 ]]; then
              info "7.3 allowedMcpServers is set without allowManagedMcpServersOnly; managed-mcp.json still holds exclusive control"
            else
              fail "7.3 MCP allowlist is soft — without allowManagedMcpServersOnly: true, users can broaden it in ~/.claude/settings.json"
            fi
          elif [[ "${DENIED}" -gt 0 ]] && [[ ${EXCLUSIVE} -eq 0 ]]; then
            warn "7.3 Denylist only — any MCP server not on the denylist is permitted"
          fi
          
          if [[ "${LOCKED}" == "true" ]] && [[ "${ALLOWED}" -eq 0 ]] && [[ ${EXCLUSIVE} -eq 0 ]]; then
            warn "7.3 allowManagedMcpServersOnly is true but no managed allowedMcpServers list was found in these files"
          fi
          
          # jq's // treats false as missing, so read the boolean explicitly
          AUTO_APPROVE=$(merged -r 'if .enableAllProjectMcpServers == null then "not set" else .enableAllProjectMcpServers end')
          if [[ "${AUTO_APPROVE}" == "true" ]]; then
            warn "7.3 enableAllProjectMcpServers is true — project MCP servers auto-approved"
          elif [[ "${AUTO_APPROVE}" == "false" ]]; then
            pass "7.3 Project MCP servers require explicit approval"
          fi

"7.4":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-7.04-monitor-claude-code-usage.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-7.04-monitor-claude-code-usage.sh"
    excerpts:
      api-claude-code-analytics:
        content: |2
          # Fetch per-user Claude Code analytics for a given day
          # Usage: set REPORT_DATE (or ANTHROPIC_REPORT_DATE) to YYYY-MM-DD; defaults to yesterday (UTC)
          REPORT_DATE="${REPORT_DATE:-${ANTHROPIC_REPORT_DATE:-$(date -u -d 'yesterday' '+%Y-%m-%d' 2>/dev/null || \
                                                                 date -u -v-1d '+%Y-%m-%d' 2>/dev/null)}}"
          if ! [[ "${REPORT_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            fail "7.4 REPORT_DATE must be YYYY-MM-DD (got: ${REPORT_DATE})"
            summary; exit 1
          fi
          
          # GET one page of the report. The admin key reaches curl as a header file
          # (-H @<(...)), never as an argument, so it never appears in `ps` output.
          # Returns non-zero on a transport error, a timeout, or any non-200 status.
          cc_get() {
            local url="$1" resp code
            resp=$(curl -sS --max-time "${ANTHROPIC_HTTP_TIMEOUT:-30}" -w '\n%{http_code}' "${url}" \
              -H @<(printf 'x-api-key: %s\n' "${ANTHROPIC_ADMIN_KEY}") \
              -H "anthropic-version: ${ANTHROPIC_VERSION}") || return 1
            code="${resp##*$'\n'}"
            resp="${resp%$'\n'*}"
            if [[ "${code}" != "200" ]]; then
              echo "HTTP ${code}: $(printf '%s' "${resp}" | jq -r '.error.message? // empty' 2>/dev/null)" >&2
              return 1
            fi
            printf '%s' "${resp}"
          }
          
          # Follow has_more / next_page until the whole day is retrieved (limit max 1000)
          info "Fetching Claude Code analytics for ${REPORT_DATE}..."
          ALL='[]'; PAGE=""; PAGES=0
          while :; do
            QUERY="starting_at=${REPORT_DATE}&limit=1000"
            if [[ -n "${PAGE}" ]]; then
              QUERY="${QUERY}&page=$(jq -rn --arg p "${PAGE}" '$p | @uri')"
            fi
            RESP=$(cc_get "${ANTHROPIC_API_BASE}/v1/organizations/usage_report/claude_code?${QUERY}") || {
              fail "7.4 Failed to fetch Claude Code analytics (page $((PAGES + 1)))"
              summary; exit 1
            }
            if ! printf '%s' "${RESP}" | jq -e '(.data | type) == "array"' >/dev/null 2>&1; then
              fail "7.4 Analytics response has no data array"
              summary; exit 1
            fi
            ALL=$(printf '%s\n%s\n' "${ALL}" "${RESP}" | jq -cs '.[0] + .[1].data')
            PAGES=$((PAGES + 1))
            [[ "$(printf '%s' "${RESP}" | jq -r '.has_more // false')" == "true" ]] || break
            PAGE=$(printf '%s' "${RESP}" | jq -r '.next_page // empty')
            if [[ -z "${PAGE}" ]] || [[ ${PAGES} -ge 1000 ]]; then
              fail "7.4 has_more=true without a usable next_page — refusing to report a partial day"
              summary; exit 1
            fi
          done
          ANALYTICS=$(printf '%s' "${ALL}" | jq -c '{data: .}')
          an() { printf '%s' "${ANALYTICS}" | jq "$@"; }
          
          RECORD_COUNT=$(an '.data | length')
          info "Found ${RECORD_COUNT} user records for ${REPORT_DATE} (${PAGES} page(s))"
          if [[ "${RECORD_COUNT}" -eq 0 ]]; then
            fail "7.4 0 Claude Code records for ${REPORT_DATE} — no activity was captured; confirm the day had Claude Code use and the key is for the right organization, then re-run with that date"
            summary; exit 1
          fi
          
          # Per-user summary (api_actor rows are identified by their API key name)
          {
            printf 'USER\tTERMINAL\tSESSIONS\tCOMMITS\tPRS\tLOC_ADD\tLOC_DEL\n'
            an -r '.data[] | [
              (.actor.email_address // .actor.api_key_name // "unknown"),
              (.terminal_type // "n/a"),
              (.core_metrics.num_sessions // 0),
              (.core_metrics.commits_by_claude_code // 0),
              (.core_metrics.pull_requests_by_claude_code // 0),
              (.core_metrics.lines_of_code.added // 0),
              (.core_metrics.lines_of_code.removed // 0)
            ] | @tsv'
          } | column -t -s $'\t'
          
          pass "7.4 Claude Code analytics retrieved"
      api-tool-acceptance:
        content: |2
          # Analyze tool acceptance rates — low acceptance may indicate
          # overly permissive settings or developer friction
          info "Analyzing tool acceptance rates..."
          {
            printf 'USER\tTOOL\tACCEPTED\tREJECTED\tRATE\n'
            an -r '.data[] |
              (.actor.email_address // .actor.api_key_name // "unknown") as $user |
              .tool_actions // {} | to_entries[] |
              [$user, .key, (.value.accepted // 0), (.value.rejected // 0),
               (if ((.value.accepted // 0) + (.value.rejected // 0)) > 0
                then ((.value.accepted // 0) * 100 / ((.value.accepted // 0) + (.value.rejected // 0)) | floor | tostring) + "%"
                else "n/a" end)] | @tsv'
          } | column -t -s $'\t'
          
          # Flag users with low acceptance rates (below 70%); only combinations with >5 decisions are assessed
          ASSESSED=$(an '[.data[] | .tool_actions // {} | to_entries[] |
            select(((.value.accepted // 0) + (.value.rejected // 0)) > 5)] | length')
          LOW_ACCEPTANCE=$(an '[.data[] |
            (.actor.email_address // .actor.api_key_name // "unknown") as $user |
            .tool_actions // {} | to_entries[] |
            {user: $user, tool: .key, accepted: (.value.accepted // 0), rejected: (.value.rejected // 0)} |
            select((.accepted + .rejected) > 5) |
            select((.accepted / (.accepted + .rejected)) < 0.7)]')
          
          LOW_COUNT=$(printf '%s' "${LOW_ACCEPTANCE}" | jq 'length')
          if [[ "${ASSESSED}" -eq 0 ]]; then
            warn "7.4 No user/tool combination had more than 5 decisions — acceptance rates not assessed"
          elif [[ "${LOW_COUNT}" -gt 0 ]]; then
            warn "7.4 ${LOW_COUNT} of ${ASSESSED} user/tool combinations have <70% acceptance rate — review permission configuration"
          else
            pass "7.4 All ${ASSESSED} assessed user/tool combinations have >=70% acceptance"
          fi
      api-cost-by-model:
        content: |2
          # Cost breakdown by model across all Claude Code users
          info "Cost breakdown by model:"
          an -r '[.data[].model_breakdown[]? |
            {model: .model, cost: ((.estimated_cost.amount // 0) / 100)}] |
            group_by(.model) | .[] |
            {model: .[0].model, total_cost: ([.[].cost] | add | . * 100 | round / 100)} |
            "  \(.model): $\(.total_cost)"'
          
          # Total cost for the day
          TOTAL_COST=$(an '[.data[].model_breakdown[]?.estimated_cost.amount // 0] | add // 0 | . / 100 | . * 100 | round / 100')
          info "Total Claude Code cost for ${REPORT_DATE}: \$${TOTAL_COST}"
          pass "7.4 Cost analysis complete"

"7.5":
  config:
    lang: "json"
    filename: "hth-anthropic-claude-7.05-sandbox-isolation.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-7.05-sandbox-isolation.jsonc"
    excerpts:
      sandbox-hardened:
        content: |2
          // L2 Walk sandbox configuration.
          // Locks filesystem to CWD, denies sensitive credential paths,
          // restricts network to approved domains only.
            {
              "sandbox": {
                "enabled": true,
                "failIfUnavailable": true,
                "autoAllowBashIfSandboxed": false,
                "allowUnsandboxedCommands": false,
                "excludedCommands": ["docker", "git"],
                "filesystem": {
                  "denyRead": [
                    "~/.aws/credentials",
                    "~/.ssh/id_*",
                    "~/.gnupg/",
                    "~/.config/gcloud/",
                    "~/.kube/config"
                  ],
                  "denyWrite": [
                    "/etc",
                    "/usr/local/bin",
                    "~/.claude/managed-settings.json"
                  ],
                  "allowWrite": [
                    "/tmp/build"
                  ]
                },
                "network": {
                  "allowedDomains": [
                    "github.com",
                    "*.githubusercontent.com",
                    "*.npmjs.org",
                    "registry.yarnpkg.com",
                    "pypi.org",
                    "files.pythonhosted.org"
                  ],
                  "allowManagedDomainsOnly": true,
                  "allowAllUnixSockets": false,
                  "allowUnixSockets": [],
                  "allowLocalBinding": false
                },
                "enableWeakerNestedSandbox": false
              }
            }
      sandbox-maximum:
        content: |2
          // L3 Run sandbox configuration.
          // No unsandboxed commands, no excluded commands, strict filesystem
          // and network lockdown. Suitable for regulated environments.
            {
              "sandbox": {
                "enabled": true,
                "failIfUnavailable": true,
                "autoAllowBashIfSandboxed": false,
                "allowUnsandboxedCommands": false,
                "excludedCommands": [],
                "filesystem": {
                  "denyRead": [
                    "~/.aws/",
                    "~/.ssh/",
                    "~/.gnupg/",
                    "~/.config/gcloud/",
                    "~/.kube/",
                    "~/.docker/config.json",
                    "~/.npmrc",
                    "~/.pypirc"
                  ],
                  "allowManagedReadPathsOnly": true,
                  "denyWrite": [
                    "/etc",
                    "/usr",
                    "/var",
                    "~/.claude/"
                  ],
                  "allowWrite": []
                },
                "network": {
                  "allowedDomains": [],
                  "allowManagedDomainsOnly": true,
                  "allowAllUnixSockets": false,
                  "allowUnixSockets": [],
                  "allowLocalBinding": false
                },
                "enableWeakerNestedSandbox": false,
                "enableWeakerNetworkIsolation": false
              }
            }

"7.6":
  config:
    lang: "json"
    filename: "hth-anthropic-claude-7.06-hooks-plugins.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-7.06-hooks-plugins.jsonc"
    excerpts:
      hooks-plugins-hardened:
        content: |2
          // L2 Walk hook and plugin lockdown.
          // Only managed hooks execute; plugin installs restricted to
          // approved marketplaces; HTTP hooks limited to internal URLs.
            {
              "allowManagedHooksOnly": true,
              "allowedHttpHookUrls": [
                "https://hooks.example.com/*",
                "https://security.example.com/api/*"
              ],
              "httpHookAllowedEnvVars": [
                "HOOK_AUTH_TOKEN"
              ],
              "strictKnownMarketplaces": [
                {
                  "source": "github",
                  "repo": "your-org/approved-plugins"
                }
              ],
              "blockedMarketplaces": [
                {
                  "source": "github",
                  "repo": "untrusted-org/plugins"
                }
              ],
              "pluginTrustMessage": "Only plugins approved by the security team are permitted. Contact #security-approvals for new plugin requests."
            }
      hooks-plugins-maximum:
        content: |2
          // L3 Run — no plugins, no hooks, no HTTP hook URLs.
          // Complete lockdown of extensibility surface.
            {
              "allowManagedHooksOnly": true,
              "disableAllHooks": false,
              "allowedHttpHookUrls": [],
              "httpHookAllowedEnvVars": [],
              "strictKnownMarketplaces": [],
              "blockedMarketplaces": [],
              "pluginTrustMessage": "Plugin installation is disabled by organizational policy.",
              "allowManagedMcpServersOnly": true,
              "allowManagedPermissionRulesOnly": true
            }

"7.7":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-7.07-prompt-injection-defense.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-7.07-prompt-injection-defense.sh"
    excerpts:
      scan-rules-files:
        content: |2
          set -euo pipefail
          
          TARGET_DIR="${1:-.}"
          FINDINGS=0
          
          # A typo'd path must not read as a clean scan
          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: scan target is not a directory: $TARGET_DIR" >&2
            exit 2
          fi
          
          echo "=== Claude Code Rules File Security Scanner ==="
          echo "Scanning: ${TARGET_DIR}"
          echo ""
          
          # Patterns commonly found in prompt injection attacks against AI coding agents.
          # Sources: Pillar Security "Rules File Backdoor" (2025), Snyk ToxicSkills (2026),
          # Lasso Security indirect prompt injection research (2026).
          SUSPICIOUS_PATTERNS=(
            # Data exfiltration via network commands
            'curl\s+.*\$'
            'wget\s+.*\$'
            'fetch\(.*\$'
            'nc\s+-'
            # Encoded payloads hiding instructions
            'base64\s+--decode'
            'eval\s*\('
            'exec\s*\('
            # Invisible Unicode characters used to hide instructions. $'...' (ANSI-C
            # quoting) turns each escape into the raw UTF-8 bytes; grep treats a plain
            # '\xe2...' string as literal text and would never match.
            $'\xe2\x80\x8b'   # zero-width space (U+200B)
            $'\xe2\x80\x8c'   # zero-width non-joiner (U+200C)
            $'\xe2\x80\x8d'   # zero-width joiner (U+200D)
            $'\xef\xbb\xbf'   # BOM / zero-width no-break space (U+FEFF)
            # Bidirectional controls that reorder how text displays (Trojan Source)
            $'\xe2\x80\xaa'   # left-to-right embedding (U+202A)
            $'\xe2\x80\xab'   # right-to-left embedding (U+202B)
            $'\xe2\x80\xac'   # pop directional formatting (U+202C)
            $'\xe2\x80\xad'   # left-to-right override (U+202D)
            $'\xe2\x80\xae'   # right-to-left override (U+202E)
            $'\xe2\x81\xa6'   # left-to-right isolate (U+2066)
            $'\xe2\x81\xa7'   # right-to-left isolate (U+2067)
            $'\xe2\x81\xa8'   # first strong isolate (U+2068)
            $'\xe2\x81\xa9'   # pop directional isolate (U+2069)
            # Instruction override attempts
            'ignore\s+(all\s+)?previous\s+instructions'
            'disregard\s+(all\s+)?prior'
            'override\s+system\s+prompt'
            'you\s+are\s+now\s+in\s+.*mode'
            'new\s+instructions:'
            'IMPORTANT:\s*override'
            # Exfiltration via MCP or tool abuse
            'mcp.*install.*--force'
            'plugin.*install.*--trust'
            # Requests to disable safety
            'dangerously-skip-permissions'
            'bypass.*permission'
            'disable.*safety'
            'allow.*all.*commands'
          )
          
          # Files to scan: CLAUDE.md, AGENTS.md, skills, hooks, and plugin configs
          SCAN_FILES=()
          while IFS= read -r -d '' file; do
            SCAN_FILES+=("$file")
          done < <(find "$TARGET_DIR" \
            \( -name "CLAUDE.md" -o -name "AGENTS.md" -o -name "GEMINI.md" \
               -o -name "COPILOT.md" -o -name "*.skill.md" -o -name "SKILL.md" \
               -o -path "*/.claude/settings.json" \
               -o -path "*/.claude/settings.local.json" \
               -o -path "*/.claude/agents/*.md" \
               -o -path "*/.claude/commands/*.md" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -print0 2>/dev/null)
          
          if [ ${#SCAN_FILES[@]} -eq 0 ]; then
            echo "No rules files found to scan."
            exit 0
          fi
          
          echo "Found ${#SCAN_FILES[@]} rules file(s) to scan."
          echo ""
          
          for file in "${SCAN_FILES[@]}"; do
            echo "--- Scanning: ${file} ---"
            for pattern in "${SUSPICIOUS_PATTERNS[@]}"; do
              # LC_ALL=C makes grep match raw bytes, so multibyte patterns match in any locale
              matches=$(LC_ALL=C grep -cEi "$pattern" "$file" 2>/dev/null || true)
              if [ "${matches:-0}" -gt 0 ]; then
                # cat -v renders invisible bytes visibly (e.g. U+200B prints as M-bM-^@M-^K)
                echo "  [ALERT] Pattern matched ($matches occurrences): $(printf '%s' "$pattern" | LC_ALL=C cat -v)"
                { LC_ALL=C grep -nEi "$pattern" "$file" 2>/dev/null || true; } | head -3 | LC_ALL=C cat -v | while read -r line; do
                  echo "    $line"
                done
                FINDINGS=$((FINDINGS + matches))
              fi
            done
          done
          
          echo ""
          echo "=== Scan Complete ==="
          echo "Total suspicious patterns found: ${FINDINGS}"
          
          if [ "$FINDINGS" -gt 0 ]; then
            echo ""
            echo "ACTION REQUIRED: Review flagged patterns before trusting this repository."
            echo "Not all findings are malicious — review context carefully."
            echo "See: howtoharden.com/guides/anthropic-claude/#77"
            exit 1
          fi
          
          echo "No suspicious patterns detected."
          exit 0

"7.8":
  config:
    lang: "yaml"
    filename: "hth-anthropic-claude-7.08-cicd-hardening.yml"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-7.08-cicd-hardening.yml"
    excerpts:
      cicd-hardened-workflow:
        content: |2
          name: Hardened Claude Code CI
          on:
            pull_request:
              types: [opened, synchronize]
          
          permissions: {}
          
          jobs:
            security-review:
              runs-on: ubuntu-latest
              permissions:
                contents: read
                pull-requests: write
                issues: read
              steps:
                # Network egress monitoring via StepSecurity Harden-Runner.
                # Builds a baseline of allowed outbound connections and blocks
                # any future calls not in the baseline.
                # Source: github.com/step-security/harden-runner (Apache-2.0)
                - name: Harden Runner
                  uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
                  with:
                    egress-policy: audit
                    allowed-endpoints: >
                      api.anthropic.com:443
                      github.com:443
                      api.github.com:443
                      objects.githubusercontent.com:443
          
                - name: Checkout
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
                  with:
                    fetch-depth: 0
          
                # Claude Code security review analyzes PR diffs for vulnerabilities.
                # Source: github.com/anthropics/claude-code-security-review (MIT)
                # WARNING: Only use on trusted PRs — not hardened against prompt injection.
                # The repo publishes no release tags; pin to a reviewed commit on main.
                # Inputs are kebab-case: claude-api-key (required), claude-model, comment-pr.
                - name: Claude Security Review
                  uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda  # main @ 2026-02-11
                  with:
                    claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
                    claude-model: claude-sonnet-4-6
                    comment-pr: true
      cicd-claude-code-action:
        content: |2
          claude-code-task:
            runs-on: ubuntu-latest
            permissions:
              contents: read
              pull-requests: write
              issues: read
            steps:
              - name: Harden Runner
                uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
                with:
                  egress-policy: audit
                  allowed-endpoints: >
                    api.anthropic.com:443
                    github.com:443
                    api.github.com:443
          
              - name: Checkout
                uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
          
              # Claude Code Action runs Claude as a CI agent.
              # Source: github.com/anthropics/claude-code-action (MIT)
              # v1 has no model/allowed_tools/disallowed_tools/max_turns inputs (GitHub
              # ignores undeclared inputs with only a warning). Pass model, tool scoping
              # and the turn limit as Claude CLI flags through claude_args instead.
              - name: Claude Code
                uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6  # v1 (tag target on 2026-09-24)
                with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  claude_args: >-
                    --model claude-sonnet-4-6
                    --allowedTools "Read,Glob,Grep,Agent"
                    --disallowedTools "Bash,WebFetch,WebSearch"
                    --max-turns 10

"7.9":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-7.09-external-sandbox.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-7.09-external-sandbox.sh"
    excerpts:
      nono-setup:
        content: |2
          # ── nono: Kernel-Enforced Agent Sandbox ──
          # Source: github.com/nolabs-ai/nono (Apache-2.0)
          # Platforms: macOS (Seatbelt), Linux (Landlock)
          # Docs: docs.nono.sh
          
          # Install nono via Homebrew (only when run with --install)
          if [[ "${1:-}" == "--install" ]]; then
            brew install nono
          fi
          
          # Run Claude Code inside nono with the built-in profile.
          # The claude-code profile grants:
          #   - Read/write to CWD only
          #   - Network access via allowlisted proxy
          #   - Credential injection without disk exposure
          #   - Filesystem snapshots for atomic rollback
          nono run --profile claude-code -- claude
          
          # Custom hardened invocation:
          #   --rollback        Enable filesystem snapshot/restore
          #   --proxy-credential Inject API key via HTTPS proxy (never touches disk)
          #   --supervised      Require interactive approval for flagged operations
          nono run \
            --profile claude-code \
            --rollback \
            --proxy-credential anthropic-api-key \
            --supervised \
            -- claude
          
          # Audit trail: review all actions taken during a session
          nono audit list
          nono audit show "${NONO_SESSION_ID:?set NONO_SESSION_ID to a session id from 'nono audit list'}" --json
          
          # Rollback: restore filesystem to pre-session state
          nono rollback list
          nono rollback restore
      openshell-setup:
        content: |2
          # ── NVIDIA OpenShell: Container-Based Agent Sandbox ──
          # Source: github.com/NVIDIA/OpenShell (Apache-2.0)
          # Platforms: Linux (container-based via K3s)
          # Docs: github.com/NVIDIA/OpenShell/tree/main/docs
          
          # Install OpenShell (only when run with --install)
          if [[ "${1:-}" == "--install" ]]; then
            curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
          fi
          
          # Launch Claude Code in an isolated sandbox.
          # OpenShell auto-detects ANTHROPIC_API_KEY, creates a provider,
          # and injects credentials without persisting them to disk.
          openshell sandbox create -- claude
          
          # Apply a custom security policy (YAML-based).
          # Static policies (filesystem, process) are locked at creation.
          # Dynamic policies (network, inference) can be hot-reloaded.
          openshell policy set hardened-claude --policy ./claude-policy.yaml
          
          # Monitor sandbox activity in real time
          openshell term
          
          # View sandbox logs
          openshell logs --tail
          
          # List and manage running sandboxes
          openshell sandbox list
          openshell sandbox connect "${SANDBOX_NAME:?set SANDBOX_NAME to a name from the list above}"

"7.10":
  config:
    lang: "json"
    filename: "hth-anthropic-claude-7.10-cowork-governance.jsonc"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/config/hth-anthropic-claude-7.10-cowork-governance.jsonc"
    excerpts:
      cowork-hardened:
        content: |2
          // L2 Walk Cowork governance configuration.
          // Disables channels by default, enforces org login,
          // restricts session retention, and controls auto-mode.
            {
              "channelsEnabled": false,
              "allowedChannelPlugins": [],
              "forceLoginMethod": "claudeai",
              "forceLoginOrgUUID": "REPLACE-WITH-YOUR-ORG-UUID",
              "cleanupPeriodDays": 7,
              "disableAutoMode": "disable",
              "env": {
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
              },
              "companyAnnouncements": [
                "Reminder: All Claude Code sessions are subject to organizational security policies. Report suspicious behavior with /feedback."
              ]
            }
      cowork-automode:
        content: |2
          // Auto mode governance settings
          // Reference: code.claude.com/docs/en/auto-mode
          // DANGER: autoMode.allow and autoMode.soft_deny REPLACE the entire
          // default rule lists when set — see 7.01 automode-warning section.
          // Only autoMode.environment is safe to set without side effects.
          // autoMode is NOT read from project settings (.claude/settings.json)
          // to prevent repos from injecting their own allow rules.
            {
              "disableAutoMode": "disable",
              "useAutoModeDuringPlan": false,
              "disableDeepLinkRegistration": "disable",
              "autoMode": {
                "environment": [
                  "Organization: REPLACE-WITH-YOUR-ORG. Primary use: software development",
                  "Source control: REPLACE-WITH-YOUR-SCM-HOST and all repos under it",
                  "Trusted internal domains: REPLACE-WITH-YOUR-INTERNAL-DOMAINS"
                ]
              }
            }
      cowork-maximum:
        content: |2
          // L3 Run Cowork configuration.
          // Minimum (1-day) transcript retention, channels disabled, auto-mode disabled,
          // org-locked login, and full managed-only lockdown.
          // cleanupPeriodDays minimum is 1: a value of 0 fails validation, and an
          // invalid key in a managed file is dropped, leaving the 30-day default.
          // A managed cleanupPeriodDays also applies to Claude Desktop and Cowork
          // transcripts (desktopSessionCleanupPeriodDays is ignored when it is set).
          // Reference: code.claude.com/docs/en/settings-reference#cleanupperioddays
            {
              "channelsEnabled": false,
              "allowedChannelPlugins": [],
              "forceLoginMethod": "claudeai",
              "forceLoginOrgUUID": "REPLACE-WITH-YOUR-ORG-UUID",
              "cleanupPeriodDays": 1,
              "disableAutoMode": "disable",
              "allowManagedPermissionRulesOnly": true,
              "allowManagedHooksOnly": true,
              "allowManagedMcpServersOnly": true,
              "strictKnownMarketplaces": [],
              "availableModels": ["sonnet"],
              "env": {
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
              },
              "companyAnnouncements": [
                "This environment operates under maximum security policy. Session transcripts older than one day are deleted. All extensions are disabled."
              ]
            }

"7.11":
  api:
    lang: "bash"
    filename: "hth-anthropic-claude-7.11-incident-response.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/anthropic-claude/api/hth-anthropic-claude-7.11-incident-response.sh"
    excerpts:
      ir-forensic-collection:
        content: |2
          # Forensic evidence collector for Claude Code/Cowork incidents.
          # Run on the affected user's machine BEFORE cleanupPeriodDays
          # triggers automatic transcript deletion.
          #
          # Usage: ./hth-anthropic-claude-7.11-incident-response.sh [output-dir]
          # Output: timestamped archive of Claude session data + summary
          
          OUTPUT_DIR="${1:-./claude-forensics-$(date +%Y%m%d-%H%M%S)}"
          CLAUDE_DIR="${HOME}/.claude"
          
          echo "=== Claude Code/Cowork Forensic Collection ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Hostname:  $(hostname)"
          echo "User:      $(whoami)"
          echo "Output:    ${OUTPUT_DIR}"
          echo ""
          
          mkdir -p "${OUTPUT_DIR}"
          
          # Collect session transcripts (.jsonl files)
          if [ -d "${CLAUDE_DIR}" ]; then
            echo "[1/5] Collecting session transcripts..."
            find "${CLAUDE_DIR}" -name "*.jsonl" -type f 2>/dev/null | while read -r f; do
              rel="${f#${CLAUDE_DIR}/}"
              mkdir -p "${OUTPUT_DIR}/transcripts/$(dirname "${rel}")"
              # -p keeps the original timestamps and mode: evidence must not look newer
              cp -p "${f}" "${OUTPUT_DIR}/transcripts/${rel}"
            done
            transcript_count=$(find "${OUTPUT_DIR}/transcripts" -name "*.jsonl" 2>/dev/null | wc -l)
            echo "  Collected ${transcript_count} transcript files"
          else
            echo "[1/5] No .claude directory found — skipping transcripts"
          fi
          
          # Collect settings files (may contain evidence of tampering)
          echo "[2/5] Collecting settings and configuration..."
          for settings_file in \
            "${CLAUDE_DIR}/settings.json" \
            "${CLAUDE_DIR}/settings.local.json" \
            "${HOME}/.claude.json"; do
            if [ -f "${settings_file}" ]; then
              cp -p "${settings_file}" "${OUTPUT_DIR}/$(basename "${settings_file}")"
              echo "  Collected: ${settings_file}"
            fi
          done
          
          # Collect project-level settings from CWD if present
          if [ -d ".claude" ]; then
            echo "[3/5] Collecting project-level .claude/ directory..."
            cp -Rp .claude "${OUTPUT_DIR}/project-claude/"
          else
            echo "[3/5] No project .claude/ directory in CWD"
          fi
          
          # Collect MCP server configs
          echo "[4/5] Collecting MCP configurations..."
          for mcp_file in \
            ".mcp.json" \
            "${CLAUDE_DIR}/mcp.json"; do
            if [ -f "${mcp_file}" ]; then
              cp -p "${mcp_file}" "${OUTPUT_DIR}/$(basename "${mcp_file}").mcp-config"
              echo "  Collected: ${mcp_file}"
            fi
          done
          
          # Collect managed policy (if accessible): settings, MCP policy, and drop-ins
          for managed_dir in \
            "/Library/Application Support/ClaudeCode" \
            "/etc/claude-code"; do
            for managed_file in managed-settings.json managed-mcp.json; do
              if [ -f "${managed_dir}/${managed_file}" ]; then
                cp -p "${managed_dir}/${managed_file}" "${OUTPUT_DIR}/${managed_file}"
                echo "  Collected managed policy: ${managed_dir}/${managed_file}"
              fi
            done
            if [ -d "${managed_dir}/managed-settings.d" ]; then
              cp -Rp "${managed_dir}/managed-settings.d" "${OUTPUT_DIR}/managed-settings.d"
              echo "  Collected managed drop-ins: ${managed_dir}/managed-settings.d"
            fi
          done
          
          # Record a SHA-256 for every collected file so later tampering is detectable
          echo "[5/5] Hashing evidence and generating collection summary..."
          if command -v sha256sum >/dev/null 2>&1; then HASH_CMD=(sha256sum); else HASH_CMD=(shasum -a 256); fi
          ( cd "${OUTPUT_DIR}" && find . -type f ! -name SHA256SUMS ! -name SUMMARY.txt | LC_ALL=C sort | \
              while IFS= read -r f; do "${HASH_CMD[@]}" "${f}"; done ) > "${OUTPUT_DIR}/SHA256SUMS"
          
          # Generate summary
          {
            echo "Claude Forensic Collection Summary"
            echo "=================================="
            echo "Date:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Hostname: $(hostname)"
            echo "User:     $(whoami)"
            echo "CWD:      $(pwd)"
            echo ""
            echo "Files Collected:"
            find "${OUTPUT_DIR}" -type f | sort | while read -r f; do
              size=$(wc -c < "${f}" | tr -d ' ')
              echo "  ${f} (${size} bytes)"
            done
            echo ""
            echo "Integrity: SHA256SUMS holds a SHA-256 for every collected file"
            echo "  Verify: (cd ${OUTPUT_DIR} && ${HASH_CMD[*]} -c SHA256SUMS)"
            echo ""
            echo "Next Steps:"
            echo "  1. Correlate session_id and prompt.id UUIDs with OTel logs in SIEM"
            echo "  2. Review transcript .jsonl files for suspicious tool_use entries"
            echo "  3. Check settings files for unauthorized MCP servers or hooks"
            echo "  4. Preserve this archive per your data retention policy"
          } > "${OUTPUT_DIR}/SUMMARY.txt"
          
          cat "${OUTPUT_DIR}/SUMMARY.txt"
          
          echo ""
          echo "=== Collection Complete ==="
          echo "Archive: ${OUTPUT_DIR}"
          echo "To compress: tar -czf ${OUTPUT_DIR}.tar.gz ${OUTPUT_DIR}"

