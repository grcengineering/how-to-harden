            summary
          fi
          OV_ID=$(printf '%s' "${OKTA_VERIFY}" | jq -r '.id')
          CURRENT_FIPS=$(printf '%s' "${OKTA_VERIFY}" | jq -r '.settings.compliance.fips // "unset"')
          info "1.8 Okta Verify FIPS compliance is currently: ${CURRENT_FIPS}"
          
