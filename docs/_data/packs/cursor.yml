"1.4":
  api:
    lang: "bash"
    filename: "hth-cursor-1.04-audit-scim-deprovisioning.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/api/hth-cursor-1.04-audit-scim-deprovisioning.sh"
    excerpts:
      api-audit-scim-deprovisioning:
        content: |2
          FINDINGS=0
          
          # 1. Member inventory: active vs removed, active members by role.
          # A 200 is not proof of data. Without the documented teamMembers array (string
          # email and role, boolean isRemoved on every entry) the deprovisioning check
          # below would report "removed or absent" for everyone, so refuse to go on.
          api_get "/teams/members"
          jq -e '(.teamMembers | type == "array")
                 and all(.teamMembers[]; (.email | type == "string") and (.role | type == "string")
                                         and (.isRemoved | type == "boolean"))' \
            "${BODY_FILE}" >/dev/null 2>&1 || {
            echo "PRECONDITION: GET /teams/members returned HTTP 200 without the documented teamMembers shape — nothing was audited" >&2
            exit 2
          }
          cp "${BODY_FILE}" "${MEMBERS}"
          ACTIVE=$(jq '[.teamMembers[] | select(.isRemoved == false)] | length' "${MEMBERS}")
          REMOVED=$(jq '[.teamMembers[] | select(.isRemoved == true)] | length' "${MEMBERS}")
          # Every team has at least one active member (the admin who issued this key).
          [ "${ACTIVE}" -gt 0 ] || { echo "PRECONDITION: GET /teams/members listed zero active members — nothing was audited" >&2; exit 2; }
          echo "=== Team members: ${ACTIVE} active, ${REMOVED} removed ==="
          jq -r '[.teamMembers[] | select(.isRemoved == false) | .role] | group_by(.) | map("  \(.[0]): \(length)") | .[]' "${MEMBERS}"
          
          # 2. Directory groups synced from the IdP (SCIM group push)
          api_get "/teams/directory-groups?page=1&pageSize=200"
          jq -e '.groups | type == "array"' "${BODY_FILE}" >/dev/null 2>&1 || {
            echo "PRECONDITION: GET /teams/directory-groups returned HTTP 200 without the documented groups array — nothing was audited" >&2
            exit 2
          }
          DIR_GROUPS=$(jq 'if (.pagination.totalCount | type) == "number" then .pagination.totalCount else (.groups | length) end' "${BODY_FILE}")
          echo "=== Directory groups: ${DIR_GROUPS} ==="
          jq -r '.groups[] | "  \(.name)  members=\(.memberCount)"' "${BODY_FILE}"
          if [ "${DIR_GROUPS}" -eq 0 ]; then
            echo "  FINDING: no directory groups — SCIM group push is not configured (or SCIM is not set up)"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          # 3. Deprovisioning proof: every email you unassigned in the IdP must be removed
          if [ -n "${HTH_EXPECT_REMOVED:-}" ]; then
            echo "=== Deprovisioning check ==="
            OLDIFS="${IFS}"; IFS=','
            for EMAIL in ${HTH_EXPECT_REMOVED}; do
              IFS="${OLDIFS}"
              EMAIL="$(printf '%s' "${EMAIL}" | tr -d '[:space:]')"
              [ -n "${EMAIL}" ] || continue
              STILL=$(jq --arg e "${EMAIL}" '[.teamMembers[] | select((.email | ascii_downcase) == ($e | ascii_downcase) and .isRemoved == false)] | length' "${MEMBERS}")
              if [ "${STILL}" -gt 0 ]; then
                echo "  FINDING: ${EMAIL} is still an ACTIVE member — deprovisioning did not reach Cursor"
                FINDINGS=$((FINDINGS + 1))
              else
                echo "  PASS: ${EMAIL} is removed or absent"
              fi
            done
            IFS="${OLDIFS}"
          fi
          
          [ "${FINDINGS}" -eq 0 ] && { echo "PASS"; exit 0; }
          echo "${FINDINGS} finding(s)"
          exit 1

"2.1":
  api:
    lang: "bash"
    filename: "hth-cursor-2.01-audit-privacy-mode-events.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/api/hth-cursor-2.01-audit-privacy-mode-events.sh"
    excerpts:
      api-audit-privacy-mode-events:
        content: |2
          # Pull every Privacy Mode change (user or team level) in the window, following
          # pagination to the end, and report each one for review.
          # A 200 is not proof of data: a page without the documented `events` array and
          # `pagination.hasNextPage` flag is refused, so "no events" can only ever mean the
          # API said there were none, never that the pack could not read what it got.
          PAGE=1
          while :; do
            api_get "/teams/audit-logs?eventTypes=privacy_mode&startTime=${HTH_WINDOW}&endTime=now&pageSize=500&page=${PAGE}"
            jq -e '(.events | type == "array") and (.pagination.hasNextPage | type == "boolean")' "${BODY_FILE}" >/dev/null 2>&1 || {
              echo "PRECONDITION: audit-logs page ${PAGE} returned HTTP 200 without the documented events/pagination shape — nothing was audited" >&2
              exit 2
            }
            jq -c '.events[]' "${BODY_FILE}" >> "${EVENTS}"
            [ "$(jq -r '.pagination.hasNextPage // false' "${BODY_FILE}")" = "true" ] || break
            PAGE=$((PAGE + 1))
            [ "${PAGE}" -le 100 ] || { echo "PRECONDITION: more than 100 pages — narrow HTH_WINDOW" >&2; exit 2; }
          done
          
          COUNT=$(wc -l < "${EVENTS}" | tr -d ' ')
          echo "=== Privacy Mode changes in the last ${HTH_WINDOW} ==="
          if [ "${COUNT}" -eq 0 ]; then
            echo "PASS: no privacy_mode events — Privacy Mode was not changed at user or team level"
            exit 0
          fi
          jq -r '"  \(.timestamp)  \(.user_email // "(unknown user)")  app=\(.application_type // "")  data=\(.event_data | tojson)"' "${EVENTS}"
          echo "FINDING: ${COUNT} Privacy Mode change(s) — confirm each one left Privacy Mode ON and was authorized"
          exit 1

"2.2":
  api:
    lang: "bash"
    filename: "hth-cursor-2.02-audit-model-access.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/api/hth-cursor-2.02-audit-model-access.sh"
    excerpts:
      api-audit-model-access:
        content: |2
          FINDINGS=0
          api_get "/teams/model-access/configuration"
          # A 200 is not proof of data: refuse a body whose `state` is not one of the
          # three documented values, rather than reporting it as a policy finding.
          jq -e '.state | IN("unrestricted", "custom", "legacy")' "${BODY_FILE}" >/dev/null 2>&1 || {
            echo "PRECONDITION: GET /teams/model-access/configuration returned HTTP 200 without a documented state (unrestricted|custom|legacy) — nothing was audited" >&2
            exit 2
          }
          STATE=$(jq -r '.state' "${BODY_FILE}")
          NEW_PROVIDER=$(jq -r '.newProviderDefault // "null"' "${BODY_FILE}")
          NEW_MODEL=$(jq -r '.newModelDefault // "null"' "${BODY_FILE}")
          echo "=== Model access policy: state=${STATE} newProviderDefault=${NEW_PROVIDER} newModelDefault=${NEW_MODEL} ==="
          
          if [ "${STATE}" != "custom" ]; then
            echo "FINDING: no custom model-access policy (state=${STATE}) — every catalog model is selectable and routable"
            exit 1
          fi
          
          if [ "${NEW_PROVIDER}" = "enabled" ]; then
            echo "FINDING: newProviderDefault=enabled — a provider Cursor adds later is allowed before anyone reviews it"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          api_get "/teams/model-access/providers"
          # The PASS below means "a custom policy is in force; review this list" — an
          # unreadable list must not stand in for an empty one.
          jq -e '(.providers | type == "array") and all(.providers[]; (.models // []) | type == "array")' "${BODY_FILE}" >/dev/null 2>&1 || {
            echo "PRECONDITION: GET /teams/model-access/providers returned HTTP 200 without the documented providers array — nothing was audited" >&2
            exit 2
          }
          echo "=== Enabled providers and models (review against your approved-model register) ==="
          jq -r '
            .providers[]
            | select(.enabled == true)
            | "  \(.id // .name):",
              ((.models // [])[] | select(.enabled == true) | "    - \(.id // .name)")' "${BODY_FILE}"
          
          [ "${FINDINGS}" -eq 0 ] && { echo "PASS: custom policy in force; review the enabled list above"; exit 0; }
          exit 1

"2.3":
  config:
    lang: "bash"
    filename: "hth-cursor-2.03-cursorignore-template.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/config/hth-cursor-2.03-cursorignore-template.sh"
    excerpts:
      cli-cursorignore-template:
        content: |2
          # Create a .cursorignore that keeps secrets and infrastructure state out of AI
          # context. Refuses to overwrite an existing .cursorignore.
          TARGET=".cursorignore"
          if [ -e "$TARGET" ]; then
            TARGET=".cursorignore.hth"
            echo "NOTE: .cursorignore already exists — writing the template to $TARGET for a manual merge"
          fi
          cat > "$TARGET" <<'IGNORE'
          # === Credentials & Secrets ===
          .env
          .env.*
          **/.env
          **/.env.*
          **/secrets/
          **/credentials/
          **/credentials.json
          **/secrets.json
          *.pem
          *.key
          *.p12
          *.pfx
          *.jks
          id_rsa*
          id_ed25519*
          *.keystore
          
          # === Cloud & Infrastructure Configs ===
          .aws/
          .azure/
          .gcloud/
          kubeconfig*
          terraform.tfstate*
          terraform.tfvars
          *.auto.tfvars
          
          # === Internal Configuration ===
          **/config/production.*
          **/config/secrets.*
          docker-compose.override.yml
          
          # === Cursor / IDE Configuration ===
          .cursor/mcp.json
          .vscode/launch.json
          
          # === Compliance & Legal ===
          **/compliance/
          **/legal/
          **/audit/
          IGNORE
          echo "Template written to $TARGET"
          [ "$TARGET" = ".cursorignore" ] || exit 1
      cli-verify-cursorignore:
        content: |2
          # Verify .cursorignore is present and covers critical patterns
          echo "=== .cursorignore Audit ==="
          if [ ! -f .cursorignore ]; then
            echo "FAIL: .cursorignore not found in project root"
            exit 1
          fi
          
          REQUIRED_PATTERNS=(".env" "*.pem" "*.key" "id_rsa" "terraform.tfstate" ".aws/")
          MISSING=0
          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -qF -- "$pattern" .cursorignore; then
              echo "  MISSING: $pattern not in .cursorignore"
              MISSING=$((MISSING + 1))
            fi
          done
          
          if [ "$MISSING" -eq 0 ]; then
            echo "PASS: All critical patterns present in .cursorignore"
          else
            echo "FAIL: $MISSING critical pattern(s) missing from .cursorignore"
            exit 1
          fi

"3.1":
  config:
    lang: "bash"
    filename: "hth-cursor-3.01-api-key-env-setup.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/config/hth-cursor-3.01-api-key-env-setup.sh"
    excerpts:
      cli-api-key-antipattern:
        content: |2
          # INSECURE: Never hardcode API keys in Cursor settings files
          # This is an example of what to SEARCH FOR and REMOVE:
          #   "cursor.openai.apiKey": "sk-proj-abc123..."
          #   "cursor.anthropic.apiKey": "sk-ant-abc123..."
      cli-api-key-env-setup:
        content: |2
          # Add provider keys to your shell profile once, without echoing them.
          PROFILE="${HTH_SHELL_PROFILE:-${HOME}/.zshrc}"
          touch "$PROFILE"
          for VAR in OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if grep -q "^export ${VAR}=" "$PROFILE"; then
              echo "  SKIP: ${VAR} is already defined in ${PROFILE} (rotate it with the 3.2 pack)"
              continue
            fi
            printf 'Enter %s (input hidden; leave empty to skip): ' "$VAR"
            IFS= read -rs VALUE
            echo
            if [ -z "$VALUE" ]; then
              echo "  SKIP: no value entered for ${VAR}"
              continue
            fi
            printf 'export %s=%q\n' "$VAR" "$VALUE" >> "$PROFILE"
            unset VALUE
            echo "  ADDED: ${VAR} to ${PROFILE}"
          done
          echo "Open a new terminal (and restart Cursor) to load the variables."
      cli-api-key-verify:
        content: |2
          # Verify no hardcoded API keys exist in Cursor settings files or git history
          echo "=== Scanning for hardcoded API keys in Cursor settings ==="
          SETTINGS_PATHS=(
            "${HOME}/Library/Application Support/Cursor/User/settings.json"
            "${HOME}/.config/Cursor/User/settings.json"
            ".vscode/settings.json"
          )
          
          FOUND=0
          for f in "${SETTINGS_PATHS[@]}"; do
            if [ -f "$f" ]; then
              if grep -qE '(sk-proj-|sk-ant-|OPENAI_API_KEY|ANTHROPIC_API_KEY)' "$f" 2>/dev/null; then
                echo "  FAIL: Hardcoded key found in $f"
                FOUND=$((FOUND + 1))
              fi
            fi
          done
          
          if [ "$FOUND" -eq 0 ]; then
            echo "  PASS: No hardcoded API keys found in settings files"
          fi
          
          # Also check git history for accidentally committed keys
          echo ""
          echo "=== Checking git history for leaked keys ==="
          LEAKED=0
          if command -v git &>/dev/null && git rev-parse --is-inside-work-tree &>/dev/null; then
            LEAKED=$(git log --all -p 2>/dev/null | grep -cE '(sk-proj-|sk-ant-)[A-Za-z0-9_-]{20,}')
            LEAKED=${LEAKED:-0}
            if [ "$LEAKED" -gt 0 ]; then
              echo "  FAIL: $LEAKED potential API key(s) found in git history"
              echo "  ACTION: Rotate keys immediately and use git-filter-repo to purge"
            else
              echo "  PASS: No API keys found in git history"
            fi
          else
            echo "  SKIP: not inside a git work tree"
          fi
          
          [ "$FOUND" -eq 0 ] && [ "$LEAKED" -eq 0 ] || exit 1

"3.2":
  config:
    lang: "bash"
    filename: "hth-cursor-3.02-api-key-rotation.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/config/hth-cursor-3.02-api-key-rotation.sh"
    excerpts:
      cli-key-rotation:
        content: |2
          # Replace the key in your shell profile with a newly minted one (input hidden).
          VAR="${1:-OPENAI_API_KEY}"
          PROFILE="${HTH_SHELL_PROFILE:-${HOME}/.zshrc}"
          case "$VAR" in
            OPENAI_API_KEY|ANTHROPIC_API_KEY) ;;
            *) echo "ERROR: unsupported variable '$VAR' (use OPENAI_API_KEY or ANTHROPIC_API_KEY)"; exit 2 ;;
          esac
          if ! grep -q "^export ${VAR}=" "$PROFILE" 2>/dev/null; then
            echo "ERROR: ${VAR} is not defined in ${PROFILE} — add it first with the 3.1 pack"
            exit 2
          fi
          printf 'Paste the NEW %s (input hidden): ' "$VAR"
          IFS= read -rs NEW_KEY
          echo
          if [ -z "$NEW_KEY" ]; then
            echo "ERROR: no key entered — ${PROFILE} left unchanged"
            exit 2
          fi
          case "$NEW_KEY" in
            *[!A-Za-z0-9._-]*) echo "ERROR: key contains unexpected characters — ${PROFILE} left unchanged"; exit 2 ;;
          esac
          VAR="$VAR" NEW_KEY="$NEW_KEY" perl -pi -e 's/^export \Q$ENV{VAR}\E=.*/export $ENV{VAR}="$ENV{NEW_KEY}"/' "$PROFILE"
          unset NEW_KEY
          echo "${VAR} rotated in ${PROFILE}. Open a new terminal, restart Cursor, confirm the new key works,"
          echo "then REVOKE the old key in the provider console."

"3.3":
  api:
    lang: "bash"
    filename: "hth-cursor-3.03-audit-team-spend.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/api/hth-cursor-3.03-audit-team-spend.sh"
    excerpts:
      api-audit-team-spend:
        content: |2
          # A 200 is not proof of data: a proxy, a captive portal or an API change can
          # answer 200 with a body this pack cannot read. Every page must carry the
          # documented teamMemberSpend array with numeric spend and limit fields, or the
          # pack refuses to report (a missing spend field would otherwise read as $0).
          SHAPE='(.teamMemberSpend | type == "array")
            and ((.totalPages // 1) | type == "number")
            and all(.teamMemberSpend[]; (.overallSpendCents | type == "number")
                                        and (.effectivePerUserLimitDollars | type == "number"))'
          PAGE=1
          while :; do
            api_read "/teams/spend" "{\"page\": ${PAGE}, \"pageSize\": 100, \"sortBy\": \"amount\", \"sortDirection\": \"desc\"}"
            jq -e "${SHAPE}" "${BODY_FILE}" >/dev/null 2>&1 || {
              echo "PRECONDITION: /teams/spend page ${PAGE} returned HTTP 200 without the documented teamMemberSpend shape — nothing was audited" >&2
              exit 2
            }
            jq -c '.teamMemberSpend[]' "${BODY_FILE}" >> "${ROWS}"
            TOTAL_PAGES=$(jq -r '.totalPages // 1' "${BODY_FILE}")
            [ "${PAGE}" -lt "${TOTAL_PAGES}" ] || break
            PAGE=$((PAGE + 1))
            [ "${PAGE}" -le 100 ] || { echo "PRECONDITION: more than 100 pages of spend data" >&2; exit 2; }
          done
          
          MEMBERS=$(wc -l < "${ROWS}" | tr -d ' ')
          # Every team has at least one member (the admin who issued this key), so an
          # empty list means the response did not describe the team: not a clean team.
          [ "${MEMBERS}" -gt 0 ] || { echo "PRECONDITION: /teams/spend returned zero members — nothing was audited" >&2; exit 2; }
          echo "=== Current billing cycle: ${MEMBERS} members ==="
          LIMIT_CENTS=$((HTH_SPEND_ALERT_DOLLARS * 100))
          OVER=$(jq -s --argjson c "${LIMIT_CENTS}" '[.[] | select((.overallSpendCents // 0) > $c)] | length' "${ROWS}")
          NOLIMIT=$(jq -s '[.[] | select((.effectivePerUserLimitDollars // 0) <= 0 and .monthlyLimitDollars == null)] | length' "${ROWS}")
          
          jq -s -r --argjson c "${LIMIT_CENTS}" '.[] | select((.overallSpendCents // 0) > $c)
            | "  OVER ALERT: \(.email)  $\((.overallSpendCents / 100 * 100 | floor) / 100)  limit=$\(.effectivePerUserLimitDollars // "none")"' "${ROWS}"
          jq -s -r '.[] | select((.effectivePerUserLimitDollars // 0) <= 0 and .monthlyLimitDollars == null)
            | "  NO LIMIT: \(.email)"' "${ROWS}"
          
          if [ "${OVER}" -eq 0 ] && [ "${NOLIMIT}" -eq 0 ]; then
            echo "PASS: every member has a spend limit and none is above \$${HTH_SPEND_ALERT_DOLLARS} this cycle"
            exit 0
          fi
          echo "FINDING: ${OVER} member(s) above \$${HTH_SPEND_ALERT_DOLLARS}, ${NOLIMIT} member(s) with no per-user limit"
          exit 1

"4.1":
  config:
    lang: "bash"
    filename: "hth-cursor-4.01-mcp-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/config/hth-cursor-4.01-mcp-audit.sh"
    excerpts:
      cli-mcp-audit:
        content: |2
          # Audit every MCP server in the project and global configs — without printing secrets
          echo "=== MCP Configuration Audit ==="
          FINDINGS=0
          for MCP_FILE in ".cursor/mcp.json" "${HOME}/.cursor/mcp.json"; do
            if [ ! -f "$MCP_FILE" ]; then
              echo "No MCP config at $MCP_FILE"
              continue
            fi
            if ! jq -e . "$MCP_FILE" >/dev/null 2>&1; then
              echo "ERROR: $MCP_FILE is not valid JSON"
              exit 2
            fi
            echo "--- $MCP_FILE ---"
            jq -r '
              (.mcpServers // {}) | to_entries[] |
              "  server: \(.key)",
              "    command: \(.value.command // "-")",
              "    args:    \((.value.args // []) | map(tostring | if test("(?i)(token|secret|passw|bearer|api[_-]?key|auth)") then "<redacted>" else . end) | join(" "))",
              "    url:     \(.value.url // "-")",
              "    env var names:  \((.value.env // {}) | keys | join(", "))",
              "    header names:   \((.value.headers // {}) | keys | join(", "))"' "$MCP_FILE"
            # Flag launch commands that fetch-and-run, and remote servers over cleartext HTTP
            RISKY=$(jq -r '(.mcpServers // {}) | to_entries[]
              | select(((.value.command // "") + " " + ((.value.args // []) | join(" ")))
                       | test("curl|wget|bash -c|sh -c|\\| *(ba)?sh"))
              | .key' "$MCP_FILE")
            CLEAR=$(jq -r '(.mcpServers // {}) | to_entries[] | select((.value.url // "") | startswith("http://")) | .key' "$MCP_FILE")
            for S in $RISKY; do echo "  FINDING: server '$S' launches through a download or shell pipe"; FINDINGS=$((FINDINGS + 1)); done
            for S in $CLEAR; do echo "  FINDING: server '$S' uses a cleartext http:// URL"; FINDINGS=$((FINDINGS + 1)); done
            if [[ "$OSTYPE" == darwin* ]]; then PERMS=$(stat -f '%Lp' "$MCP_FILE"); else PERMS=$(stat -c '%a' "$MCP_FILE"); fi
            case "$PERMS" in
              ??[2367]|?[2367]?) echo "  FINDING: $MCP_FILE is writable by group or others (mode $PERMS)"; FINDINGS=$((FINDINGS + 1)) ;;
            esac
          done
          
          echo ""
          echo "=== Review Checklist ==="
          echo "  [ ] Every MCP server is from a trusted source"
          echo "  [ ] Secrets named above live in a secret manager or env injection, not in mcp.json"
          echo "  [ ] Tool pre-approvals reviewed with the 4.2 pack (permissions.json mcpAllowlist)"
      cli-mcp-permissions:
        content: |2
          # MUTATING, only with --fix: lock MCP config files to owner read/write
          if [ "${1:-}" = "--fix" ]; then
            echo "=== Securing MCP config file permissions ==="
            for MCP_FILE in ".cursor/mcp.json" "${HOME}/.cursor/mcp.json"; do
              if [ -f "$MCP_FILE" ]; then
                chmod 600 "$MCP_FILE"
                echo "  Set $MCP_FILE to 600 (owner read/write only)"
              fi
            done
          fi

"4.2":
  config:
    lang: "bash"
    filename: "hth-cursor-4.02-audit-mcp-allowlist.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor/config/hth-cursor-4.02-audit-mcp-allowlist.sh"
    excerpts:
      cli-audit-mcp-allowlist:
        content: |2
          FINDINGS=0
          FILES_SEEN=0
          for PERM_FILE in "${HOME}/.cursor/permissions.json" ".cursor/permissions.json"; do
            [ -f "${PERM_FILE}" ] || continue
            FILES_SEEN=$((FILES_SEEN + 1))
            if ! jq -e . "${PERM_FILE}" >/dev/null 2>&1; then
              echo "ERROR: ${PERM_FILE} is not valid JSON — Cursor will not apply it as written"
              exit 2
            fi
            echo "=== ${PERM_FILE}: mcpAllowlist ==="
            ENTRIES=$(jq -r '(.mcpAllowlist // [])[]' "${PERM_FILE}")
            if [ -z "${ENTRIES}" ]; then
              echo "  (none — every MCP tool call keeps its approval prompt, unless a team policy says otherwise)"
              continue
            fi
            while IFS= read -r ENTRY; do
              case "${ENTRY}" in
                '*:*') echo "  FINDING: ${ENTRY} — pre-approves every tool on every MCP server"; FINDINGS=$((FINDINGS + 1)) ;;
                *':*') echo "  FINDING: ${ENTRY} — pre-approves every tool on this server, including tools added later"; FINDINGS=$((FINDINGS + 1)) ;;
                '*:'*) echo "  FINDING: ${ENTRY} — pre-approves this tool name on ANY server, including an attacker's"; FINDINGS=$((FINDINGS + 1)) ;;
                *)     echo "  ok:      ${ENTRY} — confirm this tool is read-only and low-consequence" ;;
              esac
            done < <(printf '%s\n' "${ENTRIES}")
          done
          
          [ "${FILES_SEEN}" -gt 0 ] || echo "No permissions.json found — Cursor uses the editor-managed allowlist; review it in Settings > Agents > Approvals & Execution"
          if [ "${FINDINGS}" -gt 0 ]; then
            echo "${FINDINGS} wildcard MCP allowlist entr(y/ies) — replace each with explicit server:tool pairs"
            exit 1
          fi
          echo "PASS: no wildcard MCP allowlist entries"
          exit 0

"5.1":
  config:
    lang: "bash"
    filename: "hth-cursor-5.01-agent-settings.sh"
