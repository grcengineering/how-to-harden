"3.2":
  terraform:
    lang: "hcl"
    filename: "hth-stripe-3.02-webhook-endpoint.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/stripe/terraform/hth-stripe-3.02-webhook-endpoint.tf"
    excerpts:
      terraform-webhook-endpoint:
        content: |2
          terraform {
            required_version = ">= 1.5.0"
            required_providers {
              stripe = {
                source  = "stripe/stripe"
                version = "= 0.3.0"
              }
            }
          }
          
          # Reads the API key from the STRIPE_API_KEY environment variable.
          provider "stripe" {}
          
          variable "security_webhook_url" {
            description = "HTTPS URL that receives Stripe security events (your SIEM collector or handler)"
            type        = string
          
            validation {
              condition     = startswith(var.security_webhook_url, "https://")
              error_message = "Stripe webhook endpoints must be HTTPS; Stripe supports only TLS 1.2 and 1.3."
            }
          }
          
          resource "stripe_webhook_endpoint" "security_events" {
            url         = var.security_webhook_url
            description = "HTH security events"
          
            enabled_events = [
              "account.updated",
              "account.application.authorized",
              "account.application.deauthorized",
              "account.external_account.created",
              "account.external_account.deleted",
              "capability.updated",
              "person.created",
              "person.updated",
              "person.deleted",
              "payment_method.attached",
              "payment_method.detached",
              "identity.verification_session.created",
              "identity.verification_session.verified",
            ]
          }
  api:
    lang: "bash"
    filename: "hth-stripe-3.02-configure-webhook-security.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/stripe/api/hth-stripe-3.02-configure-webhook-security.sh"
    excerpts:
      api-configure-webhook:
        content: |2
          # List existing webhook endpoints and flag disabled ones
          WEBHOOKS=$(stripe_get "/webhook_endpoints?limit=100") || {
            fail "3.2 Unable to retrieve webhook endpoints (check the key and its Webhook Endpoints: Read permission)"
            increment_failed; finish
          }
          
          TOTAL=$(echo "${WEBHOOKS}" | jq '.data | length')
          DISABLED=$(echo "${WEBHOOKS}" | jq '[.data[] | select(.status == "disabled")] | length')
          info "3.2 Total webhook endpoints: ${TOTAL} (Stripe allows up to 16)"
          info "3.2 Disabled endpoints: ${DISABLED}"
          
          if [ "${DISABLED}" -gt 0 ]; then
            warn "3.2 Disabled webhook endpoints found — review and remove unused:"
            echo "${WEBHOOKS}" | jq -r '.data[] | select(.status == "disabled") | "  - \(.url) (id: \(.id))"'
          fi
          
          # Optional: create a webhook endpoint that forwards security-relevant events
          if [ -n "${STRIPE_SIEM_WEBHOOK_URL:-}" ]; then
            case "${STRIPE_SIEM_WEBHOOK_URL}" in
              https://*) ;;
              *) fail "3.2 STRIPE_SIEM_WEBHOOK_URL must be an https:// URL"; increment_failed; finish ;;
            esac
            EXISTING=$(echo "${WEBHOOKS}" | jq -r --arg u "${STRIPE_SIEM_WEBHOOK_URL}" '.data[] | select(.url == $u) | .id')
            if [ -n "${EXISTING}" ]; then
              info "3.2 SIEM webhook already exists (id: ${EXISTING})"
            else
              info "3.2 Creating SIEM webhook for security events..."
              RESPONSE=$(curl -sf -X POST -K <(stripe_auth) "${STRIPE_BASE}/webhook_endpoints" \
                --data-urlencode "url=${STRIPE_SIEM_WEBHOOK_URL}" \
                --data-urlencode "enabled_events[]=account.updated" \
                --data-urlencode "enabled_events[]=account.application.authorized" \
                --data-urlencode "enabled_events[]=account.application.deauthorized" \
                --data-urlencode "enabled_events[]=account.external_account.created" \
                --data-urlencode "enabled_events[]=account.external_account.deleted" \
                --data-urlencode "enabled_events[]=person.created" \
                --data-urlencode "enabled_events[]=person.updated" \
                --data-urlencode "enabled_events[]=person.deleted" \
                --data-urlencode "enabled_events[]=payment_method.attached" \
                --data-urlencode "enabled_events[]=payment_method.detached" \
                --data-urlencode "enabled_events[]=identity.verification_session.created" \
                --data-urlencode "enabled_events[]=identity.verification_session.verified" \
                --data-urlencode "enabled_events[]=capability.updated" \
                --data-urlencode "description=HTH Security Events SIEM Webhook") || {
                fail "3.2 Failed to create SIEM webhook (the key needs Webhook Endpoints: Write)"
                increment_failed; finish
              }
              WEBHOOK_ID=$(echo "${RESPONSE}" | jq -r '.id')
              SECRET_LEN=$(echo "${RESPONSE}" | jq -r '.secret // "" | length')
              pass "3.2 SIEM webhook created (id: ${WEBHOOK_ID})"
              info "3.2 Signing secret returned (${SECRET_LEN} chars) and deliberately not printed —"
              info "3.2 reveal it from the destination in Workbench and store it in your secrets manager"
            fi
          fi
          
          pass "3.2 Webhook security audit complete"
          increment_applied

"3.3":
  api:
    lang: "bash"
    filename: "hth-stripe-3.03-configure-restricted-keys.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/stripe/api/hth-stripe-3.03-configure-restricted-keys.sh"
    excerpts:
      api-validate-key-scope:
        content: |2
          # Probe resources a narrowly scoped key should be denied, and branch on the status
          _readable=0
          probe_denied() {
            local path="$1" label="$2" code
            code=$(stripe_status "${path}")
            case "${code}" in
              403) pass "3.3 Current key cannot ${label} (403) — properly scoped" ;;
              200) warn "3.3 Current key can ${label} (200) — confirm the integration needs it"
                   _readable=$((_readable + 1)) ;;
              *)   fail "3.3 Could not assess '${label}' (HTTP ${code}) — check the key and connectivity"
                   increment_failed ;;
            esac
          }
          
          probe_denied "/customers?limit=1"       "list customers"
          probe_denied "/payment_intents?limit=1" "list payment intents"
          
          # Webhook endpoint read access is informational (many integrations need it)
          code=$(stripe_status "/webhook_endpoints?limit=1")
          case "${code}" in
            200) info "3.3 Current key has webhook endpoint read access" ;;
            403) info "3.3 Current key cannot list webhook endpoints" ;;
            *)   fail "3.3 Could not assess webhook endpoint access (HTTP ${code})"; increment_failed ;;
          esac
          
          # Pass only when every probe was denied: a key that can read a probed resource
          # (a full-access secret key always can) needs review, never a PASS line
          if [ "${_failed}" -gt 0 ]; then
            fail "3.3 Key scope not assessed — see the FAIL lines above"
          elif [ "${_readable}" -gt 0 ]; then
            warn "3.3 NEEDS REVIEW — the key can read ${_readable} probed resource(s) a narrowly scoped key should be denied"
          else
            pass "3.3 Key scope validation complete — every probed resource was denied (403)"
            increment_applied
          fi

