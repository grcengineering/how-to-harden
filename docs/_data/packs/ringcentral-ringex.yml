        content: |2
          set +x
          set -euo pipefail
          fail() { printf 'UNKNOWN: %s\n' "$*" >&2; exit 2; }
          [[ "${RINGEX_ACCESS_TOKEN:-}" =~ ^[[:alnum:]_.~+/=-]+$ ]] || fail 'Missing or invalid RINGEX_ACCESS_TOKEN'
