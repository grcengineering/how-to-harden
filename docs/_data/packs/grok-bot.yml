    lang: "bash"
    filename: "hth-grok-bot-3.01-network-allowlist.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-3.01-network-allowlist.sh"
    excerpts:
      verify-network-policy:
        content: |2
          verify() {
            gb_get team /grok-bot/network
            gb_require "GET /grok-bot/network" 200
            gb_shape '(.egressMode | IN("unset","allow_all","default_with_network_settings","network_settings_only"))
                      and (.allowlist | type == "array") and (.locked | type == "boolean")' "GET /grok-bot/network"
            local live mode locked want drift catchall
            live="${GB_TMP_DIR}/network.json"
            cp "${GB_BODY_FILE}" "${live}"
            mode=$(jq -r '.egressMode' "${live}")
            locked=$(jq -r '.locked' "${live}")
            echo "Grok Bot 3.1 — egressMode=${mode} locked=${locked} allowlist=$(jq '.allowlist | length' "${live}") entr(ies)"
            jq -r '.allowlist[] | "    - \(.)"' "${live}"
          
            case "${mode}" in
              default_with_network_settings|network_settings_only) ;;
              *) gb_finding "egressMode=${mode}: Bots can reach any destination (TRAP 3)" ;;
            esac
            if [ "${locked}" != "true" ]; then
              gb_finding "locked=false: a group's own network policy replaces the team policy for its members"
            fi
            if [ -n "${HTH_EGRESS_MODE:-}" ] && [ "${mode}" != "${HTH_EGRESS_MODE}" ]; then
              gb_finding "egressMode=${mode}, expected ${HTH_EGRESS_MODE}"
            fi
            # Catch-all entries defeat a restrictive mode (TRAP 5).
            catchall=$(jq -r '.allowlist[] | select(test("^(0\\.0\\.0\\.0/0|::/0|\\*)(:[0-9]+)?$")) | "    catch-all: \(.)"' "${live}")
            if [ -n "${catchall}" ]; then
              echo "${catchall}"
              gb_finding "the allowlist holds catch-all entries, which allow every destination they match (TRAP 5)"
            fi
          
            # Drift against the reviewed file, when one is supplied.
            if [ -n "${HTH_ALLOWLIST_FILE:-}" ]; then
              want=$(reviewed_allowlist)
              drift=$(jq -r --argjson want "${want}" '
                ((.allowlist - $want) | map("    + live, not reviewed: \(.)")) +
                (($want - .allowlist) | map("    - reviewed, not live: \(.)")) | .[]' "${live}")
              if [ -n "${drift}" ]; then
                echo "${drift}"
                gb_finding "the live allowlist differs from ${HTH_ALLOWLIST_FILE}"
              fi
            fi
          }
      enforce-network-policy:
        content: |2
          enforce() {
            local want mode live_mode body n bad
            want=$(reviewed_allowlist)
            # TRAP 6: explicit choice, else keep the live restrictive mode, else L2.
            live_mode=$(jq -r '.egressMode' "${GB_TMP_DIR}/network.json")
            if [ -n "${HTH_EGRESS_MODE:-}" ]; then
              mode="${HTH_EGRESS_MODE}"
            else
              case "${live_mode}" in
                default_with_network_settings|network_settings_only) mode="${live_mode}" ;;
                *) mode="default_with_network_settings" ;;
              esac
              echo "  egressMode: ${mode} (HTH_EGRESS_MODE unset; live mode is ${live_mode}$(if [ "${mode}" != "network_settings_only" ]; then echo "; set HTH_EGRESS_MODE=network_settings_only for L3"; fi))"
            fi
            n=$(jq 'length' <<<"${want}")
            if [ "${n}" -gt 500 ]; then
              echo "PRECONDITION: ${n} destinations exceed the Admin API's documented 500 (TRAP 2)" >&2
              exit 2
            fi
            bad=$(jq -r '.[] | select(length > 253 or test("\\s") or test("^(0\\.0\\.0\\.0/0|::/0|\\*)(:[0-9]+)?$")) | "    \(.)"' <<<"${want}")
            if [ -n "${bad}" ]; then
              echo "PRECONDITION: entries longer than 253 characters, containing whitespace, or catch-all (TRAP 5):" >&2
              echo "${bad}" >&2
              exit 2
            fi
            if [ "${n}" -eq 0 ]; then
              echo "  WARNING: the reviewed file holds zero destinations"
            fi
          
            # TRAP 1: always the whole policy, always locked.
            body=$(jq -nc --arg m "${mode}" --argjson a "${want}" '{egressMode: $m, allowlist: $a, locked: true}')
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PUT /grok-bot/network "${body}"
              return 0
            fi
            gb_put team /grok-bot/network "${body}"
            gb_require_2xx "PUT /grok-bot/network"
            echo "  PUT /grok-bot/network -> egressMode=$(jq -r '.egressMode' "${GB_BODY_FILE}") locked=$(jq -r '.locked' "${GB_BODY_FILE}") allowlist=$(jq '.allowlist | length' "${GB_BODY_FILE}")"
          }

"3.2":
  api:
    lang: "bash"
    filename: "hth-grok-bot-3.02-disable-local-egress.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-3.02-disable-local-egress.sh"
    excerpts:
      verify-local-egress:
        content: |2
          verify() {
            gb_read_capabilities
            local caps="${GB_TMP_DIR}/capabilities.json"
            if ! jq -e '.localEgressAllowed | type == "boolean"' "${caps}" >/dev/null; then
              echo "PRECONDITION: GET /grok-bot/capabilities has no boolean localEgressAllowed — Allow Local Egress Routing is Enterprise only; nothing was judged" >&2
              exit 2
            fi
            echo "Grok Bot 3.2 — team baseline localEgressAllowed=$(jq -r '.localEgressAllowed' "${caps}")"
            if [ "$(jq -r '.localEgressAllowed' "${caps}")" != "false" ]; then
              gb_finding "members can route Grok Bot's web traffic through their own computer, so destinations see that device's IP address and the Bot can reach networks available from it"
            fi
            echo "  (team baseline only — group tabs can re-enable it; see the 4.3 pack)"
            GB_UNPROVEN="group Grok Bot tabs that re-enable Allow Local Egress (no API reads them; TRAP 2)"
          }
      enforce-local-egress:
        content: |2
          enforce() {
            local body='{"localEgressAllowed": false}'
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PATCH /grok-bot/capabilities "${body}"
              return 0
            fi
            gb_patch team /grok-bot/capabilities "${body}"
            gb_require_2xx "PATCH /grok-bot/capabilities"
            echo "  PATCH /grok-bot/capabilities -> localEgressAllowed=$(jq -r '.localEgressAllowed' "${GB_BODY_FILE}")"
          }

"3.3":
  api:
    lang: "bash"
    filename: "hth-grok-bot-3.03-audit-setup-manifests.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-3.03-audit-setup-manifests.sh"
    excerpts:
      verify-setup-manifests:
        content: |2
          verify() {
            local manifests hits unreviewed want live
            manifests=$(list_manifests)
            LIVE_MANIFESTS="${manifests}"
            echo "Grok Bot 3.3 — team setup manifests: $(jq 'length' <<<"${manifests}")"
            jq -r '.[] | "    - \(.id): \([.scripts[].id] | join(", "))"' <<<"${manifests}"
          
            # Credential-shaped literals in setup or check text (TRAP 3). Names only.
            hits=$(jq -r "${CRED_SCAN}"'
              .[] | .id as $m | .scripts[]
              | .id as $s | ([(.setup // ""), (.check // "")] | map(cred_hits) | add | unique) as $h
              | select($h | length > 0)
              | "    \($m)/\($s): \($h | join(", "))"' <<<"${manifests}")
            if [ -n "${hits}" ]; then
              echo "${hits}"
              gb_finding "credential-shaped literals in team setup scripts — move them to Team Secrets and reference them by name"
            fi
          
            if [ -n "${HTH_REVIEWED_MANIFEST_IDS:-}" ]; then
              unreviewed=$(jq -r --arg ok "${HTH_REVIEWED_MANIFEST_IDS}" \
                '($ok | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $r | .[] | select(.id as $i | $r | index($i) | not) | .id' <<<"${manifests}")
              if [ -n "${unreviewed}" ]; then
                gb_finding "manifests outside HTH_REVIEWED_MANIFEST_IDS: $(echo "${unreviewed}" | tr '\n' ' ')"
              fi
            fi
          
            if [ -n "${HTH_MANIFEST_FILE:-}" ]; then
              want=$(reviewed_manifest)
              live=$(jq -c --arg id "$(jq -r '.id' <<<"${want}")" '[.[] | select(.id == $id)] | first // null' <<<"${manifests}")
              if [ "${live}" = "null" ]; then
                gb_finding "reviewed manifest '$(jq -r '.id' <<<"${want}")' is not deployed"
              elif [ "$(manifest_scripts <<<"${live}")" != "$(manifest_scripts <<<"${want}")" ]; then
                gb_finding "live manifest '$(jq -r '.id' <<<"${want}")' differs from ${HTH_MANIFEST_FILE}"
              fi
            fi
            echo "  NOT VERIFIABLE BY API: Team Secrets and group Setup Scripts (dashboard only, TRAP 2)"
            GB_UNPROVEN="Team Secrets and group Setup Scripts (dashboard only, TRAP 2)"
          }
      enforce-setup-manifest:
        content: |2
          enforce() {
            local want id body hits live
            want=$(reviewed_manifest)
            id=$(jq -r '.id' <<<"${want}")
            # Never upload a literal secret: that is the failure this control exists to stop.
            hits=$(jq -r "${CRED_SCAN}"'.scripts[] | .id as $s
              | ([(.setup // ""), (.check // "")] | map(cred_hits) | add | unique) as $h
              | select($h | length > 0) | "    \($s): \($h | join(", "))"' <<<"${want}")
            if [ -n "${hits}" ]; then
              echo "${hits}" >&2
              echo "PRECONDITION: ${HTH_MANIFEST_FILE} carries credential-shaped literals — refusing to upload it" >&2
              exit 2
            fi
            # Upload only when the reviewed manifest is missing or differs: a no-op save
            # bumps the revision, fires the 3.3 Sigma rule and cannot clear any other finding.
            live=$(jq -c --arg id "${id}" '[.[] | select(.id == $id)] | first // null' <<<"${LIVE_MANIFESTS}")
            if [ "${live}" != "null" ] && [ "$(manifest_scripts <<<"${live}")" = "$(manifest_scripts <<<"${want}")" ]; then
              echo "  reviewed manifest '${id}' already matches the live copy — nothing to upload."
              echo "  The remaining finding(s) need manual remediation: fix the flagged manifests, or remove manifests outside HTH_REVIEWED_MANIFEST_IDS, in the dashboard or in their own reviewed files."
              return 0
            fi
            body=$(jq -c '{scripts}' <<<"${want}")
            if [ "${GB_APPLY}" -ne 1 ]; then
              # Script text is never printed, so a literal the scan missed stays out of CI logs (TRAP 3).
              gb_plan PUT "/grok-bot/setup-manifests/${id}"
              jq -r '.scripts[] | "    \(.id): setup \(.setup | length) chars, check \((.check // "") | length) chars"' <<<"${want}"
              return 0
            fi
            gb_put team "/grok-bot/setup-manifests/${id}" "${body}"
            gb_require_2xx "PUT /grok-bot/setup-manifests/${id}"
            echo "  PUT /grok-bot/setup-manifests/${id} -> scripts=$(jq -c '[.manifest.scripts[]?.id]' "${GB_BODY_FILE}")"
            echo "  Running computers pick up manifest changes on a periodic refresh, roughly daily;"
            echo "  recreate a computer (or have the member reset it) to apply the change immediately."
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-3.03-setup-manifest-change.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-3.03-setup-manifest-change.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). Script text is never
            # logged; fetch the manifest itself to see what changed.
            detection:
                selection_team_manifest:
                    event_type: 'grok_bot_team_setup_manifest'
                selection_group_script:
                    event_type: 'grok_bot_group_resource'
                    event_data.resource: 'setup_manifest'
                condition: 1 of selection_*
            fields:
                - timestamp
                - user_email
                - ip_address
                - event_type
                - event_data.action
                - event_data.manifest_id
                - event_data.revision
                - event_data.entry_count
                - event_data.entry_ids
                - event_data.group_id
                - event_data.group_name
                - event_data.resource_id
                - event_data.resource_name

"4.1":
  api:
    lang: "bash"
    filename: "hth-grok-bot-4.01-enforce-auto-review.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-4.01-enforce-auto-review.sh"
    excerpts:
      verify-enforce-auto-review:
        content: |2
          verify() {
            read_auto_review
            echo "Grok Bot 4.1 — enforced=$(jq -r '.enforced' "${GB_BODY_FILE}")" \
                 "allow=$(jq '.rules.allow | length' "${GB_BODY_FILE}") block=$(jq '.rules.block | length' "${GB_BODY_FILE}")"
            jq -r '(.rules.block[] | "    block: \(.)"), (.rules.allow[] | "    allow: \(.)")' "${GB_BODY_FILE}"
            if [ "$(jq -r '.enforced' "${GB_BODY_FILE}")" != "true" ]; then
              gb_finding "Enforce Auto-Review is off: members can switch Auto-review off, and Team Bots in Slack and teammates' chats run without it (TRAP 4)"
            fi
            if [ "$(jq '(.rules.allow | length) + (.rules.block | length)' "${GB_BODY_FILE}")" -eq 0 ]; then
              gb_finding "no team Auto-review rules: rules.allow and rules.block are both empty, so no team instructions feed Auto Review. Add 'Ask first' rules with Configure Rules on the Grok Bot page (TRAP 5)"
            fi
            echo "  (team policy only — a group can set \"Don't enforce for this group\"; see the 4.3 pack)"
            GB_UNPROVEN="group opt-outs ('Don't enforce for this group' is not readable by any API — check each group's Grok Bot tab, see 4.3)"
          }
      enforce-auto-review-lock:
        content: |2
          enforce() {
            local body
            # TRAP 1: re-read right before the PUT and send the stored lists back unchanged.
            read_auto_review
            if [ "$(jq -r '.enforced' "${GB_BODY_FILE}")" = "true" ]; then
              echo "  enforced is already true; team rules are authored in the dashboard (Configure Rules, TRAP 3), so there is nothing to send"
              return 0
            fi
            body=$(jq -c '{enforced: true, rules: {allow: .rules.allow, block: .rules.block}}' "${GB_BODY_FILE}")
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PUT /grok-bot/auto-review "${body}"
              return 0
            fi
            gb_put team /grok-bot/auto-review "${body}"
            if [ "${GB_CODE}" = "403" ]; then
              echo "PRECONDITION: PUT /grok-bot/auto-review returned 403 — Enforce Auto-Review is not available to this team, or the team cannot set Auto-Review rules and the stored lists are non-empty (TRAP 2)" >&2
              exit 2
            fi
            gb_require_2xx "PUT /grok-bot/auto-review"
            # The response echoes the policy: the instructions must come back as sent.
            if [ "$(jq -S -c '.rules' "${GB_BODY_FILE}")" != "$(jq -S -c '.rules' <<<"${body}")" ]; then
              gb_fail "the PUT changed the stored instructions — compare the dashboard's rules with: $(jq -c '.rules' "${GB_BODY_FILE}")"
            fi
            echo "  PUT /grok-bot/auto-review -> enforced=$(jq -r '.enforced' "${GB_BODY_FILE}"), instructions unchanged"
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-4.01-external-email-sent.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-4.01-external-email-sent.yml"
      excerpts:
        detection:
          content: |2
            # destination_type 'email' is mail from the user's Bot addresses; drafts
            # awaiting approval are 'draft', and sends through a connected Gmail/Outlook
            # plugin are mcp_tool_call rows; neither is selected.
            detection:
                selection_event:
                    - event_name: 'cursor.grok_bot.message_delivery'
                    - body: 'grok_bot_message_delivery'
                selection_email_sent:
                    cursor.grok_bot.message_delivery.destination_type: 'email'
                    cursor.grok_bot.message_delivery.result: 'sent'
                condition: selection_event and selection_email_sent
            fields:
                - cursor.user.email
                - cursor.conversation.id
                - cursor.event.id
                - cursor.grok_bot.tool_call.id
                - cursor.grok_bot.turn.id
                - cursor.grok_bot.initiated_by
                - cursor.grok_bot.provenance

"4.2":
  api:
    lang: "bash"
    filename: "hth-grok-bot-4.02-team-rules.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-4.02-team-rules.sh"
    excerpts:
      verify-team-rules:
        content: |2
          verify() {
            local want report
            LIVE_RULES=$(list_rules)
            echo "Grok Bot 4.2 — team rules: $(jq 'length' <<<"${LIVE_RULES}")"
            jq -r '.[] | "    - [\(if .enabled then "on " else "OFF" end)] \(.name)  (scope=\(.scope // "?"))"' <<<"${LIVE_RULES}"
          
            if [ "$(jq 'length' <<<"${LIVE_RULES}")" -eq 0 ]; then
              gb_finding "no Grok Bot team rules exist"
            fi
            if [ "$(jq '[.[] | select(.enabled == false)] | length' <<<"${LIVE_RULES}")" -gt 0 ]; then
              gb_finding "disabled team rules: $(jq -r '[.[] | select(.enabled == false) | .name] | join("; ")' <<<"${LIVE_RULES}")"
            fi
            if [ "$(jq '[.[].name] | length != (unique | length)' <<<"${LIVE_RULES}")" = "true" ]; then
              gb_finding "two or more live rules share a name — the reviewed-file diff below is ambiguous"
            fi
          
            if [ -n "${HTH_RULES_FILE:-}" ]; then
              want=$(reviewed_rules)
              report=$(jq -r --argjson want "${want}" '
                . as $live
                | ($want[] | . as $w | ($live | map(select(.name == $w.name)) | first) as $l
                   | if $l == null then "MISSING: \($w.name)"
                     elif $l.content != $w.content then "DRIFT:   \($w.name) (content differs from the reviewed file)"
                     else empty end),
                  ($live[] | select(.name as $n | ($want | map(.name) | index($n)) == null) | "UNEXPECTED: \(.name)")' <<<"${LIVE_RULES}")
              if [ -n "${report}" ]; then
                sed 's/^/    /' <<<"${report}"
                gb_finding "team rules differ from ${HTH_RULES_FILE}"
              fi
            fi
          }
      enforce-team-rules:
        content: |2
          enforce() {
            local want missing disabled held total body id name
            want=$(reviewed_rules)
            missing=$(jq -c --argjson live "${LIVE_RULES}" '[.[] | select(.name as $n | ($live | map(.name) | index($n)) == null)]' <<<"${want}")
            # Re-enable only a disabled rule whose name AND content match a reviewed rule.
            disabled=$(jq -c --argjson want "${want}" '[.[] | . as $l | select(.enabled == false and any($want[]; .name == $l.name and .content == $l.content))]' <<<"${LIVE_RULES}")
            held=$(jq -r --argjson want "${want}" '.[] | . as $l | select(.enabled == false and any($want[]; .name == $l.name and .content != $l.content)) | .name' <<<"${LIVE_RULES}")
            while IFS= read -r name; do
              [ -n "${name}" ] || continue
              echo "  not re-enabled (content differs from the reviewed file — review first): ${name}"
            done <<<"${held}"
            total=$(( $(jq 'length' <<<"${LIVE_RULES}") + $(jq 'length' <<<"${missing}") ))
            if [ "${total}" -gt 50 ]; then
              echo "PRECONDITION: creating $(jq 'length' <<<"${missing}") rule(s) would exceed the team's 50-rule limit" >&2
              exit 2
            fi
          
            while IFS= read -r body; do
              [ -n "${body}" ] || continue
              if [ "${GB_APPLY}" -ne 1 ]; then gb_plan POST /grok-bot/team-rules "${body}"; continue; fi
              gb_post team /grok-bot/team-rules "${body}"
              gb_require "POST /grok-bot/team-rules" 201
              echo "  created: $(jq -r '.teamRule.name' "${GB_BODY_FILE}") ($(jq -r '.teamRule.id' "${GB_BODY_FILE}"))"
            done < <(jq -c '.[] | {name, content, enabled: true}' <<<"${missing}")
          
            while IFS=$'\t' read -r id name; do
              [ -n "${id}" ] || continue
              if [ "${GB_APPLY}" -ne 1 ]; then gb_plan PATCH "/grok-bot/team-rules/${id}" '{"enabled": true}'; continue; fi
              gb_patch team "/grok-bot/team-rules/$(jq -rn --arg i "${id}" '$i|@uri')" '{"enabled": true}'
              gb_require_2xx "PATCH /grok-bot/team-rules/${id}"
              echo "  re-enabled: ${name}"
            done < <(jq -r '.[] | [.id, .name] | @tsv' <<<"${disabled}")
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-4.02-team-rule-deleted-or-disabled.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-4.02-team-rule-deleted-or-disabled.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). team_rule has no scope
            # field, so Cursor editor rules match too; Grok Bot coverage is inferred.
            detection:
                selection_deleted:
                    event_type: 'team_rule'
                    event_data.action: 'delete'
                selection_disabled:
                    event_type: 'team_rule'
                    event_data.action: 'update'
                    event_data.is_active:
                        - false
                        - 'false'
                condition: 1 of selection_*
            fields:
                - timestamp
                - user_email
                - ip_address
                - application_type
                - event_data.action
                - event_data.rule_id
                - event_data.rule_name
                - event_data.is_active
                - event_data.is_required

"4.3":
  api:
    lang: "bash"
    filename: "hth-grok-bot-4.03-audit-group-overrides.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-4.03-audit-group-overrides.sh"
    excerpts:
      audit-group-overrides:
        content: |2
          verify() {
            local days events
            echo "Grok Bot 4.3 — group Grok Bot tab overrides"
          
            # State: the one group override an API can neutralize is network policy.
            gb_get team /grok-bot/network
            gb_require "GET /grok-bot/network" 200
            gb_shape '.locked | type == "boolean"' "GET /grok-bot/network"
            echo "  team network policy locked=$(jq -r '.locked' "${GB_BODY_FILE}")"
            if [ "$(jq -r '.locked' "${GB_BODY_FILE}")" != "true" ]; then
              gb_finding "network policy is not locked: a group's own network policy replaces the team's for its members (fix with the 3.1 pack)"
            fi
          
            # Change: every group setting, Group Rule and Group Setup Script edit (TRAP 2, TRAP 3).
            days=$(gb_lookback_days 30)
            events="$(gb_tmp events)"
            gb_audit_pull "grok_bot_group_settings,grok_bot_group_resource" "${days}" "${events}"
            echo "  group changes in the last ${days} day(s): $(wc -l < "${events}" | tr -d ' ')"
            jq -r '"    \(.timestamp)  by \(.user_email // "unknown")  group=\(.event_data.group_name // .event_data.group_id // "?")  " +
              (if .event_type == "grok_bot_group_settings" then
                 "setting \(.event_data.setting_name // "?"): \(.event_data.old_value | tojson) -> \(.event_data.new_value | tojson)"
               else
                 "\(.event_data.resource // "?") \(.event_data.action // "?"): \(.event_data.resource_name // .event_data.resource_id // "?")"
               end)' "${events}"
            if [ -s "${events}" ]; then
              gb_finding "$(wc -l < "${events}" | tr -d ' ') group Grok Bot tab change(s) — each needs a recorded exception, or a revert in the dashboard"
            fi
            echo "  NOT VERIFIABLE BY API: overrides set before the window (TRAP 1) — review every group's Grok Bot tab"
            GB_UNPROVEN="current group Grok Bot tab state (overrides set before the ${days}-day window) — review every group's tab in the dashboard"
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-4.03-group-setting-changed.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-4.03-group-setting-changed.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). setting_name values
            # are not enumerated, so every group change is selected.
            detection:
                selection_group_setting:
                    event_type: 'grok_bot_group_settings'
                selection_group_resource:
                    event_type: 'grok_bot_group_resource'
                condition: 1 of selection_*
            fields:
                - timestamp
                - user_email
                - ip_address
                - event_type
                - event_data.group_id
                - event_data.group_name
                - event_data.setting_name
                - event_data.old_value
                - event_data.new_value
                - event_data.resource
                - event_data.action
                - event_data.resource_id
                - event_data.resource_name

"5.1":
  api:
    lang: "bash"
    filename: "hth-grok-bot-5.01-template-sharing.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-5.01-template-sharing.sh"
    excerpts:
      verify-template-sharing:
        content: |2
          verify() {
            gb_read_capabilities
            local caps="${GB_TMP_DIR}/capabilities.json" value
            if ! jq -e 'has("templateSharing") and ((.templateSharing == null) or (.templateSharing | IN("all","team_only","none")))' "${caps}" >/dev/null; then
              echo "PRECONDITION: GET /grok-bot/capabilities has no documented templateSharing value — nothing was judged" >&2
              exit 2
            fi
            value=$(jq -r '.templateSharing // "null"' "${caps}")
            echo "Grok Bot 5.1 — templateSharing: ${value}"
            case "${value}" in
              team_only) ;;
              none)
                echo "PRECONDITION: templateSharing=none is an undocumented value — confirm live that it blocks public template links before accepting it; not judged, and not overwritten (TRAP 2)" >&2
                exit 2 ;;
              all)  gb_finding "members can publish Bot templates outside the team (templateSharing=all)" ;;
              null) gb_finding "templateSharing=null follows the team default, which is 'allowed' on non-Enterprise teams — set team_only explicitly" ;;
            esac
          }
      enforce-template-sharing:
        content: |2
          enforce() {
            local body='{"templateSharing": "team_only"}'
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PATCH /grok-bot/capabilities "${body}"
              return 0
            fi
            gb_patch team /grok-bot/capabilities "${body}"
            gb_require_2xx "PATCH /grok-bot/capabilities"
            echo "  PATCH /grok-bot/capabilities -> templateSharing=$(jq -r '.templateSharing // "null"' "${GB_BODY_FILE}")"
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-5.01-public-template.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-5.01-public-template.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). visibility values are
            # documented in upper case: TEAM, PUBLIC.
            detection:
                selection:
                    event_type: 'grok_bot_resource'
                    event_data.resource_type: 'template'
                    event_data.visibility: 'PUBLIC'
                condition: selection
            fields:
                - timestamp
                - user_email
                - ip_address
                - event_data.action
                - event_data.resource_id
                - event_data.visibility
                - event_data.previous_visibility

"5.2":
  api:
    lang: "bash"
    filename: "hth-grok-bot-5.02-inventory-team-bots.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-5.02-inventory-team-bots.sh"
    excerpts:
      inventory-team-bots:
        content: |2
          verify() {
            local days events published unapproved
            days=$(gb_lookback_days 30)
            events="$(gb_tmp events)"
            gb_audit_pull "grok_bot_created,grok_bot_lifecycle,grok_bot_skill,slack_account_link" "${days}" "${events}"
            echo "Grok Bot 5.2 — Team Bot activity in the last ${days} day(s)"
          
            echo "  Bots created:"
            jq -r 'select(.event_type == "grok_bot_created")
              | "    \(.timestamp)  \(.event_data.agent_id // "?")  \"\(.event_data.name // "?")\"  source=\(.event_data.source // "?")  by \(.user_email // "unknown")"' "${events}"
            echo "  Publishing, visibility and deletion:"
            jq -r 'select(.event_type == "grok_bot_lifecycle"
                          and (.event_data.action | IN("published","unpublished","visibility_changed","delete")))
              | "    \(.timestamp)  \(.event_data.agent_id // "?")  \(.event_data.action)\(if .event_data.new_visibility then " -> \(.event_data.new_visibility)" else "" end)  by \(.user_email // "unknown")"' "${events}"
            echo "  Skill changes:"
            jq -r 'select(.event_type == "grok_bot_skill")
              | "    \(.timestamp)  \(.event_data.agent_id // "?")  \(.event_data.action // "?") \(.event_data.skill_slug // "?")  by \(.user_email // "unknown")"' "${events}"
            echo "  Slack account links:"
            jq -r 'select(.event_type == "slack_account_link")
              | "    \(.timestamp)  \(.user_email // "unknown")  \(.event_data.action // "?")  slack_team=\(.event_data.slack_team_id // "?")  workspace_changed=\(.event_data.workspace_changed // "?")"' "${events}"
          
            echo "  NOT VERIFIABLE BY API: Manage Team Bots assignment, managers, Team Bot secrets, plugins, files and Slack apps (TRAP 2; see its V0.57.0 conflict)"
            GB_UNPROVEN="Team Bots published before the ${days}-day window, Manage Team Bots assignment, managers, and Team Bot secrets, plugins, files and Slack apps (dashboard and Slack only, TRAP 1 and TRAP 2)"
          
            # Every publish to the team must map to an approved Bot.
            published=$(jq -r 'select(.event_type == "grok_bot_lifecycle" and .event_data.action == "published") | .event_data.agent_id // "?"' "${events}" | sort -u)
            if [ -z "${published}" ]; then return 0; fi
            if [ -n "${HTH_APPROVED_AGENT_IDS:-}" ]; then
              unapproved=$(jq -rn --arg ok "${HTH_APPROVED_AGENT_IDS}" --arg got "${published}" \
                '($ok | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $a | $got | split("\n")[] | select(. as $g | $a | index($g) | not)')
            else
              unapproved="${published}"
            fi
            if [ -n "${unapproved}" ]; then
              gb_finding "Bots published to the team without a matching approval: $(echo "${unapproved}" | tr '\n' ' ')"
            fi
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-5.02-team-bot-published.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-5.02-team-bot-published.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). No documented audit
            # event covers a Team Bot's managers, secrets, plugins, files or Slack app.
            detection:
                selection:
                    event_type: 'grok_bot_lifecycle'
                    event_data.action: 'published'
                condition: selection
            fields:
                - timestamp
                - user_email
                - ip_address
                - event_data.agent_id
                - event_data.action
                - event_data.changed_fields
                - event_data.old_visibility
                - event_data.new_visibility

"6.1":
  api:
    lang: "bash"
    filename: "hth-grok-bot-6.01-action-recording.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-6.01-action-recording.sh"
    excerpts:
      verify-action-recording:
        content: |2
          verify() {
            gb_read_capabilities
            local caps="${GB_TMP_DIR}/capabilities.json"
            if ! jq -e '.actionRecording | type == "boolean"' "${caps}" >/dev/null; then
              echo "PRECONDITION: GET /grok-bot/capabilities has no boolean actionRecording — nothing was judged" >&2
              exit 2
            fi
            echo "Grok Bot 6.1 — actionRecording=$(jq -r '.actionRecording' "${caps}")"
            if [ "$(jq -r '.actionRecording' "${caps}")" != "true" ]; then
              gb_finding "Action Recording is off: no record exists of the commands, browsing, file transfers or connector calls Bots make"
            fi
            echo "  NOT VERIFIABLE BY API: the OpenTelemetry destination (Team Settings > OpenTelemetry Export)."
            echo "  Confirm a destination exists with the grok_bot_agent_actions family on, and that your"
            echo "  collector receives cursor.grok_bot.* log events with cursor.surface=grok_bot (TRAP 1, TRAP 3)."
            echo "  Drift signal: customer_telemetry_destination / customer_telemetry_content_opt_in audit rows (6.2 pack)."
            GB_UNPROVEN="the OpenTelemetry destination and its grok_bot_agent_actions family (Team Settings only; watch customer_telemetry_* in the 6.2 pack)"
          }
      enforce-action-recording:
        content: |2
          enforce() {
            local body='{"actionRecording": true}'
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PATCH /grok-bot/capabilities "${body}"
              return 0
            fi
            gb_patch team /grok-bot/capabilities "${body}"
            gb_require_2xx "PATCH /grok-bot/capabilities"
            echo "  PATCH /grok-bot/capabilities -> actionRecording=$(jq -r '.actionRecording' "${GB_BODY_FILE}")"
          }

"6.2":
  api:
    lang: "bash"
    filename: "hth-grok-bot-6.02-export-grok-bot-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-6.02-export-grok-bot-audit.sh"
    excerpts:
      export-grok-bot-audit:
        content: |2
          verify() {
            local days events flagged review count
            days=$(gb_lookback_days 1)
            events="$(gb_tmp events)"
            gb_audit_pull "${GROK_BOT_EVENTS}" "${days}" "${events}"
            count=$(wc -l < "${events}" | tr -d ' ')
          
            echo "Grok Bot 6.2 — ${count} Grok Bot audit event(s) in the last ${days} day(s)"
            jq -s -r 'group_by(.event_type) | map("    \(.[0].event_type): \(length)") | .[]' "${events}"
            echo "  by acting surface (context only — TRAP 1):"
            jq -s -r 'group_by(.application_type // "") | map("    \(if .[0].application_type == "" or .[0].application_type == null then "(unknown)" else .[0].application_type end): \(length)") | .[]' "${events}"
          
            # Posture-changing rows, selected by event_type and documented field values only.
            flagged=$(jq -r '
              (if .event_type == "sand_onboarding" then
                  "Grok Bot \(if .event_data.new_completed == true then "ENABLED" else "DISABLED" end) for the team"
               elif .event_type == "grok_bot_access_changed" then
                  "access \(.event_data.old_mode // "?") -> \(.event_data.new_mode // "?")\(if .event_data.new_mode == "all" then " (WIDENED to every member)" else "" end)"
               elif .event_type == "grok_bot_team_setup_manifest" then
                  "team setup manifest \(.event_data.action // "?"): \(.event_data.manifest_id // "?") (\(.event_data.entry_count // "?") entries)"
               elif .event_type == "grok_bot_group_settings" then
                  "group \(.event_data.group_name // "?") setting \(.event_data.setting_name // "?") changed"
               elif .event_type == "grok_bot_group_resource" then
                  "group \(.event_data.group_name // "?") \(.event_data.resource // "?") \(.event_data.action // "?")"
               elif .event_type == "grok_bot_resource" and .event_data.visibility == "PUBLIC" then
                  "\(.event_data.resource_type // "?") \(.event_data.resource_id // "?") is PUBLIC (\(.event_data.action // "?"))"
               elif .event_type == "grok_bot_lifecycle" and .event_data.action == "published" then
                  "Bot \(.event_data.agent_id // "?") published to the team"
               elif .event_type == "grok_bot_routine" and (.event_data.action | IN("create","update","enable")) then
                  "routine \(.event_data.action) \"\(.event_data.name // "?")\" on Bot \(.event_data.sand_agent_id // "?") trigger=\(.event_data.trigger_type // "?")"
               elif .event_type == "customer_telemetry_destination" then
                  "OpenTelemetry destination \(.event_data.action // "?") \(.event_data.destination_id // "?")"
                  + (if .event_data.action == "delete" then " — 6.1 export path REMOVED" else "" end)
                  + (if .event_data.enabled == false then " — destination DISABLED" else "" end)
                  + " enabled_families=\(.event_data.enabled_families | tojson) disabled_families=\(.event_data.disabled_families | tojson)"
               elif .event_type == "customer_telemetry_content_opt_in" then
                  (if .event_data.enabled == true then "conversation-content export turned ON (prompts, responses and tool I/O may now leave Cursor; L3 decision)"
                   else "conversation-content export turned OFF" end)
               elif .event_type == "grok_bot_machine" and .event_data.action == "register" then
                  "local computer registered: \(.event_data.machine_id // "?")"
               elif .event_type == "grok_bot_vm_bulk" then
                  "bulk computer operation \(.event_data.action // "?"): target=\(.event_data.target_count // "?") failed=\(.event_data.failed_count // "?")"
               else empty end) as $why
              | "    \(.timestamp)  by \(.user_email // "unknown")  \($why)"' "${events}")
          
            echo "  posture-changing events (review each):"
            if [ -n "${flagged}" ]; then echo "${flagged}"; else echo "    none"; fi
          
            # Unflagged review block: team_settings names the docs do not list (TRAP 3).
            review=$(jq -r --argjson known "${DOCUMENTED_TEAM_SETTINGS}" '
              select(.event_type == "team_settings" and ((.event_data.setting_name // "") as $n | $known | index($n) | not))
              | "    \(.timestamp)  by \(.user_email // "unknown")  \(.event_data.setting_name // "?"): \(.event_data.old_value | tojson) -> \(.event_data.new_value | tojson)"' "${events}")
            echo "  undocumented team_settings changes (may include Grok Bot team toggles; unverified, review each):"
            if [ -n "${review}" ]; then echo "${review}"; else echo "    none"; fi
          
            if [ -n "${HTH_AUDIT_OUT:-}" ]; then
              cp "${events}" "${HTH_AUDIT_OUT}"
              echo "  exported ${count} event(s) as JSONL to ${HTH_AUDIT_OUT}"
            fi
            if [ "${count}" -eq 0 ]; then
              echo "  NOTE: zero events — confirm the window, and that this key belongs to the Enterprise team"
            fi
            if [ -n "${flagged}" ] && [ "${HTH_FAIL_ON_FLAGGED:-0}" = "1" ]; then
              gb_finding "$(wc -l <<<"${flagged}" | tr -d ' ') posture-changing Grok Bot event(s) in the window"
            fi
            GB_UNPROVEN="changes before the ${days}-day window, and Grok Bot toggles that log only as team_settings under an undocumented setting_name (listed above for review, TRAP 3)"
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-6.02-routine-created.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-6.02-routine-created.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). trigger_type values are
            # not enumerated, so the rule does not filter on them.
            detection:
                selection:
                    event_type: 'grok_bot_routine'
                    event_data.action:
                        - 'create'
                        - 'update'
                        - 'enable'
                condition: selection
            fields:
                - timestamp
                - user_email
                - ip_address
                - application_type
                - event_data.automation_id
                - event_data.name
                - event_data.sand_agent_id
                - event_data.trigger_type
                - event_data.creation_source
                - event_data.enabled
    - lang: "yaml"
      filename: "hth-grok-bot-6.02-telemetry-export-changed-b.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-6.02-telemetry-export-changed-b.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). Family values are not
            # enumerated, so other destination updates are reviewed in the 6.02 pack.
            detection:
                selection_deleted:
                    event_type: 'customer_telemetry_destination'
                    event_data.action: 'delete'
                selection_disabled:
                    event_type: 'customer_telemetry_destination'
                    event_data.enabled:
                        - false
                        - 'false'
                selection_content_on:
                    event_type: 'customer_telemetry_content_opt_in'
                    event_data.enabled:
                        - true
                        - 'true'
                condition: 1 of selection_*
            fields:
                - timestamp
                - user_email
                - ip_address
                - event_type
                - event_data.action
                - event_data.destination_id
                - event_data.endpoint_url
                - event_data.enabled
                - event_data.enabled_families
                - event_data.disabled_families

"7.1":
  api:
    lang: "bash"
    filename: "hth-grok-bot-7.01-offboard-member.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-7.01-offboard-member.sh"
    excerpts:
      offboard-delete-then-remove:
        content: |2
          offboard() {
            local members uid op body status item state active
            # 0. Both keys must point at CURSOR_TEAM_ID, and the leaver must be active on
            #    the Team key's team, before anything irreversible is planned (TRAP 6).
            gb_require_team_key_matches
            gb_get team /teams/members
            gb_require "GET /teams/members" 200
            gb_shape '.teamMembers | type == "array"' "GET /teams/members"
            active=$(jq -r --arg e "${HTH_OFFBOARD_EMAIL}" '[.teamMembers[] | select((.email | ascii_downcase) == ($e | ascii_downcase) and .isRemoved == false)] | length' "${GB_BODY_FILE}")
            if [ "${active}" -ne 1 ]; then
              echo "PRECONDITION: ${HTH_OFFBOARD_EMAIL} is not exactly one active member of the Team key's team (found ${active}) — remove-member would fail after an irreversible delete (TRAP 6)" >&2
              exit 2
            fi
          
            # 1. Numeric id for the Organization API, resolved by email (TRAP 3).
            members="$(gb_tmp members)"
            gb_org_members "${members}"
            uid=$(jq -r --arg e "${HTH_OFFBOARD_EMAIL}" 'select((.email | ascii_downcase) == ($e | ascii_downcase)) | .id' "${members}")
            if [ -z "${uid}" ] || [ "$(wc -l <<<"${uid}" | tr -d ' ')" -ne 1 ]; then
              echo "PRECONDITION: ${HTH_OFFBOARD_EMAIL} is not exactly one member of team ${CURSOR_TEAM_ID} — data can only be deleted for a current member (TRAP 1)" >&2
              exit 2
            fi
            echo "Grok Bot 7.1 — offboarding ${HTH_OFFBOARD_EMAIL} (numeric id ${uid}) from team ${CURSOR_TEAM_ID}"
          
            op=$(gb_uuid HTH_OFFBOARD_OPERATION_ID)
            # A resumed id must name THIS member's delete, or be unused (TRAP 7). The
            # status route documents two 404 bodies: "Operation not found." (never
            # started, or aged out) and "This operation finished, and its status is no
            # longer available." (completion can no longer be proven).
            if [ -n "${HTH_OFFBOARD_OPERATION_ID:-}" ]; then
              gb_get org "/organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations/${op}?limit=1000"
              case "${GB_CODE}" in
                200)
                  if ! jq -e --argjson u "${uid}" '.action == "delete_vm_and_data" and ((.items == null) or any(.items[]; .userId == $u))' "${GB_BODY_FILE}" >/dev/null; then
                    echo "PRECONDITION: HTH_OFFBOARD_OPERATION_ID ${op} is a $(jq -r '.action // "unknown"' "${GB_BODY_FILE}") operation that does not cover ${HTH_OFFBOARD_EMAIL} — unset it to start a new delete; the member was NOT removed (TRAP 7)" >&2
                    exit 2
                  fi ;;
                404)
                  if jq -e '(.message // .error // "") | tostring | test("no longer available")' "${GB_BODY_FILE}" >/dev/null 2>&1; then
                    echo "PRECONDITION: operation ${op} finished and its status is no longer available, so the delete cannot be proven — the member was NOT removed; unset HTH_OFFBOARD_OPERATION_ID to start a new delete (TRAP 7)" >&2
                    exit 2
                  fi ;;
                *) gb_require "GET /organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations/${op}" 200 ;;
              esac
            fi
            body=$(jq -nc --argjson u "${uid}" --arg op "${op}" '{action: "delete_vm_and_data", userIds: [$u], operationId: $op}')
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan POST "/organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations" "${body}"
              gb_plan POST /teams/remove-member "$(jq -nc --arg e "${HTH_OFFBOARD_EMAIL}" '{email: $e}')"
              echo "DRY RUN: nothing was changed. Re-run with --apply. delete_vm_and_data cannot be undone (TRAP 2)."
              return 0
            fi
          
            # 2. Delete the computer and its durable data. A retry with the same
            #    operationId returns the existing operation instead of starting another.
            gb_post org "/organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations" "${body}"
            if [ "${GB_CODE}" = "409" ]; then
              echo "PRECONDITION: another computer operation is running for this team: $(jq -r '.runningOperationId // "unknown (use GET .../operations/latest)"' "${GB_BODY_FILE}")" >&2
              exit 2
            fi
            gb_require "POST /organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations" 202
            op=$(jq -r '.operationId // empty' "${GB_BODY_FILE}")
            if [ -z "${op}" ]; then echo "PRECONDITION: 202 without an operationId" >&2; exit 2; fi
            echo "  delete_vm_and_data queued: operationId=${op} (re-run with HTH_OFFBOARD_OPERATION_ID=${op} to resume)"
          
            # 3. Follow it to the end and read THIS member's result.
            status="$(gb_tmp operation)"
            gb_poll_operation "${op}" "${status}" HTH_OFFBOARD_OPERATION_ID
            # A reused operationId returns the EXISTING operation and Cursor does not
            # compare the body, so prove this is our delete before trusting its items (TRAP 7).
            if ! jq -e --arg op "${op}" '.operationId == $op and .action == "delete_vm_and_data"' "${status}" >/dev/null; then
              echo "PRECONDITION: operation ${op} is action=$(jq -r '.action // "unknown"' "${status}"), not delete_vm_and_data — HTH_OFFBOARD_OPERATION_ID names a different operation; unset it and re-run. The member was NOT removed (TRAP 7)" >&2
              exit 2
            fi
            item=$(jq -c --argjson u "${uid}" '(.items // [])[] | select(.userId == $u)' "${status}")
            if [ -z "${item}" ]; then item='{}'; fi
            state=$(jq -r '.state // "missing"' <<<"${item}")
            echo "  member result: state=${state} reason=$(jq -r '.reason // "none"' <<<"${item}")"
            if [ "${state}" != "succeeded" ]; then
              gb_fail "computer data was NOT deleted for ${HTH_OFFBOARD_EMAIL} — refusing to remove the member, because removal would end the only documented deletion path (TRAP 1)"
            fi
          
            # 4. Only now remove the member from the team.
            gb_post team /teams/remove-member "$(jq -nc --arg e "${HTH_OFFBOARD_EMAIL}" '{email: $e}')"
            gb_require_2xx "POST /teams/remove-member"
            if jq -e '.success == false' "${GB_BODY_FILE}" >/dev/null 2>&1; then
              gb_fail "remove-member answered success=false: $(jq -c '.' "${GB_BODY_FILE}")"
            fi
          
            # 5. Confirm, rather than trust the response.
            gb_get team /teams/members
            gb_require "GET /teams/members" 200
            gb_shape '.teamMembers | type == "array"' "GET /teams/members"
            if jq -e --arg e "${HTH_OFFBOARD_EMAIL}" 'any(.teamMembers[]; (.email | ascii_downcase) == ($e | ascii_downcase) and .isRemoved == false)' "${GB_BODY_FILE}" >/dev/null; then
              gb_fail "${HTH_OFFBOARD_EMAIL} is still listed as an active team member"
            fi
            echo "DONE: computer data deleted and ${HTH_OFFBOARD_EMAIL} removed from team ${CURSOR_TEAM_ID}."
            echo "  Next: confirm audit rows remove_user and credentials_revoked (sessions=revoked; 'retained' means"
            echo "  another org team still holds them — TRAP 5), offboard any other team, and revoke IdP sessions."
          }

"7.2":
  api:
    lang: "bash"
    filename: "hth-grok-bot-7.02-contain.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-7.02-contain.sh"
    excerpts:
      contain-disable-grok-bot:
        content: |2
          disable_team() {
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan POST /grok-bot/disable
              echo "  (team-wide: every member loses Grok Bot access — TRAP 1)"
              return 0
            fi
            gb_post team /grok-bot/disable
            gb_require "POST /grok-bot/disable" 204
            echo "  POST /grok-bot/disable -> 204"
            gb_get team /grok-bot/capabilities
            gb_require "GET /grok-bot/capabilities" 200
            if [ "$(jq -r '.enabled' "${GB_BODY_FILE}")" != "false" ]; then
              gb_fail "Grok Bot still reads enabled=$(jq -r '.enabled' "${GB_BODY_FILE}") after disable"
            fi
            echo "  confirmed: enabled=false (audit: sand_onboarding with new_completed=false)"
          }
      contain-terminate-computers:
        content: |2
          terminate_computers() {
            local members ids n op body opfile failed got
            gb_require_key org
            members="$(gb_tmp members)"
            gb_org_members "${members}"
            if [ "${HTH_CONTAIN_ALL:-0}" = "1" ]; then
              ids=$(jq -s -c 'map(.id) | unique' "${members}")
            elif [ -n "${HTH_CONTAIN_EMAILS:-}" ]; then
              ids=$(jq -s -c --arg e "${HTH_CONTAIN_EMAILS}" '
                ($e | ascii_downcase | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want
                | [.[] | select((.email | ascii_downcase) as $m | $want | index($m))] | map(.id) | unique' "${members}")
              if [ "$(jq 'length' <<<"${ids}")" -ne "$(jq -n --arg e "${HTH_CONTAIN_EMAILS}" '$e | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique | length')" ]; then
                echo "PRECONDITION: not every address in HTH_CONTAIN_EMAILS is a member of team ${CURSOR_TEAM_ID}" >&2
                exit 2
              fi
            else
              echo "PRECONDITION: terminate needs HTH_CONTAIN_EMAILS or HTH_CONTAIN_ALL=1" >&2
              exit 2
            fi
            n=$(jq 'length' <<<"${ids}")
            if [ "${n}" -lt 1 ] || [ "${n}" -gt 25000 ]; then
              echo "PRECONDITION: terminate_vm takes 1-25,000 members (got ${n})" >&2
              exit 2
            fi
          
            op=$(gb_uuid HTH_CONTAIN_OPERATION_ID)
            body=$(jq -nc --argjson u "${ids}" --arg op "${op}" '{action: "terminate_vm", userIds: $u, operationId: $op}')
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan POST "/organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations" "${body}"
              return 0
            fi
            gb_post org "/organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations" "${body}"
            if [ "${GB_CODE}" = "409" ]; then
              echo "PRECONDITION: another computer operation is running for this team: $(jq -r '.runningOperationId // "unknown (run: status)"' "${GB_BODY_FILE}")" >&2
              exit 2
            fi
            if [ "${GB_CODE}" = "400" ]; then
              echo "PRECONDITION: POST .../grok-bot/operations returned 400 ($(jq -r '(.message // .error // "no message") | tostring' "${GB_BODY_FILE}" | head -c 300)) — NOTHING STARTED, no computer was terminated." >&2
              echo "  Documented causes: a listed member is no longer a current member of the team (for example removed by SCIM or the dashboard after the list was read) or never signed in to Cursor, or the body is malformed or too large (TRAP 3)." >&2
              echo "  Remedies: re-run (the member list is re-read every run); narrow with HTH_CONTAIN_EMAILS; or use Grok Bot Computers > Manage > select members > Terminate VMs in the dashboard." >&2
              if [ "${DO_DISABLE}" -eq 1 ]; then
                echo "  The disable already landed, but running computers have NOT been stopped (TRAP 1)." >&2
              fi
              exit 2
            fi
            gb_require "POST /organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations" 202
            op=$(jq -r '.operationId // empty' "${GB_BODY_FILE}")
            if [ -z "${op}" ]; then echo "PRECONDITION: 202 without an operationId" >&2; exit 2; fi
          
            # TRAP 5: a reused operationId returns whatever operation already holds it.
            # Check the action before following it, so a responder never waits on the wrong one.
            gb_get org "/organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations/${op}?limit=1"
            gb_require "GET /organizations/teams/${CURSOR_TEAM_ID}/grok-bot/operations/${op}" 200
            if [ "$(jq -r '.action // ""' "${GB_BODY_FILE}")" != "terminate_vm" ]; then
              echo "PRECONDITION: operationId ${op} is an existing $(jq -r '.action // "unknown"' "${GB_BODY_FILE}") operation, not this terminate (Cursor returns 202 for an existing operationId without comparing the body) — unset HTH_CONTAIN_OPERATION_ID and re-run" >&2
              exit 2
            fi
            echo "  terminate_vm queued for ${n} member(s): operationId=${op} (re-run with HTH_CONTAIN_OPERATION_ID=${op} to resume)"
          
            opfile="$(gb_tmp operation)"
            gb_poll_operation "${op}" "${opfile}" HTH_CONTAIN_OPERATION_ID
            # The operation must cover exactly the members requested (TRAP 5).
            if jq -e '.items != null' "${opfile}" >/dev/null; then
              got=$(jq -c '[.items[].userId] | unique' "${opfile}")
              if [ "${got}" != "$(jq -c 'sort' <<<"${ids}")" ]; then
                echo "PRECONDITION: operation ${op} covers userIds ${got}, not the requested ${ids}" >&2
                exit 2
              fi
            elif [ "$(jq -r '.counts.total // -1' "${opfile}")" != "${n}" ]; then
              echo "PRECONDITION: operation ${op} has counts.total=$(jq -r '.counts.total // "?"' "${opfile}") but ${n} members were requested" >&2
              exit 2
            fi
            jq -r '(.items // [])[] | select(.state != "succeeded") | "    userId=\(.userId) \(.state) \(.reason // "")"' "${opfile}"
            failed=$(jq -r '.counts.failed // 0' "${opfile}")
            if [ "${failed}" -gt 0 ]; then
              gb_fail "${failed} member computer(s) were not terminated — start a new operation for them"
            fi
            echo "  terminated: state=$(jq -r '.state' "${opfile}") counts=$(jq -c '.counts' "${opfile}") (audit: grok_bot_vm_bulk bulk_kill)"
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-7.02-disable-or-bulk-vm-action.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-7.02-disable-or-bulk-vm-action.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). grok_bot_vm_bulk is one
            # row per completed operation; its child operations emit no rows.
            detection:
                selection_disabled:
                    event_type: 'sand_onboarding'
                    event_data.new_completed:
                        - false
                        - 'false'
                selection_bulk:
                    event_type: 'grok_bot_vm_bulk'
                selection_kill:
                    event_type: 'grok_bot_vm'
                    event_data.action: 'kill'
                condition: 1 of selection_*
            fields:
                - timestamp
                - user_email
                - ip_address
                - event_type
                - event_data.action
                - event_data.operation_id
                - event_data.target_count
                - event_data.succeeded_count
                - event_data.skipped_count
                - event_data.failed_count
                - event_data.target_user_id
                - event_data.target_user_email
                - event_data.old_completed
                - event_data.new_completed
                - event_data.source

