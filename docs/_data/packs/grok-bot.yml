"1.1":
  api:
    lang: "bash"
    filename: "hth-grok-bot-1.01-limit-access.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-1.01-limit-access.sh"
    excerpts:
      verify-grok-bot-access:
        content: |2
          verify() {
            echo "Grok Bot 1.1 — who can use Grok Bot"
          
            # `enabled` lives on /capabilities, which is not an every-plan read (TRAP 2).
            gb_get team /grok-bot/capabilities
            if [ "${GB_CODE}" = "200" ] && jq -e '.enabled | type == "boolean"' "${GB_BODY_FILE}" >/dev/null; then
              echo "  enabled: $(jq -r '.enabled' "${GB_BODY_FILE}")"
              if [ "$(jq -r '.enabled' "${GB_BODY_FILE}")" = "false" ]; then
                echo "  Grok Bot is disabled for the team: no member has access, whatever the access mode says."
                return 0
              fi
            else
              echo "  enabled: not readable with this key/plan (HTTP ${GB_CODE}); judging on /access alone"
            fi
          
            gb_get team /grok-bot/access
            gb_require "GET /grok-bot/access" 200
            gb_shape '(.mode | IN("all","limited")) and (.groups | type == "array")' "GET /grok-bot/access"
            local mode
            mode=$(jq -r '.mode' "${GB_BODY_FILE}")
            echo "  mode: ${mode}"
            jq -r '.groups[] | "    - \(.id)  \(.name)"' "${GB_BODY_FILE}"
          
            if [ "${mode}" = "all" ]; then
              if [ "${HTH_PLAN:-}" = "teams" ]; then
                echo "PRECONDITION: mode=all is expected on self-serve Teams, which has no group limit and no switch (TRAP 3) — not judged by API; review the team member list and the IdP's Cursor app assignment instead" >&2
                exit 2
              fi
              gb_finding "Grok Bot access mode is 'all' — every team member can use it. On Enterprise, limit it to approved billing groups; on Teams, gate it through team membership and the IdP's Cursor app assignment, and re-run with HTH_PLAN=teams (TRAP 3)."
              return 0
            fi
          
            # A limited policy is judged only against the approved list (TRAP 5).
            if [ -z "${HTH_APPROVED_GROUP_IDS:-}" ]; then
              echo "PRECONDITION: mode is limited; set HTH_APPROVED_GROUP_IDS to judge whether only approved billing groups hold access (billing groups partition every member, so a list naming every billing group reaches everyone outside Unassigned)" >&2
              exit 2
            fi
            local extra
            extra=$(jq -r --argjson ok "$(approved_ids_json)" '[.groups[].id] - $ok | .[]' "${GB_BODY_FILE}")
            if [ -n "${extra}" ]; then
              gb_finding "groups outside HTH_APPROVED_GROUP_IDS have Grok Bot access: $(echo "${extra}" | tr '\n' ' ')"
            fi
          }
      enforce-grok-bot-access:
        content: |2
          enforce() {
            local ids n body unknown
            ids=$(approved_ids_json)
            n=$(jq 'length' <<<"${ids}")
            if [ "${n}" -lt 1 ] || [ "${n}" -gt 100 ]; then
              echo "PRECONDITION: HTH_APPROVED_GROUP_IDS must hold 1-100 group ids (it holds ${n}); an empty limited list returns 400" >&2
              exit 2
            fi
          
            # Every id must be a billing group from List Groups (TRAP 1, TRAP 4).
            gb_get team /teams/groups
            gb_require "GET /teams/groups" 200
            gb_shape '(.groups | type == "array") and all(.groups[]; (.id | type == "string"))' "GET /teams/groups"
            unknown=$(jq -r --argjson want "${ids}" '$want - [.groups[].id] | .[]' "${GB_BODY_FILE}")
            if [ -n "${unknown}" ]; then
              echo "PRECONDITION: not billing-group ids from GET /teams/groups: $(echo "${unknown}" | tr '\n' ' ')(team_group_… directory-group ids are rejected; this pack does not send the reserved unassignedGroup id, which List Groups returns separately)" >&2
              exit 2
            fi
            echo "  approved billing groups:"
            jq -r --argjson want "${ids}" '.groups[] | select(.id as $i | $want | index($i)) | "    - \(.id)  \(.name)  members=\(.memberCount)"' "${GB_BODY_FILE}"
          
            body=$(jq -nc --argjson g "${ids}" '{mode: "limited", groupIds: $g}')
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PUT /grok-bot/access "${body}"
              return 0
            fi
            gb_put team /grok-bot/access "${body}"
            gb_require_2xx "PUT /grok-bot/access"
            echo "  PUT /grok-bot/access -> mode=$(jq -r '.mode // "?"' "${GB_BODY_FILE}") groups=$(jq -c '[.groups[]?.id]' "${GB_BODY_FILE}")"
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-1.01-access-widened.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-1.01-access-widened.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). On a stream the fields
            # sit under <event_type>.<field>. Never filter on application_type.
            detection:
                selection_widened:
                    event_type: 'grok_bot_access_changed'
                    event_data.new_mode: 'all'
                selection_enabled:
                    event_type: 'sand_onboarding'
                    event_data.new_completed:
                        - true
                        - 'true'
                condition: 1 of selection_*
            fields:
                - timestamp
                - user_email
                - ip_address
                - application_type
                - event_type
                - event_data.old_mode
                - event_data.new_mode
                - event_data.old_group_names
                - event_data.new_group_names
                - event_data.old_completed
                - event_data.new_completed
                - event_data.source

"1.2":
  terraform:
    lang: "hcl"
    filename: "hth-grok-bot-1.02-idp-computer-browser-exception.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/terraform/hth-grok-bot-1.02-idp-computer-browser-exception.tf"
    excerpts:
      providers:
        content: |2
          # Both IdPs are declared here because a module may hold only one
          # required_providers block. Delete the entry and provider block your root module
          # does not use: Terraform configures every declared provider even when var.idp
          # leaves it no resources (TRAP 12).
          terraform {
            # check blocks and cross-variable validation need Terraform 1.9 or later.
            required_version = ">= 1.9"
          
            required_providers {
              okta = {
                source = "okta/okta"
                # Arguments transcribed from 7.0.0. Review the schema before raising the pin.
                version = "7.0.0"
              }
              azuread = {
                source = "hashicorp/azuread"
                # Arguments transcribed from 3.10.0. Review the schema before raising the pin.
                version = "3.10.0"
              }
            }
          }
          
          # Reads OKTA_ORG_NAME, OKTA_BASE_URL and the OAuth 2.0 or API-token credential
          # from the environment. Identity Engine only.
          provider "okta" {}
          
          # Reads ARM_TENANT_ID, ARM_CLIENT_ID and a credential from the environment.
          provider "azuread" {}
      okta-computer-browser-rule:
        content: |2
          # Resolve the app sign-in (authentication) policy behind each app the Bot opens.
          # xAI: "open the policy attached to the app".
          data "okta_app_signon_policy" "bot_app" {
            for_each = var.idp == "okta" ? var.okta_app_ids : toset([])
            app_id   = each.value
          }
          
          # The built-in Everyone group, which a "narrow" rule must never include (TRAP 14).
          data "okta_everyone_group" "this" {
            count = var.idp == "okta" ? 1 : 0
          }
          
          locals {
            # One rule per distinct policy. Apps that share a policy share its rules (TRAP 5).
            okta_policy_ids        = toset([for p in data.okta_app_signon_policy.bot_app : p.id])
            okta_everyone_group_id = one(data.okta_everyone_group.this[*].id)
            okta_approved_groups   = coalesce(var.okta_approved_group_ids, var.okta_group_ids)
          }
          
          resource "okta_app_signon_policy_rule" "grok_bot_computer" {
            for_each  = local.okta_policy_ids
            policy_id = each.value
            name      = var.okta_rule_name
          
            # Above the FastPass, managed-device and deny catch-all rules (TRAP 6).
            priority = lookup(var.okta_rule_priority_by_policy, each.value, var.okta_rule_priority)
          
            lifecycle {
              precondition {
                condition     = !contains(var.okta_group_ids, local.okta_everyone_group_id)
                error_message = "okta_group_ids includes Okta's Everyone group, which makes the exception company-wide. Use the Cursor-assigned group or a pilot subset (TRAP 14)."
              }
            }
          
            # IF: the Cursor-assigned group, or a pilot subset of it ...
            groups_included = var.okta_group_ids
          
            # ... on Device platform = Other Desktop ...
            platform_include {
              os_type = "OTHER"
              type    = "DESKTOP"
            }
          
            # ... with Device state = Any: device_is_registered, device_is_managed and
            # device_assurances_included are deliberately unset (TRAP 8).
          
            # THEN: Allowed after successful authentication, with Password + Another factor.
            # No phishing-resistant or hardware-protection constraint (xAI step 5).
            access      = "ALLOW"
            type        = "ASSURANCE"
            factor_mode = "2FA"
            constraints = [
              jsonencode({
                knowledge = {
                  types = ["password"]
                }
              })
            ]
          }
      okta-verify-computer-browser-rule:
        content: |2
          # Read each rule back from Okta: the rules this file manages, plus any rule an
          # admin made in the console (var.okta_verify_rules). The data source returns
          # conditions and access, not factor mode or constraints (TRAP 13). The
          # narrowness asserts are postconditions, so a wide rule FAILS plan or apply; a
          # `check` block would only warn.
          locals {
            okta_rules_to_verify = var.idp != "okta" ? {} : merge(
              {
                for pid, r in okta_app_signon_policy_rule.grok_bot_computer :
                "managed-${pid}" => { policy_id = r.policy_id, rule_id = r.id }
              },
              var.okta_verify_rules,
            )
          }
          
          data "okta_app_sign_on_policy_rule" "grok_bot_computer" {
            for_each  = local.okta_rules_to_verify
            id        = each.value.rule_id
            policy_id = each.value.policy_id
          
            lifecycle {
              # A named group, never Everyone, and only approved groups (TRAP 14).
              postcondition {
                condition = (
                  length(try(self.conditions.people.groups.include, [])) > 0 &&
                  !contains(try(self.conditions.people.groups.include, []), local.okta_everyone_group_id) &&
                  alltrue([
                    for g in try(self.conditions.people.groups.include, []) :
                    contains(local.okta_approved_groups, g)
                  ])
                )
                error_message = "A Grok Bot computer rule has no group condition, includes the Everyone group, or includes a group outside okta_approved_group_ids, so it is wider than the Cursor-assigned group (TRAP 14)."
              }
          
              postcondition {
                condition = length(try(self.conditions.platform.include, [])) > 0 && alltrue([
                  for p in try(self.conditions.platform.include, []) :
                  p.type == "DESKTOP" && try(p.os.type, "") == "OTHER"
                ])
                error_message = "A Grok Bot computer rule matches a platform other than Other Desktop, or carries no platform condition at all."
              }
          
              postcondition {
                condition = (
                  !coalesce(try(self.conditions.device.registered, null), false) &&
                  !coalesce(try(self.conditions.device.managed, null), false) &&
                  length(coalesce(try(self.conditions.device.assurance.include, null), [])) == 0
                )
                error_message = "A Grok Bot computer rule requires a registered or managed device or a device assurance policy, which the Bot's computer cannot satisfy (xAI step 4)."
              }
          
              postcondition {
                condition = (
                  try(self.actions.app_sign_on.access, "") == "ALLOW" &&
                  try(self.actions.app_sign_on.verification_method.type, "") == "ASSURANCE"
                )
                error_message = "A Grok Bot computer rule is not 'Allowed after successful authentication' with an assurance verification method. Check its factor setting in the console (TRAP 13)."
              }
            }
          }
          
          # A warning only: xAI permits a shared policy scoped by group (TRAP 5).
          check "okta_listed_apps_do_not_share_a_policy" {
            assert {
              condition     = length(local.okta_policy_ids) == length(data.okta_app_signon_policy.bot_app)
              error_message = "Two or more apps in okta_app_ids share one app sign-in policy, so the rule covers every app on that policy. Give the Bot's apps their own policy if that is wider than intended (TRAP 5)."
            }
          }
      entra-computer-browser-policy:
        content: |2
          # This policy only states what the Bot's browser must satisfy. Entra applies
          # every matching policy, so your existing compliant-device, hybrid-join,
          # phishing-resistant-strength and approved-client policies still block it until
          # you lift them for exactly the group, Linux and these apps (guide 1.2 Step 2a;
          # xAI step 8; TRAP 3). This file does not edit those policies.
          resource "azuread_conditional_access_policy" "grok_bot_computer_browser" {
            count        = var.idp == "entra" ? 1 : 0
            display_name = var.entra_policy_display_name
          
            # Report-only by default (xAI step 7). Switch to "enabled" after review.
            state = var.entra_policy_state
          
            conditions {
              # HTH narrowing to the computer browser (TRAP 10).
              client_app_types = ["browser"]
          
              # Users: the Cursor-assigned group, or a pilot subset of it.
              users {
                included_groups = sort(tolist(var.entra_group_object_ids))
              }
          
              # Target resources: only the apps the Bot must open, never All (TRAP 11).
              applications {
                included_applications = sort(tolist(var.entra_application_ids))
              }
          
              # Device platforms: include Linux, exclude Windows and macOS (xAI step 5).
              platforms {
                included_platforms = ["linux"]
                excluded_platforms = ["windows", "macOS"]
              }
            }
          
            # Grant: Require multifactor authentication only (xAI step 6), or the
            # passkey-capable authentication strength xAI suggests for Entra (TRAP 9).
            grant_controls {
              operator          = "OR"
              built_in_controls = var.entra_authentication_strength_object_id == null ? ["mfa"] : null
              authentication_strength_policy_id = (
                var.entra_authentication_strength_object_id == null ? null :
                "/policies/authenticationStrengthPolicies/${var.entra_authentication_strength_object_id}"
              )
            }
          }

"2.1":
  api:
    lang: "bash"
    filename: "hth-grok-bot-2.01-audit-connector-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-2.01-audit-connector-policy.sh"
    excerpts:
      audit-connector-policy-changes:
        content: |2
          verify() {
            local days events changes user_cfg auths
            days=$(gb_lookback_days 30)
            events="$(gb_tmp events)"
            gb_audit_pull "team_marketplace,mcp_server_config,mcp_authentication,team_settings" "${days}" "${events}"
            GB_UNPROVEN="connector policy set before the ${days}-day window, and the current Team Marketplace and MCP allowlist state (dashboard only, TRAP 4)"
          
            # Team policy changes: marketplace edits, TEAM-scope MCP server configs,
            # MCP-allowlist settings (TRAP 1, TRAP 2).
            changes=$(jq -c 'select(
                .event_type == "team_marketplace"
                or (.event_type == "mcp_server_config" and (.event_data.scope // "") == "team")
                or (.event_type == "team_settings"
                    and ((.event_data.setting_name // "") | startswith("mcp_allowlist"))))' "${events}")
            user_cfg=$(jq -c 'select(.event_type == "mcp_server_config" and (.event_data.scope // "") != "team")' "${events}")
            auths=$(jq -c 'select(.event_type == "mcp_authentication")' "${events}")
          
            echo "Grok Bot 2.1 — connector-policy changes in the last ${days} day(s)"
            if [ -n "${changes}" ]; then
              jq -r '"  \(.timestamp)  team=\(.team_id // "-")  \(.event_type)  by \(.user_email // "unknown")  " +
                (if .event_type == "mcp_server_config" then
                   "\(.event_data.action // "?") server=\(.event_data.server_name // "?") type=\(.event_data.server_type // "?") scope=\(.event_data.scope // "?")"
                 elif .event_type == "team_settings" then
                   "\(.event_data.setting_name): \(.event_data.old_value | tojson) -> \(.event_data.new_value | tojson)"
                 else
                   (.event_data | tojson)
                 end)' <<<"${changes}"
              gb_finding "$(wc -l <<<"${changes}" | tr -d ' ') connector-policy change(s) — map each to an approved request"
            else
              echo "  none"
            fi
          
            # Context, not findings: personal MCP servers members configured (TRAP 2),
            # and which members connected their accounts to which MCP servers.
            echo "  user-scope MCP server configs in the window: $(if [ -n "${user_cfg}" ]; then wc -l <<<"${user_cfg}" | tr -d ' '; else echo 0; fi)"
            if [ -n "${user_cfg}" ]; then
              jq -r '"    \(.timestamp)  team=\(.team_id // "-")  \(.user_email // "unknown")  \(.event_data.action // "?") server=\(.event_data.server_name // "?") scope=\(.event_data.scope // "?")"' <<<"${user_cfg}"
            fi
            echo "  MCP authentications in the window: $(if [ -n "${auths}" ]; then wc -l <<<"${auths}" | tr -d ' '; else echo 0; fi)"
            if [ -n "${auths}" ]; then
              jq -r '"    \(.timestamp)  team=\(.team_id // "-")  \(.user_email // "unknown")  \(if (.event_data.action // "") == "" then "authenticate" else .event_data.action end)  server=\(.event_data.server_name // "?")  scope=\(.event_data.scope // "?")"' <<<"${auths}"
            fi
          }
  sigma:
    - lang: "yaml"
      filename: "hth-grok-bot-2.01-connector-policy-change.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/siem/sigma/hth-grok-bot-2.01-connector-policy-change.yml"
      excerpts:
        detection:
          content: |2
            # Admin API pull shape (event_type + event_data.<field>). The action values for
            # team_marketplace are not enumerated in the docs, so every action is selected.
            detection:
                selection:
                    event_type: 'team_marketplace'
                condition: selection
            fields:
                - timestamp
                - user_email
                - ip_address
                - event_type
                - event_data.action
                - event_data.marketplace_id
                - event_data.marketplace_name
                - event_data.plugin_id
                - event_data.plugin_name

