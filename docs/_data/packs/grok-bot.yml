    excerpts:
      verify-cloud-agent-delegation:
        content: |2
          verify() {
            gb_read_capabilities
            local caps="${GB_TMP_DIR}/capabilities.json"
            if ! jq -e '.cloudAgents | type == "boolean"' "${caps}" >/dev/null; then
              echo "PRECONDITION: GET /grok-bot/capabilities has no boolean cloudAgents — nothing was judged" >&2
              exit 2
            fi
            echo "Grok Bot 2.3 — team baseline cloudAgents=$(jq -r '.cloudAgents' "${caps}")"
            if [ "$(jq -r '.cloudAgents' "${caps}")" != "false" ]; then
              gb_finding "members can delegate Grok Bot work to Cloud Agents (cloudAgents=true)"
            fi
            echo "  (team baseline only — group tabs can re-allow it; see the 4.3 pack)"
            GB_UNPROVEN="group Grok Bot tabs that re-allow Cloud Agents (no API reads them; TRAP 1)"
          }
      enforce-cloud-agent-delegation:
        content: |2
          enforce() {
            local body='{"cloudAgents": false}'
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PATCH /grok-bot/capabilities "${body}"
              return 0
            fi
            gb_patch team /grok-bot/capabilities "${body}"
            gb_require_2xx "PATCH /grok-bot/capabilities"
            echo "  PATCH /grok-bot/capabilities -> cloudAgents=$(jq -r '.cloudAgents' "${GB_BODY_FILE}")"
          }

"2.4":
  api:
    lang: "bash"
    filename: "hth-grok-bot-2.04-local-execution-never.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/grok-bot/api/hth-grok-bot-2.04-local-execution-never.sh"
    excerpts:
      verify-local-execution-ceiling:
        content: |2
          verify() {
            gb_read_capabilities
            local caps="${GB_TMP_DIR}/capabilities.json" value
            if ! jq -e 'has("localExecution") and ((.localExecution == null) or (.localExecution | IN("never","ask","always")))' "${caps}" >/dev/null; then
              echo "PRECONDITION: GET /grok-bot/capabilities has no documented localExecution value — nothing was judged" >&2
              exit 2
            fi
            value=$(jq -r '.localExecution // "null"' "${caps}")
            echo "Grok Bot 2.4 — team localExecution ceiling: ${value}"
            case "${value}" in
              never) ;;
              null)  gb_finding "no team ceiling (localExecution=null): each member decides whether Bots run commands on their own machine" ;;
              *)     gb_finding "team ceiling is '${value}', not 'never': Bots can execute on members' machines" ;;
            esac
            GB_UNPROVEN="group Grok Bot tabs that raise the ceiling (no API reads them; TRAP 3)"
          }
      enforce-local-execution-ceiling:
        content: |2
          enforce() {
            local body='{"localExecution": "never"}'
            if [ "${GB_APPLY}" -ne 1 ]; then
              gb_plan PATCH /grok-bot/capabilities "${body}"
              return 0
            fi
            gb_patch team /grok-bot/capabilities "${body}"
            gb_require_2xx "PATCH /grok-bot/capabilities"
            echo "  PATCH /grok-bot/capabilities -> localExecution=$(jq -r '.localExecution // "null"' "${GB_BODY_FILE}")"
          }
