          jq -e --arg account "$FASTLY_CUSTOMER_ID" '
              if (.id != $account) or ((.force_2fa | type) != "boolean") or ((.force_sso | type) != "boolean")
              then error("invalid Fastly customer authentication response")
              else {customer_id: .id, force_2fa, force_sso}
              end' <<< "$response"

