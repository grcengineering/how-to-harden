"1.1":
  terraform:
    lang: "hcl"
    filename: "hth-google-vertex-ai-1.01-stage-model-allowlist.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/google-vertex-ai/terraform/hth-google-vertex-ai-1.01-stage-model-allowlist.tf"
    excerpts:
      stage-model-allowlist:
        content: |2
          variable "vertex_policy_project_number" {
            type = string
            validation {
              condition     = can(regex("^[0-9]+$", var.vertex_policy_project_number))
              error_message = "Provide an explicit Google Cloud project number."
            }
          }
          
          variable "vertex_approved_model_actions" {
            type = set(string)
            validation {
              condition = (
                length(var.vertex_approved_model_actions) > 0 &&
                length(var.vertex_approved_model_actions) <= 500 &&
                alltrue([
                  for entry in var.vertex_approved_model_actions :
                  can(regex("^publishers/[A-Za-z0-9._-]+/models/[A-Za-z0-9._-]+:(predict|deploy|tune)$", entry))
                ])
              )
              error_message = "Enter 1–500 exact publisher/model/action entries, without wildcards."
            }
          }
          
          resource "google_org_policy_policy" "vertex_model_allowlist" {
            name   = "projects/${var.vertex_policy_project_number}/policies/vertexai.allowedModels"
            parent = "projects/${var.vertex_policy_project_number}"
          
            dry_run_spec {
              inherit_from_parent = true
              rules {
                values {
                  allowed_values = sort(tolist(var.vertex_approved_model_actions))
                }
              }
            }
          
            lifecycle {
              prevent_destroy = true
            }
          }
  cli:
    lang: "bash"
    filename: "hth-google-vertex-ai-1.01-read-effective-model-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/google-vertex-ai/cli/hth-google-vertex-ai-1.01-read-effective-model-policy.sh"
    excerpts:
      read-effective-model-policy:
        content: |2
          set -euo pipefail
          : "${GOOGLE_CLOUD_PROJECT:?Set the project to assess}"
          gcloud org-policies describe vertexai.allowedModels --effective \
            --project="$GOOGLE_CLOUD_PROJECT" --format=json

