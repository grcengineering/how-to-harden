"3.1":
  cli:
    lang: "bash"
    filename: "hth-twilio-3.01-api-key-security.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/twilio/cli/hth-twilio-3.01-api-key-security.sh"
    excerpts:
      cli-audit-keys:
        content: |2
          
          # --- Inventory every API key on the account ---
          # Review the list for keys with no known owning integration: each one is a
          # standing credential that should be deleted (see rotation region below).
          twilio api:iam:v1:keys:list \
             --account-sid "${TWILIO_ACCOUNT_SID}"
      cli-create-restricted-key:
        content: |2
          
          # --- Create a least-privilege Restricted API key (US region only) ---
          # The --policy document enumerates exactly what the key may do. This example
          # grants read-only access to Messaging messages; scope it to what the owning
          # integration actually touches.
          twilio api:iam:v1:keys:create \
             --friendly-name "reporting-service-restricted" \
             --account-sid "${TWILIO_ACCOUNT_SID}" \
             --key-type restricted \
             --policy "{\"allow\":[\"/twilio/messaging/messages/read\"]}"
          
          # Where Restricted keys are not available for your region, fall back to a
          # Standard key (no --key-type flag) and compensate with tighter rotation,
          # dedicated subaccounts, and monitoring — and record the exception:
          twilio api:iam:v1:keys:create \
             --friendly-name "legacy-region-standard-key" \
             --account-sid "${TWILIO_ACCOUNT_SID}"
      cli-rotate-and-retire:
        content: |2
          
          # --- Rotate: tighten an existing Restricted key's policy in place ---
          twilio api:iam:v1:keys:update \
             --sid "${TWILIO_KEY_SID:?Set TWILIO_KEY_SID to the key being rotated}" \
             --friendly-name "reporting-service-restricted" \
             --policy "{\"allow\":[\"/twilio/messaging/messages/read\"]}"
          
          # --- Retire: delete a key whose owning integration is gone ---
          # Create the replacement key and cut integrations over BEFORE removing the
          # old one, so rotation never causes an outage.
          twilio api:iam:v1:keys:remove \
             --sid "${TWILIO_OLD_KEY_SID:?Set TWILIO_OLD_KEY_SID to the key being retired}"

"3.2":
  sdk:
    lang: "javascript"
    filename: "hth-twilio-3.02-webhook-signature-validation.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/twilio/sdk/hth-twilio-3.02-webhook-signature-validation.js"
    excerpts:
      sdk-validate-form-webhook:
        content: |2
          
          const client = require('twilio');
          
          // The primary Auth Token is the signing key for X-Twilio-Signature.
          const authToken = process.env.TWILIO_AUTH_TOKEN;
          
          // Validate a standard form-encoded Twilio webhook.
          // url    — the full public URL Twilio was configured to call
          // params — the POST parameters exactly as received
          // twilioSignature — the X-Twilio-Signature request header value
          function isValidTwilioWebhook(url, params, twilioSignature) {
            return client.validateRequest(authToken, twilioSignature, url, params);
          }
          
          // Reject anything that fails validation before touching application logic.
          // Example wiring inside any Node HTTP handler:
          //   if (!isValidTwilioWebhook(fullUrl, req.body, req.headers['x-twilio-signature'])) {
          //     res.statusCode = 403;
          //     return res.end();
          //   }
      sdk-validate-json-webhook:
        content: |2
          
          // JSON webhooks are NOT covered by parameter signing alone. Twilio appends a
          // bodySHA256 query parameter to the request URL, and the raw JSON body must be
          // validated against it with validateRequestWithBody.
          // url  — full request URL INCLUDING the ?bodySHA256=... query parameter
          // body — the raw, unparsed JSON request body string
          function isValidTwilioJsonWebhook(url, body, twilioSignature) {
            return client.validateRequestWithBody(authToken, twilioSignature, url, body);
          }
          
          // Example (values from Twilio's webhook security documentation):
          //   const url = 'https://example.com/myapp?bodySHA256=5ccde7145dfb8f56479710896586cb9d5911809d83afbe34627818790db0aec9';
          //   const body = '{"CallSid":"CA1234567890ABCDE","Caller":"+12349013030"}';
