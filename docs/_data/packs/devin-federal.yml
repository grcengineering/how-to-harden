          [[ -n ${WINDSURF_SERVICE_KEY:-} ]] || unknown 'inject an existing scoped WINDSURF_SERVICE_KEY'
          [[ -d ${HTH_EVIDENCE_DIR:-} && ! -L ${HTH_EVIDENCE_DIR:-} ]] || unknown 'supply a trusted existing evidence directory'
