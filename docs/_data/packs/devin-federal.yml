              id: devin-airgap-audit
              paths:
                - /home/*/.local/share/devin/cli-federal/audit/audit*.jsonl
                - /Users/*/.local/share/devin/cli-federal/audit/audit*.jsonl
              prospector.scanner.fingerprint.length: 64
              parsers:
                - ndjson:
                    target: devin
                    add_error_key: true
