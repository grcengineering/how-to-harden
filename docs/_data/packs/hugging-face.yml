        content: |2
          set -euo pipefail
          set +x
          umask 077
          : "${HF_ORG:?Set the exact organization slug}"
          : "${HF_TOKEN:?Provide an approved audit-export token}"
          [[ "$HF_ORG" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ && "$HF_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]
