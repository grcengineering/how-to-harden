          next_url() {
            local next
            next=$(printf '%s' "$1" | jq -r '.links.next // empty | if type == "object" then .href else . end') || return 1
            case "${next}" in
              "") ;;
              "${SNYK_API}"/*) printf '%s' "${next}" ;;
              http://* | https://*) echo "ERROR: refusing to follow a pagination link to another host" >&2; return 1 ;;
              /rest/*) printf '%s' "${SNYK_API}${next}" ;;
              /*) printf '%s' "${SNYK_API}/rest${next}" ;;
              *) echo "ERROR: unrecognised pagination link" >&2; return 1 ;;
            esac
          }
          
          # Print one jq projection per item across every page of a list endpoint.
          # Returns 2 on any failed request or on a body that is not a JSON:API list.
          snyk_list() {
            local url="$1" projection="$2" page pages=0
            while [ -n "${url}" ]; do
              page=$(snyk_get "${url}") || { echo "ERROR: GET ${url%%\?*} did not succeed" >&2; return 2; }
              printf '%s' "${page}" | jq -e '.data | type == "array"' >/dev/null \
                || { echo "ERROR: response is not the documented JSON:API list" >&2; return 2; }
              printf '%s' "${page}" | jq -r ".data[] | ${projection}" || return 2
              pages=$((pages + 1))
              [ "${pages}" -lt "${MAX_PAGES}" ] || { echo "ERROR: pagination did not end after ${MAX_PAGES} pages" >&2; return 2; }
              url=$(next_url "${page}") || return 2
            done
          }
      api-org-visibility-audit:
        content: |2
          # Everyone listed here can read this Organization's Projects, issues and ignores.
          org_viewers() {
            local org_id="$1" roles total
            roles=$(snyk_list "${SNYK_API}/rest/orgs/${org_id}/memberships?version=${SNYK_API_VERSION}&limit=100" \
              '.relationships.role.data.attributes.name // "(no role)"') || return 2
            total=$(printf '%s' "${roles}" | grep -c . || true)
            echo "== orgs/${org_id}: ${total} member(s) can view its Projects and findings =="
            [ "${total}" -eq 0 ] || printf '%s\n' "${roles}" | sort | uniq -c | sed 's/^ */  /'
          }
          
          # Which Tenant roles carry the permissions that expose findings. A role whose
          # permission list comes back empty is reported as such, never as "no access".
          role_view_permissions() {
            local tenant_id="$1"
            echo "== Tenant roles: view permissions (projects / project history / org reports) =="
            snyk_list "${SNYK_API}/rest/tenants/${tenant_id}/roles?version=${SNYK_ROLES_API_VERSION}&limit=100" \
              '.attributes | [ .name,
                 (if .custom then "custom" else "pre-defined" end),
                 (if ((.permissions // []) | length) == 0 then "permissions not returned - review in the console"
                  else "org.project.read=" + (if (.permissions | any(. == "org.project.read")) then "yes" else "no" end)
                    + " org.project.snapshot.read=" + (if (.permissions | any(. == "org.project.snapshot.read")) then "yes" else "no" end)
                    + " org.report.read=" + (if (.permissions | any(. == "org.report.read")) then "yes" else "no" end)
                  end) ] | @tsv' | sed 's/^/  /'
          }
      api-org-visibility-audit-run:
        content: |2
          if [ -z "${SNYK_ORG_ID:-}" ]; then
            echo "PRECONDITION: set SNYK_ORG_ID - visibility is decided per Organization" >&2; exit 2
          fi
          [[ "${SNYK_ORG_ID}" =~ ${UUID_RE} ]] || { echo "ERROR: SNYK_ORG_ID is not a UUID" >&2; exit 2; }
          org_viewers "${SNYK_ORG_ID}"
          if [ -n "${SNYK_TENANT_ID:-}" ]; then
            [[ "${SNYK_TENANT_ID}" =~ ${UUID_RE} ]] || { echo "ERROR: SNYK_TENANT_ID is not a UUID" >&2; exit 2; }
            role_view_permissions "${SNYK_TENANT_ID}"
          fi

"3.2":
  cli:
    lang: "bash"
    filename: "hth-snyk-3.02-governed-ignore.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/snyk/cli/hth-snyk-3.02-governed-ignore.sh"
    excerpts:
      cli-audit-snyk-policy-file:
        content: |2
          # Every ignore lands in the repo's .snyk policy file as:
          #   ignore:
          #     '<ISSUE_ID>':
          #       - '*':
          #           reason: <REASON>
          #           expires: <EXPIRY>
          # Snyk enforces an expiry only when it is a JavaScript Date Time String
          # (YYYY-MM-DDThh:mm:ss.fffZ). Any other value makes the ignore persist
          # indefinitely, so a malformed expiry is a finding, not a formatting nit.
          POLICY_FILE="${SNYK_POLICY_FILE:-.snyk}"
          EXPIRES_RE='^[0-9]+: [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{3})?Z$'
          
          # Count lines of one kind inside the top-level `ignore:` block only.
          count_in_ignore_block() {
            awk -v pat="$1" '/^ignore:/ { inb = 1; next }
              /^[^[:space:]#]/ { inb = 0 }
              inb && $0 ~ pat { n++ }
              END { print n + 0 }' "${POLICY_FILE}"
          }
          
          audit_policy_file() {
            if [ ! -f "${POLICY_FILE}" ]; then
              echo "PRECONDITION: no policy file at ${POLICY_FILE} - nothing was audited." >&2
              echo "  A repo with no CLI ignores has none; set SNYK_POLICY_FILE to audit another path." >&2
              return 2
            fi
            local entries reasons expiries bad rc=0
            entries=$(count_in_ignore_block '^[[:space:]]*- ')
            reasons=$(count_in_ignore_block '^[[:space:]]*reason:')
            expiries=$(count_in_ignore_block '^[[:space:]]*expires:')
          
            echo "== Suppression entries in ${POLICY_FILE} =="
            grep -nE '^[[:space:]]+(reason|expires):' "${POLICY_FILE}" || echo "No reason/expires lines recorded"
            echo "ignore entries: ${entries} | reasons: ${reasons} | expiries: ${expiries}"
          
            # Every expires: value inside the ignore block, quotes stripped, prefixed
            # with its line number; anything not in Date Time String form is a finding.
            bad=$(awk '/^ignore:/ { inb = 1; next }
                /^[^[:space:]#]/ { inb = 0 }
                inb && /^[[:space:]]*expires:/ {
                  v = $0
                  sub(/^[[:space:]]*expires:[[:space:]]*/, "", v)
                  gsub(/["\047]/, "", v)
                  sub(/[[:space:]]+$/, "", v)
                  print NR ": " v
                }' "${POLICY_FILE}" | grep -vE "${EXPIRES_RE}" || true)
            if [ -n "${bad}" ]; then
              echo "FAIL: malformed expiry - Snyk treats these ignores as never-expiring:"
              printf '%s\n' "${bad}"
              rc=1
            fi
            if [ "${expiries}" -ne "${entries}" ]; then
              echo "FAIL: ${entries} ignore entries but ${expiries} expiries - an entry without expires: never expires"
              rc=1
            fi
            if [ "${reasons}" -ne "${entries}" ]; then
              echo "FAIL: ${entries} ignore entries but ${reasons} reasons - every ignore needs a recorded reason"
              rc=1
            fi
            [ "${rc}" -ne 0 ] || echo "OK: every ignore entry has a reason and an enforceable expiry"
            return "${rc}"
          }
      cli-governed-ignore:
        content: |2
          # Never ignore without a reason, an accountable approver and a bounded expiry.
          # Left alone, the CLI default expiry is 30 days - set it explicitly so the
          # review date is a decision, not an accident. Expiry format: YYYY-MM-DD.
          DATE_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          governed_ignore() {
            local issue_id="$1" expiry="$2" reason
            shift 2
            reason="$*"
            command -v snyk >/dev/null || { echo "PRECONDITION: snyk CLI not found (npm i -g snyk)" >&2; return 2; }
            if [ -z "${SNYK_IGNORE_APPROVER:-}" ]; then
              echo "PRECONDITION: set SNYK_IGNORE_APPROVER to the person accountable for this risk acceptance" >&2
              return 2
            fi
            [[ "${expiry}" =~ ${DATE_RE} ]] || { echo "ERROR: expiry must be YYYY-MM-DD" >&2; return 2; }
            [ -n "${reason}" ] || { echo "ERROR: a human-readable reason is required" >&2; return 2; }
            snyk ignore \
              --id="${issue_id}" \
              --expiry="${expiry}" \
              --reason="${reason} (approved-by: ${SNYK_IGNORE_APPROVER})"
          }
      cli-governed-ignore-run:
        content: |2
          usage() {
            echo "Usage: $0 --audit-only" >&2
            echo "       $0 <snyk-issue-id> <expiry YYYY-MM-DD> <reason...>" >&2
          }
          case "${1:-}" in
            --audit-only)
              audit_policy_file ;;
            "" | -h | --help)
              usage; exit 2 ;;
            *)
              if [ "$#" -lt 3 ]; then usage; exit 2; fi
              governed_ignore "$@"
              audit_policy_file ;;
          esac

"4.1":
  api:
    lang: "bash"
    filename: "hth-snyk-4.01-audit-log-export.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/snyk/api/hth-snyk-4.01-audit-log-export.sh"
    excerpts:
      api-snyk-rest-get-paginated:
        content: |2
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "PRECONDITION: set SNYK_TOKEN - see the least-privilege note in this pack header" >&2; exit 2
          fi
          SNYK_API="${SNYK_API:-https://api.snyk.io}"
          SNYK_API_VERSION="${SNYK_API_VERSION:-2024-10-15}"
          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          MAX_PAGES="${SNYK_MAX_PAGES:-1000}"
          
          # One GET that fails closed: a transport error or any HTTP status >= 400
          # aborts the export instead of being read as an empty result.
          snyk_get() {
            curl -sS -f \
              --header "Authorization: token ${SNYK_TOKEN}" \
              --header "Accept: application/vnd.api+json" \
              "$1"
          }
          
          # The next page is requested by re-issuing the ORIGINAL query plus the cursor
          # taken from links.next (a string or {href}). Following the link verbatim
          # would trust it to carry from/to; if it did not, page 2 would silently fall
          # back to the API's default window. Only the cursor value is taken, so the
          # token never goes anywhere but the configured API host.
          next_cursor() {
            local next cursor
            next=$(printf '%s' "$1" | jq -r '.links.next // empty | if type == "object" then .href else . end') || return 1
            [ -n "${next}" ] || return 0
            cursor=$(printf '%s' "${next}" | sed -n 's/.*[?&]cursor=\([^&]*\).*/\1/p')
            [ -n "${cursor}" ] || { echo "ERROR: links.next carries no cursor parameter" >&2; return 1; }
            printf '%s' "${cursor}"
          }
      api-audit-log-export:
        content: |2
          # Collection window in UTC RFC3339, as the API requires. The default is the
          # whole previous UTC day (from is inclusive, to is exclusive). Run at least
          # daily: events age out after 90 days. GNU date first, BSD/macOS date second.
          FROM="${SNYK_AUDIT_FROM:-$(date -u -d '1 day ago' +%Y-%m-%dT00:00:00Z 2>/dev/null || date -u -v-1d +%Y-%m-%dT00:00:00Z)}"
          TO="${SNYK_AUDIT_TO:-$(date -u +%Y-%m-%dT00:00:00Z)}"
          RFC3339_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          if ! [[ "${FROM}" =~ ${RFC3339_RE} && "${TO}" =~ ${RFC3339_RE} ]]; then
            echo "ERROR: SNYK_AUDIT_FROM and SNYK_AUDIT_TO must be UTC RFC3339, e.g. 2026-01-02T00:00:00Z" >&2
            exit 2
          fi
          OUT_DIR="${SNYK_AUDIT_OUT_DIR:-./snyk-audit-logs}"
          
          # Export one scope: "orgs <org_id>" or "groups <group_id>".
          export_audit_logs() {
            local scope="$1" scope_id="$2" base url page cursor count=0 pages=0 n
            local out="${OUT_DIR}/${scope}-${scope_id}-${FROM//:/}_${TO//:/}.ndjson"
            base="${SNYK_API}/rest/${scope}/${scope_id}/audit_logs/search?version=${SNYK_API_VERSION}&from=${FROM}&to=${TO}&size=100&sort_order=ASC"
            url="${base}"
            : >"${out}.partial" \
              || { echo "ERROR: cannot write to SNYK_AUDIT_OUT_DIR (${OUT_DIR})" >&2; return 2; }
            while [ -n "${url}" ]; do
              page=$(snyk_get "${url}") \
                || { rm -f "${out}.partial"; echo "ERROR: audit-log request did not succeed for ${scope}/${scope_id}" >&2; return 2; }
              printf '%s' "${page}" | jq -e '.data.items | type == "array"' >/dev/null \
                || { rm -f "${out}.partial"; echo "ERROR: response is not the documented audit-log shape" >&2; return 2; }
              printf '%s' "${page}" | jq -c '.data.items[]' >>"${out}.partial" \
                || { rm -f "${out}.partial"; return 2; }
              n=$(printf '%s' "${page}" | jq '.data.items | length')
              count=$((count + n))
              pages=$((pages + 1))
              [ "${n}" -gt 0 ] || break
              [ "${pages}" -lt "${MAX_PAGES}" ] \
                || { rm -f "${out}.partial"; echo "ERROR: pagination did not end after ${MAX_PAGES} pages" >&2; return 2; }
              cursor=$(next_cursor "${page}") || { rm -f "${out}.partial"; return 2; }
              if [ -n "${cursor}" ]; then url="${base}&cursor=${cursor}"; else url=""; fi
            done
            mv "${out}.partial" "${out}" \
              || { rm -f "${out}.partial"; echo "ERROR: cannot write to SNYK_AUDIT_OUT_DIR (${OUT_DIR})" >&2; return 2; }
            echo "Exported ${count} event(s) for ${scope}/${scope_id} ${FROM}..${TO} -> ${out}"
          }
      api-audit-log-export-run:
        content: |2
          # Pull group-level events (role, policy, membership changes) and each org's
          # events, then point the SIEM forwarder at the finished .ndjson files.
          if [ -z "${SNYK_GROUP_ID:-}" ] && [ -z "${SNYK_ORG_ID:-}" ]; then
            echo "ERROR: set SNYK_GROUP_ID and/or SNYK_ORG_ID - nothing to export" >&2; exit 2
          fi
          mkdir -p "${OUT_DIR}" \
            || { echo "ERROR: cannot create SNYK_AUDIT_OUT_DIR (${OUT_DIR})" >&2; exit 2; }
          for scope in groups orgs; do
            if [ "${scope}" = groups ]; then scope_id="${SNYK_GROUP_ID:-}"; else scope_id="${SNYK_ORG_ID:-}"; fi
            [ -n "${scope_id}" ] || continue
            [[ "${scope_id}" =~ ${UUID_RE} ]] || { echo "ERROR: the ${scope} id is not a UUID" >&2; exit 2; }
            export_audit_logs "${scope}" "${scope_id}"
          done

