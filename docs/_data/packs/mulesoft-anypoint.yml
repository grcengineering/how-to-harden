      list-environments:
        content: |2
          set +x
          set -euo pipefail
          fail() { printf 'UNKNOWN: %s\n' "$*" >&2; exit 2; }
          [[ "${ANYPOINT_ORG:-}" =~ ^[[:alnum:]_-]+$ ]] || fail 'Missing or invalid ANYPOINT_ORG'
          
          : "${ANYPOINT_CLIENT_ID:?Use an approved Connected App ID}"
          : "${ANYPOINT_CLIENT_SECRET:?Use an approved Connected App credential}"
          command -v anypoint-cli-v4 >/dev/null || fail 'Anypoint CLI 4.x is not installed'
          # Avoid running under an unreviewed credential/region override.
          unset ANYPOINT_USERNAME ANYPOINT_PASSWORD ANYPOINT_BEARER
          anypoint-cli-v4 account:environment:list

"2.1":
  terraform:
    lang: "hcl"
    filename: "hth-mulesoft-anypoint-2.01-scoped-connected-app.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/mulesoft-anypoint/terraform/hth-mulesoft-anypoint-2.01-scoped-connected-app.tf"
    excerpts:
      scoped-connected-app:
        content: |2
          # Compose with an authenticated provider configuration. Protect Terraform state:
          # the new Connected App secret is returned on creation and retained in state.
          terraform {
            required_providers {
              anypoint = {
                source  = "mulesoft/anypoint"
                version = "~> 1.1"
              }
            }
          }
          
          variable "organization_id" {
            type        = string
            description = "Approved Anypoint organization or business-group ID."
          }
          
          variable "environment_id" {
            type        = string
            description = "Approved environment ID belonging to that organization or group."
          }
          
          resource "anypoint_connected_app" "application_inventory" {
            organization_id = var.organization_id
            name            = "Approved environment application inventory"
            grant_types     = ["client_credentials"]
            audience        = "internal"
          
            scopes = [{
              scope          = "Read Applications"
              context_params = { org = var.organization_id, envId = var.environment_id }
            }]
          }

