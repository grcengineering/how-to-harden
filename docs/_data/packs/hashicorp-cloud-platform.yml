               --format=json --quiet > "$file" || [[ ! -s "$file" ]]; then
            rm -f -- "$file"
            printf 'HCP project policy read failed or returned no data.\n' >&2
            exit 1
          fi
          printf 'Private project policy snapshot: %s\n' "$file"

