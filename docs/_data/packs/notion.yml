"2.1":
  api:
    lang: "bash"
    filename: "hth-notion-2.01-audit-workspace-members.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/notion/api/hth-notion-2.01-audit-workspace-members.sh"
    excerpts:
      api-audit-workspace-members:
        content: |2
          NOTION_VERSION="2026-03-11"
          cursor=""
          calls=0
          while :; do
            url="https://api.notion.com/v1/users?page_size=100"
            [ -n "${cursor}" ] && url="${url}&start_cursor=${cursor}"
            code=$(curl -sS -o "${BODY_FILE}" -w '%{http_code}' "${url}" \
              -H "Authorization: Bearer ${NOTION_TOKEN}" \
              -H "Notion-Version: ${NOTION_VERSION}") || code="000"
            if [ "${code}" != "200" ]; then
              echo "PRECONDITION: GET /v1/users returned HTTP ${code}: $(jq -r '.code // "no body"' "${BODY_FILE}" 2>/dev/null || echo unreadable)" >&2
              echo "  401 = invalid token; 403 = integration lacks the user-information capability." >&2
              exit 2
            fi
            jq -c '.results[]' "${BODY_FILE}" >> "${USERS_FILE}"
            calls=$((calls + 1))
            [ "$(jq -r '.has_more' "${BODY_FILE}")" = "true" ] || break
            cursor=$(jq -r '.next_cursor' "${BODY_FILE}")
            [ "${calls}" -lt 500 ] || { echo "PRECONDITION: pagination runaway guard hit" >&2; exit 2; }
          done
          
          report=$(jq -s --arg allowed "${ALLOWED_EMAIL_DOMAINS}" '
            ($allowed | ascii_downcase | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $ok
            | {
                people: [ .[] | select(.type == "person") ],
                bots:   [ .[] | select(.type == "bot") | (.name // "(unnamed)") ]
              }
            | .flagged = [ .people[]
                | ((.person.email // "") | ascii_downcase) as $e
                | (if ($e | contains("@")) then ($e | split("@") | last) else "" end) as $d
                | select(($ok | index($d)) == null)
                | "\(.name // "(unnamed)") <\(if $e == "" then "email not visible" else $e end)>" ]
          ' "${USERS_FILE}")
          
          n_people=$(jq '.people | length' <<<"${report}")
          n_bots=$(jq '.bots | length' <<<"${report}")
          n_flagged=$(jq '.flagged | length' <<<"${report}")
          echo "${n_people} person user(s), ${n_bots} bot/integration user(s)"
          jq -r '.bots[] | "  bot: \(.)"' <<<"${report}"
          
          if [ "${n_people}" -eq 0 ]; then
            echo "INCONCLUSIVE: the API returned zero person users — nothing was audited" >&2
            exit 2
          fi
          if [ "${n_flagged}" -gt 0 ]; then
            echo "WARN: ${n_flagged} member(s) outside allowed email domains:"
            jq -r '.flagged[] | "  \(.)"' <<<"${report}"
            echo "Remove unauthorized members and restrict allowed email domains (control 2.1)."
            exit 1
          fi
          echo "PASS: all ${n_people} person user(s) are inside ${ALLOWED_EMAIL_DOMAINS}"

"2.3":
  api:
    lang: "bash"
    filename: "hth-notion-2.03-audit-workspace-owners.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/notion/api/hth-notion-2.03-audit-workspace-owners.sh"
    excerpts:
      api-audit-workspace-owners:
        content: |2
          SCIM_BASE="https://api.notion.com/scim/v2"
          EXT="urn:ietf:params:scim:schemas:extension:notion:2.0:User"
          start=1
          calls=0
          while :; do
            code=$(curl -sS -o "${BODY_FILE}" -w '%{http_code}' \
              "${SCIM_BASE}/Users?startIndex=${start}&count=100" \
              -H "Authorization: Bearer ${NOTION_SCIM_TOKEN}" \
              -H "Accept: application/scim+json") || code="000"
            if [ "${code}" != "200" ]; then
              echo "PRECONDITION: GET /scim/v2/Users returned HTTP ${code}" >&2
              echo "  401 = invalid or revoked SCIM token; 403/404 = workspace not on the Enterprise Plan or SCIM not set up." >&2
              exit 2
            fi
            if ! jq -e '(.Resources | type == "array") and (.totalResults | type == "number")' "${BODY_FILE}" >/dev/null 2>&1; then
              echo "PRECONDITION: response is not a SCIM ListResponse (no Resources array / totalResults)" >&2
              exit 2
            fi
            page=$(jq '.Resources | length' "${BODY_FILE}")
            jq -c '.Resources[]' "${BODY_FILE}" >> "${USERS_FILE}"
            total=$(jq '.totalResults' "${BODY_FILE}")
            calls=$((calls + 1))
            start=$((start + page))
            [ "${page}" -gt 0 ] && [ "$((start - 1))" -lt "${total}" ] || break
            [ "${calls}" -lt 500 ] || { echo "PRECONDITION: pagination runaway guard hit" >&2; exit 2; }
          done
          
          report=$(jq -s --arg ext "${EXT}" '
            [ .[] | select(.active != false) ] as $active
            | {
                n_active: ($active | length),
                no_role:  [ $active[] | select((.[$ext].role // "") == "") | (.userName // .id) ],
                owners:   [ $active[] | select(.[$ext].role == "owner") | "\(.displayName // .name.formatted // "(unnamed)") <\(.userName // .id)>" ],
                admins:   [ $active[] | select(.[$ext].role == "membership_admin") | (.userName // .id) ]
              }
          ' "${USERS_FILE}")
          
          n_active=$(jq '.n_active' <<<"${report}")
          n_no_role=$(jq '.no_role | length' <<<"${report}")
          n_owners=$(jq '.owners | length' <<<"${report}")
          n_admins=$(jq '.admins | length' <<<"${report}")
          echo "${n_active} active member(s): ${n_owners} workspace owner(s), ${n_admins} membership admin(s)"
          jq -r '.owners[] | "  owner: \(.)"' <<<"${report}"
          
          if [ "${n_active}" -eq 0 ]; then
            echo "INCONCLUSIVE: SCIM returned zero active members — nothing was audited" >&2
            exit 2
          fi
          if [ "${n_no_role}" -gt 0 ]; then
            echo "INCONCLUSIVE: ${n_no_role} active member(s) came back without the ${EXT} role attribute — the owner count cannot be trusted" >&2
            exit 2
          fi
          if [ "${n_owners}" -eq 0 ]; then
            echo "INCONCLUSIVE: no workspace owner returned — every workspace has at least one, so the listing is incomplete" >&2
            exit 2
          fi
          if [ "${n_owners}" -gt "${MAX_OWNERS}" ]; then
            echo "WARN: ${n_owners} workspace owners exceeds MAX_OWNERS=${MAX_OWNERS}."
            echo "Demote owners who do not need full administrative control to member (control 2.3)."
            exit 1
          fi
          echo "PASS: ${n_owners} workspace owner(s), within MAX_OWNERS=${MAX_OWNERS}"

