"2.1":
  config:
    lang: "yaml"
    filename: "hth-langchain-2.1-helm-values-hardened.yml"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/langchain/config/hth-langchain-2.1-helm-values-hardened.yml"
    excerpts:
      config-helm-hardened-values:
        content: |2
          config:
            existingSecretName: langsmith-config-secrets     # license key + salts, sourced from your KMS
            hostname: https://langsmith.internal.example.com
            # OAuth 2.0 / OIDC with PKCE (authType "oauth"); no client secret to store
            authType: oauth
            oauth:
              enabled: true
              oauthClientId: "<IdP client id>"
              oauthIssuerUrl: https://idp.example.com/oauth2/default
            security:
              cors:
                # Chart default is "*". Comma-separated list of allowed origins.
                allowedOrigins: "https://langsmith.internal.example.com"
          
          # Audit logs stay off on self-hosted until this org feature flag is set (chart 0.12.33+)
          commonEnv:
            - name: DEFAULT_ORG_FEATURE_CAN_USE_AUDIT_LOGS
              value: "true"
          
          # Pod-level security context for every LangSmith pod
          commonPodSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          
          # Container-level hardening is per component: <component>.deployment.securityContext.
          # Repeat for platformBackend, playground, queue, aceBackend and hostBackend.
          backend:
            deployment:
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          frontend:
            deployment:
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
            service:
              type: ClusterIP            # chart default is LoadBalancer (public)
          
          # External, encrypted Postgres; credentials come from an existing Secret
          postgres:
            external:
              enabled: true
              existingSecretName: langsmith-postgres-credentials
          
          # Internal-only ingress with a source-range allowlist
          ingress:
            enabled: true
            ingressClassName: internal-nginx
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
            tls:
              - secretName: langsmith-tls
                hosts:
                  - langsmith.internal.example.com
  cli:
    lang: "bash"
    filename: "hth-langchain-2.1-helm-deploy-self-hosted.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/langchain/cli/hth-langchain-2.1-helm-deploy-self-hosted.sh"
    excerpts:
      cli-helm-add-repo:
        content: |2
          # Add the official LangChain Helm repository and list published chart versions
          helm repo add langchain https://langchain-ai.github.io/helm/
          helm repo update
          helm search repo langchain/langsmith --versions | head -10
      cli-helm-render-check:
        content: |2
          # Render first: prove the hardened values changed what they claim to change
          helm template langsmith langchain/langsmith \
            --version "${LANGSMITH_VERSION}" \
            --namespace "${LANGSMITH_NAMESPACE}" \
            --values "${LANGSMITH_VALUES}" > rendered.yaml
          grep -q 'type: LoadBalancer' rendered.yaml && { echo "FAIL: a LoadBalancer Service is still rendered"; exit 1; }
          grep -q 'CORS_ALLOWED_ORIGINS: "\*"' rendered.yaml && { echo "FAIL: CORS still allows any origin"; exit 1; }
          grep -q 'allowPrivilegeEscalation: false' rendered.yaml || { echo "FAIL: container securityContext did not render"; exit 1; }
          echo "render check passed"
      cli-helm-deploy-langsmith:
        content: |2
          # Deploy LangSmith with the hardened values file (config pack for this control)
          kubectl create namespace "${LANGSMITH_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          
          helm upgrade --install langsmith langchain/langsmith \
            --version "${LANGSMITH_VERSION}" \
            --namespace "${LANGSMITH_NAMESPACE}" \
            --values "${LANGSMITH_VALUES}" \
            --wait \
            --timeout 15m

"3.2":
  config:
    lang: "bash"
    filename: "hth-langchain-3.2-cve-pinning.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/langchain/config/hth-langchain-3.2-cve-pinning.sh"
    excerpts:
      config-cve-audit-python:
        content: |2
          # Python: fail the build if the PyPI langsmith SDK is below the patched floor.
          # Ask the environment's own interpreter: uv and --without-pip venvs have no pip.
          PY="${PYTHON:-python}"
          PREFIX=$("${PY}" -c 'import sys, importlib.metadata; print(sys.prefix)') \
            || { echo "cannot inspect the environment under test: '${PY}' is missing or unusable (set PYTHON)" >&2; exit 2; }
          echo "environment under test: ${PREFIX}"
          pkg_version() {  # prints the installed version; prints nothing when the package is absent
            "${PY}" -c 'import sys, importlib.metadata as m
          try:
              v = m.version(sys.argv[1])
          except m.PackageNotFoundError:
              sys.exit(0)
          if not v:
              sys.exit("no version recorded for " + sys.argv[1])
          print(v)' "$1"
          }
          PYTHON_MIN="0.8.18"   # CVE-2026-59152 (critical) is the highest PyPI floor
          INSTALLED=$(pkg_version langsmith) \
            || { echo "cannot inspect the environment under test: ${PY} could not read langsmith" >&2; exit 2; }
          if [ -z "${INSTALLED}" ]; then
            echo "langsmith (PyPI) not installed - skipping the Python check"
          elif version_lt "${INSTALLED}" "${PYTHON_MIN}"; then
            echo "FAIL: langsmith==${INSTALLED} (PyPI) is below ${PYTHON_MIN}"
            rc=1
          else
            echo "OK: langsmith==${INSTALLED} (PyPI, >= ${PYTHON_MIN})"
          fi
      config-cve-audit-node:
        content: |2
          # Node: fail the build if any npm langsmith in package-lock.json is below the floor
          NODE_MIN="0.6.0"      # CVE-2026-45134 (npm < 0.6.0) is the highest npm floor
          if [ -f package-lock.json ]; then
            # lockfile v2/v3: .packages["node_modules/langsmith"] (and nested .../node_modules/langsmith)
            # lockfile v1:    .dependencies.langsmith
            # A plain assignment, so a jq parse error aborts under set -e instead of reading as "none found"
            JS_VERSIONS=$(jq -r '
                ((.packages // {}) | to_entries[]
                   | select(.key | test("(^|/)node_modules/langsmith$")) | .value.version),
                (.dependencies.langsmith.version // empty)' package-lock.json)
            if [ -z "${JS_VERSIONS}" ]; then
              echo "langsmith (npm) not in package-lock.json - skipping the Node check"
            fi
            while IFS= read -r v; do
              [ -n "${v}" ] || continue
              if version_lt "${v}" "${NODE_MIN}"; then
                echo "FAIL: langsmith==${v} (npm) is below ${NODE_MIN}"
                rc=1
              else
                echo "OK: langsmith==${v} (npm, >= ${NODE_MIN})"
              fi
            done < <(printf '%s\n' "${JS_VERSIONS}" | sort -u)
          fi

"3.3":
  sdk:
    lang: "python"
    filename: "hth-langchain-3.3-disable-allow-dangerous-code.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/langchain/sdk/hth-langchain-3.3-disable-allow-dangerous-code.py"
    excerpts:
      sdk-avoid-python-repl:
        content: |2
          # UNSAFE: PythonREPLTool with allow_dangerous_code=True grants the model full process
          # privileges. Python-level "restrictions" are bypassable via ctypes, importlib, and
          # __subclasses__() chains.
          # from langchain_experimental.tools import PythonREPLTool
          # unsafe_tool = PythonREPLTool(allow_dangerous_code=True)  # DO NOT USE in prod
          
          # SAFE: route untrusted Python through an infrastructure-isolated (WebAssembly/Deno) sandbox
          from langchain_sandbox import SyncPyodideSandbox
          from langchain_core.tools import tool
          
          sandbox = SyncPyodideSandbox(
              allow_net=False,    # no network egress from agent code
              allow_read=False,   # no host filesystem reads
              allow_write=False,  # no host filesystem writes
              allow_run=False,    # no subprocess spawning
              allow_env=False,    # no host environment variables
              allow_ffi=False,    # no native FFI
          )
          
          
          @tool
          def run_python(code: str) -> str:
              """Execute Python code in an isolated WebAssembly sandbox."""
              result = sandbox.execute(code, timeout_seconds=30, memory_limit_mb=256)
              return result.stdout if result.status == "success" else f"Error: {result.stderr}"
      sdk-prefer-provider-sandbox:
        content: |2
          # For production, prefer a provider-managed sandbox. langchain-ai publishes Modal, Daytona
          # and Runloop backends (langchain-modal / langchain-daytona / langchain-runloop). Limits and
          # egress are set on the provider sandbox itself; the LangChain wrapper only adopts it.
          import modal
          from langchain_modal import ModalSandbox
          
          app = modal.App.lookup("hth-agent-sandbox", create_if_missing=True)
          modal_sb = modal.Sandbox.create(
              app=app,
              image=modal.Image.debian_slim(python_version="3.12"),
              cpu=1.0,
              memory=512,           # MiB
              timeout=60,           # seconds
              block_network=True,   # or cidr_allowlist=[...] for a narrow egress allowlist
          )
          prod_sandbox = ModalSandbox(sandbox=modal_sb)

"3.5":
  sdk:
    lang: "python"
    filename: "hth-langchain-3.5-validate-outputs-pydantic.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/langchain/sdk/hth-langchain-3.5-validate-outputs-pydantic.py"
    excerpts:
      sdk-pydantic-output-parser:
        content: |2
          from typing import Literal
          from pydantic import BaseModel, Field, field_validator
          from langchain_core.output_parsers import PydanticOutputParser
          from langchain_core.prompts import ChatPromptTemplate
          from langchain_openai import ChatOpenAI
          
          
          class TicketTriageDecision(BaseModel):
              """Strict schema enforced on every LLM response."""
              severity: Literal["low", "medium", "high", "critical"]
              category: Literal["bug", "feature_request", "billing", "abuse"]
              summary: str = Field(min_length=5, max_length=200)
              requires_human: bool
          
              @field_validator("summary")
              @classmethod
              def reject_html(cls, v: str) -> str:
                  if "<" in v or ">" in v:
                      raise ValueError("Summary must not contain HTML")
                  return v
          
          
          parser = PydanticOutputParser(pydantic_object=TicketTriageDecision)
          
          prompt = ChatPromptTemplate.from_messages([
              ("system", "Triage the support ticket. {format_instructions}"),
              ("user", "{ticket}"),
          ]).partial(format_instructions=parser.get_format_instructions())
          
          llm = ChatOpenAI(model="gpt-4o-mini", temperature=0)
          chain = prompt | llm | parser
          
          # Returns a fully validated TicketTriageDecision; raises on schema violation.
          decision = chain.invoke({"ticket": "Login button does nothing on mobile"})
      sdk-retry-on-validation-failure:
        content: |2
          from langchain_classic.output_parsers import RetryWithErrorOutputParser
          from langchain_core.runnables import RunnableLambda, RunnableParallel
          
          # On a parse failure, send the error and the original prompt back to the LLM to self-correct
          retry_parser = RetryWithErrorOutputParser.from_llm(parser=parser, llm=llm, max_retries=2)
          robust_chain = RunnableParallel(completion=prompt | llm, prompt_value=prompt) | RunnableLambda(
              lambda x: retry_parser.parse_with_prompt(x["completion"].content, x["prompt_value"])
          )
          
          decision = robust_chain.invoke({"ticket": "Login button does nothing on mobile"})

