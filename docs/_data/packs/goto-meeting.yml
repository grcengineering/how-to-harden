      check-admin-account-visibility:
        content: |2
          set +x
          set -euo pipefail
          fail() { printf 'UNKNOWN: %s\n' "$*" >&2; exit 2; }
          [[ "${GOTO_ACCESS_TOKEN:-}" =~ ^[[:alnum:]_.~+/=-]+$ ]] || fail 'Missing or invalid GOTO_ACCESS_TOKEN'
