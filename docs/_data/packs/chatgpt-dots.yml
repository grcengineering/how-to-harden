                - action_data.policy_changes
                - action_data.policy_changes_omitted_reason
                - request_metadata.client_ip

"4.3":
  config:
    lang: "bash"
    filename: "hth-chatgpt-dots-4.03-managed-mcp-hooks.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/chatgpt-dots/config/hth-chatgpt-dots-4.03-managed-mcp-hooks.sh"
    excerpts:
      emit-managed-mcp-hook:
        content: |2
          # Print a PreToolUse mcp_tool hook for Agent Security > Global > Requirements.
          #   HTH_HOOK_SERVER   name of an MCP server already connected for the workspace
          #   HTH_HOOK_TOOL     tool on that server that answers allow/deny
          #   HTH_HOOK_MATCHER  regex on tool name; unset = every supported tool call
          #   HTH_HOOK_TIMEOUT  seconds, default 30 (the documented default is 600)
          #   HTH_MANAGED_HOOKS_ONLY=1  also emit allow_managed_hooks_only = true
          if [ "$ACTION" = "emit" ]; then
            [ -n "${HTH_HOOK_SERVER:-}" ] || { echo "PRECONDITION: set HTH_HOOK_SERVER to the name of an already-connected MCP server" >&2; exit 2; }
            [ -n "${HTH_HOOK_TOOL:-}" ] || { echo "PRECONDITION: set HTH_HOOK_TOOL to the tool on that server that returns the decision" >&2; exit 2; }
            TIMEOUT="${HTH_HOOK_TIMEOUT:-30}"
            for v in "$HTH_HOOK_SERVER" "$HTH_HOOK_TOOL"; do
              printf '%s' "$v" | grep -E '^[A-Za-z0-9_.-]+$' >/dev/null || {
                echo "ERROR: '$v' — use letters, digits, '_', '.' or '-' only" >&2; exit 2; }
            done
            printf '%s' "$TIMEOUT" | grep -E '^[1-9][0-9]*$' >/dev/null || {
              echo "ERROR: HTH_HOOK_TIMEOUT must be a positive integer (seconds)" >&2; exit 2; }
            case "${HTH_HOOK_MATCHER:-}" in
              *"'"*) echo "ERROR: HTH_HOOK_MATCHER cannot contain a single quote (emitted as a TOML literal string)" >&2; exit 2 ;;
            esac
          
            if [ "${HTH_MANAGED_HOOKS_ONLY:-0}" = "1" ]; then
              printf 'allow_managed_hooks_only = true\n\n'
            fi
            printf '[[hooks.PreToolUse]]\n'
            if [ -n "${HTH_HOOK_MATCHER:-}" ]; then
              printf "matcher = '%s'\n" "$HTH_HOOK_MATCHER"
            fi
            printf '\n[[hooks.PreToolUse.hooks]]\n'
            printf 'type = "mcp_tool"\n'
            printf 'server = "%s"\n' "$HTH_HOOK_SERVER"
            printf 'tool = "%s"\n' "$HTH_HOOK_TOOL"
            printf '%s\n' 'input = { session_id = "${session_id}", tool_name = "${tool_name}", tool_use_id = "${tool_use_id}", tool_input = "${tool_input}" }'
            printf 'timeout = %s\n' "$TIMEOUT"
            printf 'statusMessage = "Checking tool call against workspace policy"\n'
            exit 0
          fi
      verify-managed-mcp-hooks:
        content: |2
          # Lint the hook handlers in a saved copy of the Global requirements TOML.
          # Passing means "configured", never "enforced": prove the block with a deny-all
          # tool, then prove fail-open by taking the MCP service offline.
          toml_flatten() {   # prints "<section>\t<key>\t<value>"; section is "" at top level
            awk -v SQ="'" '
              function strip(s,   i, c, q, out, esc) {
                q = ""; out = ""; esc = 0
                for (i = 1; i <= length(s); i++) {
                  c = substr(s, i, 1)
                  if (q == "\"") { out = out c; if (esc) esc = 0; else if (c == "\\") esc = 1; else if (c == "\"") q = ""; continue }
                  if (q == SQ)   { out = out c; if (c == SQ) q = ""; continue }
                  if (c == "#") break
                  if (c == "\"" || c == SQ) q = c
                  out = out c
                }
                return out
              }
              function depth(s,   i, c, q, d, esc) {
                q = ""; d = 0; esc = 0
                for (i = 1; i <= length(s); i++) {
                  c = substr(s, i, 1)
                  if (q == "\"") { if (esc) esc = 0; else if (c == "\\") esc = 1; else if (c == "\"") q = ""; continue }
                  if (q == SQ)   { if (c == SQ) q = ""; continue }
                  if (c == "\"" || c == SQ) q = c
                  else if (c == "[") d++
                  else if (c == "]") d--
                }
                return d
              }
              function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              function emit() { printf "%s\t%s\t%s\n", sect, key, trim(val); key = ""; val = "" }
              BEGIN { sect = ""; n = 0; mls = ""; arr = 0; TQ = SQ SQ SQ }
              {
                line = $0; sub(/\r$/, "", line)
                if (mls != "") {
                  p = index(line, mls)
                  if (p > 0) { val = val " " substr(line, 1, p - 1); mls = ""; emit() } else val = val " " line
                  next
                }
                if (arr > 0) { s = strip(line); val = val " " s; arr += depth(s); if (arr <= 0) { arr = 0; emit() }; next }
                s = trim(strip(line))
                if (s == "") next
                if (substr(s, 1, 1) == "[") { n++; sect = s "#" n; next }
                eq = index(s, "="); if (eq == 0) next
                key = trim(substr(s, 1, eq - 1))
                rest = trim(substr(line, index(line, "=") + 1))
                d3 = substr(rest, 1, 3)
                if (d3 == "\"\"\"" || d3 == TQ) {
                  body = substr(rest, 4); p = index(body, d3)
                  if (p > 0) { val = substr(body, 1, p - 1); emit() } else { val = body; mls = d3 }
                  next
                }
                val = trim(strip(rest))
                if (substr(val, 1, 1) == "[") { arr = depth(val); if (arr > 0) next }
                emit()
              }
            ' "$1"
          }
          
          if [ "$ACTION" = "verify" ]; then
            FILE="${2:-${HTH_REQUIREMENTS_FILE:-}}"
            [ -n "$FILE" ] && [ -r "$FILE" ] || { echo "PRECONDITION: pass a saved copy of the Global requirements TOML" >&2; exit 2; }
            FLAT=$(mktemp "${TMPDIR:-/tmp}/hth-dots-403.XXXXXX"); trap 'rm -f "$FLAT"' EXIT
            toml_flatten "$FILE" > "$FLAT"
          
            # One record per handler: event, type, server, tool, timeout ("-" when absent).
            HANDLERS=$(awk -F'\t' -v SQ="'" '
              function get(id, k) { return (f[id, k] != "" ? f[id, k] : "-") }
              $1 ~ /^\[\[hooks\.[A-Za-z]+\.hooks\]\]#/ {
                id = $1
                if (!(id in event)) { ev = id; sub(/^\[\[hooks\./, "", ev); sub(/\.hooks\]\]#.*/, "", ev); event[id] = ev; ids[++m] = id }
                v = $3; gsub("^[\"" SQ "]|[\"" SQ "]$", "", v); f[id, $2] = v
              }
              END { for (i = 1; i <= m; i++) { id = ids[i]
                      printf "%s\t%s\t%s\t%s\t%s\n", event[id], get(id, "type"), get(id, "server"), get(id, "tool"), get(id, "timeout") } }
            ' "$FLAT")
          
            if awk -F'\t' '$1 ~ /^\[\[hooks\.[A-Za-z]+\]\]#/ && $2 == "hooks" { f = 1 } END { exit !f }' "$FLAT"; then
              echo "UNVERIFIED: handlers written as an inline array (hooks = [...]) — review them by hand" >&2; exit 2
            fi
            # The same handlers written as a [hooks] table with event-named array keys, or
            # as a top-level hooks / hooks.<Event> key, are valid TOML this lint does not parse.
            if awk -F'\t' '($1 ~ /^\[[ \t]*hooks[ \t]*\]#/ && $3 ~ /^\[/) ||
                           ($1 == "" && ($2 == "hooks" || $2 ~ /^hooks\./)) { f = 1 } END { exit !f }' "$FLAT"; then
              echo "UNVERIFIED: hooks written as an inline table or array ([hooks] / hooks = ...) — review them by hand" >&2; exit 2
            fi
          
            GOOD=0; FAILS=0
            # Hooks page: "Admins can force hooks off the same way in requirements.toml
            # with [features].hooks = false." codex_hooks is the deprecated alias (TRAP 8).
            if awk -F'\t' '
                 function off(v) { gsub(/[ \t]/, "", v); return v == "false" }
                 ($1 ~ /^\[[ \t]*features[ \t]*\]#/ && ($2 == "hooks" || $2 == "codex_hooks") && off($3)) ||
                 ($1 == "" && ($2 == "features.hooks" || $2 == "features.codex_hooks") && off($3)) ||
                 ($1 == "" && $2 == "features" && $3 ~ /(^|[{,[:space:]])(codex_)?hooks[[:space:]]*=[[:space:]]*false([[:space:]]*[,}]|$)/) { f = 1 }
                 END { exit !f }' "$FLAT"; then
              echo "  FAIL: [features].hooks (or codex_hooks) = false force-disables hooks in this same file (Hooks page); remove it"; FAILS=1
            fi
            while IFS=$'\t' read -r ev type server tool timeout; do
              [ -n "$ev" ] || continue
              case "$type" in
                mcp_tool)
                  if [ "$ev" = "SessionEnd" ]; then
                    echo "  FAIL: SessionEnd mcp_tool hook — not supported with cloud orchestration"; FAILS=1
                  elif [ "$server" = "-" ] || [ "$tool" = "-" ]; then
                    echo "  FAIL: $ev mcp_tool hook is missing server or tool (both are required)"; FAILS=1
                  else
                    [ "$timeout" = "-" ] && timeout="600 (documented default)"
                    echo "  PASS: $ev mcp_tool hook -> server=$server tool=$tool timeout=$timeout"
                    [ "$ev" = "PreToolUse" ] && GOOD=1
                  fi ;;
                *) echo "  NOTE: $ev handler type '$type' is not supported with cloud orchestration; it does not run for dots" ;;
              esac
            done <<< "$HANDLERS"
          
            if awk -F'\t' '$1 == "" && $2 == "allow_managed_hooks_only" { f = 1 } END { exit !f }' "$FLAT"; then
              echo "  INFO: allow_managed_hooks_only is set; it has no documented effect on dots"
            fi
            if [ "$GOOD" = 0 ]; then
              echo "  FAIL: no PreToolUse mcp_tool hook is configured, so nothing can block a dot's tool call"; FAILS=1
            fi
            exit "$FAILS"
          fi

"5.1":
  config:
    lang: "bash"
    filename: "hth-chatgpt-dots-5.01-enforce-residency.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/chatgpt-dots/config/hth-chatgpt-dots-5.01-enforce-residency.sh"
    excerpts:
      emit-enforce-residency:
        content: |2
          # Print the requirement that blocks Allow local computer access for Work and dots
          # workspace-wide. It also requires US residency for Codex service traffic.
          if [ "$ACTION" = "emit" ]; then
            if [ "${HTH_CONFIRM_US_CODEX_RESIDENCY:-}" != "yes" ]; then
              echo "PRECONDITION: enforce_residency also requires US residency for Codex service traffic." >&2
              echo "Set HTH_CONFIRM_US_CODEX_RESIDENCY=yes once that is intended for this policy's users." >&2
              exit 2
            fi
            printf 'enforce_residency = "us"\n'
            exit 0
          fi
      verify-enforce-residency:
        content: |2
          # Check saved copies of every Agent Security cloud policy's requirements TOML.
          # The lever is optional (guide 5.1 Step 3): reports SET when at least one policy
          # sets enforce_residency = "us", NOT SET (exit 0) when none does, and fails only
          # on a value other than "us".
          toml_flatten() {   # prints "<section>\t<key>\t<value>"; section is "" at top level
            awk -v SQ="'" '
              function strip(s,   i, c, q, out, esc) {
                q = ""; out = ""; esc = 0
                for (i = 1; i <= length(s); i++) {
                  c = substr(s, i, 1)
                  if (q == "\"") { out = out c; if (esc) esc = 0; else if (c == "\\") esc = 1; else if (c == "\"") q = ""; continue }
                  if (q == SQ)   { out = out c; if (c == SQ) q = ""; continue }
                  if (c == "#") break
                  if (c == "\"" || c == SQ) q = c
                  out = out c
                }
                return out
              }
              function depth(s,   i, c, q, d, esc) {
                q = ""; d = 0; esc = 0
                for (i = 1; i <= length(s); i++) {
                  c = substr(s, i, 1)
                  if (q == "\"") { if (esc) esc = 0; else if (c == "\\") esc = 1; else if (c == "\"") q = ""; continue }
                  if (q == SQ)   { if (c == SQ) q = ""; continue }
                  if (c == "\"" || c == SQ) q = c
                  else if (c == "[") d++
                  else if (c == "]") d--
                }
                return d
              }
              function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              function emit() { printf "%s\t%s\t%s\n", sect, key, trim(val); key = ""; val = "" }
              BEGIN { sect = ""; n = 0; mls = ""; arr = 0; TQ = SQ SQ SQ }
              {
                line = $0; sub(/\r$/, "", line)
                if (mls != "") {
                  p = index(line, mls)
                  if (p > 0) { val = val " " substr(line, 1, p - 1); mls = ""; emit() } else val = val " " line
                  next
                }
                if (arr > 0) { s = strip(line); val = val " " s; arr += depth(s); if (arr <= 0) { arr = 0; emit() }; next }
                s = trim(strip(line))
                if (s == "") next
                if (substr(s, 1, 1) == "[") { n++; sect = s "#" n; next }
                eq = index(s, "="); if (eq == 0) next
                key = trim(substr(s, 1, eq - 1))
                rest = trim(substr(line, index(line, "=") + 1))
                d3 = substr(rest, 1, 3)
                if (d3 == "\"\"\"" || d3 == TQ) {
                  body = substr(rest, 4); p = index(body, d3)
                  if (p > 0) { val = substr(body, 1, p - 1); emit() } else { val = body; mls = d3 }
                  next
                }
                val = trim(strip(rest))
                if (substr(val, 1, 1) == "[") { arr = depth(val); if (arr > 0) next }
                emit()
              }
            ' "$1"
          }
          
          if [ "$ACTION" = "verify" ]; then
            shift || true
            [ "$#" -gt 0 ] || { echo "PRECONDITION: pass saved copies of every cloud policy's requirements TOML" >&2; exit 2; }
            SET=0; FAILS=0
            for FILE in "$@"; do
              [ -r "$FILE" ] || { echo "PRECONDITION: cannot read $FILE" >&2; exit 2; }
              if v=$(toml_flatten "$FILE" | awk -F'\t' '$1 == "" && $2 == "enforce_residency" { print $3; f = 1 } END { exit !f }'); then
                v=$(printf '%s' "$v" | tr -d "\"'")
                if [ "$v" = "us" ]; then
                  echo "  SET:  $FILE -> enforce_residency = \"us\""; SET=1
                else
                  echo "  FAIL: $FILE -> enforce_residency = \"$v\" (only \"us\" is accepted)"; FAILS=1
                fi
              else
                echo "  --    $FILE -> enforce_residency not set"
              fi
            done
            [ "$FAILS" = 0 ] || exit 1
            if [ "$SET" = 1 ]; then
              echo "  PASS: Allow local computer access should show as unavailable for Work and dots, workspace-wide"
              echo "        (dots themselves stay available; confirm the role boundary separately; TRAP 4 conflict)"
            else
              echo "  NOT SET: no cloud policy sets enforce_residency (optional lever; keep Allow local computer access"
              echo "        Off through roles instead — control 3.4)"
            fi
            exit 0
          fi

"5.2":
  api:
    lang: "bash"
    filename: "hth-chatgpt-dots-5.02-disable-user-memory.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/chatgpt-dots/api/hth-chatgpt-dots-5.02-disable-user-memory.sh"
    excerpts:
      preflight-memory-targets:
        content: |2
          # Resolve targets and show, per member, the saved-memory entries that remain
          # after the call (TRAP 2). Read-only.
          if [ "${SCOPE}" = "users" ]; then
            if [ -n "${FROM_GROUP}" ]; then
              cgpt_safe_id "${FROM_GROUP}" "group ID"
              ROSTER="${CGPT_TMPDIR}/roster.jsonl"
              cgpt_paginate_cursor "/manage/workspaces/${CHATGPT_WORKSPACE_ID}/groups/${FROM_GROUP}/users" "${ROSTER}"
              while IFS= read -r U; do USERS+=("${U}"); done < <(jq -r 'select(.status == "active") | .id' "${ROSTER}")
            fi
            [ "${#USERS[@]}" -gt 0 ] || cgpt_die "no target users — pass USER_ID arguments or --from-group GROUP_ID"
            echo "=== ${#USERS[@]} target member(s) ==="
            for U in "${USERS[@]}"; do
              cgpt_safe_id "${U}" "user ID"
              cgpt_get "/compliance/workspaces/${CHATGPT_WORKSPACE_ID}/users/${U}/memories"
              case "${CGPT_CODE}" in
                200) jq -r --arg u "${U}" '"  \($u): \([(.data // [])[] | (.memory_contexts // [])[] | (.memory_entries // [])[]] | length)"
                       + " saved-memory entries in \([(.data // [])[] | (.memory_contexts // [])[]] | length) context(s)"
                       + (if .has_more == true then " (lower bound — has_more, TRAP 7)" else "" end)
                       + " — NOT deleted by delete_and_disable"' "${CGPT_BODY}" ;;
                403) echo "  ${U}: memory count skipped (key lacks chatgpt.enterprise.compliance_export read)" ;;
                *)   cgpt_fail_http GET "/compliance/workspaces/${CHATGPT_WORKSPACE_ID}/users/${U}/memories" ;;
              esac
            done
          fi
      apply-memory-delete-and-disable:
        content: |2
          # The write. Literal POST, no request body (the spec defines none), retried only
          # on 429 — a 429 is a rejected request, so retrying cannot double-apply.
          CGPT_POST_RETRIES=3
          post_delete_and_disable() { # <path>
            local attempt=0 rc
            CGPT_RETRIES=0
            while :; do
              set +e
              CGPT_CODE="$(_cgpt_auth | curl -sS --path-as-is -K - -X POST -H "Content-Length: 0" -D "${CGPT_HDRS}" \
                -o "${CGPT_BODY}" -w '%{http_code}' "${CHATGPT_ADMIN_BASE}$1" 2>/dev/null)"
              rc=$?
              set -e
              [ "${rc}" -eq 0 ] || CGPT_CODE="000"
              if [ "${CGPT_CODE}" = "429" ] && [ "${attempt}" -lt "${CGPT_POST_RETRIES}" ]; then
                sleep "$(_cgpt_retry_after)"; attempt=$((attempt + 1)); CGPT_RETRIES="${attempt}"; continue
              fi
              return 0
            done
          }
          
          FAILED=0
          if [ "${SCOPE}" = "workspace" ]; then
            P="/compliance/workspaces/${CHATGPT_WORKSPACE_ID}/memory/delete_and_disable"
            if [ "${APPLY}" -eq 0 ]; then
              echo "DRY-RUN: would POST ${P} — disables Memory for the WHOLE workspace and queues"
              echo "  deletion of every member's About You summary cache (TRAP 8). The Admin API says saved"
              echo "  memories are kept; help 9295112 says a workspace owner's Memory-off deletes them (TRAP 2)."
              echo "  Validate on a non-production workspace first, and capture GET .../users/{user_id}/memories"
              echo "  for affected members before --apply. Re-run with --apply and"
              echo "  HTH_CONFIRM_WORKSPACE=${CHATGPT_WORKSPACE_ID} to execute."
              exit 0
            fi
            [ "${HTH_CONFIRM_WORKSPACE:-}" = "${CHATGPT_WORKSPACE_ID}" ] \
              || cgpt_die "--workspace --apply needs HTH_CONFIRM_WORKSPACE=${CHATGPT_WORKSPACE_ID} (TRAP 8)"
            post_delete_and_disable "${P}"
            case "${CGPT_CODE}" in
              202) if jq -e '.status == "accepted"' "${CGPT_BODY}" >/dev/null 2>&1; then
                     echo "ACCEPTED: workspace Memory disabled; deletion request $(jq -r '.id' "${CGPT_BODY}") queued (asynchronous)"
                   else
                     echo "FAIL: HTTP 202 without status \"accepted\""; FAILED=1
                   fi ;;
              503) echo "PARTIAL: Workspace Memory was disabled, but the deletion request could not be queued — re-run --apply"; FAILED=1 ;;
              500) echo "FAIL: the workspace setting or deletion request could not be persisted"; FAILED=1 ;;
              *)   cgpt_fail_http POST "${P}" ;;
            esac
          else
            DONE=0; i=0
            for U in "${USERS[@]}"; do
              i=$((i + 1))
              P="/compliance/workspaces/${CHATGPT_WORKSPACE_ID}/users/${U}/memory/delete_and_disable"
              if [ "${APPLY}" -eq 0 ]; then
                echo "DRY-RUN: would POST ${P}"
                continue
              fi
              post_delete_and_disable "${P}"
              case "${CGPT_CODE}" in
                200) if jq -e '.status == "completed"' "${CGPT_BODY}" >/dev/null 2>&1; then
                       echo "DISABLED: ${U} — Memory off, About You summary cache and M3M dream data deleted (saved memories kept per the API, TRAP 2)"
                       DONE=$((DONE + 1))
                     else
                       echo "FAIL: ${U} — HTTP 200 without status \"completed\""; FAILED=$((FAILED + 1))
                     fi ;;
                404) echo "FAIL: ${U} — the user or workspace was not found"; FAILED=$((FAILED + 1)) ;;
                500) echo "FAIL: ${U} — the setting update, cache invalidation, or a scoped deletion failed; state unknown, check the member's Memory setting"
                     FAILED=$((FAILED + 1)) ;;
                401|403|429|000)
                     # Key-level or quota-level: every later POST would fail the same way.
                     if [ $((DONE + FAILED)) -eq 0 ] && [ "${CGPT_CODE}" != "000" ]; then
                       cgpt_fail_http POST "${P}"            # nothing written yet: a true precondition
                     fi
                     if [ "${CGPT_CODE}" = "000" ]; then
                       echo "FAIL: ${U} — no HTTP response; state unknown, check the member's Memory setting (TRAP 10)"
                     else
                       echo "FAIL: ${U} — HTTP ${CGPT_CODE} after ${CGPT_RETRIES} retr(y/ies); stopping (TRAP 10)"
                     fi
                     FAILED=$((FAILED + 1))
                     echo "  ${DONE} member(s) already disabled above"
                     [ "${i}" -ge "${#USERS[@]}" ] || echo "NOT ATTEMPTED (re-run with these IDs): ${USERS[*]:i}"
                     break ;;
                *)   echo "FAIL: ${U} — HTTP ${CGPT_CODE}. Body: $(head -c 300 "${CGPT_BODY}" 2>/dev/null | tr '\n' ' ')"
                     FAILED=$((FAILED + 1)) ;;
              esac
            done
            [ "${APPLY}" -eq 1 ] || echo "DRY-RUN complete — nothing written. Re-run with --apply to execute."
          fi
          
          [ "${APPLY}" -eq 0 ] || echo "VERIFY: the API cannot read Memory state (TRAP 1) — confirm Settings > Personalization > Memory is off for each member."
          [ "${FAILED}" -eq 0 ] || exit 1
          exit 0

"6.1":
  api:
    lang: "bash"
    filename: "hth-chatgpt-dots-6.01-pull-dots-compliance-records.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/chatgpt-dots/api/hth-chatgpt-dots-6.01-pull-dots-compliance-records.sh"
    excerpts:
      clp-freshness:
        content: |2
          # Newest retained event per type, and its age. Reported, never scored (TRAP 7).
          clp_freshness "${EVENT_TYPES[@]}"
          NOW="$(hth_now_epoch)"
          echo "=== Freshness (p99 SLA: under 30 minutes from event to file) ===" >&2
          jq -r --argjson now "${NOW}" 'to_entries[]
            | if .value == null then "  \(.key): null — no retained file with a stored maximum event timestamp"
              else (try (.value | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601) catch null) as $t
                | if $t == null then "  \(.key): \(.value)  (age not computed: unrecognised timestamp form)"
                  else "  \(.key): \(.value)  (\((($now - $t) / 60) | floor) min old)" end
              end' <<<"${CLP_FRESHNESS}" >&2
      clp-pull-dedupe:
        content: |2
          # Pull every file for each type in the window, verify, de-duplicate, emit NDJSON.
          RAW="${CGPT_TMPDIR}/raw.jsonl"
          DEDUPED="${CGPT_TMPDIR}/deduped.ndjson"
          : > "${RAW}"
          echo "=== Pull: after=${AFTER}${BEFORE:+ before=${BEFORE}} ===" >&2
          for ET in "${EVENT_TYPES[@]}"; do
            clp_pull "${ET}" "${AFTER}" "${BEFORE}" "${RAW}"
            echo "  ${ET}: ${CLP_FILES} file(s) verified against file_sha256" >&2
            if [ -n "${CLP_LAST_END_TIME}" ]; then
              echo "  checkpoint: next run HTH_CLP_EVENT_TYPES=${ET} HTH_CLP_AFTER='${CLP_LAST_END_TIME}'  (exclusive — TRAP 5)" >&2
            fi
          done
          clp_dedupe "${RAW}" "${DEDUPED}"
          RAW_N="$(jq -r '1' "${RAW}" | wc -l | tr -d ' ')"
          OUT_N="$(wc -l < "${DEDUPED}" | tr -d ' ')"
          echo "  ${RAW_N} record(s) pulled, ${OUT_N} after event_id de-duplication" >&2
          if [ -n "${HTH_CLP_OUT:-}" ]; then
            cat "${DEDUPED}" >> "${HTH_CLP_OUT}"
            echo "  appended to ${HTH_CLP_OUT} (mode 0600 if newly created)" >&2
          elif [ "${MODE}" = "pull" ]; then
            cat "${DEDUPED}"
          fi
      clp-coverage-summary:
        content: |2
          # Evidence for the test-task diff: run a representative dot task (a message, an
          # app read, an app write, a cloud-browser step, a schedule), pull a window that
          # brackets it, then hold every row below against what the dot actually did.
          # Optional HTH_CLP_ACTOR_EMAIL narrows to the dot owner's records.
          EMAIL="$(printf '%s' "${HTH_CLP_ACTOR_EMAIL:-}" | tr '[:upper:]' '[:lower:]')"
          jq -s -r --arg email "${EMAIL}" '
            def owner: $email == "" or ((.actor.user_email // "") | ascii_downcase) == $email;
            def table($rows): $rows | group_by(.) | map("    \(length)\t\(.[0])") | .[];
            [ .[] | select(owner) ] as $r
            | "=== Coverage\(if $email == "" then "" else " for actor " + $email end): \($r | length) record(s) ===",
              "  by type / actor.type:",
              table([ $r[] | "\(.type)  actor=\(.actor.type // "?")" ]),
              "  CONVERSATION_MESSAGE by author.type / conversation.mode / client_type (TRAP 1):",
              table([ $r[] | select(.type == "CONVERSATION_MESSAGE")
                      | "author=\(.message.author.type // "?")  mode=\(.conversation.mode // "(absent)")  client=\(.message.author.client_type // "-")" ]),
              "  APP_LOG by app / log_type / conversation_id null (TRAP 2):",
              table([ $r[] | select(.type == "APP_LOG")
                      | "\(.app_name // .app_id // "?")  \(.log_type // "?")  conversation_id_null=\(.conversation_id == null)" ]),
              "  APP_AUTH_LOG by action / app_id:",
              table([ $r[] | select(.type == "APP_AUTH_LOG") | "\(.action // "?")  app=\(.app_id // "(null)")" ]),
              "  CODEX_LOG by event_type / agent.type / client_id (TRAP 3):",
              table([ $r[] | select(.type == "CODEX_LOG")
                      | "\(.event_type // "?")  agent=\(.agent.type // "(none)")  client=\(.client_id // "?")" ])
          ' "${DEDUPED}"
          echo "Record, per test action: which row above (if any) shows it, and whether it is attributable to the dot."

"6.2":
  api:
    lang: "bash"
    filename: "hth-chatgpt-dots-6.02-tenant-rbac-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/chatgpt-dots/api/hth-chatgpt-dots-6.02-tenant-rbac-audit.sh"
    excerpts:
      tenant-rbac-audit-log:
        content: |2
          # API Platform audit logs: tenant RBAC events (custom roles, role assignments,
          # group membership, resource role bindings) and the role.* family. Read-only GET,
          # one event type per request (TRAP 3).
          OPENAI_API_BASE="${OPENAI_API_BASE:-https://api.openai.com/v1}"
          TENANT_TYPES="${HTH_TENANT_EVENT_TYPES:-tenant.custom_role.created,tenant.custom_role.updated,tenant.custom_role.deleted,tenant.role_assignment.created,tenant.role_assignment.deleted,tenant.group.member.added,tenant.group.member.removed,tenant.resource_role_assignment.created,tenant.resource_role_assignment.deleted,role.bound_to_resource,role.unbound_from_resource}"
          ROLE_TYPES="${HTH_ROLE_EVENT_TYPES:-role.created,role.updated,role.deleted,role.assignment.created,role.assignment.deleted}"
          
          _oai_auth() { printf 'header = "Authorization: Bearer %s"\n' "${OPENAI_ADMIN_KEY}"; }
          
          # tenant_query <event_type> <tenant_only: true|false> <scope label>
          # Prints every page's events as NDJSON on stdout and a summary on stderr; adds
          # the count to TQ_FOUND. Returns 1 (after reporting) on a rejected type, so the
          # caller can retry or record it; 401/403/no response stop the run.
          TQ_FOUND=0
          tenant_query() {
            local t="$1" only="$2" scope="$3" after="" pages=0 code rc snippet n
            local tenant_arg=()
            [ "${only}" = "true" ] && tenant_arg=(--data-urlencode "tenant_only=true")
            while :; do
              local page=()
              [ -z "${after}" ] || page=(--data-urlencode "after=${after}")
              set +e
              code="$(_oai_auth | curl -sS -g -G -K - -o "${CGPT_BODY}" -w '%{http_code}' \
                "${OPENAI_API_BASE}/organization/audit_logs" \
                ${tenant_arg[@]+"${tenant_arg[@]}"} --data-urlencode "event_types[]=${t}" \
                --data-urlencode "effective_at[gte]=${SINCE_EPOCH}" --data-urlencode "limit=100" \
                ${page[@]+"${page[@]}"} 2>/dev/null)"
              rc=$?
              set -e
              [ "${rc}" -eq 0 ] || cgpt_die "GET /organization/audit_logs — no HTTP response (curl exit ${rc})"
              if [ "${code}" != "200" ]; then
                snippet="$(head -c 300 "${CGPT_BODY}" | tr '\n' ' ')"
                case "${code}" in
                  401|403) cgpt_die "audit_logs HTTP ${code} — OPENAI_ADMIN_KEY is invalid or not an organization Admin key, or audit logging is not enabled (TRAP 4). Body: ${snippet}" ;;
                  *) echo "  ${t} (tenant_only=${only}): HTTP ${code} — ${snippet}" >&2; return 1 ;;
                esac
              fi
              jq -e '(.data | type == "array") and (.has_more | type == "boolean")' "${CGPT_BODY}" >/dev/null 2>&1 \
                || cgpt_die "audit_logs returned HTTP 200 without the documented {data[], has_more} shape"
              jq -c '.data[]' "${CGPT_BODY}"
              jq -r --arg scope "${scope}" '.data[] | "  \(.effective_at | todate)  \(.type)  scope=\($scope)  actor="
                     + "\(.actor.session.user.email // .actor.api_key.user.email // .actor.api_key.service_account.id // .actor.api_key.id // "?")"
                     + "  details=\(.[.type] // "(no documented payload — TRAP 2)" | tojson | .[0:300])"' "${CGPT_BODY}" >&2
              n="$(jq '.data | length' "${CGPT_BODY}")"
              TQ_FOUND=$((TQ_FOUND + n))
              pages=$((pages + 1))
              [ "$(jq -r '.has_more' "${CGPT_BODY}")" = "true" ] || break
              after="$(jq -r '.last_id // ""' "${CGPT_BODY}")"
              [ -n "${after}" ] || cgpt_die "audit_logs: has_more is true but last_id is null — cannot page safely"
              [ "${pages}" -lt 1000 ] || cgpt_die "audit_logs: more than 1000 pages — runaway guard"
            done
          }
          
          tenant_audit() {
            [ -n "${OPENAI_ADMIN_KEY:-}" ] || cgpt_die "set OPENAI_ADMIN_KEY — an API Platform Admin key (needed for --feed tenant)"
            local t types=() roles=()
            IFS=',' read -r -a types <<<"${TENANT_TYPES}"
            IFS=',' read -r -a roles <<<"${ROLE_TYPES}"
            for t in ${types[@]+"${types[@]}"} ${roles[@]+"${roles[@]}"}; do
              [[ "${t}" =~ ^[a-z_.]+$ ]] || cgpt_die "event type '${t}' is not a lower-case audit-log type"
            done
            echo "=== Tenant RBAC audit log (API Platform), effective_at >= ${SINCE} ===" >&2
            TQ_FOUND=0
            for t in ${types[@]+"${types[@]}"}; do
              tenant_query "${t}" true tenant || INCOMPLETE=1
            done
            # role.* may not be tenant-scoped: try tenant_only first, then once without it.
            for t in ${roles[@]+"${roles[@]}"}; do
              tenant_query "${t}" true tenant || tenant_query "${t}" false org || INCOMPLETE=1
            done
            echo "  ${TQ_FOUND} tenant RBAC / role event(s)" >&2
            TENANT_FOUND="${TQ_FOUND}"
            CHANGES=$((CHANGES + TQ_FOUND))
          }
      chatgpt-audit-log-governance:
        content: |2
          # ChatGPT Compliance Logs Platform AUDIT_LOG: the governance actions that can
          # widen dots' reach (role permissions and assignments, role deletion, member
          # role and seat updates, group membership by console or Admin API, app access,
          # publication and action controls, plugin sharing and installation policy,
          # feature toggles, Agent Security policy saves). A superset of the two 6.02
          # Sigma rules plus APP_SET_ENABLED_ACTIONS (2.01 rule) and WORKSPACE_SET_POLICY
          # (4.02 rule). Removals of a user from a group are left out (TRAP 6). Read-only.
          GOVERNANCE_ACTIONS='["ROLE_CREATE","ROLE_UPDATE","ROLE_DELETE","ROLE_ASSIGN","ROLE_UNASSIGN",
            "USER_ROLE_UPDATED","UPDATE_WORKSPACE_USER",
            "ROLE_SET_PLUGIN_PERMISSIONS","ROLE_SET_CONNECTOR_PERMISSIONS","ROLE_SET_ALL_CONNECTOR_PERMISSIONS",
            "ROLE_UPDATE_BINDING_PERMISSIONS","GROUP_ADD_USERS","GROUP_EDIT","ADD_WORKSPACE_DIRECTORY_GROUP_USER",
            "APP_UPDATE_ACCESS_POLICY","APP_ALLOW_USER","APP_PUBLISH","APP_SET_ENABLED_ACTIONS",
            "PLUGIN_SHARE","PLUGIN_UPDATE_INSTALLATION_POLICY","WORKSPACE_TOGGLE_FEATURE","WORKSPACE_SET_POLICY"]'
          
          chatgpt_audit() {
            cgpt_require
            CGPT_SCOPE_HINT="chatgpt.enterprise.compliance_logs_platform.audit_log.read"
            local raw="${CGPT_TMPDIR}/audit-raw.jsonl" ded="${CGPT_TMPDIR}/audit.ndjson" hits="${CGPT_TMPDIR}/audit-hits.ndjson" n
            : > "${raw}"
            echo "=== ChatGPT AUDIT_LOG governance actions, files after ${SINCE} ===" >&2
            clp_pull AUDIT_LOG "${SINCE}" "" "${raw}"
            clp_dedupe "${raw}" "${ded}"
            jq -c --argjson acts "${GOVERNANCE_ACTIONS}" --argjson since "${SINCE_EPOCH}" '
                select(.action as $a | $acts | any(.[]; . == $a))
                | select(((try (.timestamp | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601) catch null) // $since) >= $since)' \
                "${ded}" > "${hits}"
            cat "${hits}"
            jq -r '"  \(.timestamp)  \(.action)  result=\(.action_result // "?")  actor=\(.actor.user_email // .actor.redacted_id // .actor.type // "?")"
                   + "  data=\(.action_data // {} | tojson | .[0:300])"' "${hits}" >&2
            n="$(wc -l < "${hits}" | tr -d ' ')"
            echo "  ${n} governance action(s) from ${CLP_FILES} AUDIT_LOG file(s)" >&2
            if [ -n "${CLP_LAST_END_TIME}" ]; then
              echo "  checkpoint: next run HTH_AUDIT_SINCE='${CLP_LAST_END_TIME}' (keep an overlap — TRAP 7)" >&2
            fi
            CHANGES=$((CHANGES + n))
          }
  cli:
    lang: "bash"
    filename: "hth-chatgpt-dots-6.02-tenant-rbac-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/chatgpt-dots/cli/hth-chatgpt-dots-6.02-tenant-rbac-audit.sh"
    excerpts:
      cli-list-dots-reach-rbac-events:
        content: |2
          # List RBAC changes that can widen what dots reach, from the API Platform audit log.
          HOURS="${HTH_LOOKBACK_HOURS:-24}"
          printf '%s' "$HOURS" | grep -E '^[1-9][0-9]*$' >/dev/null || {
            echo "PRECONDITION: HTH_LOOKBACK_HOURS must be a positive integer" >&2; exit 2; }
          SINCE=$(( $(date +%s) - HOURS * 3600 ))
          
          # Documented ChatGPT workspace connector-role events first, then the tenant RBAC
          # events whose link to dots grants is unverified (TRAP 2), then the role.* family
          # (role.updated carries the only documented permission diff).
          EVENT_TYPES=(
            role.bound_to_resource role.unbound_from_resource
            tenant.custom_role.created tenant.custom_role.updated tenant.custom_role.deleted
            tenant.role_assignment.created tenant.role_assignment.deleted
            tenant.group.member.added tenant.group.member.removed
            tenant.resource_role_assignment.created tenant.resource_role_assignment.deleted
          )
          ROLE_TYPES=(
            role.created role.updated role.deleted role.assignment.created role.assignment.deleted
          )
          
          ERR=$(mktemp "${TMPDIR:-/tmp}/hth-dots-602.XXXXXX"); trap 'rm -f "$ERR"' EXIT
          FOUND=0; FAILED=0
          
          # list_type <event type> <scope: tenant|org> — one type per call (TRAP 3). The key
          # travels in OPENAI_ADMIN_KEY, never in argv. Returns 1 if the CLI rejects the call.
          list_type() {
            local type="$1" scope="$2" out rows bad
            local only=()
            [ "$scope" = "tenant" ] && only=(--tenant-only)
            if ! out=$(openai --format jsonl admin organization audit-logs list \
                  ${only[@]+"${only[@]}"} --event-type "$type" --effective-at.gte "$SINCE" --limit 100 2>"$ERR"); then
              echo "  ERROR: $type (scope=$scope): $(head -c 300 "$ERR")" >&2; return 1
            fi
            # Count non-empty lines that are not a JSON object with a `type` (TRAP 5).
            bad=$(printf '%s\n' "$out" | jq -R -s -r 'split("\n") | map(select(length > 0))
              | map(select(((try fromjson catch null) as $o
                            | ($o | type) != "object" or ($o | has("type") | not))))
              | .[0:3][]')
            if [ -n "$bad" ]; then
              echo "  ERROR: $type (scope=$scope): unparseable CLI output: $(printf '%s' "$bad" | head -c 300)" >&2
              FAILED=1
            fi
            # Details live under a key named after the event type, e.g. ."role.bound_to_resource".
            rows=$(printf '%s\n' "$out" | jq -R -r --arg ws "${HTH_WORKSPACE_ID:-}" --arg scope "$scope" '
              fromjson? | select(type == "object" and has("type"))
              | (.[.type] // {}) as $d
              | select($ws == "" or (($d.workspace_id // $ws) == $ws))
              | [ (.effective_at | todate), .type, $scope,
                  ($d.resource_type // $d.changes_requested.resource_type // "-"),
                  (.actor.session.user.email // .actor.api_key.user.email
                    // .actor.api_key.service_account.id // .actor.type // "unknown"),
                  ($d | tojson) ] | @tsv')
            if [ -n "$rows" ]; then printf '%s\n' "$rows"; FOUND=1; fi
            return 0
          }
          
          printf 'effective_at\ttype\tscope\tresource_type\tactor\tdetails\n'
          for TYPE in "${EVENT_TYPES[@]}"; do
            list_type "$TYPE" tenant || FAILED=1
          done
          # role.* may not be tenant-scoped: try --tenant-only first, then once without it.
          for TYPE in "${ROLE_TYPES[@]}"; do
            list_type "$TYPE" tenant || list_type "$TYPE" org || FAILED=1
          done
          
          if [ "$FAILED" = 1 ]; then
            echo "INCOMPLETE: at least one event type could not be read or parsed; do not treat this window as clean" >&2; exit 2
          fi
          if [ "$FOUND" = 1 ]; then
            exit 1
          fi
          if [ "${HTH_TENANT_FEED_VERIFIED:-}" != "yes" ]; then
            echo "  UNVERIFIED: none in the last ${HOURS}h, and the feed has not been shown to carry a known test change (TRAP 4); set HTH_TENANT_FEED_VERIFIED=yes once it has" >&2; exit 3
          fi
          echo "  none in the last ${HOURS}h" >&2; exit 0
  sigma:
