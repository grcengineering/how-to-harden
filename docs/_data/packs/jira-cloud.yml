"1.1":
  api:
    lang: "bash"
    filename: "hth-jira-cloud-1.01-audit-permission-schemes.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/jira-cloud/api/hth-jira-cloud-1.01-audit-permission-schemes.sh"
    excerpts:
      permission-scheme-audit:
        content: |2
          # Guide Step 1: inventory every scheme and the spaces using it, then flag
          #   - any grant to Public (holder type anyone)
          #   - Browse spaces, or a destructive grant, given to a whole application population
          #   - any grant to a single named user instead of a space role or group
          audit() {
            require_admin
            jira_get "/rest/api/3/permissionscheme?expand=permissions"
            cp "${BODY}" "${WORK}/schemes.json"
            local total
            total=$(jq '(.permissionSchemes // []) | length' "${WORK}/schemes.json")
            if [ "${total}" -eq 0 ]; then
              echo "PRECONDITION: zero permission schemes returned - Free sites have none (guide Appendix A); nothing was audited" >&2
              exit 2
            fi
            jq -e '[.permissionSchemes[] | has("permissions")] | all' "${WORK}/schemes.json" >/dev/null 2>&1 \
              || { echo "PRECONDITION: schemes came back without their grants (expand=permissions not honoured)" >&2; exit 2; }
            map_spaces_to_schemes
          
            echo "Jira Cloud 1.1 - permission scheme least-privilege audit"
            echo "  permission schemes: ${total}"
            echo "  company-managed spaces: $(jq 'length' "${WORK}/map.json")"
            echo "  team-managed spaces (not governed by schemes): $(jq '[.[] | select(.style != "classic")] | length' "${WORK}/projects.json")"
          
            jq --slurpfile map "${WORK}/map.json" '
              ["ADMINISTER_PROJECTS", "DELETE_ISSUES", "DELETE_ALL_COMMENTS"] as $destructive
              | ($map[0] | group_by(.scheme) | map({key: .[0].scheme, value: map(.space)}) | from_entries) as $spaces
              | [ .permissionSchemes[] as $s
                  | ($spaces[($s.id | tostring)] // []) as $sp
                  | (if ($sp | length) == 0 then "no company-managed space" else ($sp | join(", ")) end) as $where
                  | $s.permissions[] as $g
                  | ($g.holder.type // "unknown") as $t
                  | if $t == "anyone" then
                      "FINDING: \"\($s.name)\" grants \($g.permission) to Public (holder type anyone) - spaces: \($where)"
                    elif $t == "applicationRole" and ($g.permission == "BROWSE_PROJECTS" or ($destructive | any(. == $g.permission))) then
                      "FINDING: \"\($s.name)\" grants \($g.permission) to applicationRole \($g.holder.parameter // "(no application named)") - every user with that product access - spaces: \($where)"
                    elif $t == "user" then
                      "FINDING: \"\($s.name)\" grants \($g.permission) to a single user (...\(($g.holder.value // $g.holder.parameter // "") | .[-6:])) - grant through a space role or group instead - spaces: \($where)"
                    else empty end ]' "${WORK}/schemes.json" > "${WORK}/findings.json"
          
            jq -r --slurpfile map "${WORK}/map.json" '
              ($map[0] | map(.scheme)) as $used
              | .permissionSchemes[]
              | (.id | tostring) as $id
              | "  - \"\(.name)\" (id \($id)): \(.permissions | length) grants, \([$used[] | select(. == $id)] | length) spaces"' \
              "${WORK}/schemes.json"
            jq -r '.[]' "${WORK}/findings.json"
          
            local n
            n=$(jq 'length' "${WORK}/findings.json")
            if [ "${n}" -gt 0 ]; then
              echo "${n} finding(s). Fix in Settings > Work items > Permission schemes (guide Steps 2-4)."
              return 1
            fi
            echo "COMPLIANT: no Public, application-wide Browse/destructive, or single-user grants in ${total} scheme(s)."
          }

"1.2":
  api:
    lang: "bash"
    filename: "hth-jira-cloud-1.02-audit-security-schemes.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/jira-cloud/api/hth-jira-cloud-1.02-audit-security-schemes.sh"
    excerpts:
      security-scheme-audit:
        content: |2
          # Guide Steps 1-2: a scheme exists, has levels, and has a DEFAULT level.
          # Guide Step 5: list the company-managed spaces with no scheme (move-gap review).
          audit() {
            require_admin
            jira_pages "/rest/api/3/issuesecurityschemes/search" "${WORK}/schemes.json"
            jira_pages "/rest/api/3/issuesecurityschemes/level" "${WORK}/levels.json"
            map_spaces_to_security_schemes
          
            echo "Jira Cloud 1.2 - work item security scheme audit"
            echo "  security schemes: $(jq 'length' "${WORK}/schemes.json")"
            echo "  company-managed spaces: $(jq 'length' "${WORK}/classic.json"); using a scheme: $(jq '[.[].space] | unique | length' "${WORK}/map.json")"
          
            jq --slurpfile levels "${WORK}/levels.json" --slurpfile map "${WORK}/map.json" --slurpfile classic "${WORK}/classic.json" '
              ($map[0] | map(.space) | unique) as $covered
              | if length == 0 then
                  ["FINDING: no work item security scheme exists - every item in a space is visible to everyone who can browse it (guide Step 1; unavailable on Free sites)"]
                else
                  [ .[]
                    | (.id | tostring) as $id
                    | ([$levels[0][] | select((.issueSecuritySchemeId | tostring) == $id)]) as $lv
                    | ([$map[0][] | select(.scheme == $id) | .space]) as $sp
                    | "  - \"\(.name)\" (id \($id)): \($lv | length) level(s), default \((first($lv[] | select(.isDefault == true) | .name) // "none")), spaces: \(if ($sp | length) == 0 then "none" else ($sp | join(", ")) end)",
                      (if ($lv | length) == 0 then "FINDING: \"\(.name)\" has no security levels - it cannot restrict anything (Step 2)" else empty end),
                      (if .defaultLevel == null and ($lv | any(.isDefault == true)) == false
                       then "FINDING: \"\(.name)\" has no default level - items created without a choice are fully visible (Step 2.3)" else empty end)
                  ]
                end
              + [ $classic[0][] | select(. as $k | $covered | index($k) | not)
                  | "REVIEW: space \(.) has no security scheme - a restricted item moved here becomes visible to anyone with access to the space (Step 5)" ]' \
              "${WORK}/schemes.json" > "${WORK}/lines.json"
          
            jq -r '.[]' "${WORK}/lines.json"
            local n
            n=$(jq '[.[] | select(startswith("FINDING"))] | length' "${WORK}/lines.json")
            if [ "${n}" -gt 0 ]; then
              echo "${n} finding(s). Fix in Settings > Work items > Work item security schemes (guide Steps 1-2)."
              return 1
            fi
            echo "COMPLIANT: every security scheme has levels and a default level."
          }

"1.3":
  api:
    lang: "bash"
    filename: "hth-jira-cloud-1.03-audit-public-grants.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/jira-cloud/api/hth-jira-cloud-1.03-audit-public-grants.sh"
    excerpts:
      public-grant-audit:
        content: |2
          # Guide Step 1: find every grant to Public (holder type anyone) and every space
          # each such scheme exposes. Guide Step 3: a declared public scheme must be
          # dedicated to a single space.
          audit() {
            local declared="${HTH_JIRA_PUBLIC_SCHEME_IDS:-}"
            case "${declared}" in
              *[!0-9,]*) echo "PRECONDITION: HTH_JIRA_PUBLIC_SCHEME_IDS must be comma-separated numeric scheme IDs" >&2; exit 2 ;;
            esac
            require_admin
            jira_get "/rest/api/3/permissionscheme?expand=permissions"
            cp "${BODY}" "${WORK}/schemes.json"
            local total public
            total=$(jq '(.permissionSchemes // []) | length' "${WORK}/schemes.json")
            if [ "${total}" -eq 0 ]; then
              echo "PRECONDITION: zero permission schemes returned - Free sites have none and cannot be public (guide Appendix A); nothing was audited" >&2
              exit 2
            fi
            jq -e '[.permissionSchemes[] | has("permissions")] | all' "${WORK}/schemes.json" >/dev/null 2>&1 \
              || { echo "PRECONDITION: schemes came back without their grants (expand=permissions not honoured)" >&2; exit 2; }
            public=$(jq '[.permissionSchemes[] | select(any(.permissions[]; .holder.type == "anyone"))] | length' "${WORK}/schemes.json")
          
            echo "Jira Cloud 1.3 - public and anonymous space exposure audit"
            echo "  permission schemes: ${total}; with a Public (anyone) grant: ${public}"
            if [ "${public}" -eq 0 ]; then
              echo "COMPLIANT: no permission scheme grants anything to Public (holder type anyone)."
              return 0
            fi
            map_spaces_to_schemes
          
            jq --slurpfile map "${WORK}/map.json" --arg declared "${declared}" '
              ($declared | split(",") | map(select(length > 0))) as $ok
              | ($map[0] | group_by(.scheme) | map({key: .[0].scheme, value: map(.space)}) | from_entries) as $spaces
              | [ .permissionSchemes[]
                  | select(any(.permissions[]; .holder.type == "anyone"))
                  | (.id | tostring) as $id
                  | ($spaces[$id] // []) as $sp
                  | ([.permissions[] | select(.holder.type == "anyone") | .permission] | unique) as $keys
                  | (if ($sp | length) == 0 then "no space yet (any space later given this scheme becomes public)" else ($sp | join(", ")) end) as $where
                  | if ($ok | index($id)) == null then
                      "FINDING: \"\(.name)\" (id \($id)) grants \($keys | join(", ")) to Public - readable without authentication in: \($where)"
                    elif ($sp | length) > 1 then
                      "FINDING: declared public scheme \"\(.name)\" (id \($id)) is shared by \($sp | length) spaces (\($where)) - give the public space a scheme no other space uses (Step 3.1)"
                    else
                      "GOVERNED: declared public scheme \"\(.name)\" (id \($id)) grants \($keys | join(", ")) to Public for: \($where)"
                      + (if ($keys | index("CREATE_ISSUES")) != null
                         then "\nREVIEW: anonymous work item creation is on for \"\(.name)\" - keep it only with a moderation workflow (Step 3.3)"
                         else "" end)
                    end ]' "${WORK}/schemes.json" > "${WORK}/lines.json"
          
            jq -r '.[]' "${WORK}/lines.json"
            local n
            n=$(jq '[.[] | select(startswith("FINDING"))] | length' "${WORK}/lines.json")
            if [ "${n}" -gt 0 ]; then
              echo "${n} finding(s). Remove the Public grant, or replace it with Any logged in user (guide Step 2)."
              return 1
            fi
            echo "COMPLIANT: every Public grant is on a declared, dedicated public scheme."
          }

"2.2":
  api:
    lang: "bash"
    filename: "hth-jira-cloud-2.02-audit-guest-accounts.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/jira-cloud/api/hth-jira-cloud-2.02-audit-guest-accounts.sh"
    excerpts:
      guest-roster-audit:
        content: |2
          # Guide Step 1: inventory every account holding the Guest role and the Jira
          # resources it holds it on. Guide Step 4.2: an active Jira guest with no entry
          # in the sponsor roster (HTH_GUEST_ROSTER) is a finding.
          audit() {
            local org="/v2/orgs/${ATLASSIAN_ORG_ID}/directories/-/users"
            org_pages "${org}?roleIds=atlassian%2Fguest&limit=100" "${WORK}/guests.json"
            local expected acct
            expected=$(jq 'length' "${WORK}/guests.json")
            : > "${WORK}/rows.jsonl"
            while read -r acct; do
              case "${acct}" in ''|*[!0-9A-Za-z:_-]*) echo "PRECONDITION: users GET returned a malformed accountId" >&2; exit 2 ;; esac
              org_pages "${org}/${acct}/role-assignments?roleIds=atlassian%2Fguest&limit=100" "${WORK}/ra.json"
              jq -c --slurpfile g "${WORK}/guests.json" --arg a "${acct}" '
                ($g[0][] | select(.accountId == $a)) as $u
                | { account: $a,
                    status: ($u.status // "unknown"),
                    added: (($u.addedToOrg // "") | .[0:10]),
                    jira: [ .[] | select((.resourceOwner // "") | startswith("jira")) | .resourceId ],
                    other: [ .[] | select(((.resourceOwner // "") | startswith("jira")) | not) | (.resourceOwner // "unknown") ] }' \
                "${WORK}/ra.json" >> "${WORK}/rows.jsonl"
            done < <(jq -r '.[].accountId' "${WORK}/guests.json")
            jq -s '.' "${WORK}/rows.jsonl" > "${WORK}/rows.json"
            if [ "$(jq 'length' "${WORK}/rows.json")" -ne "${expected}" ]; then
              echo "PRECONDITION: read role assignments for $(jq 'length' "${WORK}/rows.json") of ${expected} guests" >&2; exit 2
            fi
          
            echo "Jira Cloud 2.2 - guest account inventory"
            echo "  accounts holding atlassian/guest: ${expected}; on a Jira resource: $(jq '[.[] | select(.jira | length > 0)] | length' "${WORK}/rows.json")"
            jq -r '.[] | select(.jira | length > 0)
              | "  - ...\(.account | .[-6:]) status=\(.status) added=\(.added) jira resources=\(.jira | length)"' "${WORK}/rows.json"
            jq -r '[.[] | select(.jira | length == 0) | .other[]] | group_by(.) | .[]
              | "  INFO: \(length) guest role(s) on non-Jira resource owner \(.[0])"' "${WORK}/rows.json"
          
            if [ "$(jq '[.[] | select(.jira | length > 0)] | length' "${WORK}/rows.json")" -eq 0 ]; then
              echo "COMPLIANT: no account holds the Guest role on a Jira resource."
              return 0
            fi
            if [ -z "${ROSTER}" ]; then
              echo "PRECONDITION: set HTH_GUEST_ROSTER to the sponsored guests' account IDs to get a verdict (guide Step 4.2)." >&2
              exit 2
            fi
          
            jq --arg roster "${ROSTER}" '
              ($roster | split(",") | map(select(length > 0))) as $ok
              | [ .[] | select(.jira | length > 0) | select(.status == "active")
                  | select(.account as $a | $ok | index($a) == null)
                  | "FINDING: active Jira guest ...\(.account | .[-6:]) (added \(.added)) has no sponsor on the roster - confirm the engagement or remove the guest (Steps 3.3, 4.2)" ]
              + [ $ok[] as $r | select([.[] | .account] | index($r) == null)
                  | "INFO: roster entry ...\($r | .[-6:]) no longer holds the Guest role - update the roster" ]' \
              "${WORK}/rows.json" > "${WORK}/lines.json"
          
            jq -r '.[]' "${WORK}/lines.json"
            local n
            n=$(jq '[.[] | select(startswith("FINDING"))] | length' "${WORK}/lines.json")
            if [ "${n}" -gt 0 ]; then
              echo "${n} unsponsored active Jira guest(s)."
              return 1
            fi
            echo "COMPLIANT: every active Jira guest is on the sponsor roster."
          }

"3.1":
  api:
    lang: "bash"
    filename: "hth-jira-cloud-3.01-audit-automation-egress.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/jira-cloud/api/hth-jira-cloud-3.01-audit-automation-egress.sh"
    excerpts:
      automation-egress-audit:
        content: |2
          # Guide Step 1: inventory every rule, and every ENABLED rule that contains an
          # action which sends data out of Jira. Guide Step 3: rules you reviewed and kept
          # are listed in HTH_APPROVED_RULE_UUIDS and reported as approved, not as findings.
          audit() {
            require_admin
            list_rules
            describe_rules
          
            echo "Jira Cloud 3.1 - automation rule inventory and egress audit"
            echo "  rules: $(jq 'length' "${WORK}/rules.json") (enabled $(jq '[.[] | select(.state == "ENABLED")] | length' "${WORK}/rules.json"))"
            if [ "$(jq 'length' "${WORK}/rules.json")" -eq 0 ]; then
              echo "COMPLIANT: the site has no automation rules."
              return 0
            fi
            echo "  action component types in ENABLED rules (type: rules):"
            jq -r '[.[] | select(.state == "ENABLED") | .actions[]] | group_by(.) | .[] | "    \(.[0]): \(length)"' "${WORK}/rules.json"
            echo "  connections in ENABLED rules (authType/target: rules):"
            jq -r '[.[] | select(.state == "ENABLED") | .connections[]] | group_by(.) | .[] | "    \(.[0]): \(length)"' "${WORK}/rules.json"
          
            if [ -z "${EGRESS_TYPES}" ]; then
              echo "PRECONDITION: set HTH_EGRESS_COMPONENT_TYPES to the egress action types above (see header)." >&2
              echo "  Atlassian does not publish component type identifiers, so this pack will not guess which ones send data out." >&2
              exit 2
            fi
            if [ "$(jq -rn --arg egress "${EGRESS_TYPES}" '$egress | split(",") | map(select(length > 0)) | length')" -eq 0 ]; then
              echo "PRECONDITION: HTH_EGRESS_COMPONENT_TYPES names no component type (only separators)." >&2
              exit 2
            fi
          
            # A listed type that no rule on the site uses (enabled or disabled) is usually a
            # misspelling. It matches nothing, so it would hide the very rules it was meant to catch.
            local unmatched
            unmatched=$(jq -r --arg egress "${EGRESS_TYPES}" '
              ($egress | split(",") | map(select(length > 0)) | unique) as $out
              | ([ .[].actions[] ] | unique) as $seen
              | [ $out[] | select(. as $t | $seen | index($t) == null) ] | join(", ")' "${WORK}/rules.json")
          
            jq --arg egress "${EGRESS_TYPES}" --arg approved "${APPROVED}" '
              ($egress | split(",") | map(select(length > 0))) as $out
              | ($approved | ascii_downcase | split(",") | map(select(length > 0))) as $ok
              | [ .[] | select(.state == "ENABLED")
                  | . as $rule
                  | ([.actions[] | select(. as $a | $out | index($a) != null)]) as $hits
                  | select($hits | length > 0)
                  | "\(if ($ok | index($rule.uuid | ascii_downcase)) != null then "APPROVED" else "FINDING" end): \"\(.name)\" (\(.uuid)) sends data out via \($hits | join(", ")) - trigger \(.trigger), actor \(.actor), scopes \(.scopes), author ...\(.author)" ]' \
              "${WORK}/rules.json" > "${WORK}/lines.json"
          
            jq -r '.[]' "${WORK}/lines.json"
            if [ -n "${unmatched}" ]; then
              echo "WARN: HTH_EGRESS_COMPONENT_TYPES lists ${unmatched}, which matches no action type used by any rule on this site." >&2
              echo "  Types in use: $(jq -r '[ .[].actions[] ] | unique | join(", ")' "${WORK}/rules.json")" >&2
            fi
            local n
            n=$(jq '[.[] | select(startswith("FINDING"))] | length' "${WORK}/lines.json")
            if [ "${n}" -gt 0 ]; then
              echo "${n} enabled rule(s) send data out and are not on the reviewed list. Record destination, owner and justification, or disable them (guide Steps 1 and 3)."
              return 1
            fi
            if [ -n "${unmatched}" ]; then
              echo "PRECONDITION: no clean verdict while a listed egress type matches no rule. Correct its spelling from the types in use, or remove it if this site has no rule that uses it." >&2
              exit 2
            fi
            echo "COMPLIANT: every enabled rule with an egress action is on the reviewed list."
          }

