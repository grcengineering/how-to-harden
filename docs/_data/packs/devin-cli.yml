      preserve-workspace-trust:
        content: |2
          set -euo pipefail
          # Default: print the planned command; never run a session or trust a workspace.
          # Use the sandbox launcher instead when OS isolation is required.
          [ "$#" -le 1 ] || { echo 'Usage: script [--launch]' >&2; exit 2; }
          case "${1:-}" in
            '') printf '%s\n' 'DRY RUN: devin --permission-mode normal --respect-workspace-trust true' ;;
            --launch)
              command -v devin >/dev/null || { echo 'Devin CLI is not installed' >&2; exit 1; }
              exec devin --permission-mode normal --respect-workspace-trust true ;;
            *) echo 'Usage: script [--launch]' >&2; exit 2 ;;
          esac

"3.1":
  cli:
    lang: "bash"
    filename: "hth-devin-cli-3.01-govern-mcp-servers.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin-cli/cli/hth-devin-cli-3.01-govern-mcp-servers.sh"
    excerpts:
      govern-mcp-servers:
        content: |2
          set -euo pipefail
          # list is read-only. disable changes only the named scope, only with --apply.
          # List output may contain internal server metadata; keep it local.
          case "${1:-list}" in
            list)
              [ "$#" -le 1 ] || { echo 'Usage: script list' >&2; exit 2; }
              command -v devin >/dev/null || { echo 'Devin CLI is not installed' >&2; exit 1; }
              devin mcp list ;;
            disable)
              [ "$#" -ge 3 ] && [ "$#" -le 4 ] || { echo 'Usage: script disable NAME local|project|user [--apply]' >&2; exit 2; }
              name="$2"; scope="$3"
              [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo 'Invalid server name' >&2; exit 2; }
              case "$scope" in local|project|user) ;; *) echo 'Invalid scope' >&2; exit 2;; esac
              if [ "$#" -eq 4 ]; then
                [ "$4" = '--apply' ] || { echo 'Expected --apply' >&2; exit 2; }
                command -v devin >/dev/null || { echo 'Devin CLI is not installed' >&2; exit 1; }
                devin mcp disable "$name" --scope "$scope"
              else
                printf 'DRY RUN: devin mcp disable %q --scope %q\n' "$name" "$scope"
              fi ;;
            *) echo 'Usage: script list | disable NAME local|project|user [--apply]' >&2; exit 2 ;;
          esac

