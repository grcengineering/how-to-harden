          jq -r 'select(((.base_role_type // "") == "member" or (.base_role_type // "") == "guest")
                        and .permissions.export_project_data == true)
                 | "FINDING: role \"\(.name)\" (base \(.base_role_type)) can export project data."' "${ITEMS_FILE}"
          exporters=$(jq -s '[.[] | select(((.base_role_type // "") == "member" or (.base_role_type // "") == "guest")
                                            and .permissions.export_project_data == true)] | length' "${ITEMS_FILE}")
