          roles=$(jq -s 'length' "${ITEMS_FILE}")
          reported=$(jq -s '[.[] | select(.permissions.download_mobile_attachments != null)] | length' "${ITEMS_FILE}")
          if [ "${roles}" -eq 0 ] || [ "${reported}" -eq 0 ]; then
            echo "PRECONDITION: GET /roles returned ${roles} role(s), none reporting download_mobile_attachments; not evaluated (TRAP 2)" >&2
            exit 2
          fi
          echo "Asana 3.3 — mobile attachment download permission"
          echo "  roles scanned: ${roles}"
          jq -r 'select(((.base_role_type // "") == "member" or (.base_role_type // "") == "guest")
                        and .permissions.download_mobile_attachments == true)
                 | "FINDING: role \"\(.name)\" (base \(.base_role_type)) can download attachments on the mobile app."' "${ITEMS_FILE}"
          downloaders=$(jq -s '[.[] | select(((.base_role_type // "") == "member" or (.base_role_type // "") == "guest")
                                              and .permissions.download_mobile_attachments == true)] | length' "${ITEMS_FILE}")
          # TRAP 2. Roles that could not be judged: unknown base type, or no value reported.
          UNEVALUATED='def known: (.base_role_type // "") as $b | ["guest", "member", "admin", "super_admin"] | any(. == $b);
                       def judged: .base_role_type == "member" or .base_role_type == "guest";
                       select((known | not) or (judged and .permissions.download_mobile_attachments == null))'
          jq -r "${UNEVALUATED}"' | "INCONCLUSIVE: role \"\(.name)\" (base \(.base_role_type // "unreported")) was not evaluated: no download_mobile_attachments value, or an unknown base type."' "${ITEMS_FILE}"
          unevaluated=$(jq -s "[.[] | ${UNEVALUATED}] | length" "${ITEMS_FILE}")
  sigma:
    - lang: "yaml"
      filename: "hth-asana-3.03-mobile-data-control-weakened.yml"
      source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/asana/siem/sigma/hth-asana-3.03-mobile-data-control-weakened.yml"
      excerpts:
        detection:
          content: |2
            detection:
                selection:
                    event_type:
                        - 'workspace_mobile_app_biometric_authentication_required_disabled'
                        - 'workspace_mobile_app_screen_capture_enabled'
                        - 'workspace_mobile_app_copy_paste_enabled'
                        - 'workspace_mobile_app_attachments_sharing_enabled'
                condition: selection
            fields:
                - created_at
                - event_type
                - actor.gid
                - actor.name
                - context.client_ip_address

"3.4":
  api:
    lang: "bash"
    filename: "hth-asana-3.04-audit-ai-studio-seats.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/asana/api/hth-asana-3.04-audit-ai-studio-seats.sh"
    excerpts:
      ai-studio-seat-audit:
        content: |2
          query="state=active&limit=100"
          [ -z "${ASANA_DIVISION_GID:-}" ] || query="${query}&division_gid=${ASANA_DIVISION_GID}"
          offset=""; pages=0
          : > "${ITEMS_FILE}"
          while :; do
            if [ -n "${offset}" ]; then
              asana_get "/workspaces/${ASANA_WORKSPACE_GID}/ai_studio/seats?${query}&offset=${offset}"
            else
              asana_get "/workspaces/${ASANA_WORKSPACE_GID}/ai_studio/seats?${query}"
            fi
            jq -c '.data[]' "${BODY_FILE}" >> "${ITEMS_FILE}"
            offset=$(jq -r '.next_page.offset // "" | @uri' "${BODY_FILE}")
            pages=$((pages + 1))
            [ -n "${offset}" ] || break
            if [ "${pages}" -ge 1000 ]; then echo "PRECONDITION: seat paging exceeded 1000 pages" >&2; exit 2; fi
          done
          
          approved=$(jq -nc --arg a "${ASANA_AI_STUDIO_APPROVED_USERS}" \
            '[$a | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(length > 0)] | unique')
          echo "Asana 3.4 — AI Studio paid seats (active; free tier not reported, TRAP 1)"
          echo "  division: ${ASANA_DIVISION_GID:-first licensed division (TRAP 3)}"
          echo "  active paid seats: $(jq -s 'length' "${ITEMS_FILE}") across ${pages} page(s); approved holders: $(jq -n --argjson a "${approved}" '$a | length')"
          jq -s -c --argjson a "${approved}" '[.[] | select((.user.gid // "") as $g | ($a | index($g)) == null)]' "${ITEMS_FILE}" > "${BODY_FILE}"
          unapproved=$(jq 'length' "${BODY_FILE}")
          jq -r '.[] | "FINDING: unapproved AI Studio seat \(.license // "unknown") held by \(.user.name // "(no name)") …\((.user.gid // "") | .[-6:]) since \(.assigned_at // "unknown")"' "${BODY_FILE}"

"4.1":
  api:
    lang: "bash"
    filename: "hth-asana-4.01-export-audit-log-events.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/asana/api/hth-asana-4.01-export-audit-log-events.sh"
    excerpts:
      audit-log-export:
        content: |2
          query="start_at=${START_AT}&limit=100"
          [ -z "${ASANA_END_AT:-}" ] || query="${query}&end_at=${ASANA_END_AT}"
          offset=""; pages=0; events=0
          while :; do
            if [ -n "${offset}" ]; then
              asana_get "/workspaces/${ASANA_WORKSPACE_GID}/audit_log_events?${query}&offset=${offset}"
            else
              asana_get "/workspaces/${ASANA_WORKSPACE_GID}/audit_log_events?${query}"
            fi
            pages=$((pages + 1))
            n=$(jq '.data | length' "${BODY_FILE}")
            [ "${n}" -gt 0 ] || break                       # TRAP 1: empty page = end of current events
            jq -c '.data[]' "${BODY_FILE}"                  # NDJSON to stdout for the SIEM shipper
            events=$((events + n))
            offset=$(jq -r '.next_page.offset // "" | @uri' "${BODY_FILE}")
            [ -n "${offset}" ] || break
            if [ "${pages}" -ge 5000 ]; then echo "PRECONDITION: audit log paging exceeded 5000 pages" >&2; exit 2; fi
          done

"4.2":
  api:
    lang: "bash"
    filename: "hth-asana-4.02-audit-security-setting-changes.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/asana/api/hth-asana-4.02-audit-security-setting-changes.sh"
    excerpts:
      security-setting-drift:
        content: |2
          # A change that turns a control in this guide OFF or open. Any one is a finding.
          WEAKENING="workspace_require_two_factor_auth_disabled
          workspace_ip_allowlist_disabled
          workspace_ip_allowlist_api_traffic_disabled
          workspace_view_links_enabled
          workspace_logged_out_view_authentication_required_disabled
          workspace_form_link_authentication_required_disabled
          workspace_personal_access_token_enabled
          workspace_mobile_app_biometric_authentication_required_disabled
          workspace_mobile_app_screen_capture_enabled
          workspace_mobile_app_copy_paste_enabled
          workspace_mobile_app_attachments_sharing_enabled"
          # A change to a control whose direction the event does not state. Each one is
          # listed for the weekly review against the recorded baseline.
          CHANGED="workspace_saml_settings_changed
          workspace_saml_url_changed
          workspace_required_sso_provider_settings_changed
          workspace_password_requirements_changed
          workspace_default_session_duration_changed
          workspace_idle_session_duration_changed
          workspace_allowed_ip_range_added
          workspace_allowed_ip_range_changed
          workspace_ip_allowlist_member_type_changed
          workspace_require_app_approvals_of_type_changed
          workspace_app_admin_approval_setting_changed
          workspace_guest_invite_permissions_changed
          workspace_trusted_domains_setting_changed
          workspace_file_attachment_options_changed
          workspace_machine_learning_product_feature_changed
          workspace_personal_access_token_expiry_changed
          workspace_service_account_token_expiry_changed
          user_workspace_admin_role_changed
          custom_role_created
          role_permission_changed"
          
          echo "Asana 4.2 — security setting changes, ${LOOKBACK_DAYS} days from ${START_AT} (changes, not state: TRAP 1)"
          # TRAP 4. The feed must hold at least one event of any type in the window.
          asana_get "/workspaces/${ASANA_WORKSPACE_GID}/audit_log_events?start_at=${START_AT}&limit=1"
          if [ "$(jq '.data | length' "${BODY_FILE}")" -eq 0 ]; then
            echo "PRECONDITION: the audit feed returned 0 events of any type for the window; an absence of setting changes is not evidence (TRAP 4)." >&2
            echo "  Widen ASANA_LOOKBACK_DAYS, or check that the token belongs to this organization." >&2
            exit 2
          fi
          echo "  audit feed live: at least one event in the window"
          queried=0
          for t in ${WEAKENING}; do
            events_of "${t}"; queried=$((queried + 1))
            n=$(jq -s 'length' "${ITEMS_FILE}")
            if [ "${n}" -gt 0 ]; then show "FINDING"; FINDINGS=$((FINDINGS + n)); fi
          done
          for t in ${CHANGED}; do
            events_of "${t}"; queried=$((queried + 1))
            n=$(jq -s 'length' "${ITEMS_FILE}")
            if [ "${n}" -gt 0 ]; then show "REVIEW"; REVIEW=$((REVIEW + n)); fi
          done
          events_of "user_login_failed"; queried=$((queried + 1))
          failures=$(jq -s 'length' "${ITEMS_FILE}")
          echo "  user_login_failed in window: ${failures}"
          if [ -n "${ASANA_LOGIN_FAILURE_THRESHOLD:-}" ] && [ "${failures}" -gt "${ASANA_LOGIN_FAILURE_THRESHOLD}" ]; then
            echo "FINDING: ${failures} failed logins exceeds ASANA_LOGIN_FAILURE_THRESHOLD=${ASANA_LOGIN_FAILURE_THRESHOLD}"
            FINDINGS=$((FINDINGS + 1))
          fi
          echo "  event types queried: ${queried} (HTTP 200 on every page); weakening: ${FINDINGS}; for review: ${REVIEW}"

