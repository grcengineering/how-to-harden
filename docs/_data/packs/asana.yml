          UNEVALUATED='def known: (.base_role_type // "") as $b | ["guest", "member", "admin", "super_admin"] | any(. == $b);
                       def judged: .base_role_type == "member" or .base_role_type == "guest";
                       select((known | not) or (judged and .permissions.export_project_data == null))'
          jq -r "${UNEVALUATED}"' | "INCONCLUSIVE: role \"\(.name)\" (base \(.base_role_type // "unreported")) was not evaluated: no export_project_data value, or an unknown base type."' "${ITEMS_FILE}"
          unevaluated=$(jq -s "[.[] | ${UNEVALUATED}] | length" "${ITEMS_FILE}")

