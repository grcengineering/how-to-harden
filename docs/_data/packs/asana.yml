"2.1":
  api:
    lang: "bash"
    filename: "hth-asana-2.01-audit-admin-roles.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/asana/api/hth-asana-2.01-audit-admin-roles.sh"
    excerpts:
      admin-roster-audit:
        content: |2
          audit_admins() {
            asana_paginate "/workspaces/${ASANA_WORKSPACE_GID}/workspace_memberships" \
                           "opt_fields=user.name,is_active,is_admin,is_guest&limit=100"
            local scanned count
            scanned=$(jq -s 'length' "${ITEMS_FILE}")
            if [ "${scanned}" -eq 0 ]; then
              echo "PRECONDITION: the workspace returned zero memberships; nothing was audited" >&2; exit 2
            fi
            count=$(jq -s '[.[] | select(.is_active == true and .is_admin == true)] | length' "${ITEMS_FILE}")
            echo "Asana 2.1 — admin roster"
            echo "  memberships scanned: ${scanned}"
            echo "  active admins (is_admin, TRAP 1): ${count} (ceiling ${MAX_ADMINS})"
            jq -r 'select(.is_active == true and .is_admin == true)
                   | "    - \(.user.name // "(no name)") …\((.user.gid // "") | .[-6:])"' "${ITEMS_FILE}"
            if [ "${count}" -gt "${MAX_ADMINS}" ]; then
              echo "FINDING: ${count} active admins exceeds the ceiling of ${MAX_ADMINS}."
              FINDINGS=$((FINDINGS + 1))
            fi
          }
      role-escalation-audit:
        content: |2
          audit_roles() {
            asana_paginate "/roles" \
              "workspace=${ASANA_WORKSPACE_GID}&opt_fields=name,is_standard_role,base_role_type,permissions.manage_roles,permissions.assign_roles&limit=100"
            local scanned escalating
            scanned=$(jq -s 'length' "${ITEMS_FILE}")
            if [ "${scanned}" -eq 0 ]; then
              echo "PRECONDITION: GET /roles returned zero roles; RBAC was not evaluated." >&2
              echo "  Re-run with ASANA_SKIP_ROLES=1 to audit the admin roster alone." >&2
              exit 2
            fi
            echo "  roles scanned: ${scanned} (custom: $(jq -s '[.[] | select(.is_standard_role == false)] | length' "${ITEMS_FILE}"))"
            jq -r 'select(.is_standard_role == false and ((.base_role_type // "") | test("admin")))
                   | "    review: custom role \"\(.name)\" is built on base_role_type=\(.base_role_type)"' "${ITEMS_FILE}"
            # TRAP 3. A member- or guest-based role that can create or assign roles.
            escalating=$(jq -s '[.[] | select(((.base_role_type // "") == "member" or (.base_role_type // "") == "guest")
                                              and ((.permissions.manage_roles // false) or (.permissions.assign_roles // false)))] | length' "${ITEMS_FILE}")
            if [ "${escalating}" -gt 0 ]; then
              jq -r 'select(((.base_role_type // "") == "member" or (.base_role_type // "") == "guest")
                            and ((.permissions.manage_roles // false) or (.permissions.assign_roles // false)))
                     | "FINDING: role \"\(.name)\" (base \(.base_role_type)) has manage_roles=\(.permissions.manage_roles | if . == null then "unreported" else tostring end) assign_roles=\(.permissions.assign_roles | if . == null then "unreported" else tostring end), a path to admin outside the roster."' "${ITEMS_FILE}"
              FINDINGS=$((FINDINGS + escalating))
            fi
            # Roles that could not be judged: unknown base type, or either value unreported.
            local unjudged='def known: (.base_role_type // "") as $b | ["guest", "member", "admin", "super_admin"] | any(. == $b);
                            def judged: .base_role_type == "member" or .base_role_type == "guest";
                            select((known | not) or (judged and (.permissions.manage_roles == null or .permissions.assign_roles == null)))'
            jq -r "${unjudged}"' | "INCONCLUSIVE: role \"\(.name)\" (base \(.base_role_type // "unreported")) was not evaluated: manage_roles or assign_roles is unreported, or the base type is unknown."' "${ITEMS_FILE}"
            UNEVALUATED=$(jq -s "[.[] | ${unjudged}] | length" "${ITEMS_FILE}")
          }

"2.2":
  api:
    lang: "bash"
    filename: "hth-asana-2.02-audit-email-domains.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/asana/api/hth-asana-2.02-audit-email-domains.sh"
    excerpts:
      email-domain-audit:
        content: |2
          asana_get "/workspaces/${ASANA_WORKSPACE_GID}?opt_fields=name,is_organization,email_domains"
          if ! jq -e '.data | type == "object"' "${BODY_FILE}" >/dev/null 2>&1; then
            echo "PRECONDITION: workspace response carries no data object" >&2; exit 2
          fi
          
          echo "Asana 2.2 — organization email domains"
          echo "  is_organization: $(jq -r '.data.is_organization // false' "${BODY_FILE}")"
          if [ "$(jq -r '.data.is_organization // false' "${BODY_FILE}")" != "true" ]; then
            echo "FINDING: this gid is a workspace, not an organization; domain-based membership cannot be governed (TRAP 2)."
            FINDINGS=$((FINDINGS + 1))
          fi
          
          # Normalise both sides: lower-case, trimmed, de-duplicated.
          live=$(jq -c '[.data.email_domains // [] | .[] | ascii_downcase] | unique' "${BODY_FILE}")
          approved=$(jq -nc --arg a "${ASANA_APPROVED_EMAIL_DOMAINS}" \
            '[$a | split(",")[] | gsub("^\\s+|\\s+$"; "") | ascii_downcase | select(length > 0)] | unique')
          if [ "$(jq -n --argjson a "${approved}" '$a | length')" -eq 0 ]; then
            echo "PRECONDITION: ASANA_APPROVED_EMAIL_DOMAINS holds no domains (TRAP 3)" >&2; exit 2
          fi
          echo "  live email_domains:     $(jq -nr --argjson l "${live}" '$l | join(", ")')"
          echo "  approved email_domains: $(jq -nr --argjson a "${approved}" '$a | join(", ")')"
          
          unexpected=$(jq -nc --argjson l "${live}" --argjson a "${approved}" '$l - $a')
          missing=$(jq -nc --argjson l "${live}" --argjson a "${approved}" '$a - $l')
          if [ "$(jq -n --argjson u "${unexpected}" '$u | length')" -gt 0 ]; then
            echo "FINDING: domains associated with the organization but not approved: $(jq -nr --argjson u "${unexpected}" '$u | join(", ")')"
            FINDINGS=$((FINDINGS + 1))
          fi
          if [ "$(jq -n --argjson m "${missing}" '$m | length')" -gt 0 ]; then
            echo "FINDING: approved domains not associated with the organization (accounts on them sit outside central control): $(jq -nr --argjson m "${missing}" '$m | join(", ")')"
            FINDINGS=$((FINDINGS + 1))
          fi

"2.3":
  api:
    lang: "bash"
    filename: "hth-asana-2.03-audit-scim-users.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/asana/api/hth-asana-2.03-audit-scim-users.sh"
    excerpts:
      scim-orphan-reconciliation:
        content: |2
          scim_get "/Users"
          if ! jq -e '(.Resources | type == "array") and (.totalResults | type == "number")' "${BODY_FILE}" >/dev/null 2>&1; then
            echo "PRECONDITION: /Users is not a SCIM ListResponse (no Resources array or totalResults)" >&2; exit 2
          fi
          total=$(jq '.totalResults' "${BODY_FILE}")
          returned=$(jq '.Resources | length' "${BODY_FILE}")
          if [ "${total}" -eq 0 ] || [ "${returned}" -eq 0 ]; then
            echo "PRECONDITION: SCIM /Users returned no users; nothing was reconciled (TRAP 3)" >&2; exit 2
          fi
          if [ "${total}" -gt "${returned}" ]; then
            echo "PRECONDITION: SCIM returned ${returned} of ${total} users; refusing to reconcile a partial list (TRAP 3)" >&2; exit 2
          fi
          
          # Lower-cased userName of every user SCIM reports as active.
          asana_active=$(jq -c '[.Resources[] | select(.active == true) | .userName // empty | ascii_downcase] | unique' "${BODY_FILE}")
          idp_active=$(jq -Rsc '[split("\n")[] | gsub("^\\s+|\\s+$"; "") | ascii_downcase | select(length > 0)] | unique' "${ASANA_IDP_ACTIVE_USERS_FILE}")
          if [ "$(jq -n --argjson i "${idp_active}" '$i | length')" -eq 0 ]; then
            echo "PRECONDITION: ASANA_IDP_ACTIVE_USERS_FILE lists no users" >&2; exit 2
          fi
          
          echo "Asana 2.3 — SCIM user reconciliation (members only; guests are not returned, TRAP 2)"
          echo "  SCIM users: ${total} (active $(jq '[.Resources[] | select(.active == true)] | length' "${BODY_FILE}"), deprovisioned $(jq '[.Resources[] | select(.active != true)] | length' "${BODY_FILE}"))"
          echo "  IdP active users: $(jq -n --argjson i "${idp_active}" '$i | length')"
          
          orphans=$(jq -nc --argjson a "${asana_active}" --argjson i "${idp_active}" '$a - $i')
          unprovisioned=$(jq -nc --argjson a "${asana_active}" --argjson i "${idp_active}" '$i - $a')
          if [ "$(jq -n --argjson o "${orphans}" '$o | length')" -gt 0 ]; then
            echo "FINDING: active in Asana but not active in the IdP (orphaned, TRAP 1):"
            jq -nr --argjson o "${orphans}" '$o[] | "    - \(.)"'
            FINDINGS=$((FINDINGS + 1))
          fi
          if [ "$(jq -n --argjson u "${unprovisioned}" '$u | length')" -gt 0 ]; then
            echo "  info: $(jq -n --argjson u "${unprovisioned}" '$u | length') IdP-active users have no active Asana account (not assigned the app, or pending)."
          fi

