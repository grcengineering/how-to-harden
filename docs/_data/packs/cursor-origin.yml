"3.4":
  terraform:
    lang: "hcl"
    filename: "hth-cursor-origin-3.04-inbound-ip-allowlist.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor-origin/terraform/hth-cursor-origin-3.04-inbound-ip-allowlist.tf"
    excerpts:
      origin-inbound-ip-allowlist:
        content: |2
          # Management and enforcement default OFF. Import/review existing ownership first.
          # Never combine these per-entry resources with the whole-set resource
          # cursor_origin_inbound_ip_allowlist_entries for this namespace: it removes
          # entries not listed in its configuration. The API's caller-address checks do
          # not protect every caller. Prove independent recovery access before enforcement.
          data "cursor_origin_inbound_ip_allowlist_entries" "hth_observed" {
            count     = var.hth_read_ip_posture || var.hth_manage_ip_allowlist ? 1 : 0
            namespace = var.hth_origin_owner
          }
          
          resource "cursor_origin_inbound_ip_allowlist_entry" "hth_egress" {
            for_each = var.hth_manage_ip_allowlist ? var.hth_origin_egress_cidrs : {}
          
            namespace           = var.hth_origin_owner
            cidr                = each.key
            description         = each.value
            enabled             = true
            deletion_protection = true
          
            lifecycle {
              prevent_destroy = true
            }
          }
          
          resource "cursor_origin_inbound_ip_allowlist" "hth_namespace" {
            count = var.hth_manage_ip_allowlist && var.hth_enforce_ip_allowlist ? 1 : 0
          
            namespace           = var.hth_origin_owner
            enabled             = true
            deletion_protection = true
            depends_on          = [cursor_origin_inbound_ip_allowlist_entry.hth_egress]
          
            lifecycle {
              prevent_destroy = true
              precondition {
                condition     = length(var.hth_origin_egress_cidrs) > 0 && var.hth_recovery_access_tested
                error_message = "Do not enforce until required caller egress is admitted and an independent recovery path is proven."
              }
            }
          }
          
          output "hth_origin_ip_allowlist_observed" {
            sensitive = true
            value     = data.cursor_origin_inbound_ip_allowlist_entries.hth_observed
          }
          # The data-source read observes posture; it is not a simulated caller reachability
          # test. Enforcement requires enabled=true AND at least one enabled entry. A
          # protected flag's destruction would disable enforcement; guards intentionally
          # block it. CIDR edits keep the entry ID but can still lock other callers out.
          # No disabled-flag resource is created by default; selecting only entry management
          # must not turn off a namespace's existing enforcement.
          # Provider 0.8.0 neither exposes nor reads the API's trustAppDeclaredIps setting.
          # This output cannot assess that exception. Review it through the current native
          # API before enforcement; this example does not change an existing trust setting.
          # Native reference: https://cursor.com/docs/api/origin#inbound-ip-allowlist

"3.5":
  terraform:
    lang: "hcl"
    filename: "hth-cursor-origin-3.05-ssh-certificate-policy.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/cursor-origin/terraform/hth-cursor-origin-3.05-ssh-certificate-policy.tf"
    excerpts:
      origin-ssh-certificate-policy:
        content: |2
          # All writes default OFF. Import existing authorities/requirement before adopting
          # them. Never supply a private key. Native deletion_protection and Terraform
          # prevent_destroy intentionally block casual replacement and removal.
          data "cursor_origin_ssh_certificate_authorities" "hth_observed" {
            count     = var.hth_read_ssh_posture || var.hth_manage_ssh_ca || var.hth_require_ssh_certificates ? 1 : 0
            namespace = var.hth_origin_owner
          }
          
          resource "cursor_origin_ssh_certificate_authority" "hth_reviewed" {
            count = var.hth_manage_ssh_ca ? 1 : 0
          
            namespace           = var.hth_origin_owner
            name                = var.hth_ssh_ca_name
            public_key          = var.hth_ssh_ca_public_key
            deletion_protection = true
          
            lifecycle {
              prevent_destroy       = true
              create_before_destroy = true
              precondition {
                condition     = length(trimspace(var.hth_ssh_ca_public_key)) > 0 && !strcontains(var.hth_ssh_ca_public_key, "PRIVATE KEY")
                error_message = "Supply and independently verify the organization's approved CA public key, never a private key."
              }
            }
          }
          
          resource "cursor_origin_ssh_certificate_requirement" "hth_namespace" {
            count = var.hth_require_ssh_certificates ? 1 : 0
          
            namespace            = var.hth_origin_owner
            require_certificates = true
            deletion_protection  = true
            depends_on           = [cursor_origin_ssh_certificate_authority.hth_reviewed]
          
            lifecycle {
              prevent_destroy = true
              precondition {
                condition     = var.hth_manage_ssh_ca && var.hth_recovery_access_tested
                error_message = "Manage/import the verified CA and prove independent recovery access before requiring certificates."
              }
            }
          }
          
          output "hth_origin_ssh_authorities_observed" {
            sensitive = true
            value     = data.cursor_origin_ssh_certificate_authorities.hth_observed
          }
          # Requiring certificates refuses user-registered SSH keys and user API keys over
          # HTTPS. It does not prove every application credential path is revoked.
          # The CA API has no update/rename. Key/namespace changes replace the authority;
          # removing it invalidates its issued certificates. Stage overlapping authorities
          # during an approved rotation; create_before_destroy cannot override these
          # deletion guards. The final authority cannot be removed while required.

