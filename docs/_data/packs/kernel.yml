            name = "production"
          }
          
          resource "kernel_project" "staging" {
            name = "staging"
          }

"2.2":
  api:
    lang: "bash"
    filename: "hth-kernel-2.02-concurrency-limits.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/api/hth-kernel-2.02-concurrency-limits.sh"
    excerpts:
      org-default-cap:
        content: |2
          # Set the org-wide DEFAULT per-project concurrency cap. Applies to every
          # project without an explicit override; cannot exceed the org's own limit.
          # Setting the value to 0 REMOVES the default — treat 0 as a reviewed exception.
          curl -sS -X PATCH https://api.onkernel.com/org/limits \
            -H "Authorization: Bearer ${KERNEL_ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            -d '{ "default_project_max_concurrent_sessions": 10 }'
          
          # Read back the effective org posture:
          #   max_concurrent_sessions            — org ceiling (on-demand + pool reservations)
          #   default_project_max_concurrent_sessions — the default cap you just set
          curl -sS https://api.onkernel.com/org/limits \
            -H "Authorization: Bearer ${KERNEL_ADMIN_KEY}"
      per-project-override:
        content: |2
          # Explicit override for a hot project. Omitted fields are left unchanged;
          # a field set to 0 removes that project-level cap (org default applies).
          curl -sS -X PATCH "https://api.onkernel.com/org/projects/proj_production_a1b2/limits" \
            -H "Authorization: Bearer ${KERNEL_ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            -d '{ "max_concurrent_sessions": 25 }'
          
          # Verify: null values mean no project-level cap (org limit applies).
          curl -sS "https://api.onkernel.com/org/projects/proj_production_a1b2/limits" \
            -H "Authorization: Bearer ${KERNEL_ADMIN_KEY}"

"3.1":
  cli:
    lang: "bash"
    filename: "hth-kernel-3.01-secrets-deploy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/cli/hth-kernel-3.01-secrets-deploy.sh"
    excerpts:
      deploy-with-secrets:
        content: |2
          # Individual values (from your secret manager, via the shell environment):
          kernel deploy my_app.ts --env OPENAI_API_KEY="${OPENAI_API_KEY}"
          
          # Or load a local .env file that is excluded from version control:
          kernel deploy my_app.ts --env-file .env
          
          # App code reads injected values at runtime via the standard environment:
          #   TypeScript: process.env.OPENAI_API_KEY
          #   Python:     os.environ["OPENAI_API_KEY"]
      repo-hygiene-check:
        content: |2
          # Guard the choke point: .env must never be committed, and app source
          # must not embed key material.
          grep -qxF '.env' .gitignore || echo 'MISSING: add .env to .gitignore'
          git grep -nE '(sk-[A-Za-z0-9]|api[_-]?key\s*=\s*["'"'"'][^"'"'"']{8,})' -- '*.ts' '*.py' \
            && echo 'FAIL: possible hardcoded secrets above' || echo 'OK: no hardcoded secrets found'

"3.2":
  sdk:
    lang: "javascript"
    filename: "hth-kernel-3.02-credential-hygiene.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/sdk/hth-kernel-3.02-credential-hygiene.js"
    excerpts:
      create-credential-deliberately:
        content: |2
          // Pre-store a credential for headless automation. Values are encrypted with
          // per-organization keys and are WRITE-ONLY: they cannot be read back via the
          // API after creation. One-time codes (SMS/TOTP codes) are never saved;
          // totp_secret enables automatic TOTP generation for 2FA logins.
          // Keep ONE credential per account — never share a credential across accounts.
          await kernel.credentials.create({
            name: 'crm-agent-login',        // unique within the project
            domain: 'crm.example.com',      // target domain this credential is for
            values: {
              username: 'agent-svc@example.com',
              password: process.env.CRM_AGENT_PASSWORD, // from your secret manager
            },
            totp_secret: process.env.CRM_AGENT_TOTP_SECRET, // base32, optional
          });
      disable-automatic-capture:
        content: |2
          // Hosted UI / programmatic login flows SAVE credentials by default.
          // Where automatic capture is not an accepted, documented need for the
          // account, opt out on the flow configuration:
          const flow = {
            save_credentials: false,
          };
      offboard-credential:
        content: |2
          // Decommission: deleting a credential unlinks it from associated
          // connections, so they can no longer auto-authenticate.
          await fetch('https://api.onkernel.com/credentials/crm-agent-login', {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${process.env.KERNEL_API_KEY}` },
          });

"3.4":
  sdk:
    lang: "javascript"
    filename: "hth-kernel-3.04-profile-hygiene.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/sdk/hth-kernel-3.04-profile-hygiene.js"
    excerpts:
      single-writer-discipline:
        content: |2
          // Profiles persist cookies + local storage — live session tokens.
          // Create the profile once, and give WRITE access (save_changes: true)
          // to exactly one designated refresher workload. Saves replace the whole
          // profile, and the browser that ends last overwrites the profile — so
          // concurrent writers silently clobber each other.
          await kernel.profiles.create({ name: 'crm-agent' });
          
          // The ONE designated writer session:
          const writer = await kernel.browsers.create({
            profile: { name: 'crm-agent', save_changes: true },
          });
          // NOTE: state persists when the browser is deleted or times out;
          // browser.close() does NOT save profile state.
      read-only-consumers:
        content: |2
          // Every other consumer loads the profile WITHOUT save_changes: state from
          // untrusted browsing is discarded, never persisted into the trusted profile.
          const reader = await kernel.browsers.create({
            profile: { name: 'crm-agent' },
          });
          
          // Browser pools enforce this for you: pooled browsers load their profile
          // read-only — any save_changes is ignored (not rejected), so pooled
          // browsers never write back to the profile.

"4.1":
  terraform:
    lang: "hcl"
    filename: "hth-kernel-4.01-chrome-policies.tf"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/terraform/hth-kernel-4.01-chrome-policies.tf"
    excerpts:
      hardened-pool-policy:
        content: |2
          # Pool-level policy applies to EVERY browser in the pool — the hardened
          # configuration becomes the fleet default, not a per-callsite opt-in.
          # chrome_policy is a JSON object of Chrome enterprise policies (max 5 MiB);
          # Kernel-managed areas (extensions, proxy, CDP/automation) are rejected.
          resource "kernel_browser_pool" "hardened_agents" {
            name    = "hardened-agents"
            size    = 5
            stealth = true
          
            chrome_policy = jsonencode({
              # Contain prompt-injection-driven navigation: allow only the domains
              # this workload legitimately needs; more specific entries win.
              URLAllowlist = [
                "crm.example.com",
                "docs.example.com",
              ]
          
              # Kernel's documented security example: block in-browser inspection
              # surfaces (cookies, storage, network internals).
              URLBlocklist = [
                "devtools://*",
                "chrome://inspect",
                "view-source:*",
                "*", # everything not on the allowlist
              ]
            })
          
            # Roll the new policy onto idle browsers when this config changes;
            # warming/leased browsers are not rebuilt.
            rebuild_idle_browsers_on_update = true
          }

"4.2":
  cli:
    lang: "bash"
    filename: "hth-kernel-4.02-extension-vetting.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/cli/hth-kernel-4.02-extension-vetting.sh"
    excerpts:
      vet-and-upload:
        content: |2
          # 1. Fetch the exact unpacked artifact for review (Web Store source):
          kernel extensions download-web-store \
            "https://chromewebstore.google.com/detail/EXTENSION_ID" --to ./candidate-extension
          
          # 2. REVIEW ./candidate-extension: manifest permissions, code provenance.
          #    Only after review, register the artifact you vetted:
          kernel extensions upload ./candidate-extension --name approved-ext-v1
          
          # 3. Record its checksum in your approval log. Metadata includes a
          #    lowercase hex SHA-256 checksum when available.
          curl -sS "https://api.onkernel.com/extensions/approved-ext-v1/metadata" \
            -H "Authorization: Bearer ${KERNEL_API_KEY}"
      reconcile-fleet:
        content: |2
          # Cadence check: enumerate extensions in the project and reconcile each
          # checksum against the approval record.
          curl -sS "https://api.onkernel.com/extensions" \
            -H "Authorization: Bearer ${KERNEL_API_KEY}"
          
          # Load extensions into browsers BY NAME so what runs is what you vetted:
          kernel browsers create --extension approved-ext-v1

"4.3":
  api:
    lang: "bash"
    filename: "hth-kernel-4.03-managed-proxy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/api/hth-kernel-4.03-managed-proxy.sh"
    excerpts:
      create-inspecting-proxy:
        content: |2
          # Register your inspecting proxy. Credentials are WRITE-ONLY: responses
          # report has_password: true but never return the value. A ca_bundle
          # (PEM) marks a TLS-terminating proxy — Kernel validates the bundle and
          # installs it in the browser trust store. CA-bundle proxies must be bound
          # at browser creation; they cannot be hot-swapped onto a running browser.
          curl -sS -X POST https://api.onkernel.com/proxies \
            -H "Authorization: Bearer ${KERNEL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "type": "custom",
            "name": "egress-inspection",
            "protocol": "https",
            "config": {
              "host": "proxy.internal.example.com",
              "port": 8443,
              "username": "kernel-fleet",
              "password": "${PROXY_PASSWORD}",
              "ca_bundle": "$(awk 'BEGIN{ORS="\\n"} {print}' ./inspection-ca.pem)"
            },
            "bypass_hosts": []
          }
          EOF
          # Keep bypass_hosts EMPTY (or minimal and reviewed): every entry is
          # egress your inspection layer never sees. Max 100 entries.
      verify-proxy-health:
        content: |2
          # Health-check from the proxy's exit, optionally against a specific target.
          curl -sS -X POST "https://api.onkernel.com/proxies/PROXY_ID/check" \
            -H "Authorization: Bearer ${KERNEL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{ "url": "https://crm.example.com" }'

"4.5":
  cli:
    lang: "bash"
    filename: "hth-kernel-4.05-web-bot-auth.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/cli/hth-kernel-4.05-web-bot-auth.sh"
    excerpts:
      build-signing-extension:
        content: |2
          # Prerequisites (per the Web Bot Auth doc):
          #   1. An Ed25519 JWK file containing the public (x) AND private (d)
          #      components — guard the private component like a signing CA key.
          #   2. Your public keys published in JWKS form at:
          #      https://yourdomain.com/.well-known/http-message-signatures-directory
          #
          # Build the signing extension. Signed requests carry RFC 9421 headers:
          # Signature, Signature-Input, and Signature-Agent (your key directory URL).
          kernel extensions build-web-bot-auth \
            --key ./my-key.jwk \
            --signature-agent https://yourdomain.com
          
          # Attach the signing extension to fleet browsers:
          kernel browsers create --extension my-web-bot-auth
          # Services like Cloudflare and Vercel verify these signatures against your
          # published public key, confirming the request came from YOUR agent.

"5.1":
  cli:
    lang: "bash"
    filename: "hth-kernel-5.01-audit-log-review.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/cli/hth-kernel-5.01-audit-log-review.sh"
    excerpts:
      weekly-write-path-review:
        content: |2
          # Search windows are capped at 30 days. GET requests are excluded by
          # default (add --include-get to reverse). Anchor the weekly review on
          # write-path surfaces: keys, projects, proxies, profiles, credentials.
          for surface in /org/api_keys /org/projects /proxies /profiles /auth/connections; do
            kernel audit-logs search \
              --start "$(date -v-7d +%F 2>/dev/null || date -d '7 days ago' +%F)" \
              --end   "$(date +%F)" \
              --search "${surface}" \
              --limit 500 \
              --output json
          done
          
          # --search also matches user IDs, emails, IPs, and status codes:
          kernel audit-logs search \
            --start "$(date -v-7d +%F 2>/dev/null || date -d '7 days ago' +%F)" \
            --end "$(date +%F)" \
            --search 403 --output json
      archival-download:
        content: |2
          # Bulk export for archival/forensics: compressed JSONL, downloaded in
          # batches of up to 50,000 records with per-batch SHA-256 verification.
          kernel audit-logs download \
            --start "$(date -v-30d +%F 2>/dev/null || date -d '30 days ago' +%F)" \
            --end   "$(date +%F)" \
            --to "audit-$(date +%F).jsonl.gz"

"5.2":
  cli:
    lang: "bash"
    filename: "hth-kernel-5.02-audit-export-s3.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/cli/hth-kernel-5.02-audit-export-s3.sh"
    excerpts:
      create-export-destination:
        content: |2
          # 1. Create the destination — it starts PAUSED by design.
          kernel audit-logs export create \
            --region us-east-1 \
            --bucket customer-audit-logs \
            --prefix kernel/audit \
            --role-arn arn:aws:iam::123456789012:role/kernel-audit-export
          
          # 2. The response returns kernel_role_arn and external_id. Update YOUR
          #    IAM role's trust policy to allow that kernel_role_arn to assume it,
          #    WITH the sts:ExternalId condition set to the returned external_id —
          #    the documented defense against confused-deputy access to your bucket.
          #    Grant the role S3 write (and KMS, if the bucket is KMS-encrypted).
      test-then-activate:
        content: |2
          # 3. Test BEFORE activating: Kernel assumes the configured role and
          #    uploads a probe object with the same request metadata as a real delivery.
          kernel audit-logs export test dest_01example
          
          # 4. Activate once the test passes; delivery writes partitioned jsonl.gz
          #    objects under .../date=YYYY-MM-DD/hour=HH/ prefixes.
          kernel audit-logs export resume dest_01example
          
          # Operate: list, inspect, pause, or remove destinations.
          kernel audit-logs export list
          kernel audit-logs export get dest_01example

"5.3":
  sdk:
    lang: "javascript"
    filename: "hth-kernel-5.03-telemetry.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/kernel/sdk/hth-kernel-5.03-telemetry.js"
    excerpts:
      default-telemetry-baseline:
        content: |2
          // Default set (control, connection, system, captcha) is lightweight —
          // enable it broadly as the fleet baseline.
          const browser = await kernel.browsers.create({
            telemetry: { enabled: true },
          });
      deep-capture-high-risk:
        content: |2
          // High-risk automations (sensitive targets, authenticated sessions):
          // add per-category browser telemetry — console + network show what the
          // page actually did, not just what the agent intended.
          const sensitive = await kernel.browsers.create({
            telemetry: {
              browser: {
                console: { enabled: true },
                network: { enabled: true },
              },
            },
          });
          // Events stream live (SDK/CLI/SSE) or can be read back after the fact.
          // SKIP deep capture and replays for ZDR-scoped workloads (Control 4.4).
      replay-evidence:
        content: |2
          // Replays are explicit MP4 recordings — start before the sensitive
          // workflow, stop after, and archive the download with your case record.
          // Retention is plan-gated (7d Hobbyist / 30d Start-Up / custom Enterprise).
          const replay = await kernel.browsers.replays.start(sensitive.session_id);
          // ... agent workflow runs ...
          await kernel.browsers.replays.stop(replay.replay_id, { id: sensitive.session_id });
          const video = await kernel.browsers.replays.download(replay.replay_id, {
            id: sensitive.session_id,
          });
          // Each replay also carries a replay_view_url for interactive review.

