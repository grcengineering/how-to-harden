"4.1":
  sdk:
    lang: "javascript"
    filename: "hth-openai-api-4.01-reviewed-hosted-session.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/openai-api/sdk/hth-openai-api-4.01-reviewed-hosted-session.js"
    excerpts:
      reviewed-hosted-session:
        content: |2
          export function buildReviewedSession({ model, input, allowedDomains = [] }) {
            if (!model || !input) throw new Error("Choose an approved model and explicit task input");
            if (allowedDomains.length > 100 || allowedDomains.some((host) =>
              typeof host !== "string" || !/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9-]+$/i.test(host)
            )) throw new Error("Use at most 100 exact DNS hosts, with no wildcard, URL, path, or port");
            return {
              agent: { model },
              environment: {
                type: "openai_hosted",
                network: allowedDomains.length
                  ? { access: "restricted", allowed_domains: [...new Set(allowedDomains)] }
                  : { access: "disabled" },
              },
              review: "auto_review",
              input,
            };
          }
          // Explicit integration entry point: caller supplies the official OpenAI client.
          // Creating a real session starts work and may incur charges; review the payload first.
          export async function executeReviewedSession(client, options) {
            return client.beta.agents.sessions.create(buildReviewedSession(options));
          }

"4.2":
  sdk:
    lang: "javascript"
    filename: "hth-openai-api-4.02-restrict-mcp.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/openai-api/sdk/hth-openai-api-4.02-restrict-mcp.js"
    excerpts:
      restrict-mcp:
        content: |2
          export function buildRestrictedMcp({ serverLabel, serverUrl, allowedTools }) {
            const url = new URL(serverUrl);
            if (url.protocol !== "https:" || url.username || url.password || url.hash || url.search) {
              throw new Error("Use a reviewed HTTPS endpoint without embedded credentials, query, or fragment");
            }
            if (!serverLabel || !Array.isArray(allowedTools) || !allowedTools.length ||
                allowedTools.some((name) => typeof name !== "string" || !name || name.includes("*"))) {
              throw new Error("Provide a label and nonempty exact tool allowlist");
            }
            return {
              type: "mcp",
              server_label: serverLabel,
              transport: { type: "http", server_url: url.href },
              connection_origin: "service",
              allowed_tools: [...new Set(allowedTools)],
              required: true,
            };
          }
          // Add the returned tool to a reviewed session's agent.tools. Attach approved
          // vault_ids separately; a vault's credentials match the server URL. Hosted
          // sandbox network restrictions do not constrain this service-origin MCP path.

"5.1":
  sdk:
    lang: "javascript"
    filename: "hth-openai-api-5.01-verify-webhooks.js"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/openai-api/sdk/hth-openai-api-5.01-verify-webhooks.js"
    excerpts:
      verify-webhooks:
        content: |2
          export function createWebhookReceiver({ client, enqueueOnce, eventTypes = ["response.completed"] }) {
            if (typeof enqueueOnce !== "function") throw new Error("Supply a durable atomic enqueueOnce adapter");
            const accepted = new Set(eventTypes);
            return async function receive(request) {
              if (request.method !== "POST") return new Response(null, { status: 405 });
              // The SDK reports missing headers as a generic Error; reject them before
              // verification rather than converting unrelated SDK/configuration errors.
              if (["webhook-id", "webhook-timestamp", "webhook-signature"].some((name) => !request.headers.get(name))) {
                return new Response(null, { status: 400 });
              }
              const raw = await request.text(); // Preserve original text; do not JSON-parse first.
              let event;
              try {
                event = await client.webhooks.unwrap(raw, request.headers);
              } catch (error) {
                // InvalidWebhookSignatureError includes stale and mismatched signatures.
                if (error instanceof OpenAI.InvalidWebhookSignatureError || error instanceof SyntaxError) {
                  return new Response(null, { status: 400 });
                }
                throw error;
              }
              const deliveryId = request.headers.get("webhook-id");
              if (!deliveryId) return new Response(null, { status: 400 });
              if (!accepted.has(event.type)) return new Response(null, { status: 204 });
              try {
                // Transactionally enqueue and insert deliveryId under a unique key in
                // shared durable storage. A duplicate must be a successful no-op.
                await enqueueOnce(deliveryId, event);
              } catch {
                return new Response(null, { status: 503 }); // Let OpenAI retry; never acknowledge lost work.
              }
              return new Response(null, { status: 204 });
            };
          }
          // Construct the official client with webhookSecret. Do not disable its timestamp
          // tolerance, log raw payloads, or replace durable deduplication with a process Set.

