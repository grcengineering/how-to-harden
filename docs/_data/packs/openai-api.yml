          registration=$(openai_get "/organization/external_storage/${OPENAI_EXTERNAL_STORAGE_ID}" \
            -H "OpenAI-Organization: ${OPENAI_ORG_ID}")
          jq -ce --arg expected "$OPENAI_EXTERNAL_STORAGE_ID" '
