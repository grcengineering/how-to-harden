"4.4":
  api:
    lang: "bash"
    filename: "hth-devin-desktop-4.04-model-allowlist.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin-desktop/api/hth-devin-desktop-4.04-model-allowlist.sh"
    excerpts:
      model-allowlist:
        content: |2
          # Default plan mode performs NO request. Full-replacement PUT requires --apply.
          # Usage: bash this-file.sh approved.json snapshot.json [--apply]
          # approved.json contains exactly allowed_model_uids and allowed_model_tags arrays.
          # snapshot.json is the read-only pack's report, including the reviewed state's ETag.
          if [ "$#" -lt 2 ] || [ "$#" -gt 3 ] || { [ "$#" -eq 3 ] && [ "$3" != --apply ]; }; then
            echo 'usage: approved.json snapshot.json [--apply]' >&2; exit 2
          fi
          umask 077
          HTH_TMP=$(mktemp -d)
          trap 'rm -rf "$HTH_TMP"' EXIT
          python3 - "$1" "$2" "$HTH_TMP" <<'PY'
          import json, re, sys
          from pathlib import Path
          def unique(pairs):
              out = {}
              for k,v in pairs:
                  if k in out: raise ValueError('duplicate key')
                  out[k] = v
              return out
          try:
              desired = json.loads(Path(sys.argv[1]).read_text(), object_pairs_hook=unique)
              snapshot = json.loads(Path(sys.argv[2]).read_text(), object_pairs_hook=unique)
              keys = {'allowed_model_uids','allowed_model_tags'}
              if not isinstance(desired,dict) or set(desired) != keys:
                  raise ValueError()
              for k in keys:
                  if not isinstance(desired[k],list) or any(not isinstance(v,str) or not v or any(ord(c)<32 for c in v)
                                                          for v in desired[k]):
                      raise ValueError()
              if not any(desired[k] for k in keys):
                  raise ValueError()  # Avoid an ambiguous/locking empty selection in this pack.
              fingerprint = snapshot['credential_fingerprint']
              if not isinstance(fingerprint,str) or not re.fullmatch(r'[a-f0-9]{64}',fingerprint):
                  raise ValueError()
              etag = snapshot['etag']
              if not isinstance(etag,str) or not re.fullmatch(r'(?:W/)?"[\x21\x23-\x7e]+"',etag):
                  raise ValueError()
              Path(sys.argv[3], 'desired.json').write_text(json.dumps(desired))
              Path(sys.argv[3], 'etag').write_text(etag)
              Path(sys.argv[3], 'fingerprint').write_text(fingerprint)
              print(json.dumps({'operation':'replace model allowlist', 'desired':desired},indent=2))
          except (ValueError, KeyError, TypeError, OSError):
              print('UNKNOWN: invalid desired state/snapshot; nothing sent', file=sys.stderr)
              sys.exit(2)
          PY
          if [ "${3:-}" != --apply ]; then
            echo 'PLAN ONLY: no request sent. Review scope, desired models, and snapshot before --apply.'
            exit 0
          fi
          desktop_require_key
          python3 - "$HTH_TMP/fingerprint" <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          if hashlib.sha256(os.environ['DEVIN_API_KEY'].encode()).hexdigest() != Path(sys.argv[1]).read_text():
              print('UNKNOWN: snapshot was made with a different credential; nothing sent', file=sys.stderr)
              sys.exit(2)
          PY
          ETAG=$(cat "$HTH_TMP/etag")
          desktop_request PUT "$HTH_TMP/desired.json" "$ETAG"
          desktop_report > "$HTH_TMP/report.json"
          python3 - "$HTH_TMP/desired.json" "$HTH_TMP/report.json" <<'PY'
          import json, sys
          from pathlib import Path
          expected, observed = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          if any(set(expected[k]) != set(observed[k]) for k in ('allowed_model_uids','allowed_model_tags')):
              print('UNKNOWN: update response did not match desired lists; investigate before retrying', file=sys.stderr)
              sys.exit(2)
          print('PASS: API returned the requested stored allowlist. Verify a normal member model picker separately.')
          PY

"5.1":
  config:
    lang: "bash"
    filename: "hth-devin-desktop-5.01-verify-managed-policy.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/devin-desktop/config/hth-devin-desktop-5.01-verify-managed-policy.sh"
    excerpts:
      verify-managed-policy:
        content: |2
          set -euo pipefail
          # Source: https://docs.devin.ai/desktop/enterprise-policies
          # Read-only Linux policy verification. No client launch, networking, or secret output.
          # Usage: bash this-file.sh --expected reviewed-baseline.json [--policy /etc/vscode/policy.json]
          # A fixture path checks only that fixture. Runtime/team-policy precedence still needs UI proof.
          python3 - "$@" <<'PYCODE'
          import argparse, json, os, stat, sys
          from pathlib import Path
          p = argparse.ArgumentParser(description="Compare Linux Devin Desktop device policy to an approved baseline")
          p.add_argument("--expected", type=Path, required=True)
          p.add_argument("--policy", type=Path, default=Path("/etc/vscode/policy.json"))
          a = p.parse_args()
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result
          def read(path):
              if path.is_symlink():
                  raise ValueError("symlinks are not accepted")
              if not path.is_file() or path.stat().st_size > 1024 * 1024:
                  raise ValueError("missing, nonregular, or oversized file")
              value = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique_object)
              if not isinstance(value, dict):
                  raise ValueError("policy must be an object")
              return value
          try:
              expected, actual = read(a.expected), read(a.policy)
              allowed = {"AllowedExtensions": str, "ExtensionGalleryServiceUrl": str,
                         "UpdateMode": str, "TelemetryLevel": str, "EnableFeedback": bool}
              if not expected or any(k not in allowed or type(v) is not allowed[k] for k,v in expected.items()):
                  raise ValueError("baseline requires supported keys and exact documented types")
              if "AllowedExtensions" in expected:
                  ext = json.loads(expected["AllowedExtensions"], object_pairs_hook=unique_object)
                  if not isinstance(ext, dict) or ext.get("*") is not False:
                      raise ValueError("baseline extension allowlist must explicitly deny wildcard")
                  if any(type(v) is not bool and v != "stable" for v in ext.values()):
                      raise ValueError("invalid extension allowlist value")
              if "UpdateMode" in expected and expected["UpdateMode"] not in ("none", "manual", "start", "default"):
                  raise ValueError("invalid UpdateMode")
              if "TelemetryLevel" in expected and expected["TelemetryLevel"] not in ("all", "error", "crash", "off"):
                  raise ValueError("invalid TelemetryLevel")
          except (OSError, UnicodeError, ValueError):
              print("UNKNOWN: unreadable/invalid policy or baseline; no values printed", file=sys.stderr)
              sys.exit(2)
          failed = False
          for key, desired in expected.items():
              got = actual.get(key)
              matches = type(got) is type(desired) and got == desired
              if key == "AllowedExtensions" and type(got) is str:
                  try:
                      observed = json.loads(got, object_pairs_hook=unique_object)
                      matches = (isinstance(observed, dict) and observed.keys() == ext.keys()
                                 and all(type(observed[k]) is type(ext[k]) and observed[k] == ext[k] for k in ext))
                  except (ValueError, TypeError):
                      matches = False
              print(("PASS: " if matches else "FAIL: ") + key)
              failed |= not matches
          info = a.policy.stat()
          secure_permissions = info.st_uid == 0 and not (info.st_mode & (stat.S_IWGRP | stat.S_IWOTH))
          print(("PASS: " if secure_permissions else "FAIL: ") + "root-owned policy not group/world-writable")
          failed |= not secure_permissions
          print("Scope: disk configuration only; verify locked settings and server overrides in the running client")
          sys.exit(1 if failed else 0)
          PYCODE

