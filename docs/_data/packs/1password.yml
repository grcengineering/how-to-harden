"2.4":
  cli:
    lang: "bash"
    filename: "hth-1password-2.04-role-based-access-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/1password/cli/hth-1password-2.04-role-based-access-audit.sh"
    excerpts:
      cli-audit-privileged-groups:
        content: |2
          # Enumerate every group in the account, then list the members of the two
          # built-in privileged groups. Keep Owners to 1-2 people and grant
          # Administrators only to working IT/security staff.
          echo "== All groups in the account =="
          op group list
          
          for GROUP in "Owners" "Administrators"; do
            echo ""
            echo "== Members of ${GROUP} (with their role in the group) =="
            # --group filters to users belonging to the group; the output includes
            # each user's role within that group.
            op user list --group "${GROUP}"
          done
      cli-review-group-membership-detail:
        content: |2
          # Pull the full record for every member of a privileged group for an access
          # review (documented pattern: pipe list JSON into 'op user get -').
          GROUP="${1:-Administrators}"
          echo "== Detailed member records for ${GROUP} =="
          op user list --group "${GROUP}" --format=json | op user get -

"3.1":
  cli:
    lang: "bash"
    filename: "hth-1password-3.01-vault-permissions-audit.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/1password/cli/hth-1password-3.01-vault-permissions-audit.sh"
    excerpts:
      cli-vault-access-inventory:
        content: |2
          # Inventory all vaults the signed-in account can read, then list the users
          # and groups with access to one vault. Review each sensitive vault against
          # the least-privilege structure in the guide (private / team /
          # infrastructure / executive).
          echo "== All vaults =="
          op vault list
          
          VAULT="${1:?Usage: $0 <vault-name-or-id> [user-email]}"
          echo ""
          echo "== Vault: ${VAULT} — users with direct access =="
          op vault user list "${VAULT}"
          
          echo ""
          echo "== Vault: ${VAULT} — groups with access =="
          op vault group list "${VAULT}"
      cli-vaults-reachable-by-member:
        content: |2
          # Reverse view for access reviews and offboarding: every vault a specific
          # user can reach, then only the vaults where that user can manage the
          # vault itself (granular Business permission: manage_vault).
          if [ -n "${2:-}" ]; then
            MEMBER="${2}"
            echo "== Vaults reachable by ${MEMBER} =="
            op vault list --user "${MEMBER}"
          
            echo ""
            echo "== Vaults where ${MEMBER} holds manage_vault =="
            op vault list --user "${MEMBER}" --permission manage_vault
          fi

"3.4":
  cli:
    lang: "bash"
    filename: "hth-1password-3.04-scoped-service-account.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/1password/cli/hth-1password-3.04-scoped-service-account.sh"
    excerpts:
      cli-create-scoped-service-account:
        content: |2
          # One service account per workload, scoped to a single vault, read-only,
          # and expiring — never a human account reused for automation.
          #
          # --vault syntax: <vault-name>:<permission>[,<permission>]
          #   Available permissions: read_items, write_items, share_items
          # --expires-in bounds the credential's lifetime so a leaked CI secret
          #   does not live forever. --raw prints only the token, so it can be
          #   piped straight into your secrets manager without touching the log.
          op service-account create "${SA_NAME}" \
            --vault "${SA_VAULT}:read_items" \
            --expires-in 90d \
            --raw
      cli-service-account-scoping-rules:
        content: |2
          # Scoping rules for review (the tenant ceiling is 100 service accounts):
          #  - grant write_items or share_items only when the workload writes/shares
          #  - never pass --can-create-vaults unless vault creation IS the workload
          #  - one vault per --vault flag; repeat the flag for each required vault
          # Example: a deploy job that reads its own secrets and writes rotation
          # results into a dedicated rotation vault, nothing else:
          #   op service-account create "deploy-rotator" \
          #     --vault "CI-Secrets:read_items" \
          #     --vault "Rotation-Results:read_items,write_items" \
          #     --expires-in 30d --raw

"4.1":
  api:
    lang: "bash"
    filename: "hth-1password-4.01-events-api-collection.sh"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/1password/api/hth-1password-4.01-events-api-collection.sh"
    excerpts:
      api-events-collection:
        content: |2
          # Base URL depends on the region hosting your account:
          #   US:              https://events.1password.com
          #   US (Enterprise): https://events.ent.1password.com
          #   Canada:          https://events.1password.ca
          #   Europe:          https://events.1password.eu
          OP_EVENTS_BASE="${OP_EVENTS_BASE:-https://events.1password.com}"
          : "${OP_EVENTS_TOKEN:?Set OP_EVENTS_TOKEN to your Events API bearer token}"
          
          STATE_DIR="${OP_EVENTS_STATE_DIR:-./.op-events-state}"
          OUT_DIR="${OP_EVENTS_OUT_DIR:-./op-events}"
          START_TIME="${OP_EVENTS_START_TIME:-$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)}"
          mkdir -p "${STATE_DIR}" "${OUT_DIR}"
          
          # Confirm which event classes this token is authorized for before pulling.
          echo "== Token features =="
          curl -sf -H "Authorization: Bearer ${OP_EVENTS_TOKEN}" \
            "${OP_EVENTS_BASE}/api/v2/auth/introspect" | jq '.features'
          
          # Collect every class the guide requires: each answers a different question
          # (auditevents = admin/policy tampering, itemusages = mass credential
          # access, signinattempts = credential stuffing and spraying).
          for FEATURE in auditevents itemusages signinattempts; do
            CURSOR_FILE="${STATE_DIR}/${FEATURE}.cursor"
            OUT_FILE="${OUT_DIR}/${FEATURE}-$(date -u +%Y%m%dT%H%M%SZ).json"
          
            # First request uses limit + start_time; later requests resume from the
            # stored cursor (cursor-based pagination per the API reference).
            if [ -s "${CURSOR_FILE}" ]; then
              BODY=$(jq -n --arg c "$(cat "${CURSOR_FILE}")" '{cursor: $c}')
            else
              BODY=$(jq -n --arg t "${START_TIME}" '{limit: 100, start_time: $t}')
            fi
          
            HAS_MORE="true"
            while [ "${HAS_MORE}" = "true" ]; do
              RESP=$(curl -sf -X POST \
                -H "Authorization: Bearer ${OP_EVENTS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${BODY}" \
                "${OP_EVENTS_BASE}/api/v2/${FEATURE}")
          
              # Append this page's events; persist the cursor for the next run.
              echo "${RESP}" | jq -c '.items[]' >> "${OUT_FILE}"
              CURSOR=$(echo "${RESP}" | jq -r '.cursor')
              HAS_MORE=$(echo "${RESP}" | jq -r '.has_more')
              printf '%s' "${CURSOR}" > "${CURSOR_FILE}"
              BODY=$(jq -n --arg c "${CURSOR}" '{cursor: $c}')
            done
          
            echo "Collected ${FEATURE} -> ${OUT_FILE} ($(wc -l < "${OUT_FILE}") events)"
          done

