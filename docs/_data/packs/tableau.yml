    filename: "hth-tableau-1.02-site-role-audit.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tableau/api/hth-tableau-1.02-site-role-audit.py"
    excerpts:
      api-signin-pat:
        content: |2
          # Sign in with a personal access token; the response carries the session token
          # (passed as X-Tableau-Auth on every later call) and the site id.
          def sign_in():
              body = (
                  '<tsRequest>'
                  f'<credentials personalAccessTokenName="{os.environ["TABLEAU_PAT_NAME"]}"'
                  f' personalAccessTokenSecret="{os.environ["TABLEAU_PAT_SECRET"]}">'
                  f'<site contentUrl="{SITE}"/>'
                  '</credentials></tsRequest>'
              )
              root = api_request("auth/signin", data=body.encode())
              creds = root.find("{*}credentials")
              return creds.get("token"), creds.find("{*}site").get("id")
      api-audit-site-roles:
        content: |2
          # Page through every user on the site and tally site roles. Administrative
          # roles (ServerAdministrator, SiteAdministratorCreator/Explorer) are listed
          # individually so each grant can be justified in an access review.
          def audit_site_roles(token, site_id):
              roles = Counter()
              admins = []
              page = 1
              while True:
                  root = api_request(
                      f"sites/{site_id}/users?pageSize=1000&pageNumber={page}", token=token
                  )
                  users = root.findall(".//{*}user")
                  for u in users:
                      role = u.get("siteRole", "unknown")
                      roles[role] += 1
                      if role in ADMIN_ROLES:
                          admins.append((u.get("name"), role, u.get("lastLogin", "never")))
                  if len(users) < 1000:
                      break
                  page += 1
          
              print("Site role distribution:")
              for role, count in roles.most_common():
                  print(f"  {role}: {count}")
              print(f"Administrative accounts ({len(admins)}):")
              for name, role, last_login in admins:
                  print(f"  {role}\t{name}\tlastLogin={last_login}")
              return admins

"3.1":
  api:
    lang: "python"
    filename: "hth-tableau-3.01-project-permissions-audit.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tableau/api/hth-tableau-3.01-project-permissions-audit.py"
    excerpts:
      api-flag-unlocked-projects:
        content: |2
          # Projects whose contentPermissions is ManagedByOwner let content owners
          # re-open access through per-workbook overrides; LockedToProject prevents that.
          def find_unlocked_projects(token, site_id):
              projects = []
              for p in paged(token, site_id, "projects", "project"):
                  projects.append((p.get("id"), p.get("name"), p.get("contentPermissions")))
              unlocked = [p for p in projects if p[2] == "ManagedByOwner"]
              print(f"Projects: {len(projects)} total, {len(unlocked)} not locked to project")
              for pid, name, mode in unlocked:
                  print(f"  UNLOCKED: {name} (contentPermissions={mode})")
              return projects, unlocked
      api-flag-all-users-grants:
        content: |2
          # Any capability granted to the built-in "All Users" group exposes the project
          # to the entire site. Resolve the group id, then scan every project's
          # granteeCapabilities for grants against it.
          def find_all_users_grants(token, site_id, projects):
              all_users_ids = {
                  g.get("id")
                  for g in paged(token, site_id, "groups", "group")
                  if g.get("name") == "All Users"
              }
              findings = []
              for pid, name, _mode in projects:
                  root = api_request(f"sites/{site_id}/projects/{pid}/permissions", token=token)
                  for grantee in root.findall(".//{*}granteeCapabilities"):
                      group = grantee.find("{*}group")
                      if group is None or group.get("id") not in all_users_ids:
                          continue
                      for cap in grantee.findall(".//{*}capability"):
                          findings.append((name, cap.get("name"), cap.get("mode")))
              print(f'"All Users" group grants across projects: {len(findings)}')
              for project_name, cap_name, mode in findings:
                  print(f"  ALL-USERS GRANT: project={project_name} capability={cap_name} mode={mode}")
              return findings

"3.2":
  api:
    lang: "python"
    filename: "hth-tableau-3.02-connected-apps-audit.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tableau/api/hth-tableau-3.02-connected-apps-audit.py"
    excerpts:
      api-audit-connected-apps:
        content: |2
          # List every direct-trust connected app and flag the two configurations that
          # defeat domain restriction: unrestrictedEmbedding=true (any site may embed)
          # and an enabled app with an empty domainSafelist.
          def audit_connected_apps(token, site_id):
              root = api_request(f"sites/{site_id}/connected-apps/direct-trust", token=token)
              apps = [e for e in root.iter() if e.tag.endswith("connectedApplication")]
              findings = []
              print(f"Direct-trust connected apps: {len(apps)}")
              for app in apps:
                  name = field(app, "name")
                  enabled = (field(app, "enabled") or "").lower() == "true"
                  unrestricted = (field(app, "unrestrictedEmbedding") or "").lower() == "true"
                  safelist = (field(app, "domainSafelist") or "").strip()
                  print(f"  {name}: enabled={enabled} unrestrictedEmbedding={unrestricted} "
                        f"domainSafelist={safelist or '(empty)'}")
                  if enabled and unrestricted:
                      findings.append(f"{name}: unrestricted embedding — any domain may host this app")
                  elif enabled and not safelist:
                      findings.append(f"{name}: enabled with an empty domain safelist")
              for f in findings:
                  print(f"  FINDING: {f}")
              return findings

"4.2":
  api:
    lang: "python"
    filename: "hth-tableau-4.02-activity-log-export.py"
    source_url: "https://github.com/grcengineering/how-to-harden/blob/main/packs/tableau/api/hth-tableau-4.02-activity-log-export.py"
    excerpts:
      api-tcm-signin:
        content: |2
          # Sign in to Tableau Cloud Manager with a PAT secret. The response returns the
          # session token (valid 4 hours, 30-minute idle limit) and the tenant id used
          # in every activity-log URI.
          def tcm_sign_in():
              body = tcm_request(f"{TCM}/pat/login", payload={"token": os.environ["TCM_PAT_SECRET"]})
              return body["sessionToken"], body["tenantId"]
      api-download-activity-log:
        content: |2
          # List the tenant-event activity log files for a window (max 7 days), exchange
          # the paths for short-lived download URLs, and save each JSON file locally.
          # The download URLs are unauthenticated and expire in 10 minutes — treat them
          # as sensitive and download immediately.
          def download_activity_log(session_token, tenant_id, start_time, end_time, out_dir):
              base = f"{TCM}/tenants/{tenant_id}/activitylog"
              window = urllib.parse.urlencode({"startTime": start_time, "endTime": end_time})
              files = tcm_request(f"{base}?{window}", session_token=session_token)
              paths = [f["path"] for f in files]
              print(f"Activity log files in window: {len(paths)}")
              if not paths:
                  return 0
          
              urls = tcm_request(base, session_token=session_token, payload={"files": paths})
              out = pathlib.Path(out_dir)
              out.mkdir(parents=True, exist_ok=True)
              for entry in urls:
                  target = out / entry["path"].replace("/", "_")
                  with urllib.request.urlopen(entry["url"]) as resp:
                      target.write_bytes(resp.read())
                  print(f"  saved {target}")
              return len(paths)

