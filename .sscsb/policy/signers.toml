# sscsb approved-signers policy.
#
# Humans, CI, and AI agents must NEVER share keys or identities. Only signers
# listed here can push to protected branches, and only `class = "human"`
# signers satisfy the human-only protected-branch signing policy. AI agents
# draft changes; they never sign, so no `class = "ai"` entry should ever carry
# a key that is used for signing — the class exists so an AI-associated
# identity can be explicitly DENIED signing rights.
#
# [[signer]]
# principal = "you@example.com"          # matches allowed_signers principal
# class = "human"                        # human | ci | ai
# hardware_backed = true                 # asserted when the key lives on a YubiKey/secure element
# ssh_public_key = "ssh-ed25519 AAAA... you@example.com"
# # gpg_fingerprint = "ABCD1234..."      # for gpg.format=openpgp signers
#
# AI agents may sign ONLY when the `agent-signing` control is enabled, and their
# signatures are ALWAYS rejected on protected branches regardless of any other
# field — humans, CI, and AI never share identities. When agent-signing is on:
#
# [[signer]]
# principal = "agent@ci.example.com"     # a DISTINCT identity, never a human's
# class = "ai"                           # only emitted into allowed_signers when agent-signing is on
# backend = "github-app"                 # tpm | fido2 | kms | github-app | piv | software
# hardware_backed = true                 # self-asserted; see attestation_file to back it up
# # attestation_file = ".sscsb/policy/attestations/agent.bin"  # out-of-band hardware proof
# # expires = "2027-01-01"               # reported by `sscsb verify`; rotate before this
# ssh_public_key = "ssh-ed25519 AAAA... agent@ci.example.com"


# ── Approved signers ─────────────────────────────────────────────────────────
# Added with `sscsb signers add`, which also regenerates
# .sscsb/policy/allowed_signers. Editing this file by hand does NOT regenerate
# it, and `git config gpg.ssh.allowedSignersFile` points at the generated file:
# an out-of-date allowed_signers makes every commit verify as "No principal
# matched" (%G? = U) even when the signature is good. Always use the CLI.

[[signer]]
principal = "10093271+p4gs@users.noreply.github.com"
class = "human"
backend = "software"
# Deliberately false, and it must stay that way while the key lives where it does.
#
# The key is held in a 1Password vault and used through 1Password's SSH agent
# (op-ssh-sign), with device authentication required per signature. That is a real
# custody control — the private key is not loose on disk and each signature needs
# an explicit human approval — but it is NOT a secure element: the key is
# software-held and exportable by anyone who can unlock the vault, so it is not a
# YubiKey `-sk` key.
#
# `sscsb verify commit-signing` therefore notes the key is not hardware-backed,
# and that is the honest result. Asserting `true` here would attest a hardware
# boundary that does not exist, which is worse than the finding. Closing it means
# moving this identity to an ed25519-sk key on a hardware token and re-registering
# it as a GitHub signing key.
hardware_backed = false
ssh_public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBxEAReKc/G/sUxY/UbXprOccUKaxhd+sr/7Gbb40u9w github-signing@1password.p4gs"
